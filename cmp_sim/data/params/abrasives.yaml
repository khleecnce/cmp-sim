  # -------------------------------------------------------------
  ceria:
    aliases: [ceo2, cerium_oxide, cerium_dioxide, calcined_ceria, colloidal_ceria]
    material: CeO2
    synthesis: >
      Two industrial routes with very different particle character.
      (a) CALCINED: oxidise raw ceria then mechanically crush -> irregular,
      faceted, broad PSD, steady and high removal rate, higher scratch risk.
      (b) WET / COLLOIDAL: grow from seed nuclei in aqueous Ce solution ->
      spherical, narrow PSD, lower rate but much better scratch defectivity.
      A flux/hydrothermal route is also used to narrow the PSD.
    synthesis_source: "https://doi.org/10.5772/intechopen.75408"
    shape_class: faceted_or_spherical_depending_on_route
    properties:
      density_kg_m3: {value: 7215, unit: kg/m^3, source: "https://www.osti.gov/servlets/purl/1469554", confidence: literature,
        note: "Theoretical density 7.215 g/cm3 from the measured lattice parameter of stoichiometric CeO2."}
      hardness_gpa: {value: 6.44, unit: GPa, source: "https://doi.org/10.3390/ma19102134", confidence: literature,
        note: "Room-temperature nanoindentation hardness 6.44 +/- 0.72 GPa (dense sintered CeO2). Falls to 5.08 GPa at 400 C."}
      youngs_modulus_gpa: {value: 167.6, unit: GPa, source: "https://doi.org/10.3390/ma19102134", confidence: literature,
        note: "Room-temperature nanoindentation, 167.6 +/- 12.5 GPa. Independent measurements on fully dense CeO2 give 213 +/- 6 GPa by nanoindentation and 207 GPa extrapolated from resonant ultrasound (https://www.osti.gov/servlets/purl/1469554) - the spread is real, pick per your porosity."}
      youngs_modulus_alt_gpa: {value: 213, unit: GPa, source: "https://www.osti.gov/servlets/purl/1469554", confidence: literature}
      iep_ph: {value: 8.0, unit: pH, source: "https://doi.org/10.5772/intechopen.75408", confidence: literature,
        note: "IEP of ceria ~pH 8 (positive below, negative above). Other compilations put ceria IEP nearer 7; the practical point is that it is far above silica's, so ceria and oxide have OPPOSITE charge in acidic slurry."}
      typical_d50_nm: {value: 70, unit: nm, source: "https://nccavs-usergroups.avs.org/wp-content/uploads/2023/01/P47-CChen.pdf", confidence: literature,
        note: "D50 ~70 nm measured by DLS for a commercial ceria CMP slurry. Advanced work is pushing below 10 nm (https://nccavs-usergroups.avs.org/wp-content/uploads/2023/01/P25-RVenkataswamy.pdf)."}
    ce3_note: >
      Surface Ce3+ fraction, not just size, sets reactivity. Higher Ce3+ raises
      affinity for silicate ions, and LARGER ceria particles carry more Ce3+.
      Below 10 nm, Ce(OH)4 particles are more surface-reactive than CeO2 and
      recover the rate that small ceria otherwise loses.
    ce3_sources:
      - "https://doi.org/10.5772/intechopen.75408"
      - "https://nccavs-usergroups.avs.org/wp-content/uploads/2023/01/P25-RVenkataswamy.pdf"
    film_effects:
      oxide:
        mechanism: "CHEMICAL TOOTH. Interfacial Si-O-Si and Ce-O-Ce bonds dissociate and a Si-O-Ce bridging bond forms; SiO4 units are then extracted as the particle slides. Removal is bond rupture, not indentation."
        removal_mode: chemical_tooth
        conc_exponent: {value: null, unit: dimensionless, source: null, confidence: unverified,
          note: "TODO(owner): not fitted in an accessible source. WARNING - do NOT copy the silica exponent here; per-collision efficiency differs by ~2e7x, so the concentration response is a different functional form (site-limited, expect early saturation)."}
        size_exponent: {value: null, unit: dimensionless, source: null, confidence: unverified,
          note: "TODO(owner): disputed and confounded by surface chemistry. Larger ceria has more Ce3+ (favours rate) but fewer particles per unit mass (disfavours rate); sub-10 nm ceria loses rate unless made as Ce(OH)4. Sources: https://doi.org/10.5772/intechopen.75408 , https://nccavs-usergroups.avs.org/wp-content/uploads/2023/01/P25-RVenkataswamy.pdf"}
        saturation_conc_wt_pct: {value: null, unit: wt%, source: null, confidence: unverified,
          note: "TODO(owner): ceria slurries are run DILUTE - the filtration study used a commercial ceria slurry diluted to 0.25 wt%, and the <10 nm study used 0.2 wt% (with 0.2 wt% PVA). That those working points are orders of magnitude below fumed-silica loadings is itself evidence of early saturation, but it is not a measured knee."}
        working_conc_examples_wt_pct: {value: [0.2, 0.25], unit: wt%, source: "https://nccavs-usergroups.avs.org/wp-content/uploads/2023/01/P47-CChen.pdf", confidence: literature,
          note: "0.25 wt% commercial ceria (filtration study); 0.2 wt% synthesised ceria + 0.2 wt% PVA at pH 6 (small-particle study)."}
        rate_anchor_nm_per_min: {value: 350, unit: nm/min, source: "https://doi.org/10.1149/1.3230624", confidence: literature,
          note: "~350 nm/min blanket oxide with a ceria slurry + 0.05% cyclic amine additive."}
        ph_note: "Ceria-slurry pH is kept below the ceria IEP (~8) so the particle is positive and the oxide negative; reactivity peaks near neutral pH where both surfaces carry enough OH to form Si-O-Ce."
        selectivity_note: "Ceria is the selective oxide abrasive: with 0.05% pyridine-HCl / piperazine / imidazole it gives <2-3 nm/min nitride against ~350 nm/min oxide. Ceria oxide rate is roughly 3x conventional silica, but bare ceria raises defectivity."
        selectivity_sources:
          - "https://doi.org/10.1149/1.3230624"
          - "https://doi.org/10.1149/1.2949085"
        source: "https://doi.org/10.1021/acs.langmuir.3c00304"
        confidence: literature
      sin:
        mechanism: "Si3N4 hydrolyses to a suboxide; surface Ce3+ reacts with that suboxide. Suppressing either the hydrolysis or the Ce3+ sites (additive adsorption) collapses the nitride rate - this is the lever that makes STI selectivity work."
        removal_mode: chemical_tooth
        conc_exponent: {value: null, unit: dimensionless, source: null, confidence: unverified, note: "TODO(owner): not fitted."}
        size_exponent: {value: null, unit: dimensionless, source: null, confidence: unverified, note: "TODO(owner): not fitted."}
        saturation_conc_wt_pct: {value: null, unit: wt%, source: null, confidence: unverified, note: "TODO(owner): not sourced."}
        suppressed_rate_nm_per_min: {value: 2, unit: nm/min, source: "https://doi.org/10.1149/1.3596181", confidence: literature,
          note: "Nitride rate suppressed to <2 nm/min when hydrolysis is hindered or Ce3+ is blocked by additive adsorption."}
        selectivity_note: "Two polymer additives (poly(4-vinyl pyridine), poly(acrylic acid-co-DADMAC)) adsorb on ceria yet do NOT suppress the nitride rate - so 'adsorbs on ceria' is not sufficient to predict suppression. An alternate removal path exists."
        source: "https://doi.org/10.1149/1.3596181"
        confidence: literature
      cu:
