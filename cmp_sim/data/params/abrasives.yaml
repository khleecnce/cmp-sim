meta:
  schema_version: 1
  films_covered: [oxide, sin, cu, w, poly_si, si, sic, sapphire, snag]
  abrasives_covered: [colloidal_silica, fumed_silica, ceria, alumina, gamma_alumina, diamond, zirconia, titania, silicon_carbide_abrasive, organic_polymer, abrasive_free]
  compiled_by: "CMP-Sim literature pass (open-access sources only)"
  compiled_on: "2026-09-15"
  honesty_statement: >
    Numbers appear here only where a source was actually fetched and read.
    Where the requested physics is real but the specific number could not be
    verified against an accessible source (Si-O-Ce and silica-silica adsorption
    energies in kJ/mol, the indentation-depth prefactor, most per-film
    concentration and size exponents, SnAg entirely, zirconia and titania
    mechanical properties, gamma-alumina properties), the value is null with a
    TODO(owner) note naming what is missing. Nothing was interpolated or
    invented to fill a gap.
  key_sources:
    - "https://doi.org/10.3390/nano15171366  # Bellahsene et al., Nanomaterials 15:1366 (2025) - nano-abrasive review; C^(+/-1/3) and d^(4/3)/d^(-1/3) laws, shape/aspect-ratio, non-monotonic size evidence"
    - "https://doi.org/10.1021/acs.langmuir.3c00304  # Langmuir (2023) ReaxFF MD of ceria on silica glass; Si-O-Ce bond formation, 24 vs 5e8 collisions per SiO4"
