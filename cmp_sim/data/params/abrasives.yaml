  gamma_alumina:
    aliases: [gamma_al2o3, transition_alumina]
    material: Al2O3
    phase: gamma
    shape_class: irregular_porous
    note: >
      Listed separately because phase changes the mechanics. gamma-Al2O3 is a
      defect-spinel transition alumina with lower density, far higher specific
      surface area and lower hardness than alpha, and it transforms to alpha on
      calcination. CMP practice uses ALPHA alumina; if a slurry is gamma it will
      behave as a softer, more chemically active, lower-density abrasive and the
      alpha numbers must not be substituted.
    note_source: "https://doi.org/10.5772/intechopen.75408"
    properties:
      density_kg_m3: {value: null, unit: kg/m^3, source: null, confidence: unverified,
        note: "TODO(owner): not verified in this pass. It is lower than alpha's 3984 kg/m^3; do not reuse the alpha value."}
