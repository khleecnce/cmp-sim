# =====================================================================
# CMP-Sim abrasive particle knowledge base
# =====================================================================
# Purpose: map an abrasive POPULATION (type / size / shape / concentration)
#          to how it removes each wafer film, so the simulator can predict
#          rather than interpolate.
#
# Contract for every numeric entry:
#   {value: <number|null>, unit: <str>, source: <DOI or URL|null>,
#    confidence: literature | derived | vendor | unverified, note: <optional>}
#   confidence meanings:
#     literature  - value read from a peer-reviewed / standards source
#     vendor      - value from a manufacturer datasheet (Corning, Evonik, ...)
#     derived     - computed from a literature value by an explicit relation
#     unverified  - NOT sourced. value is null and note starts with TODO(owner)
#
# HARD RULE (see global_warnings.cross_abrasive_transfer):
#   Do NOT reuse a concentration or size exponent fitted for one abrasive
#   chemistry on a different abrasive chemistry. Silica-on-oxide and
#   ceria-on-oxide are different removal mechanisms (physisorption vs.
#   chemical bond formation), so their C and d exponents are not portable.
#
# Schema version and provenance date are in `meta` at the bottom.
# =====================================================================

global_models:

  concentration_dependence:
    description: >
      Two competing limits are reported for the dependence of MRR on abrasive
      volume concentration C0 and particle diameter d. Which one applies
      depends on whether removal is indentation-limited (volume of material
      ploughed per particle dominates) or surface-area-limited (number of
      reactive contacts dominates). Both are written for FIXED total down
      force, i.e. the load is shared among however many particles are in
      contact, which is why C0 appears with opposite signs.
    indentation_limited:
      relation: "MRR ~ V ~ C0^(-1/3) * d^(4/3)"
      conc_exponent: {value: -0.333, unit: dimensionless, source: "https://doi.org/10.3390/nano15171366", confidence: literature,
        note: "Eq. (1) of the review. Negative because at fixed load more particles means less load each."}
      size_exponent: {value: 1.333, unit: dimensionless, source: "https://doi.org/10.3390/nano15171366", confidence: literature}
      applies_when: "mechanical/indentation removal dominates; harder abrasive than film; larger particles"
    surface_area_limited:
      relation: "MRR ~ A ~ C0^(1/3) * d^(-1/3)"
      conc_exponent: {value: 0.333, unit: dimensionless, source: "https://doi.org/10.3390/nano15171366", confidence: literature,
        note: "Eq. (2). This is the C^(1/3) regime named in the CMP literature."}
      size_exponent: {value: -0.333, unit: dimensionless, source: "https://doi.org/10.3390/nano15171366", confidence: literature}
      applies_when: "chemically assisted removal; reaction-site-limited; small particles"
    number_density_form:
      relation: "N ~ C0/d^3  and  MRR ~ A ~ N*d^2 ~ C0/d"
      source: "https://doi.org/10.3390/nano15171366"
      confidence: literature
      note: >
        Eq. (3). Key experimental corollary reported in the same review: the
        polishing rate is INDEPENDENT of particle size when slurries of equal
        TOTAL abrasive surface area are compared. If the simulator conserves
        total surface area it should reproduce that invariance.
    saturation:
      general_shape: "steep initial rise in rate with abrasive (or chemical) concentration, then asymptotic approach to a maximum"
      source: "https://doi.org/10.1149/1.1372222"
      confidence: literature
      note: >
        Model of CMP (ECS 2001) predicts asymptotic saturation in BOTH chemical
        and abrasive concentration. Per-film saturation concentrations are given
        in the film_effects blocks where a number was actually published;
        otherwise they are null + TODO. Do not invent a knee point.
      universal_saturation_conc_wt_pct: {value: null, unit: wt%, source: null, confidence: unverified,
        note: "TODO(owner): there is no universal saturation concentration. It depends on abrasive, film, pad and pressure. Measure per formulation."}

  indentation_depth:
    relation: "delta ~= F / (2*pi*R*H)"
    symbols: "F = load carried by one particle [N]; R = particle radius [m]; H = hardness of the SOFTER contacting body [Pa]; delta = plastic indentation depth [m]"
    conc_exponent: {value: null, unit: dimensionless, source: null, confidence: unverified,
      note: "TODO(owner): relation is geometric, not a concentration law. Couple it to concentration via F = P*A_contact/N_active."}
    source: null
    confidence: unverified
    note: >
      TODO(owner): this fully plastic spherical-indentation scaling is the form
      requested for the engine and is standard contact mechanics, but I did not
      find an open primary source stating exactly this prefactor for CMP, so it
      is flagged unverified rather than given a false citation. What IS sourced:
      surface roughness Ra of the polished substrate is primarily set by the
      indentation depth of abrasives into the surface, which is governed by the
      abrasive hardness H and Young's modulus E_a
      (https://doi.org/10.3390/nano15171366). Validate the prefactor against
      your own nanoindentation data before trusting absolute depths.

  size_dependence_is_non_monotonic:
    summary: >
      The sign of dMRR/dd is NOT universal. The literature genuinely disagrees,
      because the two limits above trade places as d changes. Encode as a
      regime switch, not as a single exponent.
    evidence:
      - system: "glass, colloidal silica 40-120 nm"
        finding: "MRR rises with d from 40 to 60 nm (indentation-driven), then FALLS from 60 to 120 nm (surface-area-driven). Turnover near 60 nm."
        source: "https://doi.org/10.3390/nano15171366"
        confidence: literature
      - system: "silicon wafer, silica 10-140 nm"
        finding: "MRR rises with d up to ~80 nm then decreases. Turnover near 80 nm."
        source: "https://doi.org/10.3390/nano15171366"
        confidence: literature
      - system: "NiP-coated Al alloy, silica 15-160 nm"
        finding: "MRR increases monotonically with d over the whole range - contradicts the two cases above."
        source: "https://doi.org/10.3390/nano15171366"
        confidence: literature
      - system: "tungsten, alumina 0.1 um and up"
        finding: "Removal rate INCREASES with DECREASING particle size and with increased solids loading; local roughness insensitive to alumina size. Authors conclude removal is contact-area / reaction-rate controlled, not a scratching process."
        source: "https://doi.org/10.1149/1.1390851"
        confidence: literature
      - system: "copper and tantalum, silica 50-300 nm"
        finding: "MRR increases as abrasive size decreases."
        source: "https://doi.org/10.3390/nano15171366"
        confidence: literature
      - system: "sapphire, silica 4 / 20 / 55 / 105 nm"
        finding: "MRR increases with size from 20 to 105 nm, BUT 4 nm silica gives an anomalously high MRR comparable to 105 nm - a second (chemical) mechanism switches on at very small size."
        source: "https://doi.org/10.11159/icmie25.159"
        confidence: literature
      - system: "generic, modelling"
        finding: "A wear model including abrasive size distribution, adhesion and plastic deformation predicts removal rate DECREASES as abrasive size increases."
        source: "https://doi.org/10.1149/1.1997156"
        confidence: literature
    optimum_size_nm: {value: null, unit: nm, source: null, confidence: unverified,
      note: "TODO(owner): turnover diameter is system-specific (60 nm for glass/silica, 80 nm for Si/silica, absent for NiP). Fit per film+abrasive pair; do not hard-code one number."}
    dynamic_size_drift:
      finding: "Particle size can grow during closed-loop polishing: 2-3% increase for 20 and 55 nm silica after 30 min of Si polishing, with a corresponding MRR rise for the 20 nm slurry."
      source: "https://doi.org/10.3390/nano15171366"
      confidence: literature

  shape_effects:
    spherical:
      contact: "point contact (single point for an ideal sphere)"
      motion: "tends to ROLL at the pad-wafer interface, which wastes relative motion"
      consequence: "lower COF, lower MRR, lowest scratch risk"
      source: "https://doi.org/10.3390/nano15171366"
      confidence: literature
    non_spherical_faceted_elongated:
      contact: "small finite contact area rather than a point"
      motion: "resists rolling, spends more time SLIDING, so it actually cuts"
      consequence: "higher friction coefficient and higher MRR than spheres of the same size, measured on SiO2, Al2O3 and ZrO2 surfaces"
      source: "https://doi.org/10.3390/nano15171366"
      confidence: literature
      roll_to_slide_transition_axial_ratio:
        diamond_ellipsoid_on_copper: {value: 0.83, unit: dimensionless, source: "https://doi.org/10.3390/nano15171366", confidence: literature, note: "sliding predominates below this axial ratio"}
        diamond_ellipsoid_on_silicon: {value: 0.46, unit: dimensionless, source: "https://doi.org/10.3390/nano15171366", confidence: literature}
    aggregated_fumed:
      contact: "branched, fused aggregates; contact stress concentrates on a few protruding primary particles"
      consequence: "high MRR but high scratch rate; aggregates are hard and their size/shape are hard to control"
      source: "https://doi.org/10.1149/1.2901864"
      confidence: literature
      note: "Fumed silica exhibits aggregates of greater hardness than polymer-core composites; both scratch length and depth increase with particle size AND irregularity."
    cocoon_peanut_elongated_colloidal:
      consequence: "higher MRR than spherical colloidal silica of similar size, attributed to higher COF and sliding-dominated motion"
      source: "https://doi.org/10.3390/nano15171366"
      confidence: literature
      aspect_ratio_definition: "AR = length / width"
    soft_core_composite:
      consequence: "polymer-core / oxide-shell particles give fewer and shallower scratches than the bare oxide, from the spring-like elastic compliance of the core"
      source: "https://doi.org/10.1149/1.2949085"
      confidence: literature

  large_particle_tail:
    why_it_matters: >
      Scratch defectivity is driven by the oversize tail of the PSD (D99 /
      large particle count, LPC), not by D50. A slurry can meet its D50 spec
      and still scratch. Treat LPC as an independent input to the defect model.
    numerical_anchors:
      oversize_threshold_nm: {value: 200, unit: nm, source: "https://doi.org/10.1109/TSM.2018.2796564", confidence: literature,
        note: "Modelling study defines 'large particles' as >200 nm in diameter for a sub-200 nm working slurry."}
      oversize_fraction_that_degrades_uniformity_wt_pct: {value: 1.0, unit: wt%, source: "https://doi.org/10.1109/TSM.2018.2796564", confidence: literature,
        note: "Presence of even 1 wt% of larger particles was shown to deteriorate wafer uniformity and promote scratch growth."}
      filter_retention_target_um: {value: 0.5, unit: um, source: "https://www.entegris.com/content/dam/web/resources/application-notes/appnote-filtration-characteristics-of-cmp-slurries-7590.pdf", confidence: vendor,
        note: "CMP filters must retain >0.5 um particles while passing the 0.03-0.2 um working particles at high flow and low dP."}
      filter_transition_curve_penalty_nm: {value: 2000, unit: nm, source: "https://www.entegris.com/content/dam/web/resources/application-notes/appnote-filtration-characteristics-of-cmp-slurries-7590.pdf", confidence: vendor,
        note: "Media that passes at 200 nm may not reach >80% retention until >2000 nm - the retention curve is broad, so 'filtered' does not mean 'tail-free'."}
      ceria_case_d50_nm: {value: 70, unit: nm, source: "https://nccavs-usergroups.avs.org/wp-content/uploads/2023/01/P47-CChen.pdf", confidence: literature,
        note: "Commercial ceria slurry, D50 ~70 nm by DLS, diluted to 0.25 wt%; functional filtration cut LPC and gave >10% reduction in wafer defects >90 nm."}
      d99_scratch_threshold_nm: {value: null, unit: nm, source: null, confidence: unverified,
        note: "TODO(owner): no open source gives a single universal D99 scratch threshold. It scales with pad asperity size and film hardness. Calibrate against your own LPC-vs-scratch data."}
    secondary_sources:
      - "https://doi.org/10.1149/1.2184036  # Remsen et al., LPC in fumed silica slurries correlated with CMP scratch defects"
      - "https://doi.org/10.1007/s40544-013-0026-y  # scratch formation review; filtration and water-jet spray as mitigations"
      - "https://doi.org/10.1149/2.0101806jss  # dispersant reduces LPC measured by SPOS, scratch counts fall accordingly"
      - "https://doi.org/10.14356/KONA.2008010  # slurry stability, agglomerates and LPC as the microscratch source"

  chemical_tooth:
    definition: >
      'Chemical tooth' = the abrasive forms an actual chemical bond to the film,
      so material is pulled out by bond rupture rather than ploughed out by
      indentation. Ceria on silica is the canonical case: Si-O-Ce bridging bonds
      form at the interface. Silica on silica has no such bond - it interacts by
      physisorption / hydrogen bonding - which is why the two abrasives obey
      different rate laws at the SAME concentration.
    ceria_on_silica:
      bond: "Si-O-Ce (equivalently Ce-O-Si) bridging bond, formed after dissociation of interfacial Si-O-Si and Ce-O-Ce bonds"
      source: "https://doi.org/10.1021/acs.langmuir.3c00304"
      confidence: literature
      efficiency_anchor:
        ceria_collisions_per_SiO4_removed: {value: 24, unit: collisions, source: "https://doi.org/10.1021/acs.langmuir.3c00304", confidence: literature}
        silica_collisions_per_SiO4_removed: {value: 500000000, unit: collisions, source: "https://doi.org/10.1021/acs.langmuir.3c00304", confidence: literature,
          note: "5e8 collisions for silica abrasive vs 24 for ceria - a ~2e7x difference in per-collision efficiency. This is the strongest available quantitative statement of the chemical-tooth advantage."}
      ph_dependence: "Reactivity between silica and ceria(111) is HIGHER at neutral pH, because more OH groups on both surfaces increase the number of Si-O-Ce bonds formed."
      facet_dependence: "CeO2(100) is intrinsically more reactive than (111) despite lower surface Ce density; literature disagrees on which calcination temperature (facet mix) polishes better."
      ce3_role: "Higher surface Ce3+ concentration increases adsorption affinity for silicate ions; larger ceria particles carry more Ce3+."
      ce3_source: "https://doi.org/10.5772/intechopen.75408"
      pressure_limit: "Excessive pressure is detrimental: it detaches SiO4 units heterogeneously, roughening the surface and breaking bulk Si-O-Si bonds."
    adsorption_energy_ceria_silica_kj_mol: {value: null, unit: kJ/mol, source: null, confidence: unverified,
      note: "TODO(owner): the commonly quoted -111 to -258 kJ/mol range for Si-O-Ce chemisorption could NOT be verified against an accessible primary source in this pass. The qualitative chemisorption claim IS sourced (10.1021/acs.langmuir.3c00304). Supply the primary DFT reference or measure it before using a number."}
    adsorption_energy_silica_silica_kj_mol: {value: null, unit: kJ/mol, source: null, confidence: unverified,
      note: "TODO(owner): the -20 to -40 kJ/mol physisorption figure was not verified for the silica/silica CMP pair specifically. General physisorption binding energies are 10-300 meV (~1-29 kJ/mol) per https://en.wikipedia.org/wiki/Physisorption, which brackets but does not confirm the quoted range."}

  electrostatics:
    principle: >
      Particle-film adhesion, and therefore the number of particles actually
      engaged in removal, flips sign when the slurry pH crosses between the
      abrasive IEP and the film IEP. Opposite signs -> electrostatic attraction
      -> more particles retained on the wafer -> higher rate but also higher
      post-CMP particle defectivity. Same sign -> repulsion -> cleaner surface,
      lower rate. This is why ceria slurries for oxide run below their IEP and
      nitride slurries run acidic.
    worked_examples:
      - "Ceria slurry pH is kept below ~8 so ceria is positive while silicon oxide is negative, facilitating Si-O-Ce formation. (https://doi.org/10.5772/intechopen.75408)"
      - "Fujimi Si3N4 slurry is designed acidic: the abrasive stays negatively charged pH-independently while Si3N4 is positively charged below pH 5, so attraction raises the nitride rate. (https://nccavs-usergroups.avs.org/wp-content/uploads/CMPUG2015/CMP2015_4Takeda.pdf)"
      - "Alumina on tungsten: at acidic pH the surface-charge difference creates an attractive force that retains alumina on the wafer - one reason alumina/W scratches. (https://doi.org/10.5772/intechopen.75408)"
      - "Sapphire CMP: removal rate rises with pH up to 8; the electrostatic interaction between colloidal silica and the sapphire surface is the stated control variable. (https://doi.org/10.1149/2.0241503jss)"

global_warnings:

  cross_abrasive_transfer:
    severity: critical
    rule: "NEVER reuse a concentration exponent, size exponent or saturation concentration fitted for one abrasive material on another abrasive material."
    reason: >
      The removal mechanisms are physically different. Ceria removes SiO2 by
      forming Si-O-Ce chemical bonds (chemisorption; ~24 abrasive-substrate
      collisions per SiO4 unit removed), whereas silica removes SiO2 by
      physisorption-mediated indentation of a hydrated layer (~5e8 collisions
      per SiO4 unit). A concentration term calibrated on one is meaningless on
      the other, and the error is not a scale factor - it changes the exponent.
    source: "https://doi.org/10.1021/acs.langmuir.3c00304"
    confidence: literature

  cross_film_transfer:
    severity: high
    rule: "Do not reuse an exponent across films for the same abrasive without evidence."
    reason: >
      Alumina on tungsten is contact-area/reaction-rate limited (rate rises as
      particle size falls, 10.1149/1.1390851), while indentation-limited films
      show the opposite sign. Same abrasive, opposite trend.

  fixed_load_assumption:
    severity: medium
    rule: "The C0^(+/-1/3) exponents assume a FIXED total down force shared over the active particles. If your engine instead fixes per-particle load, the concentration exponent changes."
    source: "https://doi.org/10.3390/nano15171366"

  d50_is_not_enough:
    severity: high
    rule: "Feed the simulator a distribution (at least D50 and D99/LPC), never D50 alone. Rate tracks the bulk of the distribution; scratch defectivity tracks the tail."
    source: "https://doi.org/10.1109/TSM.2018.2796564"

# ---------------------------------------------------------------------
# Isoelectric points of the FILMS (the other half of the electrostatics)
# ---------------------------------------------------------------------
film_iep:
  oxide:
    material: SiO2
    iep_ph: {value: 1.80, unit: pH, source: "https://doi.org/10.1039/d6ra00388e", confidence: literature,
      note: "Experimental PZC for SiO2 quoted as pH 1.80. CMP practice commonly cites 2-3; treat 1.8-3 as the plausible band."}
    charge_above_iep: negative
  sin:
    material: Si3N4
    iep_ph: {value: null, unit: pH, source: null, confidence: unverified,
      note: "TODO(owner): exact IEP not pinned to an open primary source here. What IS sourced: Si3N4 is POSITIVELY charged in solution below about pH 5, i.e. IEP lies near pH 5 for the hydrolysed nitride surface (https://nccavs-usergroups.avs.org/wp-content/uploads/CMPUG2015/CMP2015_4Takeda.pdf). Nitride surfaces hydrolyse to a suboxide/oxide, so the measured IEP drifts with surface history."}
    charge_below_ph5: positive
    charge_source: "https://nccavs-usergroups.avs.org/wp-content/uploads/CMPUG2015/CMP2015_4Takeda.pdf"
  cu:
    material: Cu (as Cu oxide / hydroxide in slurry)
    iep_ph: {value: null, unit: pH, source: null, confidence: unverified,
      note: "TODO(owner): no open primary source verified in this pass. The polished Cu surface is an oxide/complex layer whose IEP depends on the oxidizer and inhibitor (BTA shifts it), so a single number is misleading."}
  w:
    material: W (as WO3 passivation layer)
    iep_ph: {value: null, unit: pH, source: null, confidence: unverified,
      note: "TODO(owner): not verified. Relevant surface is the WOx passivation layer formed by the oxidizer (https://doi.org/10.5772/intechopen.75408), not metallic W. Tungsten-oxide IEP is low (acidic), which is consistent with alumina/W attraction at acidic pH, but the number is unsourced here."}
  poly_si:
    material: polycrystalline Si (native SiOx terminated)
    iep_ph: {value: null, unit: pH, source: null, confidence: unverified,
      note: "TODO(owner): a clean Si surface in water bears a native oxide, so its IEP tends toward the silica value (~2-3), but I did not verify a primary measurement."}
  si:
    material: Si substrate
    iep_ph: {value: null, unit: pH, source: null, confidence: unverified,
      note: "TODO(owner): same caveat as poly_si - native-oxide terminated."}
  sic:
    material: SiC
    iep_ph: {value: 3.8, unit: pH, source: "https://doi.org/10.3390/ma17010056", confidence: literature,
      note: "IEP 3.8 measured for unmodified SiC powder (PMC10819982). Powder value; a polished 4H-SiC wafer face may differ, and Si-face vs C-face oxidise differently (https://doi.org/10.1038/s41598-023-49622-z)."}
    charge_above_iep: negative
  sapphire:
    material: alpha-Al2O3
    iep_ph: {value: 9.5, unit: pH, source: "https://doi.org/10.1016/j.mtcomm.2024.109962", confidence: literature,
      note: "Zero zeta potential of washed alpha-Al2O3 particles at pH ~9.5; pure/unwashed alpha-Al2O3 commonly at pH ~8.5-9 (PMC11462379). Single-crystal sapphire surfaces sit in the same band. Anionic additives shift IEP down."}
    charge_below_iep: positive
  snag:
    material: SnAg solder
    iep_ph: {value: null, unit: pH, source: null, confidence: unverified,
      note: "TODO(owner): no source found for SnAg surface IEP under CMP conditions. Surface is a mixed Sn/Ag oxide whose composition depends on the oxidizer."}

# =====================================================================
# ABRASIVES
# =====================================================================
abrasives:

  # -------------------------------------------------------------
  colloidal_silica:
    aliases: [silica, sio2, colloidal_sio2, stober_silica, wet_silica]
    material: SiO2
    synthesis: "liquid-phase growth from a precursor (Stober / sol-gel); spherical, narrow PSD"
    shape_class: spherical
    properties:
      density_kg_m3: {value: 2201, unit: kg/m^3, source: "https://valleydesign.com/Datasheets/Corning-Fused-Silica-7980.pdf", confidence: vendor,
        note: "Corning HPFS 7980 fused silica, 2.201 g/cm3. Used as the amorphous-SiO2 proxy for colloidal silica."}
      hardness_gpa: {value: 5.12, unit: GPa, source: "https://valleydesign.com/Datasheets/Corning-Fused-Silica-7980.pdf", confidence: derived,
        note: "Derived from Knoop hardness 522 kg/mm^2 (100 g load) x 9.807e-3 GPa per kg/mm^2 = 5.12 GPa. Knoop, not Vickers; colloidal nanoparticles may be softer/more hydrated than bulk fused silica."}
      youngs_modulus_gpa: {value: 72.7, unit: GPa, source: "https://valleydesign.com/Datasheets/Corning-Fused-Silica-7980.pdf", confidence: vendor}
      shear_modulus_gpa: {value: 31.4, unit: GPa, source: "https://valleydesign.com/Datasheets/Corning-Fused-Silica-7980.pdf", confidence: vendor}
      iep_ph: {value: 1.80, unit: pH, source: "https://doi.org/10.1039/d6ra00388e", confidence: literature,
        note: "Experimental PZC of SiO2. CMP vendor literature usually quotes IEP 2-3; use 1.8-3 as the band."}
      typical_d50_nm: {value: null, unit: nm, source: null, confidence: unverified,
        note: "TODO(owner): commercial colloidal silica spans roughly 10-160 nm across the studies cited here (4-105 nm sapphire study, 10-140 nm Si study, 15-160 nm NiP study). No single typical D50 is defensible - set it per product."}
    defect_character: "lowest scratch risk of the oxide abrasives, from spherical shape and small size; trades rate for defectivity"
    defect_source: "https://doi.org/10.5772/intechopen.75408"
    film_effects:
      oxide:
        mechanism: "hydration of the SiO2 surface by OH-, then physisorption/hydrogen-bonded contact of the silica particle and mechanical detachment of the softened hydrated layer. No chemical bridging bond to the film."
        removal_mode: mechanical
        conc_exponent: {value: null, unit: dimensionless, source: null, confidence: unverified,
          note: "TODO(owner): use global_models.concentration_dependence and pick the regime; no silica-on-oxide-specific fitted exponent was verified. Expect the C^(1/3) surface-area branch at small d and the C^(-1/3) indentation branch at large d."}
        size_exponent: {value: null, unit: dimensionless, source: null, confidence: unverified,
          note: "TODO(owner): sign is genuinely disputed. Glass 40-120 nm turns over at ~60 nm; Si 10-140 nm turns over at ~80 nm; NiP 15-160 nm is monotonic increasing (all https://doi.org/10.3390/nano15171366). Do not pick one value."}
        saturation_conc_wt_pct: {value: null, unit: wt%, source: null, confidence: unverified,
          note: "TODO(owner): asymptotic saturation in abrasive concentration is predicted (https://doi.org/10.1149/1.1372222) but the knee is formulation-specific."}
        efficiency_note: "~5e8 abrasive-substrate collisions per SiO4 unit removed, versus ~24 for ceria."
        efficiency_source: "https://doi.org/10.1021/acs.langmuir.3c00304"
        selectivity_note: "Silica gives poor oxide:nitride selectivity compared with ceria; it is the non-selective choice."
        selectivity_source: "https://doi.org/10.5772/intechopen.75408"
        source: "https://doi.org/10.5772/intechopen.75408"
        confidence: literature
      sin:
        mechanism: "mechanical abrasion of the hydrolysed nitride surface; in acidic slurries the negatively charged silica is electrostatically attracted to the positively charged Si3N4 (pH < 5), which raises the nitride rate"
        removal_mode: mechanical
        conc_exponent: {value: null, unit: dimensionless, source: null, confidence: unverified, note: "TODO(owner): not sourced."}
        size_exponent: {value: null, unit: dimensionless, source: null, confidence: unverified, note: "TODO(owner): not sourced."}
        saturation_conc_wt_pct: {value: null, unit: wt%, source: null, confidence: unverified, note: "TODO(owner): not sourced."}
        selectivity_note: "Acidic design is how Fujimi raises Si3N4 rate while suppressing oxide and poly-Si loss (erosion control after nitride clearing)."
        source: "https://nccavs-usergroups.avs.org/wp-content/uploads/CMPUG2015/CMP2015_4Takeda.pdf"
        confidence: literature
      cu:
        mechanism: "oxidizer forms a Cu oxide/complex passivation layer (Kaufman model); silica abrasives shear that soft layer away. Inhibitor (BTA) and complexant set how fast the layer regrows."
        removal_mode: chemomechanical
        conc_exponent: {value: null, unit: dimensionless, source: null, confidence: unverified, note: "TODO(owner): not sourced as an exponent."}
        size_exponent: {value: null, unit: dimensionless, source: null, confidence: unverified,
          note: "Sourced TREND only: MRR of Cu increases as silica size DECREASES over 50-300 nm (https://doi.org/10.3390/nano15171366), i.e. surface-area-limited, exponent expected negative. No fitted number."}
        saturation_conc_wt_pct: {value: null, unit: wt%, source: null, confidence: unverified, note: "TODO(owner): not sourced."}
        selectivity_note: "Silica on Cu is used where a Cu:barrier ratio near 1 is wanted; alumina is chosen when higher selectivity and planarity are needed."
        source: "https://doi.org/10.5772/intechopen.75408"
        confidence: literature
      w:
        mechanism: "oxidizer converts W to WOx, which is softer than W; the abrasive removes the WOx passivation layer. Chemistry-dominated, not scratch-dominated."
        removal_mode: chemomechanical
        conc_exponent: {value: null, unit: dimensionless, source: null, confidence: unverified,
          note: "Sourced TREND only: removal rate increases roughly LINEARLY with abrasive concentration in W CMP, but with a strong loading effect (very low or non-linear rate early in the polish) that is more pronounced than in dielectric CMP (https://doi.org/10.5772/intechopen.75408). Encode the loading transient, not just a steady exponent."}
        size_exponent: {value: null, unit: dimensionless, source: null, confidence: unverified,
