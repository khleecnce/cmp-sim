        mechanism: "hard-abrasive route: alumina (and SiC, nanodiamond) raise the SiC removal rate mechanically, but cause surface defects and scratches. Best current practice supports a Fenton-like catalyst (CuxO-CeO2) ON the alumina so oxidation and abrasion are co-located."
