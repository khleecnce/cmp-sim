  # -------------------------------------------------------------
  alumina:
    aliases: [al2o3, alumina_alpha, alpha_alumina, corundum]
    material: Al2O3
    phase: alpha
    phase_note: >
      alpha-Al2O3 (corundum, R-3c) is the hard, dense, thermodynamically stable
      phase and is what CMP means by 'alumina abrasive'. gamma-Al2O3 is a
      defect-spinel transition alumina: lower density, much higher surface area,
      softer, and it converts to alpha on calcination. They are NOT
      interchangeable in a removal model - see the gamma_alumina entry.
    phase_source: "https://doi.org/10.5772/intechopen.75408"
    shape_class: faceted_angular
    properties:
      density_kg_m3: {value: 3984, unit: kg/m^3, source: "https://srdata.nist.gov/CeramicDataPortal/Pds/Scdaos", confidence: literature,
        note: "NIST SRD 150, sintered alpha-Al2O3 at 20 C: 3.984 +/- 0.002 g/cm3 (Munro, J. Am. Ceram. Soc. 80:1919, 1997)."}
      hardness_gpa: {value: 15.0, unit: GPa, source: "https://srdata.nist.gov/CeramicDataPortal/Pds/Scdaos", confidence: literature,
        note: "Vickers, 1 kg load, 20 C: 15 +/- 2 GPa."}
      youngs_modulus_gpa: {value: 416, unit: GPa, source: "https://srdata.nist.gov/CeramicDataPortal/Pds/Scdaos", confidence: literature,
        note: "Elastic modulus 416 +/- 30 GPa at 20 C."}
      poissons_ratio: {value: 0.231, unit: dimensionless, source: "https://srdata.nist.gov/CeramicDataPortal/Pds/Scdaos", confidence: literature}
      fracture_toughness_mpa_m05: {value: 3.5, unit: MPa*m^0.5, source: "https://srdata.nist.gov/CeramicDataPortal/Pds/Scdaos", confidence: literature}
      iep_ph: {value: 9.5, unit: pH, source: "https://doi.org/10.1016/j.mtcomm.2024.109962", confidence: literature,
        note: "Washed alpha-Al2O3 particles: zero zeta potential at pH ~9.5. Pure/unwashed alpha-Al2O3 more commonly at pH ~8.5-9. Anionic additives shift IEP downward."}
      typical_d50_nm: {value: null, unit: nm, source: null, confidence: unverified,
        note: "TODO(owner): W-CMP alumina studies used 0.1 um and larger; product D50 varies widely. Set per product."}
    hardness_warning: >
      Alumina at 15 GPa is far harder than W, WOx, Cu and SiO2. It WILL scratch
      them if the tail of the PSD is not controlled. Composite alumina/polymer
      abrasives were introduced specifically to address this at advanced nodes.
    hardness_warning_source: "https://doi.org/10.5772/intechopen.75408"
    film_effects:
      w:
        mechanism: "oxidizer forms a WOx passivation layer softer than W; alumina removes it. At acidic pH the alumina (positive, IEP ~9) and the tungsten-oxide surface carry opposite charge, so alumina is retained on the wafer - good for rate, bad for scratch."
        removal_mode: chemomechanical
        conc_exponent: {value: null, unit: dimensionless, source: null, confidence: unverified,
          note: "Sourced TREND: removal rate increased with increased solids loading (https://doi.org/10.1149/1.1390851) and is described as roughly linear in abrasive concentration with a strong early-polish loading effect (https://doi.org/10.5772/intechopen.75408). No fitted exponent."}
        size_exponent: {value: null, unit: dimensionless, source: null, confidence: unverified,
          note: "Sourced TREND (strong): removal rate INCREASES with DECREASING alumina size from 0.1 um upward, and local roughness is INSENSITIVE to alumina size. The authors conclude removal is NOT a scratching process but contact-area/reaction-rate controlled (https://doi.org/10.1149/1.1390851). Sign is negative - opposite to the indentation branch. Do not reuse an oxide exponent here."}
        saturation_conc_wt_pct: {value: null, unit: wt%, source: null, confidence: unverified, note: "TODO(owner): not sourced."}
        selectivity_note: "Alumina gives better planarity and better W:oxide selectivity than silica, which is why it is the standard bulk-W abrasive at advanced nodes despite its scratch risk."
        loading_effect: "Very low or non-linear removal at the start of the polish is more pronounced in W CMP than in dielectric CMP - model it as a transient, not a steady state."
        source: "https://doi.org/10.5772/intechopen.75408"
        confidence: literature
      cu:
        mechanism: "abrades the oxidiser-formed Cu complex layer; higher hardness gives higher rate and better planarization than silica but more defects"
        removal_mode: chemomechanical
        conc_exponent: {value: null, unit: dimensionless, source: null, confidence: unverified, note: "TODO(owner): not sourced."}
        size_exponent: {value: null, unit: dimensionless, source: null, confidence: unverified, note: "TODO(owner): not sourced."}
        saturation_conc_wt_pct: {value: null, unit: wt%, source: null, confidence: unverified, note: "TODO(owner): not sourced."}
        selectivity_note: "Alumina/silica mixed abrasive slurries have been used for Cu and Ta films."
        source: "https://doi.org/10.1149/1.1564110"
        confidence: literature
      oxide:
        mechanism: "purely mechanical indentation/ploughing - alumina is 3x harder than SiO2, so there is no chemical tooth and defectivity dominates"
        removal_mode: mechanical
        conc_exponent: {value: null, unit: dimensionless, source: null, confidence: unverified, note: "TODO(owner): not sourced."}
        size_exponent: {value: null, unit: dimensionless, source: null, confidence: unverified, note: "TODO(owner): not sourced."}
        saturation_conc_wt_pct: {value: null, unit: wt%, source: null, confidence: unverified, note: "TODO(owner): not sourced."}
        selectivity_note: "In alumina/ceria mixed abrasive slurries for STI, oxide:nitride selectivity as high as 65 was reported without additives; TEM showed a sheath of small ceria particles forming around the larger alumina particles, so the alumina acts as a carrier core."
        selectivity_source: "https://doi.org/10.1149/1.1564110"
        source: "https://doi.org/10.1149/1.1564110"
        confidence: literature
