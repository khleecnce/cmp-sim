      iep_ph: {value: 7.5, unit: pH, source: "https://doi.org/10.1039/d6ra00388e", confidence: literature,
        note: "Experimental PZC of gamma-AlO(OH) (boehmite, the hydrated gamma-route surface) is pH 7.5; alpha-AlO(OH) is 7.7. NOTE this is the oxyhydroxide, not anhydrous gamma-Al2O3 - the anhydrous gamma value is not verified here."}
      typical_d50_nm: {value: null, unit: nm, source: null, confidence: unverified, note: "TODO(owner): not sourced."}
    film_effects:
