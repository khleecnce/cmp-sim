        conc_exponent: {value: null, unit: dimensionless, source: null, confidence: unverified,
          note: "TODO(owner): not fitted. Sourced qualitative fact: commercial fumed-silica dielectric slurries run HIGH abrasive concentration to reach the needed rate, and that high concentration is what drives the scratch/agglomeration/clogging problems (https://doi.org/10.5772/intechopen.75408)."}
        size_exponent: {value: null, unit: dimensionless, source: null, confidence: unverified,
