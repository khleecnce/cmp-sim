    structure_source: "https://products.evonik.com/assets/45/92/Technical_Overview_AEROSIL_Fumed_Silica_EN_EN_244592.pdf"
    defect_character: "high rate but high scratch and LPC risk; prone to re-agglomeration and to clogging slurry delivery lines and filters; industry usage is declining for advanced nodes"
