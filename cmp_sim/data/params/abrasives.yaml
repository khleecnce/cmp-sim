  # -------------------------------------------------------------
  organic_polymer:
    aliases: [polymer_abrasive, polystyrene, ps, pmma, polymer_core_composite]
    material: "polystyrene / PMMA / crosslinked organic particle, optionally shelled with SiO2 or CeO2"
    shape_class: spherical_compliant
    properties:
      density_kg_m3: {value: null, unit: kg/m^3, source: null, confidence: unverified,
        note: "TODO(owner): polymer-dependent (~1050 kg/m^3 for PS, ~1180 for PMMA) but not verified from a primary source here."}
      hardness_gpa: {value: null, unit: GPa, source: null, confidence: unverified,
        note: "TODO(owner): not verified numerically. Sourced QUALITATIVE fact: the polymer core's mechanical properties are highly tunable via synthesis parameters, and a SiO2 shell lowers the effective hardness of the composite abrasive, which improves Ra (https://doi.org/10.1149/1.2949085 , https://doi.org/10.3390/nano15171366)."}
      youngs_modulus_gpa: {value: null, unit: GPa, source: null, confidence: unverified, note: "TODO(owner): not verified; tunable by synthesis."}
      iep_ph: {value: null, unit: pH, source: null, confidence: unverified,
        note: "TODO(owner): set by the shell or by surface functionalisation (sulfate, carboxyl), not by the polymer bulk. If shelled with SiO2 use the silica IEP; if shelled with CeO2 use the ceria IEP."}
      typical_d50_nm: {value: 300, unit: nm, source: "https://doi.org/10.1149/1.2949085", confidence: literature,
        note: "300 nm polymer core coated with 14 nm ceria particles in the defectivity study. Not a universal size."}
    design_rationale: >
      The point of a polymer abrasive is COMPLIANCE, not hardness. The elastic
      core acts as a spring that limits the peak contact stress, so a given
      normal load produces a shallower indentation and shallower scratches.
      Rate is then recovered chemically by shelling the core with the reactive
      oxide (ceria for oxide films, silica for a silica-like tooth).
    film_effects:
      oxide:
        mechanism: "compliant-core, reactive-shell: the shell supplies the surface chemistry (Si-O-Ce if ceria-shelled) while the core's elasticity caps the contact stress"
        removal_mode: mixed
        conc_exponent: {value: null, unit: dimensionless, source: null, confidence: unverified, note: "TODO(owner): not fitted in the cited studies."}
        size_exponent: {value: null, unit: dimensionless, source: null, confidence: unverified, note: "TODO(owner): not fitted."}
        saturation_conc_wt_pct: {value: null, unit: wt%, source: null, confidence: unverified, note: "TODO(owner): not sourced."}
        defectivity_gain: "Fewer and shallower scratches than colloidal silica and than fumed-silica-shelled composites, for polymer-core/colloidal-silica-shell abrasives."
        defectivity_source: "https://doi.org/10.1149/1.2740038"
        ceria_shell_note: "Ceria-based slurries give roughly 3x the removal rate of conventional silica but WORSE defectivity; a 300 nm polymer core coated with 14 nm ceria reduces defectivity via the spring-like elastic core. The two composite routes (silane coupling vs electrostatic assembly) give different rates because they give different morphology and surface composition."
        ceria_shell_source: "https://doi.org/10.1149/1.2949085"
        shape_note: "Both scratch length and depth increase with particle size and irregularity; fumed-silica-shelled composites do not fix the fumed aggregate's irregularity."
        shape_source: "https://doi.org/10.1149/1.2901864"
        ph_note: "Composite performance was characterised at pH 3 and pH 10 - the electrostatic assembly route in particular is pH-sensitive."
        selectivity_note: "Selectivity comes from the shell chemistry, so inherit it from the shell material's entry, not from the polymer."
        source: "https://doi.org/10.1149/1.2740038"
        confidence: literature
      sapphire:
        mechanism: "polystyrene-CeO2 core-shell improves Ra versus bare CeO2 on RB-SiC/sapphire-class hard substrates even though the bare ceria particles are ~10x smaller"
        removal_mode: mixed
        conc_exponent: {value: null, unit: dimensionless, source: null, confidence: unverified, note: "TODO(owner): not sourced."}
        size_exponent: {value: null, unit: dimensionless, source: null, confidence: unverified, note: "TODO(owner): not sourced."}
        saturation_conc_wt_pct: {value: null, unit: wt%, source: null, confidence: unverified, note: "TODO(owner): not sourced."}
        selectivity_note: "Finish improves, MRR drops; the rate loss is recovered by photocatalytic assist (CeO2-TiO2 + UV)."
        source: "https://doi.org/10.3390/nano15171366"
        confidence: literature
      sic:
        mechanism: "same compliant-core rationale on reaction-bonded SiC"
        removal_mode: mixed
