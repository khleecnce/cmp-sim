# Copper, alkaline benzenesulfonic-acid slurry — own-dir overlay.
#
# `base: cu_alkaline_benzenesulfonic` resolves to the NEXT tier, so the whole
# inherited legacy pack is kept intact and this file adds only what the engine
# needs that the legacy file does not state.
#
# Why this file exists
# --------------------
# The inherited pack declares `abrasive_size_exponent: 0.0` and backs it
# properly — it is a sourced NULL RESULT, not a missing number: TW202115224A
# (Cu, n=18) restricted to its spherical subset (15/27/50/160 nm) gives
# Spearman rho 0.03-0.15, not significant, and a second independent leg from
# force-partition theory agrees.
#
# What it does not say is WHICH ABRASIVE the 0.0 belongs to, and that is the
# distinction that decides whether the number transfers. Ten measured sweeps in
# this repository split by abrasive rather than by film:
#
#     ceria    +0.87   (3 sweeps,  3-211 nm)
#     alumina  +0.29   (2 sweeps, 50-3500 nm)
#     silica   -0.05   (5 sweeps, 12-160 nm, five different films)
#
# A size exponent with no abrasive attached is a global constant in disguise,
# which is exactly what the derived -0.84 was before it turned out to have the
# wrong sign on 8 of those 10 sweeps. So the value is kept — 0.0 sits inside
# the silica group's scatter and is independently evidenced — and only its
# scope is made explicit.

name: cu_alkaline_benzenesulfonic
description: >
  Copper CMP in an alkaline benzenesulfonic-acid slurry. Own-dir overlay over
  the inherited legacy pack; adds abrasive scoping only.
base: cu_alkaline_benzenesulfonic

params:
  reference_abrasive:
    value: colloidal_silica
    unit: abrasive database key
    note: >
      This pack's abrasive_size_exponent note already scopes its 0.0 to COLLOIDAL
      SILICA on copper (TW202115224A spherical subset, 15-160 nm). Declaring the
      reference abrasive as a key makes that scope machine-readable, so the
      engine can detect a swap instead of relying on a human reading the note.
    source: "this pack's own abrasive_size_exponent note (TW202115224A silica subset)"
    confidence: literature

  abrasive_size_exponent:
    value: 0.0
    unit: "-"
    note: >
      MRR ~ d^n for COLLOIDAL SILICA on copper in this chemistry. NOT
      transferable to a pack with a different abrasive: measured exponents
      split by abrasive (ceria +0.87, alumina +0.29, silica -0.05), and this
      abrasive belongs to the silica group, whose members scatter around zero.

      A sourced null result rather than an unknown. Two independent legs:
      (1) TW202115224A, Cu, n=18, spherical subset at 15/27/50/160 nm at
      matched chemistry (glycine 5.5 wt% + alanine 9.5 wt% + 1,2,4-triazole
      416 ppm) gives Spearman rho 0.03-0.15 — not significant; (2) the
      force-partition argument in
      legacy/knowledge/cmp/abrasive-size-null-result-force-partition-theory.md.

      Inherited from cu_h2o2_bta at one confidence grade lower, as the legacy
      pack records.

      ⚠ ITS EVIDENCE IS SCORED UNDER ANOTHER PACK (§56). Leg (1) is
      tw202115224a_cu_abrasive_size_pressure, which carries `pack: cu_h2o2_bta`
      -- so no scored block under THIS pack sweeps particle size, and nothing
      in reach can refute this 0.0:
      tools/departed_evidence_census.py classes it DEPARTED-AND-UNTESTABLE.
      Measured, not argued, before deciding: re-assigning that dataset here
      changes shape only 19.51% -> 19.10% while absolute scale collapses from
      1.734 to 11.177 (a 6.4x error bought for 0.4 pp of trend -- the exact
      trade docs/limits.md warns about). REFUSED. The dataset's own header
      also names an acidic glycine/BTA chemistry, which is cu_h2o2_bta's
      system and not this alkaline benzenesulfonic one, so the re-assignment
      would be wrong on chemistry regardless of the score.
      Leg (2), the force-partition argument, is independent of that dataset and
      is why the value stands rather than being withdrawn.
      TODO(owner): a size sweep in the benzenesulfonic chemistry itself would
      make this number testable where it acts.
    source: >
      legacy/knowledge/params/cu_alkaline_benzenesulfonic.yaml (verbatim value
      and evidence); dataset
      cmp_sim/data/validation/datasets/tw202115224a_cu_abrasive_size_pressure.yaml;
      abrasive grouping in docs/predictive-accuracy.md
    confidence: literature

  # ── pH response: the term this pack was missing entirely ───────────────
  #
  # WHY THIS EXISTS. The inherited pack declares no pH response at all: no
  # ph_peak, no width, no floor. Its only pH-adjacent entry is ph_ref 4.0,
  # inherited from the ACIDIC parent, which is meaningless for a slurry run
  # between pH 8.5 and 11.1. A pH sweep therefore moved nothing — five rows of
  # us9200180b2_cu_ph_alkaline_sweep spanning a measured 3.4x fall in rate all
  # predicted the same number, and the dataset scored 51.0%, losing to
  # predicting its own average.
  #
  # The missing term did not merely leave that dataset unexplained; it pushed
  # its work onto the oxidiser term. The inherited pack sets
  # oxidizer_peak_wt_pct 1.0 with the stated reason that it places the whole
  # observed window on the FALLING side of the Kaufman peak — a shape chosen so
  # that rate decreases with oxidiser. In us9200180b2_cu_h2o2_series the pH
  # DRIFTS 10.2 -> 8.5 as acidic H2O2 is added, so part of what that pack calls
  # an oxidiser effect is a pH effect wearing the oxidiser's label.
  #
  # THE NUMBERS. Fitted to the five printed rows of US9200180B2's own pH series
  # (pH 6.2/7.1/8.7/9.4/9.9 -> 732/577/334/263/214 A/min, H2O2 and abrasive
  # fixed), the free optimum sits at ph_peak 3.3 (0.55% shape error). That is
  # BELOW the lowest measured pH and therefore an extrapolation, so it is
  # refused on the same ground as cu_h2o2_bta's bound: the peak is pinned to
  # the lowest pH actually measured, 6.2, which costs almost nothing (3.65%).
  #
  # ⚠ SELF-SCORING DISCLOSURE. us9200180b2_cu_ph_alkaline_sweep carries
  # used_for_calibration: true and these three constants are fitted to it, so
  # its own score is not independent evidence. The honest check is that the
  # HELD-OUT datasets on this pack do not regress.
  ph_peak:
    value: 6.2
    unit: pH
    note: >
      An UPPER BOUND on the optimum, not a fitted optimum. The measured series
      falls monotonically across its whole range (732 -> 214 A/min from pH 6.2
      to 9.9), so the data locate the peak only as "at or below 6.2". Free
      fitting prefers 3.3, outside the measured range; extrapolating a peak to
      a pH nobody polished at is refused, and the bound is used instead.

      Mechanism, from the patent's own account: benzenesulfonic acid complexes
      copper most effectively where it is protonated, and the alkaline arm
      loses that channel as the surface passivates, leaving the mechanical
      floor below.
    source: >
      US9200180B2, Examples 8-12 (pH series at fixed 1 wt% H2O2, 3 wt%
      colloidal silica); dataset
      cmp_sim/data/validation/datasets/us9200180b2_cu_ph_alkaline_sweep.yaml
    confidence: med

  ph_response_width:
    value: 2.3
    unit: pH
    note: >
      Fitted jointly with the floor at ph_peak 6.2 over the same five rows;
      shape error 3.65%. Narrower than the acidic parent's 4.15 because the
      measured fall is steep: the rate more than halves over three pH units.
    source: same five rows as ph_peak (US9200180B2 Examples 8-12)
    confidence: med

  ph_mechanical_floor:
    value: 0.25
    unit: fraction of peak rate
    note: >
      Copper still removes at pH 9.9 (214 A/min against 732 at pH 6.2), so a
      floor is required and is not a fitting convenience. It is higher than the
      acidic pack's 0.12 because this slurry keeps a benzenesulfonate-assisted
      channel open in the alkaline region.
    source: same five rows as ph_peak (US9200180B2 Examples 8-12)
    confidence: med

  # ── the pH range these constants were measured over ────────────────────
  ph_valid_range:
    value: [6.2, 9.9]
    unit: pH
    note: >
      US9200180B2's pH series spans 6.2-9.9 and ph_peak (6.2) is its lowest
      point, so nothing below pH 6.2 is measured. This pack is also applied to
      datasets run at pH 10.2-11.1, slightly above the range; those are flagged
      rather than silently trusted.
    source: "us9200180b2_cu_ph_alkaline_sweep.yaml (5 rows, pH 6.2-9.9)"
    confidence: high
