# Oxide (TEOS/PETEOS/thermal SiO2) CMP with a colloidal-silica slurry.
#
# OVERRIDE of the inherited legacy/knowledge/params/oxide_silica.yaml.
# `base: oxide_silica` resolves to the NEXT tier down the search path, so every
# value the legacy pack already sources (Kp, pH peak, abrasive size/conc laws,
# dispersant shield, viscosity, bulk hardness ...) is inherited untouched. This
# file ONLY adds the dielectric-CMP gaps that were previously absent.
#
# Scope discipline
# ----------------
# Oxide removal is hydrolysis-driven (Cook 1990): water diffuses into the silica
# network, Si-O-Si bonds are hydrolysed to silanol, and the softened layer is
# abraded. Silica abrasive has NO Si-O-Ce "chemical tooth" — ceria-specific
# concentration/redox laws live in sti_ceria.yaml and must not leak in here.
#
# Nothing below feeds the Preston P*V core, so the validation back-test
# (us9499721b2 TEOS/colloidal silica, 1.9% MAPE) is unaffected by construction;
# it was re-run after this file was written and is unchanged.

base: oxide_silica
description: "Oxide / colloidal silica: hydrolysis mechanism, contact stress, pattern and thermal terms"

params:
  ph_acid_mechanical_floor:
    value: 0.010
    unit: fraction of peak rate
    note: >
      Rate BELOW the optimum pH, as a fraction of the peak. Separate from
      ph_mechanical_floor (which applies above the optimum) because the two
      sides decay by different mechanisms: below the optimum the abrasive and
      the film approach the same charge state and particles stop attaching,
      while above it alkaline hydrolysis keeps softening the film.

      NOT a free parameter. The unconstrained fit wants 0.0, which is the
      setting that made the model return 0.0 A/min at pH 2 -- CN109609035B
      measures 109 A/min there. An abrasive under load removes material at
      any pH. 1% of peak. No silica-on-oxide dataset here measures the deep acid side at a fixed alkaline formulation, so this is a floor chosen to keep the prediction finite rather than a fitted value; CN109609035B's acid series is a different (anionic-surfactant) system whose own optimum is near pH 2.
    source: TODO(owner) - order-of-magnitude bound, not a measurement
    confidence: low

  abrasive_conc_half_wt_pct:
    value: 4.4
    unit: wt%
    note: >
      Abrasive loading at which the mechanical term reaches half its
      saturated value: factor ~ C/(C_half + C). Without it the model used a
      bare power law and kept rewarding extra abrasive long after the real
      process had stopped responding (predicted log-log slope +1.0 against
      the +0.15 to +0.53 the measurements show).

      A COMPROMISE, and the two oxide datasets genuinely disagree:
        us9499721b2 (0.5-3 wt%, 4 iso-pressure series) wants 0.6
        us6564116b2 (5-25 wt%, L25 array)             wants 5.9
      4.4 minimises the worse of the two (19.9% / 19.8%). Taking
      us9499721b2's own optimum of 0.59 scored it at 7.3% but pushed
      us6564116b2 from 20.6% to 26.6%, with the residual rising
      monotonically from 0.52 to 0.89 across the loading range -- a
      systematic 2x over-prediction at 5 wt%, which is the signature of a
      saturation that is too aggressive rather than a random miss.

      The disagreement is real, not fitting noise: one covers 0.5-3 wt% and
      the other 5-25 wt%, so either the response is not a single Langmuir
      over 0.5-25 wt%, or the two tools differ in slurry delivery. Fitting
      each dataset its own constant would hide that behind two good numbers.
    source: >
      us9499721b2_teos_colloidal_silica_pressure_conc.yaml (22 pts) and
      us6564116b2_oxide_taguchi_L25_pressure_platenspeed.yaml (25 pts),
      jointly; neither alone
    confidence: low

  abrasive_size_exponent:
    value: -0.05
    unit: dimensionless
    note: >
      MRR ~ d^n for SILICA abrasive on oxide. Was null, which fell back to
      the derived -0.84 and so had the sign wrong for most measured sweeps.

      Measured sweeps split by ABRASIVE, not by film:
        silica  -0.05  (5 sweeps, 12-160 nm, five different films)
        alumina +0.29  (2 sweeps, 50-3500 nm, Cu and SiC)
        ceria   +0.87  (3 sweeps, 3-211 nm, oxide)
      Within one abrasive the sweeps agree; across abrasives they do not
      share a sign, so this must NOT be reused for a ceria pack (sti_ceria
      carries +0.87 for exactly this reason).

      CAVEAT the power law hides: Bouvet 2002 (JVST B 20(4) 1556, Fig. 3)
      measures 135.5 / 187.5 / 156.4 / 140.2 nm/min at 12/25/45/75 nm on
      thermal oxide - an interior MAXIMUM at 25 nm. -0.05 is the
      least-squares slope through a hump, so it tracks the ENDS of that
      range and under-predicts the middle by about 20%. Three sizes cannot
      reveal such a maximum; four can.

      The same four ceria-coated-silica slurries also give opposite answers
      on two oxides: US 2019/0127607 A1 [0120] reports HDP rising
      monotonically (n ~ +0.75) while TEOS reverses at 156 nm. Deposition
      method alone changes the size response, so a pack-level exponent is
      an average over that, not a law. Son 2021 (Sci Rep 11:17736) with wet
      ceria gives n ~ +1.0.

      To do better: a size sweep on YOUR oxide with YOUR abrasive at fixed
      loading, pH, pressure and speed - at least four sizes.
    source: >
      bouvet2002_oxide_silica_size_sweep.yaml (12-75 nm, interior maximum),
      wei2026_sic_silica_size_sweep.yaml (+0.10),
      tw202115224a_cu_abrasive_size_pressure.yaml (+0.14),
      bouvet2002_w_silica_size_sweep.yaml (-0.05),
      bouvet2002_ti_silica_size_sweep.yaml (-0.45);
      contrast us20190127607a1_*.yaml and son2021_oxide_ceria_size_sweep.yaml
    confidence: med

  # ── pH response, fitted to MEASURED silica-on-oxide sweeps ─────────────
  # Inherited ph_peak = 11.0 is kept: Li 2021 measures a maximum at pH 11
  # (1727 A/min vs 1551 at pH 10 and 1407 at pH 12.5), which confirms it.
  ph_response_width:
    value: 3.1
    unit: pH
    note: >
      Gaussian half-width, fitted to Li 2021 (3 points, pH 10-12.5,
      alkaline silica with an additive). Shape error 0.1%, but on 3 points
      straddling the peak -- the fit is well posed yet narrowly sampled.
      Does NOT describe the acidic branch: CN109609035B measures a 22x FALL
      from pH 2 to 5 with charged silica, whose own optimum is near pH 2,
      not 11. That is a different slurry system (anionic-surfactant
      stabilised) and needs its own pack rather than a wider bell here.
    source: li2021_oxide_silica_ph.yaml (3 measured points)
    confidence: med
  ph_mechanical_floor:
    value: 0.12
    unit: fraction of peak rate
    note: >
      Fitted jointly with the width on Li 2021. The floor applies on the
      alkaline side only (see ph_response), and with a width of 3.1 the
      bell itself stays near 1.0 across the measured pH 10-12.5 window, so
      the weak 1.2x sensitivity Li reports comes from the width rather than
      from the floor. Poorly constrained: no point in this dataset sits far
      enough above pH 11 to make the floor visible.
    source: li2021_oxide_silica_ph.yaml (3 measured points)
    confidence: med

  film_youngs_modulus_pa:
    value: 92.0e9
    unit: Pa
    note: >
      Young's modulus of the silica film, needed by the pad-limited plasticity
      criterion Lambda = 48*Hp*E^2/(pi^2*H^3) that decides elastic vs plastic
      particle contact. Taken from the same table as the wet-pad hardness the
      criterion pairs it with, so the two are mutually consistent.

      ⚠ Oxide sits ON the elastic/plastic boundary and which side depends on
      which hardness is used: with this table's own H = 15 GPa, Lambda = 0.6
      (elastic); with the 8 GPa reported elsewhere for CVD oxide, Lambda = 2.3
      (plastic). That is not a defect in the criterion - oxide CMP really does
      run near the scratching threshold, which is why oxide alone shows no
      measurable scratches in the source paper's Table IV while Cu and both
      low-k films do. The engine reports 'transition' in that band rather than
      picking a side.
    source: >
      Eusner, Saka, Chun et al., J. Electrochem. Soc. 156(7) H528-H534 (2009),
      Table I "Dielectric constant and mechanical properties of CMP materials"
      -- read directly from the PDF: SiO2 (dielectric, abrasive) E = 92 GPa,
      H = 15 GPa; Cu E = 128, H = 1.22; Pad (wet) E = 0.53, H = 0.05 (avg).
    confidence: literature


  # ══════════════════════════════════════════════════════════════════
  # 1. Single-particle contact — stress and the softened surface
  # ══════════════════════════════════════════════════════════════════
  # cmp_sim/core/regime.py::classify_contact_branch needs BOTH
  # particle_contact_stress_pa and a hardness. Only the first is publishable.

  particle_contact_stress_pa:
    value: 2.58e+08
    unit: Pa
    note: >
      MEAN HERTZIAN CONTACT PRESSURE P0 under ONE abrasive particle during
      silica-on-silica polishing. Cook 1990, "Chemical processes in glass
      polishing", J. Non-Cryst. Solids 120, 152-171, doi:10.1016/0022-3093(90)90200-6,
      Appendix 2 ("Interaction during the polishing of silica by silica"):
      part pressure 0.4 kg/cm^2, speed 5 cm/s, particle diameter 0.015 um ->
      contact area a_c = 0.054 nm^2, **P0 = 2627 kg/cm^2**, friction coefficient
      0.28, max surface tensile stress 268 MPa, dwell time 0.005 us.
      Unit conversion (1 kgf/cm^2 = 98066.5 Pa): 2627 * 98066.5 = 2.576e8 Pa.
      Cross-check inside the same paper: Appendix 1 (3 um particles, 0.07 kg/cm^2
      part pressure) gives P0 = 1.5e3 kg/cm^2 = 1.47e8 Pa, and Appendix 2's CeO2
      case gives 2684 kg/cm^2 = 2.63e8 Pa. So the published band for a single
      CMP-scale particle on silica is **1.5e8 - 2.6e8 Pa**, and this pack takes
      the silica-abrasive-on-silica end of it, which is the chemistry of this pack.
      ⚠ These are Cook's own Hertzian calculations from measured polishing
      conditions, not a direct stress measurement — no one can put a gauge under
      a 15 nm particle. They are, however, computed from the particle size,
      load-per-grain and elastic constants of exactly this system.
      ⚠ Cook's conditions (0.4 kg/cm^2 = 5.7 psi, 5 cm/s) are optical-polishing,
      not a 300 mm CMP tool; P0 scales weakly (as P^(1/3) per his eq. 6), so a
      3 psi CMP run sits within ~20% of this value, but the number is a
      REFERENCE-CONDITION stress, not a per-recipe one.
      Consequence: P0/H_bulk = 2.58e8 / 9e9 = 0.029 << 0.5, so the inherited
      bulk hardness alone already puts this system firmly on the ELASTIC branch
      (regime.py ELASTIC_STRESS_RATIO = 0.5). The softened layer would have to be
      ~29x softer than bulk (i.e. below ~0.3 GPa) to flip the branch to plastic.
    source: "doi:10.1016/0022-3093(90)90200-6 (Cook 1990) Appendix 2, silica-on-silica case"
    confidence: literature

  film_surface_hardness_pa:
    value: null
    unit: Pa
    note: >
      **NOT SOURCED — deliberately null.** TODO(materials-agent): the hardness of
      the hydrated/softened silica surface that CMP actually abrades has no
      published direct measurement, and the reason is physical, not clerical.
      What the literature actually says, in order of how close it gets:
      (a) Cook 1990 (doi:10.1016/0022-3093(90)90200-6) states plainly that
          "material constants for the surface itself are not available", and
          that the bulk elastic constants of hydrated silicate glasses are "not
          appreciably different from their anhydrous analogs [17,18]". He defines
          microhardness as average bond energy per unit volume and says it "may
          be reduced by hydration and corrosion" — a direction, not a number.
      (b) The softened layer on PURE silica is 0.5-12 nm thick (Cook's Fick
          calculation) against 1-20 nm measured; Tadjiev & Hand 2010
          (J. Non-Cryst. Solids 356(2) 102-108,
          doi:10.1016/j.jnoncrysol.2009.10.004) report that for durable glasses
          the hydrated layer is "of the order of 5 nm which is too small to be
          detected by nanoindentation due to indenter bluntness". So the
          measurement this key wants is BELOW the resolution of the standard
          technique for exactly the composition we care about.
      (c) Bracketing evidence from less durable glasses, same paper, Table 2
          (bulk H -> hydrated-layer H, GPa): SKMB1 5.1 -> 1.6; SKMB2 4.8 -> 2.5;
          SS 6.2 -> 1.9 (5 min) / 1.5 (10 min). Softening factor 0.24-0.52.
          Their high-durability soda-lime compositions showed NO measurable
          change at all. Pure SiO2 is the most durable of the family, so
          transferring the 0.24-0.52 factor to it would be an extrapolation
          across the exact variable (chemical durability) that controls the
          effect — that is a guess, and this project does not ship guesses.
      (d) Milder, closer-to-durable evidence: Zhang et al. 2024, npj Mater.
          Degrad. (doi:10.1038/s41529-024-00431-3) measure a boroaluminosilicate
          surface going from ~7.5 to ~6.4 GPa nanohardness (Vickers 6.5 -> 5.8)
          after 90 min aqueous corrosion — a factor of only 0.85.
      So the honest bracket for a hydrated silica surface is somewhere between
      0.85x and 0.24x of bulk, i.e. 2.2-7.7 GPa against the inherited
      film_bulk_hardness_pa = 9e9 — a 3.5x spread that changes no decision here
      (see particle_contact_stress_pa: the elastic branch survives down to
      ~0.3 GPa), so a point value would add false precision without adding a
      single correct prediction.
      What would close this: nanoindentation with a sharp Berkovich at <5 nm
      contact depth on a freshly polished, never-dried SiO2 CMP surface, or a
      modulus-mapping AFM section through the Beilby layer (Suratwala et al.
      2015, doi:10.1111/jace.13659, measured that layer's CHEMISTRY by SIMS but
      published no hardness for it).
    source: "null result; bracket from doi:10.1016/j.jnoncrysol.2009.10.004 Table 2 and doi:10.1038/s41529-024-00431-3"
    confidence: unverified

  hydration_layer_depth_nm:
    value: 1.2
    unit: nm
    note: >
      Depth of water penetration into the silica surface during ONE particle
      pass — the thickness of the layer that CMP actually removes. Cook 1990
      Appendix 1 worked example (0.07 kg/cm^2, 5 cm/s, 3 um particles, glass
      surface 465 K): D_eff = 2.4e-9 cm^2/s under the travelling-indenter tensile
      stress, t_eff = 2.9 us -> depth = (2 D_eff t_eff)^0.5 = **1.2 nm**.
      Appendix 2's silica-abrasive case gives 0.1 nm and its CeO2 case 1.1 nm.
      Cook's full Fig. 8 span over particle size and pressure is 0.5-12 nm
      against measured polishing-layer thicknesses of 1-20 nm.
      ⚠ Diagnostic only — no layer in this engine consumes it yet. It is recorded
      because it is the quantity Cook's model actually predicts, and because
      film_surface_hardness_pa cannot be measured until someone indents this
      thickness (see that key's note).
      ⚠ NOT the Beilby layer: Suratwala et al. 2015 (doi:10.1111/jace.13659)
      measured ~50 nm of Ce penetration by SIMS, an order thicker, but by a
      reactive rather than diffusive mechanism — different physical object.
    source: "doi:10.1016/0022-3093(90)90200-6 (Cook 1990) Appendix 1 + Fig. 8"
    confidence: literature

  # ══════════════════════════════════════════════════════════════════
  # 2. Arrhenius / activation energy — the sources DISAGREE by 15x
  # ══════════════════════════════════════════════════════════════════

  chem_activation_energy_kj_per_mol:
    value: 8.75
    unit: kJ/mol
    note: >
      APPARENT activation energy for SiO2 removal, from an Arrhenius plot of
      blanket-wafer removal rate against mean process temperature.
      Shin et al. 2025, Materials 18(19) 4461, doi:10.3390/ma18194461 (MDPI
      CC-BY, PMC12525981): "The calculated activation energies were 8.75 kJ/mol
      for SiO2, 29.9 kJ/mol for Ta, and 151.7 kJ/mol for Cu", ln A = 9.7 / 18.1 /
      66.3 respectively; 200 mm blanket wafers, G&P POLI-500, IR-monitored pad
      temperature, barrier-removal slurry. The paper's own reading: SiO2's low Ea
      means "the reaction can proceed even without elevated temperatures, as the
      hydrated layer forms under typical CMP process temperatures" — i.e. oxide
      removal is nearly temperature-independent (30 -> 50 C gives only ~1.24x).
      **THE LITERATURE DISAGREES HERE AND THE DISAGREEMENT IS RECORDED, NOT
      AVERAGED:**
        - Shin 2025 (this value): SiO2, 8.75 kJ/mol. Directly measured on SiO2,
          but with a barrier slurry, not a colloidal-silica oxide slurry.
        - Mariscal et al. 2020, ECS JSS 9 044008, doi:10.1149/2162-8777/ab89bc,
          Table I: SiO2 Ea = **1.40 eV = 135.1 kJ/mol** (Si3N4 1.47 eV =
          141.8 kJ/mol), ceria slurry, fitted inside a modified
          Langmuir-Hinshelwood model. The authors themselves caveat it: their
          Arrhenius abscissa is the PAD temperature Tp, not the true wafer
          reaction temperature Tw, and they write that "the actual activation
          energies for our SiO2 and Si3N4 processes will be markedly different
          from the extracted values reported here". That value is carried in
          sti_ceria.yaml, which is the pack its chemistry belongs to.
        - Cook 1990's mechanistic expectation, the one this pack's physics is
          built on: water diffusion into silica has **~40 kJ/mol below 550 C**
          and ~80 kJ/mol above (Wakabayashi & Tomozawa data, Cook 1990 Fig. 6,
          secondary citation within Cook). If oxide CMP were rate-limited by the
          hydrolysis diffusion step, ~40 kJ/mol is what one should see.
      Shin's 8.75 is FAR below Cook's 40, i.e. the measured oxide CMP response is
      even less thermally activated than pure hydrolysis diffusion — consistent
      with a mechanically-limited regime where the chemistry is never the
      bottleneck, which is also what Mariscal's k1/k2 = 6.3-142 for SiO2 says.
      Use for RANKING thermal sensitivity (oxide << barrier << Cu), not for
      absolute rate.
    source: "doi:10.3390/ma18194461 (Shin 2025) Fig. 5; disagreement vs doi:10.1149/2162-8777/ab89bc Table I and Cook 1990 Fig. 6"
    confidence: literature

  chem_temp_ref_c:
    value: null
    unit: C
    note: >
      **NOT SOURCED — deliberately null, and this null is load-bearing.**
      TODO(calibration-owner): the Arrhenius term in
      cmp_sim/models/chemical_rate.py only switches on when BOTH
      chem_activation_energy_kj_per_mol and chem_temp_ref_c exist. The reference
      temperature is not a literature constant — it is "the temperature at which
      this pack's kp_m_per_pa was back-calculated", and the inherited Kp comes
      from a STI calibration point (P = 20.7 kPa, V = 0.8 m/s -> 254.05 nm/min)
      whose wafer/pad temperature is not reported. Declaring a number here would
      silently re-scale every rate this pack predicts, and would double-count
      whatever temperature is already baked into Kp.
      Leaving it null keeps the thermal response reported as UNMODELLED (the
      engine emits an explicit warning when a temperature is supplied), which is
      the correct state: Ea is known, the anchor is not.
      To close it: re-run this pack's Kp calibration with the pad surface
      temperature logged, then set this key to that temperature.
    source: "TODO(calibration-owner) — reference temperature of the Kp back-calculation is unreported"
    confidence: unverified

  # ══════════════════════════════════════════════════════════════════
  # 3. Pattern / planarization (MIT Stine-Ouma-Lee framework)
  # ══════════════════════════════════════════════════════════════════
  # Engine keys consumed by cmp_sim/core/solver.py::_pattern_diagnostic are
  # planarization_length_m / initial_step_height_m / stop_layer_rate_m_per_s /
  # dishing_max_m / oxide_dishing_sensitivity_b / die_size_m. The
  # pattern_*-prefixed keys named in the data-gap list are declared alongside
  # them with identical values and sources so the gap list closes literally;
  # they are aliases, not independent measurements.

  planarization_length_m:
    value: 3.75e-03
    unit: m
    note: >
      Pad planarization length PL for oxide CMP — the length over which the pad
      averages the layout (rho_eff = layout (*) w, Ouma eq. 5.4).
      Ouma, "Modeling of Chemical Mechanical Polishing for Dielectric
      Planarization", Ph.D. thesis, MIT EECS 1999, hdl:1721.1/9704, Table 5.2:
      PL measured on a characterisation mask at four process corners —
      **A (low P, low V) 3.75 mm; B (low P, high V) 4.50 mm; C (high P, low V)
      3.60 mm; D (high P, high V) 2.90 mm.** This pack takes corner A, the
      low-pressure/low-speed corner closest to the inherited Kp calibration
      point (20.7 kPa = 3 psi).
      PL is formally defined as the width at which the elliptic pad-bending
      weight falls to 2/pi of its peak (Ouma Fig. 5.11); the engine approximates
      that kernel with a Gaussian and declares the approximation.
      **Reported range, not a single truth.** Independent confirmation on a
      different tool: Lee, "Modeling of CMP for Shallow Trench Isolation",
      Ph.D. thesis, MIT EECS 2002, hdl:1721.1/29907, Table 2.3 extracts
      PL_ox = 2.3-4.1 mm on a stacked IC1400 pad and 5.3-7.5 mm on IC1000 solo
      over 10 processes. Ouma Fig. 7.5 separately reports 3.0 mm (conventional)
      vs 9.5 mm (high-speed, subpad removed) — "about three times".
      So the published span is ~2.3-9.5 mm and it is dominated by SUBPAD
      STIFFNESS, not by slurry: PL is a consumable-set property, and Ouma
      p.149 finds it insensitive to pad wear and conditioning.
      ⚠ This is the MIT tool's PL, not this pack's tool's. Without a
      characterisation-mask run on the target tool the absolute value is
      transferred, not measured (Ouma's own caution, §7.2.5).
    source: "Ouma 1999 MIT PhD thesis hdl:1721.1/9704 Table 5.2 (p.146); range cross-checked against Lee 2002 hdl:1721.1/29907 Table 2.3"
    confidence: literature

  pattern_planarization_length_mm:
    value: 3.75
    unit: mm
    note: >
      Alias of planarization_length_m in the units the gap list asked for.
      Same measurement, same source — NOT an independent value. Keep the two in
      step if either is edited.
    source: "Ouma 1999 MIT PhD thesis hdl:1721.1/9704 Table 5.2 (p.146)"
    confidence: literature

  initial_step_height_m:
    value: 6.60e-07
    unit: m
    note: >
      Initial local step height z1 presented to the polish. Lee 2002
      (hdl:1721.1/29907) §2.12 experimental stack: pad oxide 100 A + nitride
      1500 A + trench depth 5000 A -> **z1 = 6600 A = 660 nm**, with 9000 A of
      oxide overburden deposited. Lee's Table 2.4 processes use a
      SILICA-based slurry, which is why this stack is quoted in this pack rather
      than only in the ceria one.
      Alternative published stack, recorded rather than averaged: Mariscal et al.
      2020 (doi:10.1149/2162-8777/ab89bc) Fig. 2 — Si trench 2850 A plus thermal
      oxide gives a 4650 A trench, HDP fill 6000 A, so z1 = 4650 A = 465 nm.
      ⚠ Step height is a LAYOUT/integration property, not a slurry property. It
      is a legitimate default for an STI-like stack and a wrong number for any
      other integration scheme; override it per recipe.
    source: "Lee 2002 MIT PhD thesis hdl:1721.1/29907 §2.12 (p.65, p.75)"
    confidence: literature

  pattern_step_height_nm:
    value: 660.0
    unit: nm
    note: >
      Alias of initial_step_height_m in nm. Same measurement, same source — not
      an independent value.
    source: "Lee 2002 MIT PhD thesis hdl:1721.1/29907 §2.12"
    confidence: literature

  pattern_selectivity:
    value: 4.0
    unit: "-"
    note: >
      Blanket SiO2:Si3N4 removal-rate selectivity for a SILICA-based slurry.
      Mariscal et al. 2020, ECS JSS 9 044008, doi:10.1149/2162-8777/ab89bc,
      states it directly while contrasting their ceria results: "silica-based
      slurries reach values of RR selectivity that are a mere 4:1".
      This is the headline difference between the two abrasives and the reason
      ceria exists for STI: ceria in the SAME study reached 32:1-101:1.
      **Honest spread.** Lee 2002 (hdl:1721.1/29907) Table 2.4 extracted
      s = 2.7, 2.8, 3.1, 4.2, 4.4, 7.2, 8.6, 8.9, 10.3, 38 from ten silica-slurry
      STI processes, and the thesis remarks that "selectivity also appears to
      change with process conditions". So 4:1 is the representative low value and
      a single blanket selectivity must NOT be treated as a slurry constant: it
      moves by an order of magnitude with pressure and speed on the same slurry.
      ⚠ Diagnostic only. The engine's pattern layer consumes
      stop_layer_rate_m_per_s, not this ratio, and no nitride film model exists.
    source: "doi:10.1149/2162-8777/ab89bc (Mariscal 2020), silica-slurry comparison statement; spread from Lee 2002 hdl:1721.1/29907 Table 2.4"
    confidence: literature

  oxide_nitride_selectivity:
    value: 4.0
    unit: "-"
    note: >
      Same quantity as pattern_selectivity, under the key name the ceria pack
      already uses, so that the two packs can be compared on one axis. Silica
      slurry ~4:1 vs ceria's tens-to-hundreds. Source and caveats as above.
    source: "doi:10.1149/2162-8777/ab89bc (Mariscal 2020)"
    confidence: literature

  stop_layer_rate_m_per_s:
    value: null
    unit: m/s
    note: >
      **NOT SOURCED — null.** TODO(materials-agent): no paper found that reports
      an absolute Si3N4 removal rate for a colloidal-SILICA oxide slurry under a
      stated pressure/speed. Mariscal 2020 gives the silica selectivity (4:1) but
      its measured nitride rates are for the CERIA slurry; Lee 2002 extracts
