  # ══════════════════════════════════════════════════════════════════
  # 4. pH / surface charge of the OXIDE FILM (not the abrasive)
  # ══════════════════════════════════════════════════════════════════

  wafer_iep_ph:
    value: 2.5
    unit: pH
    note: >
      Isoelectric point of the silica FILM surface (the wafer side). The
      inherited pack declares abrasive_iep_ph = 2.5 for the colloidal-silica
      PARTICLE but never the film, so a silica-on-silica system had only half
      its electrostatics declared.
      Published range 2-3. Dandu Veera, Peddeti & Babu 2009, J. Electrochem.
      Soc. 156(12) H936-H943, doi:10.1149/1.3230624, measured silica as
      **negatively charged across pH 2-12** on their own instrument, i.e. IEP at
      or below 2. Cook 1990 (doi:10.1016/0022-3093(90)90200-6) §3.1 gives the
      underlying surface chemistry: Si-OH2+ <-> Si-OH <-> Si-O-, with pK1 ~ -2
      and the two charged species at equal concentration at pH 9.8, and only 9%
      of silanols ionised at pH 7.
      Mechanistic consequence for THIS pack, and the reason Cook says
      silica-on-silica polishes badly: particle and film are the same material,
      so at the operating pH 10.5 both are strongly negative. Cook §4 is explicit
      — "if both the glass and the polishing particle are the same material ...
      contact bonding is inefficient because of the lack of difference in surface
      charge ... consequently polishing rates are very low". That is precisely
      the absence of a chemical tooth, and it is why the ceria pack must own a
      different concentration/redox law rather than inheriting this one.
      Quantified in the same paper: 1 SiO2 molecule removed per 5e8 collisions
      for silica abrasive vs 1 per 24 collisions for CeO2 — a 2e7x difference in
      per-impact efficiency at nearly identical contact pressure (2627 vs
      2684 kg/cm^2).
    source: "doi:10.1149/1.3230624 (Dandu 2009) zeta data; mechanism doi:10.1016/0022-3093(90)90200-6 (Cook 1990) §3.1, §4"
    confidence: literature

  # ══════════════════════════════════════════════════════════════════
  # 5. Stop-layer (Si3N4) material constants — diagnostic
  # ══════════════════════════════════════════════════════════════════

  stop_layer_hardness_pa:
    value: 1.36e+10
    unit: Pa
    note: >
      Nanoindentation hardness of the PECVD SiNx stop layer — the deposition
      type used in the blanket nitride work this project validates against
      (Mariscal 2020 polished PECVD Si3N4).
      Gan et al. 2018, "Mechanical Properties of Silicon Nitride and Oxynitride
      Thin Films Deposited by PECVD", Surfaces 1(1) 59-72,
      doi:10.3390/surfaces1010006 (MDPI CC-BY), Table 2:
      **silane 16 sccm: E = 153.0 +/- 14.9 GPa, H = 13.6 +/- 2.9 GPa**;
      silane 50 sccm (more Si-rich): E = 108.5 +/- 10.6, H = 10.2 +/- 3.0.
      Si excess and hydrogen soften the network, so PECVD SiNx spans ~10-14 GPa.
      **Disagreeing deposition method, recorded not averaged:** LPCVD low-stress
      SiN is reported at E ~ 224 GPa, H ~ 22.5 GPa (Zheng et al., Adv. Mater.
      Sci. Eng. 2013, 835942, doi:10.1155/2013/835942 — full text not obtained,
      secondary). LPCVD is the harder, better stop layer; which number applies
      depends entirely on how the nitride was deposited.
      Hardness ordering that matters for CMP:
      LPCVD Si3N4 ~22.5 > PECVD SiNx ~13.6 > SiO2 ~8-9 GPa. The review
      Srinivasan, Dandu & Babu 2015, ECS JSS 4(11) P5029,
      doi:10.1149/2.0071511jss, states the operative consequence: "silicon
      nitride is harder than silicon dioxide or ceria" and "the ceria particles
      are softer than the nitride film" — so nitride is not removed mechanically
      at all. It is hydrolysed to SiO2/Si(OH)4 first
      (Si3N4 + 6H2O -> 3SiO2 + 4NH3) and only that soft product is abraded,
      which is why blocking the hydrolysis blocks the nitride removal outright.
      ⚠ Diagnostic only — no nitride film model exists in the engine.
    source: "doi:10.3390/surfaces1010006 (Gan 2018) Table 2; mechanism doi:10.1149/2.0071511jss (Srinivasan 2015)"
    confidence: literature
