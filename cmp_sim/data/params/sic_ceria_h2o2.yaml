# 4H-SiC CMP — ceria / H2O2 alkaline slurry.
#
# OVERRIDE of the inherited legacy/knowledge/params/sic_ceria_h2o2.yaml.
#
# Why this file exists
# --------------------
# The inherited SiC pack declares `base: sti_ceria` and never overrides
# `kp_m_per_pa`, so it silently inherited the OXIDE Preston coefficient
# (2.2e-13 m/Pa). 4H-SiC is one of the hardest materials polished in a fab and
# removes roughly two orders of magnitude slower than oxide, so the inherited
# pack over-predicted SiC removal by ~128x: a 5.5 psi / 60 rpm run returned
# ~6,300 A/min where the source data for that very condition reports 2-7 nm/min
# (20-70 A/min).
#
# This was not a modelling error but an inheritance accident: the pack was
# created to switch the pH term on, and Kp was never revisited. The fix is data,
# not code.
#
# How the value below was obtained
# --------------------------------
# Least-squares fit of the single free constant Kp over all 50 runs of the
# source DOE (the same data the rest of this pack is built from):
#
#     Kp* = <x, y> / <x, x> = 1.714e-15 m/Pa
#
# where x is the area-averaged P*V term at Kp = 1 and y the measured rate.
#
# HONEST LIMIT: the residual of that fit is 59% MAPE, because in this DOE
# pressure and speed are NOT the dominant factors. The source's own factor
# ranking is pH (+0.520) > head rpm (+0.341) > CeO2 (+0.286) > pressure
# (+0.266) > H2O2 (+0.221), and pump flow (-0.317) and polish time (-0.324)
# outrank composition entirely. SiC removal is chemically rate-limited, so a
# mechanical P*V law cannot fit it well no matter how Kp is chosen. Use this
# pack for RANKING composition changes, not for absolute rate.

base: sic_ceria_h2o2
description: "4H-SiC: ceria/H2O2 alkaline slurry, Kp refitted to SiC's own DOE"

params:
  reference_abrasive:
    value: ceria
    unit: abrasive database key
    note: >
      Kp was back-calculated from Wang et al. ACS SI Table S3 point S3-27, a
      CeO2 4 wt% / H2O2 4 vol% / pH 10 SiC polish - a ceria measurement. The
      pack's own size-exponent note records that SiC's two sweeps are alumina
      (+0.24) and silica (+0.10) while ceria elsewhere gives +0.87, i.e. the
      abrasives disagree on this film too, so the swap must be detected.
    source: "Wang et al. ACS SI Table S3 point S3-27 (this pack's Kp anchor)"
    confidence: literature

  abrasive_conc_exponent:
    value: null
    unit: dimensionless
    note: >
      WITHDRAWN 2026-09-28 (§55). Deliberately null so the DERIVED exponent
      acts instead. This is a constant REMOVED, not a constant refitted.

      The inherited value was +0.227, the median log-log slope of 17 matched
      pairs in Wang et al. figshare:31056549. It is a fit, and the same
      three-factor decomposition this engine already resolves for every run
      gives the surface-area limit

          n_C = p * (1 - alpha*chi) = +1/3

      from the contact branch alone -- no data, no free parameter. The pack's
      own inherited note already recorded that the two agree in sign and order
      of magnitude, and read the gap as high-loading saturation. It never
      priced them against each other.

      MEASURED through the shipping solver (shape MAPE, one free scale per
      block, exactly as the scorer fits it). Every block under this pack
      improves or is untouched when the fitted constant is withdrawn:

        liang2026_4hsic_ceria_composite_h2o2_conc   18.17% -> 11.21%
        sic2026_ceria_h2o2_ph_DOE50                 33.96% -> 33.47%
        su2011_procengr_6hsic_alumina_abrasive_conc 14.36% -> 13.98%
        su2011_sic_alumina_size_sweep                4.38% ->  4.38%
        wei2026_sic_silica_size_sweep                3.18% ->  3.18%

      0 worse, 3 better, 2 unchanged -- and the two improved loading blocks
      are BOTH held out (used_for_calibration: false), so this is not the
      model scoring itself. The liang2026 block is the corpus's cheapest
      remaining crosser on the held-out ladder.

      ⚠ NOT a licence to tune: the derived +1/3 is what the model computes,
      and it is adopted BECAUSE it is derived, not because it scores better.
      Had it scored worse the fitted value would have stayed and the
      disagreement would have been recorded. An exponent scanned per block is
      forbidden (docs/limits.md §33).

      EXIT CONDITION: a 4H-SiC loading ladder at fixed pH and oxidiser, in
      the plastic/indentation branch where the decomposition gives a
      different p, would make the derivation testable rather than merely
      unfalsified here.
    source: >
      derived in cmp_sim/models/luo_dornfeld.py (n_C = p*(1-alpha*chi), the
      surface-area limit of the three-factor contact decomposition); the
      withdrawn fit was Wang et al. figshare:31056549 ACS SI Table S3,
      17 matched pairs (median +0.227, bootstrap 95% CI -0.136..+0.598)
    confidence: literature

  abrasive_conc_half_wt_pct:
    value: null
    unit: wt%
    note: >
      TODO(owner) - deliberately null. SiC does NOT show a single saturating
      response to abrasive loading, so fitting one would be curve-fitting
      through a contradiction.

      ⚠ 2026-09-28 RE-AUDIT (§55, tools/sic_conc_half_refusal_reaudit.py).
      The enumeration below EXPIRED and is kept only as the superseded
      reasoning. Two of its six series are no longer this pack's: ruling
      #49-B moved entegris2022_us20220315802a1_sic_alumina_conc (the -0.40
      "decisive" fall, and an ACID KMnO4/alumina system) to the
      sic_alumina_kmno4 pack. Re-running the enumeration today finds exactly
      ONE iso-condition loading ladder under this pack --
      su2011_procengr_6hsic_alumina_abrasive_conc at +0.486 -- and ZERO
      falling ones. The contradiction that justified the null has dissolved.

      THE NULL SURVIVES ANYWAY, for a different and measured reason. One
      ladder cannot anchor a saturation constant: priced through the shipping
      solver, every C_half from 1 to 8 wt% makes liang2026 WORSE than the
      withdrawn-exponent baseline (11.21% -> 30.79/26.47/23.58/21.49/20.09/
      17.76/15.61/14.12%) and none of the other four blocks improves. The
      saturating form is competing with a derivation that already fits.

      EXIT CONDITION: a second iso-condition 4H-SiC loading ladder reaching
      above ~7 wt% at fixed pH and oxidiser. Until then this is "one ladder,
      cannot identify a saturation constant", NOT "the data contradict
      saturation".

      Superseded enumeration, left in place per docs/limits.md §51 (how a
      wrong scope failed is the lesson): six iso-condition series give
      exponents of -0.40, -0.28, +0.01, +0.44, +0.49 and +1.43. Two of them
      fall with loading, which no saturating form can produce: Entegris
      US 2022/0315802 A1 measures 966.7 -> 200 A/min as alumina goes
      0.1 -> 5 wt%, a 5x DROP for 50x more abrasive.
      The best single C_half still leaves 36.7% error against 5.8-9.5% for
      the other packs.

      This is consistent with SiC being chemically rate-limited (its P*V
      correlation is R^2 = 0.09): if the oxide layer, not the abrasive, sets
      the rate, then adding abrasive mostly adds agglomeration and slurry
      starvation. Leaving this null keeps the bare power law, which is also
      wrong but does not claim a saturation that the data denies.
    source: >
      entegris2022_us20220315802a1_sic_alumina_conc.yaml (-0.40),
      sic2026_ceria_h2o2_ph_DOE50.yaml (-0.28, +0.01, +0.49, +1.43),
      su2011_procengr_6hsic_alumina_abrasive_conc.yaml (+0.44)
    confidence: low
  abrasive_size_exponent:
    value: 0.17
    unit: dimensionless
    note: >
      MRR ~ d^n. SiC sits between the two mechanisms: its own two sweeps give +0.24 (alumina, 1000-3500 nm) and +0.10 (silica, 30-130 nm), so 0.17 is their mean and the abrasive-specific values should be preferred when known.
      Measured sweeps split by ABRASIVE, not by film: ceria +0.87 (3 sweeps,
      3-211 nm), alumina +0.29 (2 sweeps, 50-3500 nm), silica -0.05 (5
      sweeps, 12-160 nm, five different films). Within one abrasive the
      sweeps agree; across abrasives they do not share a sign, so this value
      is NOT transferable to a pack with a different abrasive.
    source: su2011_sic_alumina_size_sweep (+0.24), wei2026_sic_silica_size_sweep (+0.10)
    confidence: low

  # ── block the inherited oxide pH response ──────────────────────────────
  # sic_ceria_h2o2 inherits from sti_ceria, so the pH optimum fitted to
  # ceria-on-SILICA sweeps (peak 4.5, width 1.2) arrived here uninvited and
  # multiplied SiC's rate by 0.57 at its own operating pH, pushing the
  # prediction below the published SiC floor. Same class of inheritance
  # accident that once made Kp wrong by 128x in this pack.
  #
  # SiC is not silica: it is chemically rate-limited (its P*V correlation is
  # R^2 = 0.09), its removal depends on OXIDATION of the Si face rather than
  # on hydrolysis of a silica network, and the reported pH dependence goes the
  # other way -- alkaline-oxidant systems are the ones that work. Setting the
  # width to null switches the term OFF rather than guessing a SiC optimum.
  # UPDATE — the isolation the note said was impossible turned out to exist.
  #
  # The claim below was that "the DOE50 set varies pH together with oxidizer
  # and pressure, so it cannot isolate the pH axis". That is true of the set as
  # a whole, but not of its structure: grouping the 50 rows so that ONLY pH
  # moves leaves FIVE isolated groups spanning pH 9/10/11, which is enough to
  # fit a peak position, a width and a floor.
  #
  # Fitted over those five groups (scale free per group, so this is a shape
  # fit): the optimum is pH 10.5, width 1.25, floor 0.10, at 27.5% shape error.
  # With the term inactive the same five groups score 57.1%.
  #
  # The peak position matters more than the numbers. The INHERITED chain would
  # have supplied pH 4.5 from sti_ceria — the direct parent, an acid-side ceria
  # optimum — and the note above is right that this is wrong for SiC. (Note the
  # grandparent oxide_silica sits at 11.0, so the leak to guard against is the
  # ceria one, not silica's.) But the fix was to disable the term, which left
  # the pack declaring `ph_peak: 4.5` (inherited) with
  # `ph_response_width: null`, i.e. a constant that LOOKS like a SiC optimum
  # and does nothing. The engine warns about exactly this ("declares an optimum
  # pH but no ph_response_width, so pH is INERT"), and an inert constant that
  # looks active is worse than no constant.
  #
  # So the term is now activated with SiC's OWN optimum, which the data put at
  # the alkaline end — agreeing with the mechanism argued above: SiC removal
  # needs oxidation of the Si face, and the alkaline-oxidant systems are the
  # ones that work.
  ph_peak:
    value: 10.5
    unit: pH
    note: >
      Fitted over the five isolated pH groups of the DOE50 set (pH 9/10/11 at
      otherwise matched conditions). Interior to the measured range, so unlike
      the Cu and anionic-silica packs this is a genuine optimum rather than a
      bound — the data bracket it on both sides.

      ⚠ The bracket is narrow (9 to 11) and the fitted peak sits near its
      centre, so the position is better supported than its width. Pinning the
      peak to the alkaline end instead (11.0) costs 31.1% against 27.5%.

      Explicitly NOT the inherited silica optimum of 4.5: SiC is oxidation-
      limited, not hydrolysis-limited, and its reported pH dependence runs the
      other way.
    source: >
      cmp_sim/data/validation/datasets/sic2026_ceria_h2o2_ph_DOE50.yaml,
      five pH-isolated groups
    confidence: med

  ph_response_width:
    value: 1.25
    unit: pH
    note: >
      Fitted jointly with the peak and floor over the same five groups.

      ⚠ Least trustworthy of the three: the measured pH span is only 9-11, so
      the width is constrained by two points either side of the optimum. It
      should be re-fitted if a wider SiC pH sweep appears.
    source: same five isolated groups (sic2026_ceria_h2o2_ph_DOE50)
    confidence: low
  # ── blocking an inherited value that does not belong to SiC ──────────
  # This pack's lineage runs SiC -> sti_ceria -> oxide_silica, so anything the
  # silica packs declare arrives here unless it is overridden. That has already
  # bitten once: the oxide Kp of 2.2e-13 was inherited silently and
  # over-predicted SiC by ~128x (see kp_m_per_pa below).
  #
  # The same thing just happened with the elastic modulus. Adding SiO2's
  # E = 92 GPa to the silica packs propagated it to SiC, whose real modulus is
  # ~4-5x larger, and the pad-limited plasticity criterion goes as E^2 - so the
  # inherited value made SiC look 'elastic' on a number that was never about
  # SiC. Declared null rather than filled with a handbook figure: no source in
  # this corpus measures 4H-SiC modulus alongside the wet-pad hardness the
  # criterion pairs it with, and mixing studies is how the 128x error happened.
  film_youngs_modulus_pa:
    value: null
    unit: Pa
    note: >
      TODO(owner) - deliberately blocked, not missing by oversight.
      4H-SiC modulus is ~450 GPa in the literature (vs SiO2's 92), but this
      pack must not inherit the silica value, and a handbook number paired with
      a pad hardness measured in a different study is the kind of mixing that
      produced this pack's historical 128x Kp error. With it null the engine
      reports contact_branch as undetermined for SiC, which is honest: SiC is
      chemically rate-limited anyway, so the particle-contact branch is not the
      term that decides its rate.
      To fill it: a measured 4H-SiC elastic modulus for YOUR wafer orientation
      and doping, and ideally a wet-pad nanohardness from the same tool.
    source: "TODO(owner) - no non-mixing source in this corpus"
    confidence: unverified

  kp_m_per_pa:
    value: 1.714e-15
    unit: m/Pa
    note: >
      Least-squares fit of Kp over the full 50-run 4H-SiC DOE (Wang et al.,
      figshare:31056549, ACS SI Table S3), measured rates 1.24-16.0 nm/min.
      Replaces the oxide value of 2.2e-13 that was inherited unintentionally
      from the sti_ceria parent, which over-predicted SiC by ~128x.
      Fit residual 59% MAPE: SiC is chemically rate-limited, so P*V explains
      only part of the variance (the source ranks pH and flow above pressure).
      Adequate for ranking, not for absolute rate.
    source: "figshare:31056549 ACS SI Table S3 (50-run DOE, least-squares Kp fit)"
    confidence: measured

  ph_mechanical_floor:
    value: 0.10
    unit: fraction of peak rate
    note: >
      Fitted with the peak and width over the five isolated groups. SiC still
      removes away from the optimum — the ceria abrasive is under load whatever
      the pH — so a zero floor would be wrong in the same way it is wrong for
      every other pack here.
    source: same five isolated groups (sic2026_ceria_h2o2_ph_DOE50)
    confidence: low

  ph_valid_range:
    value: [9.0, 11.0]
    unit: pH
    note: >
      The DOE50 set's entire pH span. NARROW — two units — and the fitted
      optimum sits inside it, so both limbs are short. Anything asked outside
      9-11 is extrapolation and the engine says so.
    source: "sic2026_ceria_h2o2_ph_DOE50.yaml (pH levels 9, 10, 11)"
    confidence: high
