# Tungsten plug CMP — Fe(III)/H2O2 (Fenton) chemistry.
#
# OVERRIDE of the inherited legacy/knowledge/params/w_fe_oxidizer.yaml.
#
# Why this file exists
# --------------------
# The inherited pack's `kp_m_per_pa` is 2.8e-13 m/Pa, marked `estimated`, and
# its own note says it was back-calculated from a quoted literature RANGE
# ("300-600 nm/min at 3 psi") rather than from a measured operating point. That
# range is high for tungsten, and using it made the W example return ~5,000
# A/min — above the published envelope for W plug CMP.
#
# How the value below was obtained
# --------------------------------
# Least-squares Kp fit against the two W datasets already in the validation
# corpus, which are printed patent example tables (no digitisation error):
#
#   US2011/0186542A1  15 conditions, 24.6-265.0 nm/min  ->  Kp = 7.18e-14
#   US8070843B2        5 conditions,  9.6-296.5 nm/min  ->  Kp = 6.82e-14
#
# Two independent patents from different applicants agree within 5%, which is
# far better evidence than a single quoted range. The adopted value is their
# mean, 7.0e-14 m/Pa — a factor of 4 below the inherited estimate.
#
# HONEST LIMIT: both sources sweep chemistry more than pressure, so this Kp is
# a corpus-wide average rather than a single-point calibration. Tungsten
# removal also depends strongly on oxidizer concentration through the
# passivation layer, which the chemistry layer handles separately; do not read
# this constant as "the" W Preston coefficient for an arbitrary slurry.

base: w_fe_oxidizer
description: "Tungsten / Fe-H2O2, Kp refitted to two printed patent example tables"

params:
  kp_m_per_pa:
    value: 7.0e-14
    unit: m/Pa
    note: >
      Mean of independent least-squares Kp fits to US2011/0186542A1 (n=15,
      Kp = 7.18e-14) and US8070843B2 (n=5, Kp = 6.82e-14), both printed patent
      example tables. The two agree within 5%. Replaces the inherited 2.8e-13,
      which was derived from a quoted literature rate range rather than data and
      over-predicted W removal by ~4x.
    source: "US2011/0186542A1 Table + US8070843B2 Table (least-squares Kp fit)"
    confidence: literature
