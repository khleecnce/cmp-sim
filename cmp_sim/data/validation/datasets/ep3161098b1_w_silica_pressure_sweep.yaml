  # ---- 5F (printed as 1F): 60 ppm Fe, 63 ppm inhibitor -------------------
  - label: "5F Fe60/inh63, 1.5 psi"
    pressure_psi: 1.5
    rpm_platen: 100
    mrr_nm_per_min: 30.0
    read_method: table
    overrides: &c5F
      sfr_ml_min: 200
      abrasive_wt_pct: 2.0
      abrasive_size_nm: 55.0
      slurry_ph: 4.0
      oxidizer_wt_pct: 2.0
      fe_ppm: 60
      inhibitor_ppm: 63
  - label: "5F Fe60/inh63, 2.0 psi"
    pressure_psi: 2.0
    rpm_platen: 100
    mrr_nm_per_min: 85.0
    read_method: table
    overrides: *c5F
  - label: "5F Fe60/inh63, 3.0 psi"
