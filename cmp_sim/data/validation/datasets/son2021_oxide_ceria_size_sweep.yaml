notes: >
  Swept axis: wet-ceria abrasive size — 3 / 20 / 40 / 70 / 100 nm. Pressure (3 psi), both
  rotation speeds (87 table / 93 carrier), flow (200 ml/min), polish time (60 s), pad
  (IC1000/Suba IV), pad conditioning, tool (POLI-762) and film (450 nm CVD SiO2 on 300 mm)
  are all printed and identical.

  ⚠ EXCLUDED POINT — abrasive (a), 82 nm DRY CeO2, which digitizes to ~600 nm/min. It is
  in the same Figure 1 but it is a DIFFERENT ABRASIVE MATERIAL: milled cerium carbonate
  with an irregular surface, versus wet-precipitated f.c.c.-faceted particles for (b)-(f),
  as the caption states. Including it would (i) confound abrasive type with size and
  (ii) break the monotonic trend, since dry 82 nm (~600) exceeds wet 100 nm (~399). Per
  the no-pooling rule, it is reported here but NOT used as a data row. If you ever want a
  dry-vs-wet comparison, that is a separate 2-level material contrast, not a size sweep.

  ⚠ ABRASIVE LOADING IS NOT STATED for the Fig. 1 series, so `abrasive_wt_pct` is
  deliberately ABSENT from every row. The Methods give 0.3 wt% for the NEW super-fine
  Ce(OH)4 slurries (the paper's main subject, Fig. 4), but Figure 1 is the conventional
  dry/wet CeO2 baseline that motivates the work and no loading is given for it. I have not
  carried the 0.3 wt% across — that would be an assumption, and if loading did vary with
  size in this baseline set the sweep would be confounded. Treat the exponent below as
  conditional on loading having been held fixed, which the paper implies but does not say.
  This, plus the digitization, is why confidence is `low` despite a clean trend.

  ⚠ `slurry_ph` is recorded as 6.0 with caution: the Methods state the super-fine slurry
  "pH of the slurry was titrated at 6.0", and the paper's abrasive-stability optimum is
  pH 6.0. The pH of the Fig. 1 baseline dry/wet CeO2 slurries is not separately printed.
  Flagged so it is never mistaken for a measured value specific to this series.

  FINDING for `abrasive_size_exponent` on SiO2 with WET CERIA: n ~ +1.0 over 3-100 nm
  (or +0.79 over 20-100 nm excluding the uncertain 3 nm endpoint). Strongly POSITIVE —
  the largest in this batch.

  ⚠ CONTRADICTION with the other oxide size datasets collected here. All are "oxide", and
  they do not agree even in sign or shape:
    - THIS FILE (CVD SiO2, wet CERIA, 3-100 nm):                 n ~ +1.0, monotonic rising
    - us20190127607a1 HDP oxide (ceria-coated silica, 89-211 nm): n ~ +0.75, rising
    - us20190127607a1 TEOS oxide (same runs as above):            NON-monotonic, dip at 156 nm
    - bouvet2002 thermal oxide (colloidal SILICA, 12-75 nm):      NON-monotonic, PEAK at 25 nm
    - basim2000 PECVD oxide (fumed silica + coarse spikes):       rate FALLS with coarse adds
  The abrasive MATERIAL is the strongest discriminator here: ceria and ceria-coated silica
  give large positive exponents, plain colloidal/fumed silica gives ~zero or an interior
  maximum. Do NOT average these into one oxide exponent; the disagreement, and its
  correlation with abrasive chemistry, is the finding.

  ⚠ Rate/defect trade-off: the whole point of Figure 1 is that the rate gain from bigger
  wet ceria is paid for in scratches (the green right-hand axis, "Scratch No. [ea/12 in
  wf., < 10 nm size]", 0-1250). A size-exponent model fitted to MRR alone will predict
  that bigger is always better and miss why the industry does not simply use 100 nm.

  ⚠ Not stated for this series: abrasive loading (above), size DISTRIBUTION (only a single
  nominal size per abrasive, so `abrasive_d50_nm` = that nominal and no d99 is available),
  error-bar magnitudes as numbers, replicate counts, temperature.
  ⚠ `pack` is a placeholder; the abrasive is ceria, not silica. Shape/rank use only.
