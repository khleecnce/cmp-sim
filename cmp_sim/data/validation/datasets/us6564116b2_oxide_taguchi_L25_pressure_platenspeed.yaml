# Blanket oxide CMP on a production 200 mm polisher — Taguchi L25(5^5) orthogonal array.
# Down force (4/5/6/7/8 psi) x platen speed (20/30/40/50/60 rpm) are swept together with
# slurry solid content, back pressure and polish time. All 25 (down force, platen speed)
# pairs are DISTINCT — the L25 array covers the 5x5 pressure-speed grid exactly once each.
#
# Why this source: it is a printed patent example table (no digitization error), the MRR
# column is measured (thickness change / time at 9 points per wafer by AFT), and the patent
# itself frames the experiment against the Preston equation.

source: >
  G.-J. Wang, J.-C. Tsai, J.-L. Chen, "Method for determining efficiently parameters in
  chemical-mechanical polishing (CMP)", US Patent 6,564,116 B2, granted 2003-05-13
  (filed 2001-04-06, appl. 09/826,929). Free full text:
  https://www.freepatentsonline.com/6564116.html
  Numbers transcribed from: TABLE 1 (L25(5^5) orthogonal array — the factor levels of every
  trial: solid content wt%, down force psi, back pressure psi, platen speed rpm, polish time s)
  joined row-by-row with TABLE 2 ("an experimental results and S/N ratio table" — the measured
  MRR column, headed "MRR (A/S)", i.e. Angstrom per second).
  Carrier (head) speed 25 rpm and the oxide film type come from the running text and TABLE 5
  ("Since the carrier speed and oscillation speed have little influence ... the primitive
  settings of those two parameters by NDL are adopted" — Carrier Speed 25 rpm).
  Experiments were run at the National Nano Device Laboratory (NDL), Taiwan.

film: oxide
pack: oxide_silica
in_scope: true
used_for_calibration: false

wafer_radius_m: 0.100      # not stated in the patent; NDL-era tool, left at a plausible default.
                           # NOTE: the patent does not state wafer size. Treat absolute MRR with care.
center_offset_m: 0.200     # r_cc not stated in the patent; base value used.

# ── Units and reading method ────────────────────────────────────────────────
#  read_method: table for every condition — both the factor levels and the MRR are PRINTED
#  numbers in the patent's own tables. Nothing here is digitized or interpolated.
#  Unit conversion: patent prints MRR in Angstrom/second.
#      nm/min = (A/s) * 60 / 10 = (A/s) * 6      e.g. 9.14 A/s -> 548.4 A/min -> 54.84 nm/min
#  measured_mrr_angstrom_per_min keeps the converted-to-per-minute Angstrom value;
#  the raw printed A/s value is given in each label so nothing is lost.
#
#  ⭐ Self-check on the unit interpretation: TABLE 5 reports a separate verification run at
#     15% solids / 7 psi / 3 psi back / 20 rpm / 60 s with "Experimental MRR 26.65 A/s" and
#     "Average of removal amount 1599.2 A" — and 1599.2 A / 60 s = 26.65 A/s exactly.
#     So the TABLE 2 column really is Angstrom/second. (That TABLE 5 run is NOT included
#     below because it is a different polish time from any L25 row; row 14 is the same
#     factor combination but at 50 s and reads 22.11 A/s.)
#
# ── What is NOT held fixed ─────────────────────────────────────────────────
#  This is an L25 orthogonal array, so slurry solid content (5/10/15/20/25 wt%), back
#  pressure (0/1/2/3/3.5 psi) and polish time (40-60 s) vary along with pressure and speed.
#  Solid content is carried in overrides as abrasive_wt_pct so the fit can group on it.
#  Back pressure and polish time have no engine parameter and are recorded in the labels only.

# ── INDEPENDENT VERIFICATION (parent agent, against the official patent PDF) ──
# Source checked: patentimages.storage.googleapis.com/pdfs/US6564116.pdf (9 pages).
# The L25 array and the MRR column are OCR-scrambled in the PDF text layer, so the
# factor-to-row assignment could not be read off directly. It was instead verified
# ARITHMETICALLY against the patent's own TABLE 3 response table, which the
# transcription does not contain and therefore could not have been fitted to:
#
#   For each factor level, S/N = 20*log10(MRR in A/s) averaged over its 5 rows.
#   Reconstructed from this file vs TABLE 3 as printed:
#
#     down force  4 psi   24.53241  vs  24.53263   (-0.0002)
#                 5 psi   26.68941  vs  26.68942   (-0.0000)
#                 6 psi   27.66431  vs  27.66443   (-0.0001)
#                 7 psi   28.75605  vs  28.75611   (-0.0001)
#                 8 psi   29.62748  vs  29.60729   (+0.0202)
#     platen     20 rpm   24.62006  vs  24.62076   (-0.0007)
#                30 rpm   26.95876  vs  26.95966   (-0.0009)
#                40 rpm   28.02085  vs  28.02038   (+0.0005)
#                50 rpm   28.66437  vs  28.66399   (+0.0004)
#                60 rpm   29.00561  vs  28.98510   (+0.0205)
#
#   Nine of ten levels match to five decimal places, which fixes the factor
#   assignment beyond reasonable doubt.
#
# ⚠ ONE SUSPECT VALUE. Both discrepant levels (8 psi and 60 rpm) share exactly one
#   row — row5 (8 psi, 60 rpm) — and both are off by the same +0.0202 in S/N. That
#   is consistent with a single mis-transcribed cell: the value needed to close both
#   sums is 20.313 A/s, not the 20.55 A/s recorded. Note that 20.31 also appears in
#   the OCR stream adjacent to 20.55, so an OCR swap is the likely cause.
#   The value is LEFT AS TRANSCRIBED rather than silently "corrected" to the number
#   that makes the arithmetic close — back-solving a datum from the result it is
#   meant to test is circular. Effect on scoring is negligible (1 of 25 rows, 1.2%).
#
# Unit conversion A/s -> nm/min (x6.0) checked on all 25 rows: 0 errors.

