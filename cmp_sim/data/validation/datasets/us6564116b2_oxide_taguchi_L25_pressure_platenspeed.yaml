notes: >
  Swept axes: down force 4/5/6/7/8 psi and platen speed 20/30/40/50/60 rpm, in an L25
  orthogonal array so that all 25 (pressure, rpm) pairs are distinct and each of the
  5 pressure levels appears once at each of the 5 speeds. This is a clean mechanical-axis
  (Preston P*V) test: no two conditions share a (pressure, rpm) combination.

  ⚠ Chemistry is NOT strictly fixed. Solid content moves 5 -> 25 wt% across the array and is
  recorded in overrides (abrasive_wt_pct). The patent's own ANOVA/response table (TABLE 3)
  ranks the S/N effect on MRR as: down force (24.53 -> 29.61 across levels 1..5) and platen
  speed (24.62 -> 28.99) strongly monotonic; solid content also monotonic (23.80 -> 28.77);
  back pressure essentially flat (27.72 -> 26.97). So pressure and speed dominate, which is
  exactly what this dataset is here to test.

  ⚠ Not recorded by the patent, so not in this file: slurry pH, abrasive type and size,
  pad type, slurry flow rate, wafer diameter. Oscillation speed 2 mm/s and carrier speed
  25 rpm come from TABLE 5. rpm_wafer is set to that carrier speed for all conditions.
  Because abrasive identity and pH are unknown, ABSOLUTE MRR from oxide_silica pack will
  carry an unknown systematic scale factor — read rank agreement, not magnitude.

  ⚠ Back pressure (0 / 1 / 2 / 3 / 3.5 psi) is a wafer-carrier backside pressure, a separate
  knob from the down force. It is not modelled by the engine and is left out of the
  condition fields; it is preserved in the labels. The patent measured it to be the least
  influential of the five factors on MRR.

  Replication: single wafer per trial, 9-point thickness measurement per wafer (AFT).
  No error bars are printed, so no uncertainty field is given.
