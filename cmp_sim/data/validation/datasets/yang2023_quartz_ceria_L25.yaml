# Quartz-glass CMP with a CeO2-LaOF slurry — L25 orthogonal array, SIX factors.
#
# WHY THIS FILE OVERRIDES THE INHERITED COPY
# ------------------------------------------
# legacy/validation/datasets/yang2023_quartz_ceria_L25.yaml records only two of
# the paper's six factors: pressure (D) and platen speed (E). The other four —
# abrasive concentration (A), pH (B), dispersant concentration (C) and slurry
# flow (F) — change on every row and were not written down.
#
# That is not a cosmetic omission. With four factors invisible, the scoring
# harness groups all 25 rows into one "chemistry group" and reads the residual
# as a VELOCITY error, when most of it is chemistry the model was never told
# about. The dataset was reporting 32.4% against the velocity axis on that
# basis. Its own extreme-difference analysis ranks pressure (D) as the LARGEST
# effect on MRR and puts speed behind three chemical factors, so attributing the
# scatter to velocity had the paper's own conclusion backwards.
#
# Factor levels, Table 1 of the paper (verbatim):
#   A abrasive concentration (wt%)   0.25 / 0.5 / 1 / 3 / 5
#   B polishing solution pH          9 / 9.5 / 10 / 10.2 / 10.5
#   C dispersant concentration (wt%) 0.25 / 0.35 / 0.5 / 0.75 / 1
#   D polishing pressure (kPa)       20 / 25 / 30 / 35 / 40
#   E polishing speed (rpm)          60 / 80 / 100 / 120 / 140
#   F polishing fluid flow (mL/min)  2 / 4 / 6 / 8 / 10
# Assignment and results: Table A1 (Appendix A), read from the PMC full-text
# XML (PMC9920658), 25 rows of A-F level indices plus Sa and MRR.
#
# Pressures converted 1 kPa = 0.145038 psi; the inherited file's two decoded
# rows (No.1 "20kPa, 60rpm", No.3 "25kPa, 120rpm") agree with this decode, so
# the level table is being read the same way, only more completely.
#
# ⚠ STILL OUT OF SCOPE, and the reason has not changed: the workpiece is quartz
# glass and the abrasive is a CeO2-LaOF composite, not an STI oxide with plain
# ceria. `sti_ceria` is borrowed for its ceria-on-silicate chemistry only.
# Recording the four missing factors makes the dataset HONEST, not in-scope.

source: >
  Y. Yang et al., "Dispersion and Polishing Mechanism of a Novel CeO2-LaOF-Based
  Chemical Mechanical Polishing Slurry for Quartz Glass", Materials 16(3), 1148
  (2023). doi:10.3390/ma16031148 (MDPI open access, PMC9920658).
  Factor levels from Table 1; the L25 assignment and the MRR column from
  Table A1. MRR unit nm/min, per the body text ("MRR was 194.20 nm/min").

in_scope: false
used_for_calibration: false
film: oxide
pack: sti_ceria

conditions:
  - label: "No.1: 20 kPa, 60 rpm, 0.25 wt%, pH 9, disp 0.25 wt%, 2 mL/min"
    pressure_psi: 2.9008
    rpm_wafer: 60
    rpm_platen: 60
    mrr_nm_per_min: 273.3
    read_method: table
    flow_ml_min: 2
    overrides:
      abrasive_wt_pct: 0.25
      slurry_ph: 9
      dispersant_wt_pct: 0.25
