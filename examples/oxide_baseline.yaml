# Blanket PETEOS / thermal oxide, colloidal-silica slurry, 300 mm rotary tool.
# Conditions follow the Mariscal 2020 reference point (ECS JSS 9 044008):
# 3 psi at a sliding velocity of 1.25 m/s, which the matched 66.31 rpm pair
# reproduces uniformly across the wafer.
model: full

wafer:
  film: oxide
  diameter_mm: 300
  initial_thickness_nm: 1000
  n_radial: 81

slurry:
  pack: oxide_silica
  ph: 10.5
  abrasive: {kind: silica, conc_wt_pct: 12.0, d50_nm: 70.0}

pad:
  name: IC1000
  shore_d: 57.0
  groove: k-groove
  groove_width_mm: 0.5
  groove_pitch_mm: 2.0
  groove_depth_mm: 0.75

tool:
  pressure_psi: 3.0
  rpm_platen: 66.31
  rpm_head: 66.31
  flow_ml_min: 200
  time_s: 60
