# SnAg solder microbump planarization (advanced packaging / hybrid bonding).
#
# THIS EXAMPLE IS EXPECTED TO REFUSE TO RUN, and that is the point.
#
# The pack carries 68 sourced numbers - SnAg nanohardness, tin electrochemistry,
# abrasive properties - but no Preston coefficient, because no primary source
# publishes a SnAg or pure-Sn CMP removal rate together with the pressure and
# velocity it was measured at. There is nothing to divide.
#
# Running it produces a ParamMissing naming the film, the missing key and the
# way forward, rather than a number invented to fill the gap. Supply your own
# Kp in a pack override and the rest of the model works.
model: auto

wafer:
  film: snag
  diameter_mm: 300
  n_radial: 81

slurry:
  pack: snag_solder

pad:
  name: IC1000
  groove_width_mm: 0.5
  groove_pitch_mm: 2.0
  groove_depth_mm: 0.75

disk:
  name: generic-diamond

# ── How to make this run ─────────────────────────────────────────────
# Uncomment BOTH blocks below. The pH is required because for an unestablished
# film the viable window is itself unknown: the only primary CMP-on-Sn report
# eliminated alkaline (etched the tin) and acidic (scratched it) without
# qualifying a third, so it cannot be defaulted.
#
# slurry.ph: 6.5
#
# Then give whatever rates you have measured. The model fits Kp to them and
# reports a LEAVE-ONE-OUT cross-validated accuracy - each point predicted by a
# fit that never saw it - so the number it quotes is an honest out-of-sample
# error rather than the 0% a one-parameter fit always scores on its own data.
#
# One point sets the scale but permits no error estimate. Two give a first
# estimate. Four or more, spread across pressure and speed, give a usable one
# and test whether removal really is proportional to P*V on your tool.
#
# measurements:
#   - {label: "lot A", rate_A_per_min: 3200, pressure_psi: 1.0, rpm_platen: 60}
#   - {label: "lot A", rate_A_per_min: 6500, pressure_psi: 2.0, rpm_platen: 60}
#   - {label: "lot B", rate_A_per_min: 4700, pressure_psi: 1.5, rpm_platen: 60}
#
# Alternatively, if you already know your Preston coefficient:
# params:
#   kp_m_per_pa: 2.0e-13

tool:
  pressure_psi: 1.5         # solder is soft; packaging CMP runs gentle
  rpm_platen: 60
  rpm_head: 60
  flow_ml_min: 200
  time_s: 60
