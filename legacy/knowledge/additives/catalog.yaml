    categories: [rr_booster, defect_reducer]
    target_films: [Cu]
    typical_range: {min: 0.0001, max: 0.5, unit: "wt%"}
    mechanism: "특허 원문: 'choline salt as copper removal rate booster and total defect reducer' (pH 5–8)"
