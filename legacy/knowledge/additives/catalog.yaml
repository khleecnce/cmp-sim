    cas: "124-68-5 (AMP)"
    categories: [rr_booster, ph_adjuster]
    target_films: [poly-Si]
    typical_range: {min: 0.01, max: 5.0, unit: "wt%"}
    mechanism: "아민 화합물이 4급 암모늄과 병용되어 poly-Si 제거율·안정성 확보(KR102644385B1 아민 0.01–5 wt%)"
    source: "KR102644385B1 (amine compounds incl. 2-amino-2-methyl-1-propanol, tris(hydroxymethyl)aminomethane, triisopropanolamine)"
