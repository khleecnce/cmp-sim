    cas: "9003-01-4"
    categories: [rr_inhibitor, dispersant]
    subtype: polymer
    target_films: [SiN]
    roles:
      rr_inhibitor: [SiN]
      dispersant: [oxide]
    mechanism: >
      음이온 폴리전해질이 세리아·SiN 표면에 흡착. 분자량·입경에 따라 SiN 억제와 oxide 유지의
      균형이 달라져 STI 선택비를 결정(JMR 2007). 동시에 세리아 분산 안정제(JJAP 2005).
    source: "doi:10.1557/jmr.2007.0097 (Effects of abrasive particle size and MW of PAA in ceria slurry on SiO2/Si3N4 selectivity); doi:10.1143/JJAP.44.5949"
    source_type: paper
    confidence: literature

