# CMP 첨가제 카탈로그 — 문헌·특허 근거만. 출처 없는 항목 금지.
#
# 작성: 2026-09-08. 사용자(슬러리 실무자) 지시:
#   "Additive 따로 만들어서 각 카테고리별로 어떤 케미컬 썼는지 검색해서 적용할 수 있게.
#    옆에 함량도 표시 → R/R booster(막질 표시) / R/R inhibitor(막질 표시) / oxidizer /
#    corrosion inhibitor / dispersant(surfactant & polymer) / defect 저감제"
#
# 규칙
#   - 모든 항목은 `source:`에 DOI 또는 특허번호를 단다. 출처 없는 케미컬은 넣지 않는다.
#   - `typical_range`는 출처 문헌·특허 청구/실시예에 적힌 범위만. 없으면 생략 + confidence: estimated.
#   - `engine_key`는 knowledge/params/*.yaml에 **실제로 있는 키만** 쓴다
#     (현재 화학 관련 키: oxidizer, oxidizer_wt_pct, inhibitor, inhibitor_mM, slurry_ph,
#      oxide_nitride_selectivity). booster_mM·dispersant_ppm 등은 엔진에 없으므로 생략 —
#     생략 = "엔진 미연결"이고 UI는 이를 dead 배지로 표시해야 한다.
#   - `target_films`: 이 케미컬이 그 카테고리 역할로 작용하는 막질. 카테고리가 여러 개면
#     `roles:`에 카테고리별 막질을 따로 적는다.
#   - source_type: patent | paper
#   - confidence: verified(원문 실시예/표 직접 확인) | literature(문헌 서술 확인) | estimated
#
# 검증: .venv/bin/python -c "import yaml; d=yaml.safe_load(open('knowledge/additives/catalog.yaml'));
#        assert all(c.get('source') for c in d['chemicals'])"

version: 1
film_codes: [Cu, W, Co, Ru, Ta, Mo, oxide, SiN, poly-Si, SiC]

categories:
  rr_booster:
    label: "R/R Booster"
    label_ko: "연마율 촉진제"
    needs_target_film: true
  rr_inhibitor:
    label: "R/R Inhibitor"
    label_ko: "연마율 억제제 (stopping/선택비)"
    needs_target_film: true
  oxidizer:
    label: "Oxidizer"
    label_ko: "산화제"
    needs_target_film: false
  corrosion_inhibitor:
    label: "Corrosion Inhibitor"
    label_ko: "부식 억제제"
    needs_target_film: true
  dispersant:
    label: "Dispersant (Surfactant & Polymer)"
    label_ko: "분산제 (계면활성제·고분자)"
    needs_target_film: false
  defect_reducer:
    label: "Defect Reducer (Surfactant & Polymer)"
    label_ko: "결함 저감제 (계면활성제·고분자)"
    needs_target_film: false
  ph_adjuster:
    label: "pH Adjuster"
    label_ko: "pH 조절제·완충제"
    needs_target_film: false
  chelator:
    label: "Chelating Agent"
    label_ko: "킬레이트제·착화제"
    needs_target_film: false
  biocide:
    label: "Biocide"
    label_ko: "살균제"
    needs_target_film: false

chemicals:

  # ═══════════════════════════════════════════ R/R BOOSTER — Cu
  - id: glycine
    name: "Glycine"
    cas: "56-40-6"
    categories: [rr_booster, chelator]
    target_films: [Cu, poly-Si]
    roles:
      rr_booster: [Cu, poly-Si]
      chelator: [Cu, W]
    typical_range: {min: 0.05, max: 16.0, unit: "wt%"}
    mechanism: >
      Cu²⁺-글리시네이트 착물 형성으로 H2O2가 만든 Cu 산화층을 용해(Aksu & Doyle 2001/2003).
      poly-Si CMP에서는 아미노산이 TMAH 대체 촉진제(WO2021046080A1, 0.05–1 wt%).
    source: "US8974692B2 (Air Products; chelating agent glycine 0.01–22 wt%, preferred 0.05–16 wt%); doi:10.1149/1.1344532; doi:10.1149/1.1615611; WO2021046080A1"
    source_type: patent
    confidence: verified

  - id: dl_alanine
    name: "DL-Alanine"
    cas: "302-72-7"
    categories: [rr_booster, chelator]
    target_films: [Cu]
    mechanism: "글리신 보조 착화제. Cu-알라닌 착물로 TSV Cu 제거율 상승"
    source: "doi:10.1557/s43578-023-01042-5 (J. Mater. Res. 2023, DL-alanine auxiliary complexing agent TSV Cu CMP)"
    source_type: paper
    confidence: literature

  - id: arginine
    name: "L-Arginine"
    cas: "74-79-3"
    categories: [rr_booster, chelator]
    target_films: [Cu, poly-Si]
    roles:
      rr_booster: [Cu, poly-Si]
    mechanism: >
      Cu: 구아니디노기가 Cu²⁺ 착화(MRS 2006). poly-Si: 아미노산/구아니딘 유도체가
      TMAH-free 촉진제(WO2021046080A1, 0.05–1 wt%, pH 10–11).
    typical_range: {min: 0.05, max: 1.0, unit: "wt%"}
    source: "doi:10.1557/proc-0914-f12-03 (The Role of Arginine as a Complexing Agent in Copper CMP); WO2021046080A1 (CMC Materials, polysilicon accelerator)"
    source_type: paper
    confidence: literature

  - id: citric_acid_booster
    name: "Citric acid"
    cas: "77-92-9"
    categories: [rr_booster, chelator, ph_adjuster]
    target_films: [Cu, Mo]
    roles:
      rr_booster: [Cu, Mo]
      chelator: [Cu, Mo, W]
    typical_range: {min: 0.1, max: 0.1, unit: "M"}
    mechanism: >
      Cu/Mo-citrate 착물이 표면 경도를 낮춰 기계제거 촉진. 0.1 M 첨가로 Mo MRR ~2.4×, Cu ~4.0×
      (Gamagedara & Roy 2024, 무입자 대비). W 슬러리에서는 H2O2 안정제/pH 조절제로도 사용.
    source: "doi:10.3390/ma17194905; doi:10.1149/1.1890786 (Citric Acid as a Complexing Agent in CMP of Copper); US10676647B1"
    source_type: paper
    confidence: verified

  - id: oxalic_acid
    name: "Oxalic acid"
    cas: "144-62-7"
    categories: [rr_booster, chelator]
    target_films: [Cu]
    mechanism: "Cu 옥살레이트 착화로 산화층 용해 촉진(ESL 2005)"
    source: "doi:10.1149/1.1883873 (Oxalic Acid as a Complexing Agent in CMP Slurries for Copper); US20050090104A1 (listed complexing agent)"
    source_type: paper
    confidence: literature

  - id: hedp
    name: "HEDP (1-hydroxyethylidene-1,1-diphosphonic acid)"
    cas: "2809-21-4"
    categories: [rr_booster, chelator]
    target_films: [Cu]
    typical_range: {min: 0.01, max: 10.0, unit: "wt%"}
    mechanism: "유기 포스포네이트 킬레이트제 — Cu 착화로 고 MRR, 산화제와 반응 안 해 pot-life 김"
    source: "US20050090104A1 (organic phosphonate 0.01–10 wt%, preferred 0.1–2 wt%; Cu slurry example 0.05–5% HEDP)"
    source_type: patent
    confidence: verified

  - id: choline_bicarbonate
