  - id: ethylenediamine
    name: "Ethylenediamine (EDA)"
    cas: "107-15-3"
    categories: [rr_booster, ph_adjuster]
    target_films: [Cu]
    mechanism: "유기 디아민이 Cu 제거율 촉진(US8974692B2); Lewis 염기로 pH 상승용(US20050090104A1)"
    source: "US8974692B2 (organic amine compounds to boost copper film removal rates: ethylene diamine, propylene diamine); US20050090104A1; doi:10.1007/978-3-642-03653-8_311"
    source_type: patent
    confidence: literature

  # ═══════════════════════════════════════════ R/R BOOSTER — W
  - id: ferric_nitrate
    name: "Ferric nitrate Fe(NO3)3"
    cas: "7782-61-8"
    categories: [rr_booster, oxidizer]
    target_films: [W]
    roles:
      rr_booster: [W]
      oxidizer: [W, Cu]
    typical_range: {min: 0.005, max: 0.20, unit: "wt%"}
    mechanism: >
      H2O2와 조합 시 Fe³⁺/Fe²⁺ 다중산화상태 촉매(Fenton형)로 W→WO3 산화 가속. 특허 원문:
      0.005–0.20 wt% (≈7–280 ppm Fe). 0.05 wt% 이하로도 충분(Table 3). 단독 고농도(수 wt%)로는
      Cu/W 산화제로도 사용(Tribol. Int. 2008).
    source: "US5958288A (Cabot; catalyst 0.005–0.20 wt% with H2O2); US10676647B1 (Cabot; 0.5–3000 ppm Fe); doi:10.1016/j.triboint.2007.09.009"
    source_type: patent
    confidence: verified
    engine_key: oxidizer

  - id: kio3
    name: "Potassium iodate KIO3"
    cas: "7758-05-6"
    categories: [rr_booster, oxidizer]
    target_films: [W]
    typical_range: {min: 2.0, max: 3.2, unit: "wt%"}
    mechanism: "IO3⁻가 W를 WO3로 산화(pH ~4, KHP 완충). 실시예: 알루미나 7% + KIO3 3.2% + KHP 4.4%, pH 4.1"
    source: "WO1995024054A1 (Rodel; Example 2); doi:10.1149/1.1391617 (Stein et al. 1999, KIO3-based W CMP kinetics)"
    source_type: patent
    confidence: verified
    engine_key: oxidizer

  # ═══════════════════════════════════════════ R/R BOOSTER — oxide
  - id: potassium_salts_oxide
    name: "K⁺ salts (KOH / KCl / KNO3 / K2SO4)"
    cas: "1310-58-3 (KOH)"
    categories: [rr_booster, ph_adjuster]
    target_films: [oxide]
    roles:
      rr_booster: [oxide]
      ph_adjuster: [oxide, Cu, W]
    typical_range: {min: 0.0, max: 0.4, unit: "mol/L K+"}
    mechanism: >
      pH 11 실리카 슬러리에서 K⁺ 0→0.4 M까지 oxide MRR 단조 증가 후 정점(Li et al. 2021 Fig.10);
      염 종류 무관하게 K⁺ 몰농도가 지배(Fig.9, 0.2 M에서 +36%). 이중층 압축으로 입자-표면 접근 촉진.
    source: "doi:10.1149/2162-8777/ac3e44 (Li et al. 2021, ECS JSS 10 123008); knowledge/cmp/abrasive-size-concentration-ph-K-additive-mrr-quantitative.md"
    source_type: paper
    confidence: verified
    engine_key: slurry_ph

