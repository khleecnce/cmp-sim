      아미노산(zwitterion)이 SiN 표면/세리아 활성점에 선택 흡착해 SiN 제거 억제 → oxide:SiN
      선택비 증가(Penta & Babu 2015; America & Babu 2004).
    source: "doi:10.1149/2.0061511jss (Further Investigation of Slurry Additives for Selective Polishing of SiO2 over Si3N4 Using Ceria); doi:10.1149/1.1817870"
    source_type: paper
    confidence: literature

  - id: lysine_glutamic
    name: "L-Lysine / L-Glutamic acid"
    cas: "56-87-1 / 56-86-0"
    categories: [rr_inhibitor]
    target_films: [SiN]
    typical_range: {min: 0.02, max: 0.02, unit: "M"}
    mechanism: "pH 5, 라이신 0.02 M + 글루탐산 0.02 M + TEAH 0.003 M → oxide:SiN 선택비 35.5(2차 인용, 조건 의존)"
    source: "doi:10.1149/2.0061511jss; knowledge/cmp/ceria-slurry-ce-redox-selectivity.md §5"
