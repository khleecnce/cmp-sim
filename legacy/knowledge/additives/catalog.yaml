      SiN:TEOS 선택비 ≥40. 실시예: 0.5 wt% + NH4OH 0.0006 wt% + 실리카 0.75 wt%. 사용자 질문
      "SiN 부스터가 있는가" → 있음(reverse-STI/ SiN 우선 제거용).
    source: "US11999877B2 (Versum/Merck; SiN removal rate enhancers 0.01–5 wt%, preferred 0.1–1 wt%)"
    source_type: patent
    confidence: verified

