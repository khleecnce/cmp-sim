  # ── S 안정성: 글레이징-컨디셔닝 균형 정상상태 (패드 재질 공통) ──────────
  # dR/dt = −k_g·R + k_c·G·(1−R),  G = duty/100 · exp(−t_disk/τ_aging)
  # R_ss = k_c G/(k_g + k_c G).  S = R_ss/R_ss,ref (G>0) | exp(−k_g(t−t_ref)) (G=0)
  # 기준점은 Γ과 공유한다(cond_ref_duty_pct, cond_ref_disk_usage_hours) — 같은 물리 조건.
  stab_glaze_rate_per_min:
    value: 0.0279599276
    unit: 1/min
    note: >
      글레이징률 k_g. Jeong et al. 2024 (doi:10.3390/ma17081817) Fig.9 정규화 MRR pooled(2+5 psi)
      로그회귀 a=1.1478, b=−0.1109 의 10 min 손실 22.25% 를 지수형으로 이식: k_g=−ln(0.7775)/9.
      압력별 개별 적합은 2 psi 0.0223 / 5 psi 0.0392 /min (±40% 밴드, 2점이라 압력 항은 미도입).
      ⚠ 실리카/IC1000 단일계 값 — 다른 연마입자계의 k_g 는 코퍼스에 없다(EVIDENCE-RULES 판정#9 종결).
      그 불확실성(Lawing 2004 fumed/colloidal 5배)이 S 에 미치는 폭은 _f_stab 이 운전점마다 계산해
      등급을 정한다(stab_glaze_rate_uncertainty_x).
    source: knowledge/materials/pad-steady-state-glazing-conditioning-balance.md §2
    confidence: literature
  stab_cond_recovery_rate_per_min:
    value: 4.08
    unit: 1/min
    note: >
      절삭재생률 k_c (신품 디스크·duty 100% 기준). Jeong et al. 2022 ASPEN
      (ISBN 978-981-18-6021-8 paper OR-12-0224, 1차 원문 확보 — 이 프로시딩 DOI 는 Crossref
      미등록이니 인용에 쓰지 마라) §2.2: 3 psi·10 min 연마 후 30 s 컨디셔닝으로
      완전 회복 → 잔여 결손 ε=exp(−k_c·0.5 min). ε 는 Jeong 2024 Table 1 컨디셔닝 복원 허용폭 ±13%
      (N_cond/N_0=0.91~1.13) → k_c=ln(1/0.13)/0.5. 독립 하한(Jeong 2024, 1 min 컨디셔닝으로 N 0.51→1.0)
      1.33 /min 위. 자릿수(1.3~6 /min)는 확실, 4.08 은 그 안의 한 점(ε 가 접촉수 기준이라는 추정 요소).
      IC1000류 PU 패드·디스크 0.7 psi·101 rpm·9 cpm 조건. 하중·속도 환산 지수 없음 → G 에 F·v 미포함.
      ⚠ [2026-09-14] 1차 원문 확보 결과 **k_c 는 상수가 아니다**. 원문은 네 압력의 회복시간을
      보고한다(2/3/4/5 psi → 10/30/60/180 s). 같은 변환을 네 점에 적용하면 k_c 가 12.24~0.68 /min
      으로 18배, 글레이징 깊이 보정 후에도 7.3배 퍼진다 → 압력(직전 글레이징 깊이)의 함수다.
      이 값 4.08 은 **3 psi 좌표**다. 압력 의존은 미모델링 — 원문이 회복 곡선이 아니라 "충분한가"의
      이산 판정만 주어 형상을 적합하면 관측이 지지하지 않는 창작이 된다. 해소 조건: 시간 연속
      회복 곡선 문헌 1건. 근거·verify: pad-steady-state-glazing-conditioning-balance.md §6-2.
    source: knowledge/materials/pad-steady-state-glazing-conditioning-balance.md §2
    confidence: literature
  stab_glaze_rate_uncertainty_x:
    value: 5.0
    unit: "-"
    note: >
      k_g 의 슬러리 의존 불확실 배율. Lawing 2004 (NCCAVS CMPUG) ex-situ 감쇠: fumed −35% vs colloidal −7%
      (4.7배). _f_stab 이 k_g×이 배율로 S 를 재계산해 |ΔS|<0.03 이면 k_g 는 약한 고리가 아니라고 판정한다.
    source: knowledge/materials/pad-glazing-mechanism-mrr-decay.md §4(E)
    confidence: literature
