# 공통 베이스 — 장비·패드·접촉역학. 막질/슬러리와 무관한 것만 여기 둔다.
#
# 이 파일이 존재하는 이유: 이 값들은 원래 sim/tier2_physics/*.py 에 하드코딩돼 있었다
# (_E_STAR=1e9, _R=5e-6, _BETA=1/0.3e-6, _ETA=1e11 ...). 코드를 고쳐야만 다른 조건을
# 돌릴 수 있었다는 뜻이다. 이제 팩을 바꾸면 된다.
#
# confidence 표기:
#   verified   — 코드로 재현·검증 완료 (지식노트 verify 블록 PASS)
#   literature — 논문/표준 인용값, 우리가 재현하진 않음
#   estimated  — 문헌 범위에서 고른 대표값. 실제 툴마다 다르다
#   unverified — 출처 불충분. 결과에 경고로 딸려 나간다

description: "공통 베이스 — 300mm 로터리 CMP 툴, IC1000류 PU 패드, 산화막 기준"

params:
  # ── 웨이퍼/툴 기하 ──────────────────────────────────────
  wafer_radius_m:
    value: 0.150
    unit: m
    source: SEMI M1 (300mm 표준)
    confidence: literature
  center_offset_m:
    value: 0.200
    unit: m
    note: >
      r_cc 웨이퍼중심-플래튼중심 거리. Zhao, Wang, He, Lu (2012) IEEE Trans. Semicond. Manuf.
      25(3), 502-510, DOI 10.1109/TSM.2012.2190432 §IV 본문 명시: "All below calculations are
      based on the following dimensional parameters for 12 in CMP platform: Δe₀ = 25 mm,
      e₀ = 200 mm." 같은 논문 Eq.(1)이 e를 "the center distance between the platen and the
      wafer carrier"로 정의 — 우리 r_cc와 동일량이고, 논문이 "ω_p·e가 상대속도 크기의 지배항"
      이라 명시해 FabSim의 Preston 속도항 용도와 맥락이 일치한다.
      운전 범위(sweep 포함): 0.175~0.225 m (= e₀ ± Δe₀, Eq.11-12).
      교차 참고(미채택): Kim & Jeong 2004 JEM 33(1) 53-60 Fig.6/7 캡션 D=150mm는 200mm
      웨이퍼 툴이고, Ye & Yao 2025 Micromachines 16(4) 450 Table 1의 e=277.89mm는 5인치
      단면 폴리셔다 — 기하 폐합 검증에만 사용했다.
      ⚠ 논문 설계치수이지 AMAT/Ebara 양산기 도면 실측이 아니다(그쪽은 Google Patents 503으로
      확보 실패) — 그래서 measured가 아니라 literature다.
      (이전 값 0.180 m은 근거 없는 추정이었다. 다만 위 sweep 범위 안에는 있었다.)
    source: knowledge/physics/cmp-platen-wafer-center-distance-rcc.md
    confidence: literature

  # ── 패드 표면 통계 (GW 접촉역학) ────────────────────────
  # 원래 위치: sim/tier2_physics/gw_preston_link.py 의 _E_STAR/_R/_BETA/_ETA/_A_N
  pad_E_star_pa:
    value: 1.316e8
    unit: Pa
    note: >
      등가 탄성계수 E* = E_pad/(1-nu^2) (웨이퍼가 패드보다 400배 이상 강성이라
      복합식이 단일물체식으로 수렴 — 근거 노트 §4 verify (b), 상대차 0.001%).
      [등급 판정 2026-09-15, 정확도 갭 CONFIDENCE 1~2위] 이전 값 1.0e9 Pa("PU ~1 GPa 오더",
      estimated)는 1차 출처 없는 오더 추정이었고, 독립 3그룹 실측/모델값보다 2.6~8.4배 과대였다:
        Bozkaya & Muftu 2009 JES 156(12) H890 (doi:10.1149/1.3231691) Table I:
          E_s=100 MPa(hard), nu_s=0.49 -> E* = 131.6 MPa   ← 채택값(3값의 중앙값)
        Shi & Ring 2010 Microelectron. Eng. (doi:10.1016/j.mee.2010.04.010):
          E* = 119 MPa (MRR 감쇠곡선 fit으로 직접 보고)
        Sorooshian 2005 학위논문(Univ. of Arizona) p.358: E=285 MPa, nu=0.5 -> E* = 380 MPa
      채택 근거: 세 값의 **중앙값**을 쓴다(평균 아님 — 380 MPa 는 유일하게 한 자릿수 위쪽
      이상치다). 문헌 범위는 1.19e8~3.8e8 Pa 이며, 그 안에서 값을 움직이는 것은 근거 있는
      what-if 다. 범위 밖(특히 1e9)은 어느 문헌도 지지하지 않는다.
      ⚠ R·1/beta 와 **세트로 함께** 교체됐다 — 하나만 바꾸면 근거 노트 §4의 기하 정합이
      깨진 조합이 된다.
    source: knowledge/pad/pad-material-gw-effective-modulus-asperity-distribution.md
    confidence: literature
  pad_asperity_radius_m:
    value: 5.0e-5
    unit: m
    note: >
      asperity 곡률반경 R(정점 osculating 구의 곡률반경. 돌기 몸통 반경이 아니다 —
      실제 접촉 발자국은 a(z)=sqrt(2Rz), 근거 노트 §4).
      [등급 판정 2026-09-15] 이전 값 5.0e-6 m(estimated)은 문헌 중심값의 1/10 이었다.
      독립 3그룹이 25~100 um 범위·50 um 중심에 수렴:
        Bozkaya & Muftu 2009 Table I "Pad summit radius Rs" = 50 um (base), 범위 25~100 um
        Shi & Ring 2010: ks = 2e4 /m -> R = 50 um
        Sorooshian 2005 p.358: kappa_s = 2e4~5e5 /m -> R = 2~50 um
      ⚠ R 은 소재 물성이 아니라 **컨디셔닝(디스크 grit·하중)이 만드는 기하량**이다 —
      같은 폴리우레탄이라도 컨디셔닝이 바뀌면 이 값이 바뀐다(근거 노트 §1).
    source: knowledge/pad/pad-material-gw-effective-modulus-asperity-distribution.md
    confidence: literature
  pad_height_beta_inv_m:
    value: 2.0e-6
    unit: m
    note: >
      asperity 높이 **지수분포** 스케일 1/beta (= lambda).
      [등급 판정 2026-09-15] 이전 값 0.3e-6 m(estimated)은 같은 분포족 문헌값의 1/6.7 이었다.
      채택: Sorooshian 2005 학위논문 p.358 Fig. A.1 lambda = 2.0 um (Borucki et al. 2004 인용,
      7 psi) — fab-sim 이 채택한 지수분포와 **동일 분포족**인 유일한 1차값.
      ⚠ Bozkaya & Muftu 2009 Table I 의 sigma_s = 5 um 은 **Gaussian SD** 라 분포족이 달라
      직접 대입하면 안 된다(근거 노트 §1·§2). 그래서 이 키만은 교차검증 문헌이 1건뿐이며,
      동일 분포족 2번째 출처가 나오면 재검증 대상이다.
    source: knowledge/pad/pad-material-gw-effective-modulus-asperity-distribution.md
    confidence: literature
  pad_asperity_density_m2:
    value: 2.0e8
    unit: 1/m^2
    note: >
      단위면적당 asperity 수 eta. pad-asperity-density-gw-literature-values.md
      §2·§5, 독립 5문헌(Bozkaya&Muftu 2009 JES 156(12) H890, Bozkaya&Muftu 2010
      JES 157(3) H287, Sorooshian 2005 학위논문, Shi&Ring 2010, Suzuki et al. 2017
      CIRP Annals DOI 10.1016/j.cirp.2017.04.088) 수렴값 2.0e8 /m^2로 500배 하향.
    source: knowledge/materials/pad-asperity-density-gw-literature-values.md
    confidence: literature
  pad_nominal_area_m2:
    value: 1.0e-4
    unit: m^2
    note: 명목 접촉면적 A_n (1 cm^2 기준 셀)
    source: knowledge/materials/gw-nominal-vs-local-pressure.md
    confidence: literature

  # ── 패드 마모/컨디셔닝 ──────────────────────────────────
  # 원래 위치: conditioner_pcr_decay.py / conditioner_asperity_distribution.py
  pad_pcr_anchor_hours:
    value: 50.0
    unit: h
    source: Entegris 기술자료 (PCR 감쇠 앵커점)
    confidence: literature
  pad_pcr_anchor_ratio:
    value: 0.16
    unit: "-"
    note: 50h 후 PCR/PCR0
    source: Entegris 기술자료
    confidence: literature
  pad_sigma0_m:
    value: 8.112e-6
    unit: m
    note: 초기 asperity 높이 표준편차. Lv3-1 노트 Table1 실측
    source: knowledge/equipment/conditioner-disk-pad-cutting-model.md
    confidence: literature
  pad_wear_half_life_h:
    value: 48.0
    unit: h
    source: knowledge/materials/pad-wear-glazing-mrr-decay.md
    confidence: estimated

  # ── 윤활/마찰 (Stribeck) ────────────────────────────────
  # 원래 위치: cmp_lubrication_regime.py 의 cof_stribeck 기본인자
  cof_boundary:
    value: 0.30
    unit: "-"
    note: 경계윤활 영역 마찰계수 mu_bl
    source: knowledge/physics/tribology-friction-wear-stribeck.md
    confidence: literature
  cof_hydro_coeff:
    value: 8.0
    unit: "-"
    source: knowledge/physics/cmp-lubrication-regimes.md
    confidence: estimated
  cof_transition_alpha:
    value: 40.0
    unit: "-"
    source: knowledge/physics/cmp-lubrication-regimes.md
    confidence: estimated

  # ── 공정 기본 조건 ──────────────────────────────────────
  pressure_psi:
    value: 3.0
    unit: psi
    note: 대표 다운포스. 20.7 kPa
    source: knowledge/cmp/cmp-tool-architecture.md
    confidence: literature
  rpm_wafer:
    value: 60.0
    unit: rpm
    source: knowledge/cmp/cmp-tool-architecture.md
    confidence: literature
  rpm_platen:
    value: 55.0
    unit: rpm
    source: knowledge/cmp/cmp-tool-architecture.md
    confidence: literature
  relative_velocity_ref_mps:
    value: 0.75
    unit: m/s
    note: 0.5~1 m/s 대표값
    source: knowledge/physics/cmp-kinematics-rotary.md
    confidence: literature

  # ── 계측 ────────────────────────────────────────────────
  n_points:
    value: 81
    unit: "-"
    note: 웨이퍼 전체 81포인트 측정 (사용자 실무 기준)
    source: knowledge/cmp/uniformity-metrics-definitions-standards.md
    confidence: verified
  edge_exclusion_m:
    value: 0.003
    unit: m
    source: knowledge/cmp/wafer-metrology-thickness-methods.md
    confidence: literature

  # ══════════════════════════════════════════════════════════
  # 병합 파라미터 기준점 (ARCHITECTURE-V2.md §2 · sim/factors.py)
  #
  # ⚠ 왜 '_ref' 값이 반드시 필요한가:
  #   모든 팩터는 **기준 조건 대비 배수**여야 한다. Kp가 이미 특정 조성·조건에서
  #   역산된 값이므로, 팩터를 절대값으로 곱하면 같은 효과를 두 번 센다
  #   (2026-09-06 Cu MRR 20배 붕괴가 정확히 이 사고였다).
  #   기준값이 없으면 factors.py는 '기준=현재값'으로 폴백하는데, 그러면 배수가
  #   영원히 1.0이라 **인자를 바꿔도 결과가 안 변한다.** 그래서 여기 명시한다.
  # ══════════════════════════════════════════════════════════

  # ── Λ 기계 부하 강도 기준 ────────────────────────────────
  lambda_ref_pressure_psi:
    value: 3.0
    unit: psi
    note: 위 pressure_psi와 같은 기준 조건. Kp가 이 근방에서 역산됐다
    source: knowledge/cmp/cmp-tool-architecture.md
    confidence: literature
  lambda_ref_rpm_platen:
    value: 55.0
    unit: rpm
    source: knowledge/cmp/cmp-tool-architecture.md
    confidence: literature
  lambda_ref_center_offset_m:
    value: 0.200
    unit: m
    note: >
      Λ 기준점 — center_offset_m과 같은 값·같은 근거(Zhao 2012 12인치 플랫폼 e₀=200mm).
      ⚠ 반드시 center_offset_m과 함께 움직여야 Λ=1.0 기준 계약이 유지된다. 서브에이전트가
      "바꾸면 λ 의미가 변한다"며 제외를 권고했지만, 오히려 한쪽만 두면 기준에서 Λ≠1.0이 되어
      Kp 이중계상이 된다 — 동반 이동이 정답이다(factors.py 설계계약 §1).
    source: knowledge/physics/cmp-platen-wafer-center-distance-rcc.md
    confidence: literature

  # ── Θ 정상상태 열저항 네트워크 (진단 전용, MRR 경로에 곱하지 않음) ──
  # knowledge/physics/frictional-heating-temperature-arrhenius-coupling.md §8
  # (White 2003 doi:10.1149/1.1560642 원문 Eq.4-10 이식). 두 값이 없으면 engine.py
  # theta_steady_state_* 진단은 조용히 None.
  pad_thickness_m:
    value: 1.27e-3
    unit: m
    note: >
      IC1000 데이터시트 50 mil(Pureon 2024). White 2003 Eq.5도 1.27e-3 m 사용. ⚠ 열이 실제로
      흐르는 유효 길이(그루브 바닥·다공층)는 이보다 짧을 수 있음 — 노트 §8.5 미검증. IC1010은 2.03e-3.
    source: knowledge/materials/pad-structure-groove-subpad.md
    confidence: literature
  pad_thermal_conductivity_w_mk:
    value: 0.02
    unit: W/(m·K)
    note: 다공성 PU 패드. Shin 2025(≈0.02)와 White 2003 Eq.5(0.02) 일치.
    source: knowledge/physics/frictional-heating-temperature-arrhenius-coupling.md
    confidence: literature

  # ── Θ 열·유동 부하 (SFR) ────────────────────────────────
  sfr_ml_min:
    value: 150.0
    unit: mL/min
    note: >
      ILD 레시피 실측 조건. Yim 2018은 200, Cu 3-step은 조건별 상이.
      실제 툴에서 가장 자주 만지는 손잡이 중 하나다.
    source: knowledge/cmp/product-wafer-proxy-metrics-virtual-metrology.md
    confidence: literature
  sfr_ref_ml_min:
    value: 150.0
    unit: mL/min
    note: Θ 기준점 — sfr_ml_min과 같은 조건
    source: knowledge/cmp/product-wafer-proxy-metrics-virtual-metrology.md
    confidence: literature

  # ── Θ 열·유동 부하 (플래튼 냉각수 온도, SFR과 독립 냉각채널) ──────
  # Shin et al. 2025(Materials 18(19):4461, doi:10.3390/ma18194461) 실측:
  # 미제어 정상상태 계면온도 36C, 보텍스튜브 1단 냉각 시 30C가 균형점.
  # Yuh et al. 2015(doi:10.1007/s40684-015-0041-8) 실측: 냉각수온도 10-30C
  # 스윕에서 MRR_avg 단조증가(방향만, 함수형 미제시).
  platen_coolant_temp_c:
    value: 30.0
    unit: "°C"
    note: 이번 런의 플래튼 냉각수 설정온도. Shin 2025 균형점(30C)을 기본값으로 둔다.
    source: knowledge/equipment/cmp-theta-platen-coolant-temperature-driver.md
    confidence: literature
  platen_coolant_ref_c:
    value: 30.0
    unit: "°C"
    note: Θ 기준점 — platen_coolant_temp_c와 같은 조건(Shin 2025 균형점)
    source: knowledge/equipment/cmp-theta-platen-coolant-temperature-driver.md
    confidence: literature
  platen_hot_side_ref_c:
    value: 36.0
    unit: "°C"
    note: >
      ⚠ Shin 2025의 특정 장비(POLI-500, 배리어 슬러리) 미제어 정상상태 계면온도.
      전 팩 공통 근사로 쓴다 — 막질별 실제 발열온도는 다를 수 있음(미검증, §4 참조).
    source: knowledge/equipment/cmp-theta-platen-coolant-temperature-driver.md
    confidence: estimated

  # ── Θ 열·유동 부하 (리테이닝 링 압력, 웨이퍼-패드와 독립인 마찰 발열원) ──
  # Lee, Guo, Jeong (2012), Int. J. Precis. Eng. Manuf. 13(1) 25-31, doi:10.1007/s12541-012-0004-8.
  # Table 1: RR압력 2-6psi 스윕, 총 마찰력(F_wafer+F_ring) 선형회귀 R²>0.99 (E1 대상계 직접실측).
  retaining_ring_pressure_psi:
    value: 5.0
    unit: psi
    note: >
      이번 런의 리테이닝 링 공압. 문헌 실험(80rpm, 웨이퍼 4psi 고정) 다수 조건(5psi)을 기본값으로 둔다.
    source: knowledge/physics/cmp-theta-retaining-ring-pressure-heat-channel.md
    confidence: literature
  retaining_ring_ref_psi:
    value: 5.0
    unit: psi
    note: Θ 기준점 — retaining_ring_pressure_psi와 같은 조건(Lee/Guo/Jeong 2012 Table 1 다수조건)
    source: knowledge/physics/cmp-theta-retaining-ring-pressure-heat-channel.md
    confidence: literature

  # ── Γ 컨디셔닝 부하 ─────────────────────────────────────
  cond_downforce_lbf:
    value: 4.0
    unit: lbf
    note: ≈17.8 N. PCR 실험 표준 조건 (패드 100 RPM, 디스크 73 RPM)
    source: knowledge/equipment/disk-rpm-load-radius-pcr.md
    confidence: literature
  cond_ref_downforce_lbf:
    value: 4.0
    unit: lbf
    source: knowledge/equipment/disk-rpm-load-radius-pcr.md
    confidence: literature
  cond_sweep_cpm:
    value: 10.0
    unit: cpm
    note: >
      상용 CMP 레시피 12건의 실측 최빈값(4/12)이자 중앙값(10.5) 근처 정수 — 추정치가 아니다.
      papers/ 코퍼스 190편 전수 스캔으로 "분당 스윕 왕복수"가 숫자로 명시된 300/200mm
      레시피를 수집: 19(Menk 2010 MRS Proc.1249 E02-02, AMAT, "sweep rate was 19 sweeps
      per minute"), 19(Zheng 2023 Micromachines 14(9) 1683 Table 1), 15(Kim & Kang 2011
      IJMTM 51:565), 13x2(McAllister 2019 Micromachines 10(4) 258), 11(McAllister 2019
      학위논문 3M PB32A), 10x4(Shinhan CVD / Liao 2014 / Mariscal 2020 JSS / MEE 2016),
      9x2(Son & Lee 2021 Appl.Sci. 11(8) 3521 / ASPEN 2022). 분포: 범위 9~19, 중앙값 10.5,
      최빈값 10(33%), 평균 12.3. 독립 연구그룹 5곳(AMAT·Tsinghua·한양대·Arizona·한국).
      ⚠ 표기 혼선 해소: Zheng의 "sweep speed 19 RPM"은 같은 논문 Eq.(4) 사인파 정의상
      Menk의 "19 sweeps per minute"와 동일 물리량이다(주기 3.158s, 오차<1e-12로 검증) —
      디스크 자전으로 오독하면 안 된다.
      ⚠ 한계: 스윕 왕복수를 독립변수로 스윕해 PCR/MRR을 측정한 논문은 없다(전부 고정 조건으로만
      기재). 범위가 9~19(2.1배)로 넓으므로 PCR 프로파일이 민감한 해석에는 민감도 스캔을 병행하라.
      Sorooshian 2005의 20/30 cpm은 100mm 랩 폴리셔라 모집단에서 분리했다.
