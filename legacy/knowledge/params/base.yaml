    unit: s
    note: 무컨디셔닝(G=0) 분기의 기준 시각 — Jeong 2024 Fig.9 첫 측정점 1 min(기존 S 기준 계약 그대로).
    source: knowledge/materials/pad-glazing-mechanism-mrr-decay.md §2.3
    confidence: literature

