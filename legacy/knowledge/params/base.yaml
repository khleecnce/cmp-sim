  asperity_height_distribution:
    value: exponential
    unit: "-"
    note: >
      돌기 높이 분포의 형태. 지수분포면 실접촉면적이 하중에 **정확히 선형**이고
      분리거리와 무관하다 — GW 모델의 해석적 결과이고, sim/tier2_physics/gw_contact.py
      수치적분으로 A_r ∝ P^1.0000 을 재현해 확인했다(2026-09-13).
      이 선형성이 χ(하중 분배 분율)=1 을 준다: 압력을 올리면 접촉 자리가 비례해
      늘어나므로 하중이 입자들에게 재분배된다는 뜻이다.
      가우시안 분포를 쓰는 계는 팩에서 덮어쓰면 된다(그 경우 지수가 1보다 약간 작다).
    source: "Greenwood & Williamson 1966 Proc.R.Soc.A 295 300-319 (doi:10.1098/rspa.1966.0242) + Lubricants/MDPI 2022 'Rough Surface Contact Modelling—A Review' 선형 A_r-W 관계"
