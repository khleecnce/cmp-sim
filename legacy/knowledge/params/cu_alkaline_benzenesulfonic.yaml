# 구리 CMP — **알칼리 step-2 계**. 억제제가 없고 벤젠술폰산이 barrier 제거를 가속한다.
#
# 왜 cu_h2o2_bta 에서 갈라 나왔는가 (2026-09-19)
# ────────────────────────────────────────────
# 전이 테스트에서 처음 보는 조성의 절대 MRR 오차 중앙값이 77% 였는데, 그 오차가
# 전 계열에 퍼진 게 아니라 **4개 계열에 몰려** 있었다(제외하면 나머지 17개 중앙값
# 60%). 그 4개는 전부 pack: cu_h2o2_bta 로 채점되고 있었으나 실제 조성이 다르다:
#
#     팩(cu_h2o2_bta)          이 데이터셋들
#     pH 4 산성                pH 6~11 알칼리 (KOH 조정)
#     BTA 1 mM                 **억제제 없음**
#     알루미나                 콜로이달 실리카
#     글리신 착화              벤젠술폰산
#
# US9200180B2 명세서 원문(로컬 사본 papers/patents/US9200180B2.html 에서 직접 대조,
# 인용구 7개 전수 확인)이 이 분리를 요구한다:
#
#   · 벤젠술폰산은 억제제가 아니다 — corrosion inhibitor 마쿠쉬 군(1,2,4-triazole /
#     benzotriazole / TINUVIN / CDX)에 들어 있지 않고, "benzenesulfonic acid not only
#     serves as oxidants but complexes with tantalum ions to form tantalum sulfonate
#     complexes, which results in high tantalum and/or tantalum nitride removal rates"
#     로 서술된 **산화제 겸 Ta 착화제**다.
#   · 부호가 반대다 — "both Ta and TaN removal rates are substantially increased with
#     increasing benzenesulfonic acid concentration". 억제제라면 농도↑에 제거율↓여야 한다.
#   · Cu 제거율이 낮은 이유도 흡착막이 아니다 — "This is possibly due to a much higher
#     passivation rate for copper than tantalum and/or tantalum nitride in a mixture of
#     hydrogen peroxide and benzenesulfonic acid". 즉 알칼리 H2O2 **부동태화**다.
#   · pH 는 청구항 "a pH ranging from about 5 to 11" 이고 실시예 23개 전부 pH 6.2~11.2
#     (중앙값 약 9)로 **산성 실시예가 하나도 없다.**
#   · 선호 임베디먼트는 오히려 "substantially free of ... corrosion inhibitors" 다.
#   · 대상 공정도 "most especially for step 2 copper CMP processes" — Cu 벌크 제거가
#     아니라 barrier 단계다.
#
# 분리의 직접 근거(반사실 측정):
#   알칼리 pH 스윕 5점을 부모 팩으로 예측하면 obs/pred 가 0.00502~0.00533 로
#   **퍼짐이 1.06배**다. 형상(pH 의존성)은 이미 맞고 축척만 193배 틀렸다는 뜻이다.
#   축척만 틀린 것은 정의상 Kp 문제이고, Kp 는 계마다 역산되는 양이므로
#   **팩을 나누는 것이 정답이지 항을 새로 만들 일이 아니다.**
#
# ⚠ 이 팩에 억제제 키를 넣지 마라. 억제제가 없는 것이 이 계의 정의다.
#   `inhibitor_mM` 을 선언하면 화학층이 흡착 항을 켜고, 그 항의 ΔG 는 BTA×Cu 쌍
#   값이라 남의 재료로 계산한 숫자가 된다.
base: base
description: "Cu CMP (step-2, 알칼리): H2O2 부동태화 지배, 억제제 없음, 벤젠술폰산 + 콜로이달 실리카"

params:
  film:
    value: cu
    confidence: verified
  abrasive:
    value: silica
    source: >
      US9200180B2 실시예 전체 — "K-안정 콜로이달 실리카". 부모 팩(알루미나)과 다르다.
    confidence: literature

  kp_m_per_pa:
    value: 1.9110383e-14
    unit: m^2/N
    note: >
      ⚠ 2026-09-19 기준점 동반이동: cu_ph_alkaline_ref 를 6.25 → 9.0(운전점)으로
      옮기면서 **같은 편집에서** 이 값에 0.400326 을 곱했다
      (4.7737e-14 → 1.91104e-14). 기준점을 위로 올리면 pH 항이 운전점에서
      0.400326 → 1.0 으로 **커지므로**, 곱을 보존하려면 Kp 는 같은 비율만큼
      **작아져야** 한다. 그 결과 예측값은 불변이다 — 4개 Cu 검증 계열의 예측
      벡터가 수정 전후 동일함을 실행으로 확인했다(방향을 반대로 잡았다가
      예측이 2.5배 뛰는 것을 실행이 잡아냈다. 계산으로 주장하지 말고 돌려 보라).
      한쪽만 옮기면 Kp 이중 계상이고, 이것이 기준배수 위반(model_hygiene L
      심각 1건)을 회귀 없이 닫는 유일한 길이다.

      이 계에서 직접 역산한 축척. US9200180B2 TABLE 4 (pH 6.2/7.1/8.7/9.4/9.9 →
      Cu RR 73.2/57.7/33.4/26.3/21.4 nm/min) 5점에 대해 기하평균 비
      exp(mean(ln(obs/pred))) 가 1.000 이 되도록 잡았다.
      **자유도는 1개(축척 하나)뿐이고 형상은 건드리지 않았다** — 개별 비의 퍼짐이
      1.06배에 불과해 5점이 한 상수로 동시에 맞는다. 이것이 계열마다 보정항을 붙이는
      것과 다른 점이다: 여기서 맞춘 것은 Kp 하나이고, pH 의존성은 cu_ph_alkaline_k
      (같은 표에서 독립적으로 회귀된 값)가 그대로 만든다.
      ⚠ 그래서 us9200180b2_cu_ph_alkaline_sweep 은 이 팩에 대해
      `used_for_calibration: true` 여야 한다 — 이미 그렇게 표시돼 있다.
      나머지 세 계열(abrasive_series · h2o2_series · us20110165777a1)이 held-out 이다.
      ⚠ 절대값을 신뢰하지 마라. Kp 는 이 장비(Mirra 3400, Politex, 2.0 psi)의
      지문을 포함한다 — 고객 실측이 오면 계열 축척 층이 다시 흡수한다.
    source: US9200180B2 (Air Products / 현 Versum·Merck) TABLE 4, Examples 15-19
    confidence: estimated

  slurry_ph:
    value: 9.0
    unit: pH
    note: >
      실시예 23개의 중앙값. 청구항 범위는 "a pH ranging from about 5 to 11"(광의
      4.5~12, 최선호 7~10.5)이고 산성 실시예가 없다. KOH 로 조정된다.
    source: US9200180B2 청구항 1 + 실시예 성분표
    confidence: literature
  ph_ref:
    value: 4.0
    unit: pH
    note: >
      **산성** 가지(cu_ph_acid_k)의 기준점이다. 이 팩의 운전점은 pH 9 이므로 산성
      가지를 타지 않지만, 키가 없으면 로더가 폴백해 조용한 기본값이 된다.
      부모와 같은 물리적 의미(산성역 기준)를 유지한다.
    source: knowledge/cmp/cu-cmp-ph-mechanism.md
    confidence: literature
  cu_ph_acid_k:
    value: 0.1428
    unit: 1/pH
    note: >
      산성역 감쇠 계수. 이 팩의 운전 대역(pH 6~11)에서는 사용되지 않지만, 팩이
      선언하지 않으면 부모 값이 조용히 상속돼 어느 쪽이 쓰였는지 추적이 끊긴다.
      ⚠ 단위 불일치는 의도된 표기다 — 접미사 _k 가 검사기에서 절대온도(K)를
      뜻하지만 여기서는 감쇠 상수 k 이고 차원은 1/pH 다. pH 는 무차원 로그량이므로
      온도로 **환산**하는 관계 자체가 존재하지 않는다(환산 불가, 환산 대상 아님).
      부모 팩 cu_h2o2_bta 의 같은 키와 동일한 사유다.
    source: knowledge/cmp/cu-cmp-ph-mechanism.md
    confidence: literature
  cu_ph_alkaline_k:
    value: 0.3329
    unit: 1/pH
    note: >
      알칼리역 감쇠 계수. **이 값의 출신이 곧 이 팩이 존재해야 하는 이유다** —
      US9200180B2 TABLE 4 Examples 15-19 (pH 6.2/7.1/8.7/9.4/9.9 → Cu RR
      732/577/334/263/214 Å/min) 의 ln(RR) vs pH 최소자승에서 나왔고
      (k=0.3329, R²=0.9971, 5점), 그 조성은 **콜로이달 실리카 10 wt% + H2O2 1 wt%
      + 벤젠술폰산 1 wt% + BTA 없음**, 즉 정확히 이 팩의 조성이다.
      그동안 이 값이 산성·BTA 팩 안에 세들어 있었다 — 알칼리 가지가 자기 계의
      Kp·억제제·연마입자를 못 쓰고 남의 것을 쓰고 있었다는 뜻이고, 그것이
      절대 MRR 이 193배 어긋난 직접 원인이다.
      ⚠ 단위 불일치는 의도된 표기다 — 접미사 _k 는 감쇠 상수(차원 1/pH)이지
      절대온도가 아니다. pH 는 무차원 로그량이라 온도로 **환산**하는 관계가
      존재하지 않는다(환산 불가). 산성 가지 cu_ph_acid_k 와 동일.
    source: US9200180B2 TABLE 4, Examples 15-19
    confidence: literature
  cu_ph_alkaline_ref:
    value: 9.0
    unit: pH
    note: >
      알칼리 가지의 기준점 = **이 팩의 운전점**(slurry_ph 와 동일). 2026-09-19
      기준배수 위반 수정: 이전 값 6.25(V자 골 위치)로 두면 기준 조건에서
      pH 항이 exp(−0.3329·(9−6.25)) = 0.4003 을 내어 **기준 조건 MRR 배수가
      1.0 이 아니게 된다**(model_hygiene L 검사 심각). Kp 가 그 조건에서
      역산된 값이므로 배수는 정확히 1.0 이어야 한다는 계약 위반이다.
      ⚠ 골 위치(6.25)는 여전히 물리적 사실이지만, 그것은 **함수의 형상**이
      아니라 좌표 원점 선택의 문제다 — exp(−k·(pH−ref)) 에서 ref 를 옮기는 것은
      곡선 전체에 상수배를 걸 뿐 **형상(k)을 바꾸지 않는다**. 그래서 이 이동은
      `_ref` 동반이동 규칙의 정석 적용이고, 짝인 kp_m_per_pa 를 같은 편집에서
      1/0.4003 배 옮겨 **예측값은 비트 단위로 불변**이다(아래 kp 주석 참조).
      실측으로 확인: 4개 Cu 검증 계열의 예측 벡터가 수정 전후 동일하다.
    source: >
      기준점 선택(좌표 원점) — 골 위치의 문헌 근거는 Du & Desai 2003
      (DOI 10.1557/PROC-767-F6.6) / Ilie & Ipate 2017
      (DOI 10.3390/lubricants5020015) 이며 k 의 출신 표와 함께 위 cu_ph_alkaline_k
      주석에 남아 있다.
    confidence: literature

  oxidizer:
    value: H2O2
    source: US9200180B2 실시예 성분표
    confidence: literature
  oxidizer_wt_pct:
    value: 1.0
    unit: "wt%"
    note: 실시예 대표 농도. 청구항 범위 0.1~10 wt%.
    source: US9200180B2 실시예 성분표
    confidence: literature
  oxidizer_ref_wt_pct:
    value: 1.0
    unit: "wt%"
    note: >
      기준 농도 — 화학 배수가 1.0 이 되는 지점. Kp 를 이 농도에서 역산했으므로
      본값과 같아야 한다. 다르면 기준 조건에서 배수 ≠ 1.0 = 이중 계상이다.
    source: kp_m_per_pa 를 역산한 조건과 동일
    confidence: literature
  oxidizer_passivation_K:
    value: 0.8232
    unit: 1/wt%
    note: >
      Langmuir 부동태 피복 상수. θ(C)=K·C/(1+K·C) 이고 산화제 항은
      f(C) = φ + (1−φ)·(1−θ(C))/(1−θ(C_ref)) — 산화제가 많을수록 Cu 표면
      부동태막이 활성 사이트를 덮어 제거율이 **낮아지는** 방향이다.
      **이 키가 이 팩에 와야 하는 이유**: 값의 출처가 US20110165777A1 TABLE 2
      4점(H2O2 0/0.25/0.5/1.0 wt%)인데 그 조성이 pH 11.1 알칼리 + 벤젠술폰산
      1.0 wt% + 콜로이달 실리카 5 wt% 로 **이 팩의 계이지 부모(pH 4 산성 + 알루미나
      + 글리신)의 계가 아니다.** 부모에 남겨 두면 이 팩에서는 키가 없어 산화제 항이
      통째로 꺼진다 — 실측으로 확인했다(산화제 0→7 wt% 에서 예측이 29.81 nm/min
      으로 소수점까지 고정, 즉 그 축이 미사용 상태였다).
      ⚠ 부동태화가 지배한다는 방향 자체가 이 계의 특징이다. 명세서가
      "a much higher passivation rate for copper than tantalum and/or tantalum
      nitride in a mixture of hydrogen peroxide and benzenesulfonic acid" 라고
      적은 바로 그 메커니즘이다.
    source: knowledge/cmp/chi-oxidizer-cu-h2o2-reparameterization.md
    confidence: estimated
  oxidizer_peak_wt_pct:
    value: 1.0
    unit: "wt%"
    note: >
      이 계는 산화제 증가가 제거율을 **낮추는** 부동태 지배계라 관측 창 안에
      정점이 없다. 정점을 운전점에 두어 관측 대역 전체가 정점 이후(감소) 구간이
      되게 한다 — 부모 팩의 3.0(산성·착화제계의 Kaufman 정점)을 물려받으면
      이 계에 없는 상승 구간이 생긴다.
    source: US9200180B2 명세서 (Cu 부동태 지배 서술) + US20110165777A1 TABLE 2 형상
    confidence: estimated

  abrasive_wt_pct:
    value: 10.0
    unit: "wt%"
    note: US9200180B2 TABLE 4 조성(콜로이달 실리카 10 wt%). Kp 역산 조건.
    source: US9200180B2 TABLE 4
    confidence: literature
  abrasive_ref_wt_pct:
    value: 10.0
    unit: "wt%"
    note: >
      본값과 동반 이동. 부모 팩 값(3.0)을 물려받으면 기준 조건에서 농도 항 배수가
      1.0 에서 깨져 Kp 가 이중 계상된다.
    source: kp_m_per_pa 를 역산한 조건과 동일
    confidence: literature
  abrasive_density_kg_m3:
    value: 2200.0
    unit: kg/m^3
    note: 비정질 콜로이달 실리카 2.20 g/cm3 (CRC Handbook).
    source: CRC Handbook of Chemistry and Physics — amorphous SiO2
    confidence: literature

