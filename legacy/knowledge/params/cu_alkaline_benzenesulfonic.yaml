      부모 null 결과(n=0.0)는 독립된 두 다리로 literature 등급을 받았다
      (knowledge/cmp/abrasive-size-null-result-force-partition-theory.md):
        ① 실측: TW202115224A(Cu, n=18) 순수 구형 부분집합(15/27/50/160nm)에서
           Spearman ρ≈0.03~0.15(비유의) — 단 이 데이터의 조성은 **글리신
           5.5wt%+알라닌 9.5wt%+1,2,4-트리아졸 416ppm**(부모 팩과 동일 화학,
           `validation/datasets/tw202115224a_cu_abrasive_size_pressure.yaml`
           원문 그대로)이다.
        ② 이론: Chen thesis 힘분배+단층+소성압입 결합 유도가 정확히 d⁰를
           준다(§4 verify). 이 유도는 **막(Cu, 연질→소성 압입 레짐)과 입자
           (구형, 15~160nm 콜로이달실리카)만 쓰고 화학종(오염제거제·억제제·
           산화제·pH)을 어디에도 참조하지 않는다** — 직접 재확인함
           (§4 수식에 pH·억제제·산화제 항 없음).

      이 팩(알칼리·벤젠술폰산·억제제 없음·pH 9)은:
        · 막 = Cu(부모와 동일) — ②의 전제(연질 소성 레짐) 그대로 유지.
        · 입자 = K-안정 콜로이달 실리카 50-60nm, 구형 추정(K-안정화 콜로이달
          실리카는 통상 Stöber형 합성으로 근사 구형 — US9200180B2는 형상을
          명시하지 않으나 "colloidal silica"라는 용어 자체가 흄드/응집형과
          대비되는 저응집 구형 입자를 뜻하는 업계 관행 표기다) — ②의 두 번째
          전제(구형, 15~160nm)도 유지, ①의 크기 범위(15~160nm)에도 포함.
        · 화학 = 벤젠술폰산+H2O2+알칼리, 억제제 없음 — **①의 화학(글리신/
          알라닌/트리아졸)과 다르다.**

      즉 ②(이론, 화학무관)는 그대로 전이되지만 ①(실측, 화학특정)은 전이되지
      않는다 — 두 독립 다리 중 하나만 남는다. EVIDENCE-RULES.md E4 정의
      ("1차 유도지만 다른 계에서 검증된 것을 전이 — 방향만 채택, 크기는
      미채택")에 해당하는 상황이고, 부모의 literature 등급은 ①+② 결합에서
      나온 것이므로 ②단독 전이는 한 단계 낮춰 **estimated**로 상속한다.
      값(0.0)은 바꾸지 않는다 — ②가 예측하는 값 자체가 0.0이고, ①이 다른
      화학종에서도 방향을 뒤집을 만한 반대 증거를 준 적이 없다(오히려
      Li 2021의 반대부호 사례는 산화막/탄성 레짐에서 나왔다 — 부모 노트 §7이
      이미 그 갈림을 탄성 vs 소성으로 귀속).
      ⚠ 이 판정이 검증하지 못한 것: 벤젠술폰산·과산화수소 부동태막이 입자
      표면 마찰계수를 바꿔 ②의 소성압입 상수를 흔들 가능성 — 미검증, 방향도
      모름. 이것이 estimated에 머무는 두 번째 이유다.
    source: >
      knowledge/cmp/abrasive-size-null-result-force-partition-theory.md
      (이론), validation/datasets/tw202115224a_cu_abrasive_size_pressure.yaml
      (실측 조성 대조용, 직접 채택 아님)
    confidence: estimated
