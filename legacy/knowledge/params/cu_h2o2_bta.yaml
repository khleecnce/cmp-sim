      §9.0): 0단계에서 Table I x II 35실험 전수탐색 결과, **글리신이 존재하는
      조건에서 H2O2 만 바뀌는 실험쌍은 하나도 없다**. 이 계의 착화제는
      옥살산(팩 기준은 글리신)이고, 같은 논문 회귀에서 옥살산 +536.63 /
      글리신 -440.91 로 부호가 갈린다(노트 §5) — 착화제 종에 따른 차이가
      미검증이므로 옥살산 데이터를 글리신 레짐의 **방향 대리(proxy)**로만
      쓴다. 값을 교체할 근거가 생기면 즉시 갱신하되, 격자를 채우려고 등급을
      올리지 않는다.
      ⚠ 추가 한계: 같은 전수탐색에서 실리카 0wt%·옥살산-단독 조건(Expt 16/33,
      글리신 0)은 반대로 **감소**(H2O2 6->7wt%: 2326->2070)를 보였다 — 즉
      "산성×착화제=증가"도 실리카 농도(>=6wt%)를 붙여야 정확하다. 이 팩의
