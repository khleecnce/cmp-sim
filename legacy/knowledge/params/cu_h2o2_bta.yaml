  promoter_exponent_m:
    value: 0.7238
    unit: "-"
    confidence: estimated
    source: knowledge/cmp/chi-carboxylate-promoter-cu-oxalate-us6309560.md
    note: >
      멱지수. g(C) = phi + (1-phi)*(C/C_anchor)^m.
      값의 출처: US6309560B1 TABLE 1 통제쌍 — 11% H2O2 / wetting 10 ppm / BTA 0
      고정에서 옥살산암모늄 0.5 → 1.0 wt% 일 때 Cu 251.7 → 402.9 nm/min(비 1.6007).
      m = log2((1.6007 - phi)/(1 - phi)) = 0.7238 (2점 통과라 잔차 0).
      m<1 = 포화형(농도를 올릴수록 한계효용 감소) — 착화제 흡착 사이트 포화와
      정성적으로 일치하나 이 데이터가 포화 곡률을 **증명하지는** 않는다(2점).
      ⚠ confidence=estimated 이유 셋:
      (1) 통제쌍이 각 1건씩이라 (phi, m)을 동시에 풀 수 없어 서로 다른 H2O2 수준의
          두 쌍에서 하나씩 뽑았다 — phi 는 7% 계열, m 은 11% 계열이다.
          두 계열은 wetting agent 농도도 다르다(50 vs 10 ppm, 미모델링 축).
      (2) 독립 교차확인(Jani 2025 doi:10.1149/2162-8777/adc59e RSM, 적합에 미사용)은
          0.02→0.08 M 예상비 3.113 인데 이 항은 2.515 — **19.2% 낮다**. 방향·오더는
          맞고 크기는 어긋난다. 계가 다르다(알루미나/옥살산암모늄/pH 7.5 자연 vs
          실리카/옥살산/pH 3.0) — 덮어씌우지 않고 차이를 그대로 남긴다.
      (3) 옥살산암모늄(염)과 옥살산(산)을 같은 종으로 묶었다. 촉진의 활성종이
          옥살레이트 음이온이라면 같지만, 암모늄 자신의 Cu 착화 기여
          (US6309560B1 본문이 고pH에서 Cu(NH3)x 형성을 언급)는 분리되지 않았다.
