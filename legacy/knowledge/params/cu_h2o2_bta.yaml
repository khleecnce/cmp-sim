      (2) 이 계열에는 BTA 가 없다(팩에는 있다). BTA 와 글리신의 커플링은 미검증.
      (3) 두 통제쌍의 고정 조건이 서로 다르다(실리카 3 vs 6 wt%, H2O2 5 vs 7 wt%,
