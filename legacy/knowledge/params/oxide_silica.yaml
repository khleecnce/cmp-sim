  # ⚠ 물질의 고유 밀도이지 슬러리 제형 정보가 아니다.
  abrasive_density_kg_m3:
    value: 2200.0
    unit: kg/m^3
    confidence: literature
    source: >
      비정질 실리카(colloidal SiO2) 2.20 g/cm3 — CRC Handbook, amorphous silica. 콜로이달 실리카는 비정질이므로 석영(2.65)이 아니라 이 값을 쓴다.
