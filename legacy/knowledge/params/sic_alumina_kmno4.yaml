  # ── 산화제 (2026-09-16, 물리위생 차원 위반 해소) ──────────────
  # 부모(sic_ceria_h2o2)는 H2O2 를 vol% 로 선언한다(Wang DOE: 2/4/6 vol%).
  # 이 팩의 산화제는 KMnO4 이고 특허 원문이 wt% 로 적는다 — 상속하면
  # **다른 재료의 농도를 다른 단위로** 물려받는다(모델 위생 규칙:
  # "재료를 바꾼 팩이 부모의 재료 고유 상수를 물려받으면 남의 재료로
  #  계산한 숫자가 이 팩의 결과로 나온다"). 본값·기준점을 한 편집에서
  # 함께 자기선언한다 — 비(c/c_ref)는 1.0 그대로라 예측은 불변이고,
  # 키 이름(_wt_pct)과 단위(wt%)의 어긋남만 사라진다.
  # ⚠ 현재 이 계보에는 산화제 형상 파라미터(langmuir_K/passivation_K/
  #   peak_wt_pct)가 없어 χ 의 산화제 항 자체가 비활성이다(factors.py 가
  #   경고로 신고 중). 그 항을 켤 때는 KMnO4 기준으로 형상을 새로 확보해야
  #   하며, H2O2 형상을 전용하지 마라(E°가 다르다: MnO4-/MnO2 +1.68 V).
  # ── 산화제 종 선언 (2026-09-16) ────────────────────────────────
  # 부모(sic_ceria_h2o2)가 2026-09-16 에 oxidizer_langmuir_K(H2O2 데이터로 적합)를
  # 선언하면서, 상속만으로 이 팩까지 그 곡선을 쓰게 되는 상황이 생겼다.
  # KMnO4 는 H2O2 와 산화력이 다르다(E°(MnO4⁻/MnO2)=+1.68 V vs SHE) — 형상을
  # 전이하면 남의 산화제로 이 팩의 MRR 을 예측하게 된다. 종을 명시해
  # sim/chemistry.py 의 종 게이트가 그 경로를 끄게 한다. 이 팩의 산화제 형상은
  # KMnO4 데이터를 확보할 때까지 **갭으로 남긴다**(지어내지 않는다).
  # 2026-09-19 갱신: 아래 oxidizer_langmuir_K 를 자기선언해 갭을 채웠다 — 이 note 의
  # "갭으로 남긴다"는 더 이상 유효하지 않다(knowledge/chemistry/sic-kmno4-oxidant-
  # adsorption-kinetics.md §1).
  oxidizer:
    value: KMnO4
    source: "US20220315802A1 Table 1 — 4 wt% KMnO4 + 0.5 wt% 질산염, pH 2.3"
    confidence: measured

  # ── 산화제 형상 (χ 산화제축 배선, 2026-09-19, C2 완성격자 회차) ─────────
  # 종 게이트(sim/chemistry.py::_oxidizer_species_gate_ok)를 통과시키려면 이 팩
  # 고유의 KMnO4 데이터로 K 를 자기선언해야 한다(부모의 H2O2 K 는 상속되지 않는다
  # — 판정#50, 의도된 차단). 이 K 는 이 팩과 재료계가 완전히 일치하는 문헌
  # (4H-SiC + α-Al2O3 500 nm + KMnO4, Gong et al. 2024, DOI 10.3390/ma17030679)의
  # L25 직교표(5수준 KMnO4 1~5 wt%, 각 수준 5회 반복 주효과 평균)에서 역산했다.
  # 근거·피팅·한계는 knowledge/chemistry/sic-kmno4-oxidant-adsorption-kinetics.md 전체.
  # ⚠ **held-out 상충**: 같은 논문의 같은 Table 2 가
  # validation/datasets/gong2024_4hsic_alumina_kmno4_L25.yaml(used_for_calibration:
  # false)로 이 팩의 독립 검증에 쓰이고 있었다. 이 K 를 선언하는 순간 그 독립성이
  # 깨진다(자기 답안지 채점, kp_m_per_pa 의 Entegris 사례와 같은 성격) — 이 팩
  # yaml 은 그 파일을 고칠 권한이 없으므로 agents/slurry-chemist/PROFILE.md
  # §구현 요청으로 갱신을 위임했다.
  oxidizer_langmuir_species:
    value: KMnO4
    note: >
      oxidizer_langmuir_K 가 KMnO4 데이터로 적합됐다는 선언 — 이 팩의 oxidizer(위,
      KMnO4)와 일치하므로 종 게이트를 통과한다(판정#47과 같은 장치).
    source: "Gong et al. 2024, DOI 10.3390/ma17030679 — 이 팩과 산화제 종 일치"
    confidence: measured

  oxidizer_langmuir_K:
    value: 2.28
    unit: "1/wt%"
    note: >
      촉진-포화형 Langmuir 피복 상수. f(C)=φ+(1-φ)·θ(C)/θ(C_ref), θ(C)=K·C/(1+K·C),
      φ=0.15(_oxidizer_term 기본값, 이 팩은 새로 선언하지 않는다 — 아래 축퇴 참조),
      C_ref=4 wt%(=이 팩의 oxidizer_ref_wt_pct, 우연히 아래 문헌의 격자점과 일치).

      Gong et al. 2024(DOI 10.3390/ma17030679) Table 2, L25(5³) 직교표의 KMnO4
      주효과 평균 5점(1/2/3/4/5 wt% → 0.53348/0.67452/0.68066/0.68680/0.70520 µm/h,
      Table 3 인쇄값과 로컬 재계산이 일치)을 비선형 최소자승으로 적합. 잔차(비율
      공간) rms 3.1%, 최대 개별 잔차 5.7%p(C=2 지점).

      ⚠ **K·φ 축퇴**: φ 를 자유변수로 풀면 음수로 발산한다(자유도 부족, 판정#19의
      (n,C_peak) 축퇴와 같은 종류). φ=0 으로 고정하면 K=2.82 로 바뀌지만 예측치는
      <1%p 차이 — φ 는 이 데이터로 식별 불가능하다. 그래서 φ 는 새로 선언하지 않고
      기존 기본값(0.15)에 얹었다.
      ⚠ **주효과 평균이지 통제된 단일축 스윕이 아니다** — 다른 두 인자(pH, 알루미나
      wt%)의 영향이 직교 배치로 상쇄된다는 가정에 의존(상호작용항 미검증).
      ⚠ **held-out 상충**(위 oxidizer_langmuir_species note 참조) — 미해소.
      ⚠ 폴리타입 불일치(Gong 은 4H, 이 팩의 pH 계수는 6H Chen 2020) — 미검증, 기존
      관례(Su 2011 이식 선례)와 동일한 가정.

      기준점 계약: C_ref=4 wt% 가 이 문헌 격자점과 일치해 f(C_ref)=1 이 별도 재보간
      없이 성립한다 — kp_m_per_pa 재역산 불필요(값 불변).
    source: "Gong et al. 2024, DOI 10.3390/ma17030679 Table 2/3 (L25 직교표, n=25, 5수준 주효과 평균)"
    confidence: estimated

  oxidizer_wt_pct:
    value: 4.0
    unit: "wt%"
    note: >
      이 팩의 기준 조성 산화제 농도 — KMnO4 4 wt%(ph_ref 와 같은 출처 줄).
      부모의 H2O2 3.0 wt% 를 덮는다.
    source: "US20220315802A1 Table 1 — 4 wt% KMnO4 + 0.5 wt% 질산염, pH 2.3"
    confidence: measured

  oxidizer_ref_wt_pct:
    value: 4.0
    unit: "wt%"
    note: >
      기준점 동반 이동(본값과 같은 조성). 부모의 4.0 **vol%**(H2O2)를 덮는다 —
      값이 우연히 같아도 단위와 재료가 다르므로 상속은 오답이다.
    source: "US20220315802A1 Table 1 — 4 wt% KMnO4"
    confidence: measured

  abrasive_density_kg_m3:
    value: 3950.0
    unit: kg/m^3
    note: alpha-Al2O3 3.95 g/cm3 — CRC Handbook. 부모의 세리아 7220 을 덮는다(연마입자가 다르다).
    source: "CRC Handbook of Chemistry and Physics — alpha-Al2O3 density"
    confidence: literature

  # ── pH 축 부활 (2026-09-18, 판정#61) ───────────────────────────
  # 판정#59 가 abrasive 정체성을 알루미나로 바로잡으면서, 이 팩의 pH 분기는
  # "상속된 후보가 전부 남의 재료 것"이라 **의도적으로 꺼져** 있었다
  # (χ status=unmodeled, 완성 격자 60→59). 그 자리를 이 팩의 재료계
  # (SiC × 산성 KMnO4 × 알루미나)에서 직접 측정된 문헌으로 채운다.
  #
  # 근거: Chen G., Du C., Ni Z., Liu Y., Zhao Y., Russ. J. Appl. Chem. 93(6)
  #       832-837 (2020), doi:10.1134/S1070427220060099, Fig. 1(a) —
  #       6H-SiC Si면, 2 wt% Al2O3 나노(100 nm), 0.05 M KMnO4, pH 2/4/6/8/10,
  #       4 psi, 90/90 rpm, IC-1000 K-Groove. **pH 2→10 단조 감소**.
  #       판독값(nm/h): 1544 / 813 / 528 / 455 / 434 (인쇄 최대 1554 를
  #       -0.6 % 로 재현 — 눈금 간격 역산 교차검증).
  # 형태: g(pH) = φ + (1-φ)·exp(-k(pH-2)), f = g(pH)/g(pH_ref).
  #       순수 지수는 pH 10 을 3 배 넘게 과소예측한다(평탄 구간을 못 담는다).
  # ⚠ 그래프 판독(digitized)이라 등급은 estimated. 인쇄 표를 가진 KMnO4
  #   pH 스윕을 확보하면 승격 대상이다.
  sic_kmno4_ph_acid_k:
    value: 0.546
    unit: "1/pH"
    note: >
      MnO4- 산화력의 pH 감쇠 상수. Chen 2020 Fig.1(a) Si면 5점(pH 2~10)을
      로그공간 최소자승으로 적합(φ 동시 추정). 개별 재현오차 -2.4~+2.6 %,
      rms(log)=0.0171. C 면(같은 그림 (b))은 k=0.380·φ=0.308 로 더 완만한데,
      이 팩의 기준 막질은 Si 면이므로 Si 면 값을 쓴다(면 방위별 분기는 미모델링).
      ⚠ 그래프 판독 기반 — estimated.
      ⚠ **단위 불일치 예외(의도된 표기)**: 키가 `_k` 로 끝나지만 이것은 온도(K)가
      아니라 pH 축의 **감쇠율 상수** `g(pH)=φ+(1-φ)·exp(-k(pH-2))` 의 k 이므로
      단위가 `1/pH` 다. pH 는 그 자체가 로그 무차원량이라 K 로 **환산할 대상이
      아니다** — 환산하지 않는 이유가 이것이다. 소비처는 `sim/factors.py::
      _ph_sic_kmno4_acidic_term` 한 곳뿐이고 지수 인자로만 쓰므로 자릿수 오류
      경로가 없다.
    source: "Chen et al. 2020, DOI 10.1134/S1070427220060099, Fig. 1(a) (digitized, 5점)"
    confidence: estimated

  sic_kmno4_ph_anchor:
    value: 2.0
    unit: pH
    note: 지수의 기준점(위 적합이 pH 2 를 1.0 으로 두고 풀렸다). 측정값이 아니라 적합 좌표계 선언.
    source: "Chen et al. 2020, DOI 10.1134/S1070427220060099, Fig. 1(a) 최저 pH 수준"
    confidence: estimated

  sic_kmno4_ph_floor:
    value: 0.268
    unit: "-"
    note: >
      pH 가 올라 산화력이 꺼져도 남는 **기계 경로 하한**(연마입자 압흔). 위와 같은
      적합에서 동시 추정. 실측 pH 10/pH 2 비 0.281 과 같은 자릿수이며, 이 하한이
      없으면 pH 10 예측이 실측의 1/3 이하로 떨어진다.
      ⚠ 그래프 판독 기반 — estimated.
    source: "Chen et al. 2020, DOI 10.1134/S1070427220060099, Fig. 1(a) (digitized, 5점)"
    confidence: estimated
  sic_kmno4_ph_floor_lo_wt:
    value: 0.79
    unit: wt%
    note: |
      φ 농도 보간의 **저농도 앵커**. Chen 2020 의 0.05 M KMnO4 를 wt% 로 환산한 값
      (0.05 mol/L x 158.03 g/mol = 7.90 g/L ≈ 0.79 wt%, 묽은 수용액 밀도 1 kg/L 가정).
      이 농도에서 관측된 pH 감쇠가 φ=0.268 을 준다.
    source: "Chen et al. 2020, DOI 10.1134/S1070427220060099 (0.05 M KMnO4) — 몰농도→wt% 환산"
    confidence: literature
  sic_kmno4_ph_floor_lo:
    value: 0.268
    unit: "-"
    note: |
      저농도 앵커의 기계 하한. `sic_kmno4_ph_floor` 와 같은 적합에서 나온 값이다
      (Chen 2020 Fig.1a 판독 5점). ⚠ 그래프 판독 기반 — estimated.
    source: "Chen et al. 2020, DOI 10.1134/S1070427220060099, Fig. 1(a) (digitized, 5점)"
    confidence: estimated
  sic_kmno4_ph_floor_hi_wt:
    value: 6.5
    unit: wt%
    note: |
      φ 농도 보간의 **고농도 앵커**. Wang 2021 이 최대 연마율을 얻은 조성이다
      (pH 2.00, KMnO4 6.5 wt%, Al2O3 연마입자, 4H-SiC Si면).
      ※ 이 팩의 Kp 는 같은 Wang 2021 의 1.4 µm/h 에서 역산했는데, 그 Kp note 는
      농도를 이 팩 기준 0.5 wt% 로 **가정**했다고 적어두었다. 원문 초록(인쇄 텍스트)
      확인 결과 실제 농도는 6.5 wt% 다 — 그 가정은 틀렸다. 값 수정은 Kp 재역산을
      동반하므로 별도 갱으로 분리한다(판정#64 §5 에 기록).
    source: "Wang W., Liu W., Song Z., ECS J. Solid State Sci. Technol. 10 (2021) 074004, DOI 10.1149/2162-8777/ac12de — 초록 인쇄값"
    confidence: literature
  sic_kmno4_ph_floor_hi:
    value: 0.7848
    unit: "-"
    note: |
      고농도 앵커의 기계 하한. Wang 2021 의 두 인쇄 끝점(pH 2 → 1.4 µm/h,
      pH 12 → 1.1 µm/h, 비 0.7857)에 같은 형상 g(pH)=φ+(1-φ)exp(-k(pH-2)) 와
      k=0.546 을 넣어 푼 값: φ = (0.7857 - e^-5.46)/(1 - e^-5.46) = 0.7848.
      **출처가 그래프가 아니라 리뷰 본문의 인쇄 수치다**(Micromachines 2022 리뷰가
      Wang 2021 을 인용하며 두 끝점을 문장으로 적었다).
      ⚠ 끝점 2 개뿐이라 k 를 독립 추정할 수 없어 Chen 2020 의 k 를 빌렸다 — φ 는
      그 가정에 조건부다. 원문 Fig. 확보 시 k·φ 를 동시 재적합할 것.
      ⚠ 폴리타입이 다르다(4H vs Chen 의 6H) — 이 차이가 φ 에 섞여 있을 수 있다.
    source: "Wang et al. 2021 DOI 10.1149/2162-8777/ac12de (pH2 1.4 / pH12 1.1 µm/h), 인쇄값 경유: Hsieh et al., Micromachines 13 (2022) 1752, DOI 10.3390/mi13101752 §2.1"
    confidence: estimated
