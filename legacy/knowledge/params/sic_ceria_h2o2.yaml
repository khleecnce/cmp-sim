# 4H-SiC CMP — 세리아/H2O2 알칼리 슬러리 (실측 DOE 기반)
#
# ⚠ 이 팩은 **Si 반도체용이 아니다.** 4H-SiC 웨이퍼 전용이다.
#   Si 산화막/Cu/W 공정에 이 값을 쓰면 안 된다.
#
# 왜 만들었나 (2026-09-08):
#   Wang et al. ACS SI Table S3의 50조건 완전 DOE가, 우리가 확보한 데이터 중
#   조성(CeO2·H2O2·pH)과 압력·rpm이 모두 절대값으로 있는 **유일한** 것이다.
#   기존 sti_ceria 팩에는 pH 파라미터가 없어 화학층의 pH 항이 통째로 꺼져
#   있었는데(chemistry.py `_ph_softening_term`이 파라미터 부재 시 스킵),
#   실측에서 pH가 **가장 강한 인자(rho=+0.520)**로 나왔다.
#   그래서 이 데이터로 계수를 역산해 pH 항을 처음으로 켠다.
#
# 실측 역산 근거 (같은 조성·압력·rpm에서 pH만 다른 9개 조, n=12쌍):
#   pH 1단위당 MRR 배수 중앙값 = 1.633
#   MRR ∝ H^-1.5 이므로 경도비 = 1.633^(-1/1.5) = 0.7213
#   → ph_softening_per_unit = 1 - 0.7213 = 0.2787
#
#   ⚠ 이 값은 SiC 표면 화학에서 나왔다. Si 산화막의 pH 의존성은 다르다
#     (실리카 등전점 pH~2, 세리아 ~7 → 정전기 상호작용이 반대로 움직인다).
#     다른 재료계로 옮기지 마라.
#
# 실측된 인자 순위 (이 팩의 검증 기준선):
#   pH +0.520 > head rpm +0.341 > CeO2 +0.286 > 압력 +0.266 > H2O2 +0.221
#   > platen +0.153 | 펌프유량 -0.317, 연마시간 -0.324 (둘 다 엔진에 없음)
#
#   ⚠ 펌프유량·시간이 조성보다 강하다. 논문 PCA도 같다(pump +0.563, time +0.535).
#     엔진이 이 둘을 모델링하지 않으므로 이 데이터셋에서 순위 일치도의 상한이
#     구조적으로 제한된다. rho가 낮아도 화학층만의 문제가 아니다.

base: sti_ceria
description: "4H-SiC CMP: 세리아/H2O2 알칼리 슬러리, pH 항 실측 역산"

params:
  # ── Preston 계수 — 이 팩 전용값 선언 (2026-09-16, 판정#49) ──────────
  # ⚠ 이 키는 조부모(sti_ceria)의 2.2e-13 m^2/N 을 상속하고 있었다. 그 값은
  #   **세리아 슬러리로 깎은 Si 산화막(SiO2)** 에서 역산된 값이다. 이 팩이 깎는
  #   것은 4H-SiC 로, 같은 저장소의 sim/pack_meta.py 가 이미 "경도가 높아 MRR이
  #   Si 대비 2~3자리 낮다"고 적고 있다 — 즉 연마입자(세리아)만 같고 피삭재가
  #   다른데 Preston 계수를 그대로 물려받고 있었다(판정#48 의 κ 농도항 상속과
  #   같은 종류의 하이진 결함).
  #   증상: sic2026_ceria_h2o2_ph_DOE50 (n=50) 백테스트에서 예측/실측
  #   기하평균 164배 과대예측(계통편향 0.01배). 순위(rho=+0.393, p=0.002)는
  #   맞는데 절대값만 두 자리 틀린 전형적인 Kp 스케일 결함이다.
  kp_m_per_pa:
    value: 1.4144e-15
    unit: m^2/N
    note: >
      이 팩의 **기준 조건에서 역산한 Preston 계수**다. 기준 조건은 이 팩이 이미
      선언해 둔 ref 3종과 정확히 일치하는 DOE 중심점이다:
      CeO2 4 wt%(abrasive_ref_wt_pct) · H2O2 4 vol%(oxidizer_ref_wt_pct) ·
      pH 10(ph_softening_ref / ph_ref) — Wang et al. ACS SI Table S3 의 S3-27
      (4.5 psi, platen 60 rpm, head 60 rpm, 실측 198.52 nm/h = 3.3087 nm/min).
      그 조건에서 모든 무차원 팩터가 1.0 이 되므로 Kp 는 유일하게 결정된다:
      Kp_new = Kp_old x (실측/예측) = 2.2e-13 x (3.3087 / 514.654) = 1.4144e-15.

      왜 이 데이터인가: 이 팩(4H-SiC + 세리아 + H2O2 알칼리)과 재료계가 정확히
      일치하는 절대 MRR 데이터는 저장소에 이것뿐이다. 이미 ph_softening_per_unit
      의 출처이기도 하므로 데이터셋은 used_for_calibration: true 로 표시돼 있고,
      이 Kp 역산 역시 캘리브레이션이다 — **자기 데이터로 검증했다고 말하지 않는다.**

      독립 확인 1 (다른 논문, 같은 재료계 아님):
        Wei et al. 2026 (Crystals 16, 179, DOI 10.3390/cryst16030179, MDPI OA,
        papers/wei2026-cryst16030179-4hsic-fenton-cmp.pdf 원문 확보) — 4H-SiC C면,
        콜로이달 실리카 8 wt%(110 nm) + H2O2 5 wt% + Fe3O4 0.03 wt%, pH 9,
        34.5 kPa(=5.004 psi), 패드/웨이퍼 각 50 rpm, 60 min, 최대 MRR 701 nm/h
        (= 11.683 nm/min, Table 3 + Fig.4a 본문 인쇄값).
        이 조건을 새 Kp 로 넣으면 예측 1.43 nm/min → **0.12배(8배 과소예측)**.
        ⚠ 일치라고 부르지 않는다. 연마입자가 세리아가 아니라 실리카이고,
        C면은 Si면보다 2~3배 빠르며(같은 리뷰 DOI 10.3390/mi13101752 §2),
        Fenton 촉매가 추가된 계다. 자릿수(1자리 이내)만 맞는 것으로 본다.
        직전 값(2.2e-13)이었다면 같은 조건에서 약 20배 과대예측이었다.
      독립 확인 2 (held-out, 다른 연마입자):
        su2011_procengr_6hsic_alumina_abrasive_conc (6H-SiC + 마이크론 알루미나)
        계통편향 248배 → **1.59배**. 이 데이터는 이 팩의 어떤 파라미터에도
        쓰이지 않은 held-out 이다.
      남는 불일치 (덮지 않고 적는다):
        entegris2022_us20220315802a1_sic_alumina_conc 는 반대로 0.005배
        (196배 과소예측)가 된다. 이 특허 데이터의 실측 MRR 은 5.8 um/h 로,
        su2011(0.045~0.070 um/h)·Wang(0.12~0.96 um/h)보다 두 자리 높다.
        같은 "SiC CMP" 안에서 실측이 130배 벌어지는 것이므로 이건 Kp 하나로
        덮을 문제가 아니라 **팩 분리(고속 산성 KMnO4 알루미나 계 vs 알칼리
        세리아/H2O2 계) 문제**다. Kp 로 덮지 않는다.
      순위 지표는 이 변경에 불변이다(Preston 은 Kp 에 선형 → 단조 변환).
    source: >
      Wang et al., figshare:31056549, ACS SI Table S3 (S3-27 중심 조건) 역산.
      자릿수 교차확인: Wei et al. 2026, DOI 10.3390/cryst16030179.
      상세: knowledge/cmp/sic-preston-coefficient-pack-own-declaration.md
    confidence: measured

  film:
    value: sic_4h
    source: "Wang et al. ACS SI Table S3 — 4H-SiC 웨이퍼"
    confidence: measured

  abrasive:
    value: ceria
    source: "Wang et al. ACS SI Table S3 — CeO2 연마입자"
    confidence: measured

  slurry_ph:
    value: 10.0
    unit: ""            # pH 는 무차원(로그 활동도)
    source: "Wang et al. ACS SI Table S3 — DOE 중심 수준 (pH 9/10/11)"
    confidence: measured

  ph_softening_ref:
    value: 10.0
    unit: ""            # pH 기준점 — 무차원
    source: "Wang et al. ACS SI Table S3 — DOE 중심값을 기준으로 잡는다"
    confidence: measured

  ph_softening_per_unit:
    value: 0.2787
    source: "Wang et al. ACS SI Table S3 50조건 역산 (pH만 다른 9조/12쌍, 배수 1.633, H^-1.5 환산). 2026-09-08"
    confidence: measured

  abrasive_ref_wt_pct:
    value: 4.0
    unit: "wt%"
    source: "Wang et al. ACS SI Table S3 — DOE 중심 수준 (CeO2 2/4/6 wt%)"
    confidence: measured

  abrasive_conc_exponent:
    value: 0.227
    unit: "-"
    note: >
      ⚠ 2026-09-16 판정#52 — **부호를 뒤집었다(-0.406 → +0.227).**

      이전 값 -0.406 은 Entegris US20220315802A1 Table 1(산성 pH 2.3 · KMnO4 ·
      알루미나/지르코니아, n=5)의 로그-로그 회귀였다. 그런데 **그 데이터셋은
      판정#49-B 로 이미 이 팩을 떠나 sic_alumina_kmno4 팩으로 옮겨졌다** —
      근거는 다른 팩으로 가고 지수만 여기 남아 있던 상태다(고아 파라미터).

      이 팩의 계(4H-SiC + H2O2 + 세리아 함유 연마입자)에서 직접 관측된 농도-MRR
      방향은 **네 건 모두 비음(非負)**이다:
        1) Wang et al. figshare:31056549 ACS SI Table S3 — 산화제·pH·압력·rpm 이
           모두 같고 CeO2 농도만 다른 **매칭쌍 17개**의 로그-로그 기울기
           중앙값 **+0.227** (부트스트랩 2000회 95% CI -0.136 ~ +0.598).
           ← 이 값을 채택한다. 교란이 통제된 이 팩 자신의 계 실측이다.
        2) Liang et al. Nano Research 2026 doi:10.26599/NR.2026.94909100 §2.3 —
           4H-SiC, CuxO-CeO2/Al2O3 + H2O2 8wt%, 1/5/9 wt% 에서 228.54 → 538.45 →
           621.47 nm/h **단조 증가**(OLS 기울기 +0.472).
           held-out 이므로 **적합에 쓰지 않았다** — 방향 확인용.
        3) Wei et al. 2026 doi:10.3390/cryst16030179 §3.2 — 4H-SiC C면, 콜로이달
           실리카 2→8 wt% 에서 MRR 단조 증가(최대 701 nm/h). 8 wt% 초과에서
           점도·응집으로 꺾인다.
        4) Gong et al. 2024 doi:10.3390/ma17030679 L25 — +0.036(알루미나/KMnO4 계
           라 참고값).

      이론 유도값과의 관계: sim/regime_adapter.py 의 3인자 분해가 이 팩에서
      n_C = p(1-αχ) = **+0.333**(표면적 지배 극한)을 준다. 채택값 +0.227 은
      그 부호와 일치하고 자릿수도 같다 — 실측이 이론보다 약간 낮은 것은
      고농도 포화(순수 거듭제곱이 구조적으로 표현 못 하는 영역) 때문으로 읽힌다.

      ⚠ 한계: 부트스트랩 95% CI 가 0 을 포함한다. 즉 **크기는 미결정이고
      부호만 판정됐다.** 그래서 confidence 를 literature 에 둔다(measured 아님).
      ⚠ 이 값은 캘리브레이션 데이터(sic2026_ceria_h2o2_ph_DOE50,
      used_for_calibration: true)에서 나왔다 — 그 데이터셋의 개선을 이 항의
      근거로 주장하지 않는다.
      ⚠ 적용 범위: 이 팩의 DOE 범위 2~6 wt% + 교차확인 1~9 wt%. Liang/Wei 가
      공통으로 보고한 8~10 wt% 이상의 점도·응집 감쇠 구간은 이 거듭제곱이
      표현하지 못한다.
      ⚠ 마이크론급 알루미나(백강옥) 계의 비단조 거동(su2011, 판정#36)은 여전히
      별개 레짐이다 — 이 지수로 설명하려 들지 마라.

      과거 판정#37(Table 1 유지 재확정)은 "Entegris 데이터가 이 팩의 것"이라는
      전제 위에 있었고, 판정#49-B 로 그 전제가 사라졌으므로 함께 종결한다.
    source: >
      Wang et al., figshare:31056549 (ACS SI Table S3) 매칭쌍 17개 재분석.
      방향 교차확인: Liang et al. doi:10.26599/NR.2026.94909100 (held-out),
      Wei et al. doi:10.3390/cryst16030179.
      상세: knowledge/cmp/sic-ceria-abrasive-concentration-sign-reversal-ruling.md
    confidence: literature

  oxidizer_ref_wt_pct:
    value: 4.0
    unit: "vol%"
    note: >
      ⚠ 키 이름은 wt_pct 인데 원문 단위는 **vol%** 다(Wang DOE: H2O2 2/4/6 vol%).
      H2O2 30% 수용액 기준 vol%↔wt% 는 밀도차로 약 1.1배 어긋나므로 엄밀히 같지 않다.
      χ 항이 **기준 대비 비(c/c_ref)** 로만 쓰므로 같은 단위끼리 나눠 배수는 불변이고,
      그래서 값을 환산하지 않고 단위만 정직하게 표기한다. 절대 농도를 쓰는 항이
      생기면 그때 환산해야 한다 (2026-09-11 차원 검사에서 발견).
    source: "Wang et al. ACS SI Table S3 — DOE 중심 수준 (H2O2 2/4/6 vol%)"
    confidence: measured

  # ── 연마입자 입경 (base sti_ceria의 80nm 오버라이드) ─────
  abrasive_size_nm:
    value: 120.0
    unit: nm
    note: >
      SiC+세리아 1차 문헌 실측값으로 승격(기존 base sti_ceria 상속값 80nm는 세리아가 아니라
      같은 원문의 실리카 dmean을 잘못 전용한 값으로 보임 — 노트 §3). Chen et al. 2017
      (RSC Adv. 7, 16938–16952, DOI 10.1039/C6RA27508G, 오픈액세스, 원문 1차 확인) §2.1
      Materials: "ceria abrasives (dmean ≈ 120 nm, 30 wt%, Chuangyuan New materials Co. Ltd.)"
      — 공급업체 콜로이달 스펙이자 TEM(JEOL-2100)으로 직접 확인(Fig. 1b), 실제 6H-SiC CMP
      실험(§2.3, 4psi/80·80rpm/IC-1000)에 2wt%로 희석해 실사용.
      ⚠ 산화제 불일치: 이 논문은 KMnO4(0.05M)를 쓰고 이 팩은 H2O2다. 그러나 연마입자
      입경은 공급업체 콜로이달 분산 물성(입자 자체 기하)이라 산화제와 독립적 — SiC+ceria
      입경 계는 동일하다고 본다. 산화제 차이는 화학층(MRR 배수) 쪽에만 영향.
      ⚠ 웨이퍼는 6H-SiC(이 팩은 4H-SiC) — 폴리타입 다르나 연마입자 스펙 자체는 웨이퍼
      폴리타입과 무관(공급업체 물성이므로 교차 적용 타당).
    source: knowledge/cmp/sic-ceria-abrasive-particle-size-chen2017-rsc.md
    confidence: literature

  # ── ψ 표면 흡착 보호 (분산제 경로, 교차계 전이) ──────────
  dispersant_type:
    value: "NONE"
    unit: "-"
    note: >
      oxide_silica 팩(→sti_ceria 경유)에서 상속된 경로였다. Li et al. 2021은 실리카 슬러리
      실측이라 세리아 화학계로의 전이는 교차계 외삽(EVIDENCE-RULES E4)이고, 값 자체는
      여전히 전이하지 않는다(아래 참조).

      2026-09-14 EVIDENCE-RULES 판정#15(sti_ceria.yaml과 동일 판정, 이 팩도 base로 상속):
      Kim et al. 2024(doi:10.3390/polym16243593, PMC11679047, CC-BY) §Results가 이 팩과
      같은 화학(EAA 공중합제 분산제)·같은 oxide 막질(PETEOS)에서 실측을 제공한다 — 분산제
      함량 5→7wt%(D5→D7)에서 oxide MRR이 **4224→4712 Å/min(+11.55%)로 오른다.**
      실리카/Li 2021의 PVA(−3.6%)·PVP(−7.9%)와 **부호가 반대**다. 실리카형 억제 배수를
      전이하지 않는(=NONE, 배수 1.0) 현재 선택은 부호 반대의 1차 대상계 실측(E3, 대상계
      실측이나 DLS 입경이 281.6→227.2nm로 동시에 변해 교란)으로 뒷받침된다.

      ⚠ **값은 바꾸지 않는다.** Kim 2024의 +11.55%도 입경 교란과 뒤섞여 있어(sti_ceria의
      abrasive_size_peak_nm=163 정점 모델로 역산하면 입경만으로 +7.42%가 설명되고 잔차
      +3.85%는 방향은 알아도 ψ 단독 귀속 불가) 정량 ψ 배수를 추출할 근거가 못 된다.
      이 팩은 SiC 웨이퍼(4H-SiC)라 Kim 2024(Si oxide/PETEOS)와 막질이 또 한 겹 다르지만,
      화학(세리아+EAA 분산제)은 동일 — "실리카형 억제를 쓰지 않는다"는 판단의 근거로는
      sti_ceria와 같은 논리를 그대로 적용한다(오히려 이 팩은 SiC라 실리카 전이 근거가
      sti_ceria보다도 더 약했었다).

      confidence를 estimated→literature로 올린다 — "NONE의 정량값이 문헌에서 나왔다"는
      뜻이 아니라, "이 경로를 실리카형으로 쓰지 않는다는 결정 자체가 이제 1차 대상계
      실측으로 뒷받침된다"는 뜻이다(EVIDENCE-RULES §4 null도 결론이다).
    source: knowledge/cmp/ceria-dispersant-eaa-oxide-mrr-direction-vs-silica.md (EVIDENCE-RULES 판정#15)
    confidence: literature

  # ── ψ 표면 흡착 보호 — 첨가제 농도축: 문헌 없음 (2026-09-14) ──────────
  # 부모(sti_ceria)의 shield_K_* 는 계면활성제×SiO₂/Si₃N₄ 쌍의 상수다. SiC 는
  # Si–C 공유결합 세라믹이라 실란올 표면화학이 없고, SiC 위 첨가제 농도-RR 스윕
  # 문헌이 코퍼스(1510건)·웹 검색 어디에도 없다. K 를 자기선언하지 않으므로
  # factors._f_psi 의 has_own 게이트가 농도축을 비활성(partial)으로 둔다 —
  # 지어낸 숫자보다 정직한 부재가 낫다. 드라이버만 선언해 사유를 기록한다.
  shield_additive_wt_pct:
    value: 0.0
    unit: wt%
    note: >
      SiC 팩의 첨가제 농도. ⚠ 흡착상수(shield_langmuir_K) 미선언 → 이 값을 바꿔도
      결과가 변하지 않는다(partial, notes 에 신고). 검색 흔적: Zhou 2015 6H-SiC Triton X-100
      (doi:10.1016/j.apsusc.2015.10.158)은 초록만 확보(0.5 wt% 단일 최적점, 스윕 표 미확인)
      — 원문 확보 시 그 표로 K 를 역산해 자기선언하면 자동 활성화된다.
    source: knowledge/cmp/psi-adsorption-shield-oxide-systems.md §6
    confidence: literature
  shield_ref_wt_pct:
    value: 0.0
    unit: wt%
    note: 기준 농도(무첨가 DOE, Wang et al. ACS SI Table S3). 활성화 시 그대로 사용.
    source: knowledge/cmp/psi-adsorption-shield-oxide-systems.md §6
    confidence: literature

  # -- tau slurry transport (viscosity) ------------------------
  slurry_viscosity_pa_s:
    value: 1.4e-3
    unit: "Pa·s"
    note: >
      세리아 슬러리 실제 점도(sti_ceria와 동일 근거: Kim 2024
      DOI 10.3390/polym16243593 §3.3 Fig.17d 상용 세리아 1.41 cP, 25°C).
      ⚠ H2O2 추가 세리아 슬러리의 점도를 **직접 재는 문헌은 미확보**다.
      H2O2는 저농도 수용액이라 점도를 크게 바꾸지 않을 것으로 보이나 근거가 없으므로,
      세리아 일반값의 전용이며 **이 전용 자체는 미검증**이다(노트 §4 한계 5).
    source: knowledge/materials/slurry-viscosity-rheology-literature-values.md §2 §4-5
    confidence: literature

  abrasive_ref_size_nm:
    source: "이 팩의 abrasive_size_nm 과 같은 출처 — 기준점은 독립 측정값이 아니라 '어느 조건에서 Kp 를 역산했는가'의 선언이다"
    value: 120.0
    unit: nm
    note: >
      κ 입경항 기준점 — 이 팩의 abrasive_size_nm(120 nm)과 일치시킨다.
      키가 없어 실리카 부모의 50 nm 를 상속하고 있었다
      (2026-09-13 model_hygiene 극한검사가 검출).
    confidence: literature

  abrasive_wt_pct:
    value: 4.0
    unit: "wt%"
    note: >
      이 팩의 근거 DOE(Wang et al. ACS SI Table S3) 중심 수준. 이전에는 키가 없어
      실리카 부모의 20 wt% 를 상속했는데, 그 값은 DOE 범위(2/4/6 wt%) 밖이고
      이 재료계의 근거가 아니다 — 기준점 4.0 과 5배 어긋나 기준조건에서 κ 농도항이
      0.52 로 눌려 있었다(2026-09-13 model_hygiene 검출). 근거 있는 쪽(기준점)을
      두고 근거 없는 쪽(본값)을 DOE 중심으로 맞춘다.
    source: "Wang et al. ACS SI Table S3 — DOE 중심 수준 (CeO2 2/4/6 wt%)"
    confidence: measured

  wafer_iep_ph:
    value: 4.9
    unit: pH
    note: >
      SiC 표면 등전점(1차 문헌 실측, 분산제 무첨가 조건, PCD·입도·점도 3중 정합).
      base(sti_ceria)에서 상속되던 실리카 산화막 IEP(2.5)는 SiC 표면이 아니라 다른
      막질(oxide_silica) 것이므로 이 팩 전용값을 명시적으로 선언한다(sim/factors.py
      _ph_ceria_window_term의 `pack.has_own("wafer_iep_ph")` 게이트 — 상속값으로는
      항이 조용히 스킵되고 있었다, 2026-09-13 COMPLETION-C4/UNWIRED abrasive_size_nm
      회차에서 발견). Singh, Jena, Besra, Bhattacharjee 2007(J. Nanoparticle Res. 9,
      797-806, DOI 10.1007/s11051-006-9121-6) Abstract: "the isoelectric point (iep)
      of SiC powder was pH_iep (4.9)".
      ⚠ 분말(나노입자) 실측이지 CMP로 깎는 단결정 웨이퍼 표면 실측이 아니다 — 표면
      산화막 특성이 유사하다고 가정한 전이(추정). 분산제 첨가 시 IEP가 3.6까지 이동한다는
      보고도 있어(같은 원문), 실제 CMP 슬러리(계면활성제 포함)에서는 이 값이 과대추정일
      수 있음. 폴리타입(원문 미명시 vs 팩의 4H-SiC)도 교차 적용.
    source: knowledge/cmp/sic-isoelectric-point-singh2006-jnr.md
    confidence: literature

  film_bulk_hardness_pa:
    value: 2.6e+10
    unit: Pa
    note: >
      4H-SiC 단결정의 나노압입 경도. 이 저장소에서 가장 단단한 막질이고, 그래서 같은 압력에서도 탄성 쪽에 깊이 머문다.
      ⚠ 이것은 **벌크** 경도이지 CMP 가 실제로 깎는 화학 변질층의 경도가 아니다.
      변질층 경도의 절대값은 공개 문헌에 없다(_knowledge_audit/mechanics.md 의
      최대 병목). 다만 변질층은 벌크보다 무르므로 H_surface ≤ H_bulk 이고,
      이 부등식이 한쪽 방향의 판정을 확정해 준다 — 접촉응력이 벌크 경도를
      넘으면 변질층에서는 더더욱 소성이다. 그 용도로만 쓴다
      (sim/regime_adapter.py::alpha_from_bulk_bound).
    source: "Nanoindentation of 4H-SiC single crystal — 보고 범위 24~28 GPa"
    confidence: literature

  # ── κ 입경 정점형 곡선 — 세리아 실측으로 재선언 (2026-09-13) ──────────
  # ⚠ 이 세 키는 조부모(oxide_silica)에서 상속되고 있었다. 상속값 정점 80 nm 는
  #   콜로이달 **실리카** 슬러리 값이라, 이 팩의 본값 120 nm 가 **감소 가지** 위에
  #   놓여 "세리아 입자를 키우면 MRR이 떨어진다"는 문헌과 반대 방향 예측을 하고
  #   있었다. 근거: knowledge/cmp/ceria-abrasive-size-mrr-peak-shift-vs-silica.md §1·§3
  abrasive_size_peak_nm:
    value: 163.0
    unit: nm
    note: >
      세리아 입경-MRR 정점. 근거·한계·등급은 sti_ceria.yaml 의 동일 키와 같다
      (Oh et al. 2010 MEE DOI 10.1016/j.mee.2010.07.040, 62/116/163/232 nm 중
      163 nm 최대 — 1차 전문 미확보, Wang et al. 2020 DOI 10.1177/0036850420982451
      2차 인용으로 확인, E5).
      ⚠ **교차막질 전이**: 근거 문헌 4편은 전부 SiO2/SiN 막이고 이 팩은 4H-SiC 다
      (EVIDENCE-RULES E4). 세리아+SiC 입경 1축 스윕 실측은 이번 회차에 확보하지
      못했다 — 미검증. 다만 상속값(실리카 연마입자 기준 80 nm)보다는 최소한
      **연마입자 종류가 일치**하므로 개선으로 판단해 채택한다. SiC+세리아 입경
      스윕이 나오면 즉시 교체한다.
    source: knowledge/cmp/ceria-abrasive-size-mrr-peak-shift-vs-silica.md §2 §5
    confidence: literature
  abrasive_size_exp_below_peak:
    value: 1.3333333333
    unit: dimensionless
    note: >
      압입 지배 d^(4/3). Bellahsene et al. 2025 (DOI 10.3390/nano15171366, MDPI OA,
      전문 확보) §2.1 Eq.(1) 메커니즘 폐형식. 상속을 끊고 명시 재선언
      (값은 부모와 동일하나 판단 주체를 이 팩으로 옮긴다).
      ⚠ 세리아·SiC 계 실측 재추정 없음 — 형식 전용, 미검증.
    source: knowledge/cmp/ceria-abrasive-size-mrr-peak-shift-vs-silica.md §3
    confidence: literature
  abrasive_size_exp_above_peak:
    value: -0.3333333333
    unit: dimensionless
    note: >
      표면적 지배 d^(-1/3). 근거·한계는 abrasive_size_exp_below_peak 와 동일.
      ⚠ 이 팩의 본값 120 nm 는 정점 163 nm 아래이므로 이 지수는 현재 기준조건에서
      발동하지 않는다(120 nm < 163 nm → below 가지). 입경 슬라이더를 163 nm 위로
      올렸을 때만 쓰인다.
    source: knowledge/cmp/ceria-abrasive-size-mrr-peak-shift-vs-silica.md §3
    confidence: literature

  ph_ref:
    value: 10.0
    unit: pH
    source: >
      이 팩의 slurry_ph 와 같은 출처 — 기준점은 독립 측정값이 아니라 "어느 조건에서
      Kp 를 역산했는가"의 선언이다. 부모(실리카 계열)의 5.5 를 상속하고 있었는데,
      막질 등전점을 자기선언해 pH 정전 창 항이 활성화되면서 기준 조건 배수가
      0.4877 로 어긋났다(2026-09-13 optimize_loop 검출). 이 팩의 운전 pH 와
      일치시켜 배수를 1.0 으로 복원한다 — 예측 형상은 불변이다.
      ⚠ 항을 **활성화**할 때도 기준점 동반 이동이 필요하다. 비활성 상태에서는
      기준점이 틀려도 증상이 없어 조용히 남는다.
    confidence: literature
  oxidizer_wt_pct:
    value: 4.0
    unit: "vol%"
    note: >
      이 팩의 기준 조성 산화제 농도 — H2O2 4 vol%. oxidizer_ref_wt_pct 와 짝을 이룬다.
      WARN 기준점(ref)은 있는데 본값이 없어서 산화제 항이 침묵했다 —
      0/3/6 wt% 에서 예측 MRR 이 완전히 동일했다(314.5698).
      override 로만 주입되는 축은 팩이 본값을 모르므로 상대항을 만들 수 없다.

      ⚠ 2026-09-16 정정: 이 값은 3.0 **wt%** 였고 출처가 `cu-cmp-ph-mechanism.md`
      (구리 계 노트)였다. 기준점(oxidizer_ref_wt_pct)은 4.0 **vol%**(이 팩의 근거
      DOE 중심점)인데 본값만 다른 재료계·다른 단위에서 와 있었다 — 상대항
      (c/c_ref)이 산화제 형상 파라미터가 없어 비활성이라 지금까지 드러나지
      않았을 뿐, 항을 켜는 순간 기준 조건에서 배수가 1.0 이 아니게 되어
      Kp 이중 계상이 된다. 기준점과 같은 출처 줄(Wang ACS SI Table S3 의 DOE
      중심점 H2O2 4 vol%)로 맞춘다. 같은 종류의 결함을 sic_alumina_kmno4 에서
      이미 한 번 고쳤다(그 파일 oxidizer_wt_pct note 참조).

      ⚠ 단위 불일치(키는 _wt_pct, 값은 vol%)는 의도된 표기다 — 기준점
      oxidizer_ref_wt_pct 와 **같은 근거**이므로 여기에도 그 근거를 남긴다:
      H2O2 30% 수용액 기준 vol%↔wt% 는 밀도차로 약 1.1배 어긋나 엄밀히 같지 않지만,
      χ 의 산화제 항과 Langmuir 항이 **기준 대비 비(c/c_ref)** 로만 이 값을 쓰므로
      같은 단위끼리 나눠 배수가 불변이다. 그래서 값을 환산하지 않고 단위만 정직하게
      표기한다. **절대 농도를 쓰는 항이 새로 생기면 그때 환산해야 한다** —
      그 항을 추가하는 커밋에서 본값·기준점을 동시에 wt% 로 옮겨라.
    source: >
      Wang et al., figshare:31056549 (ACS SI Table S3) — 4H-SiC 50조건 DOE 중심점
      (H2O2 2/4/6 vol% 중 4 vol%). 기준점 oxidizer_ref_wt_pct 와 같은 출처.
    confidence: measured

  # ── 산화제 형상 (χ 산화제축 배선, 2026-09-16) ─────────────────────
  # 이 키가 없어 sim/factors.py 가 "χ가 산화제 변화에 조용히 무반응"을 매 실행
  # 경고하고 있었다(죽은 축). 근거·유도·불확실성은 노트에 전부 있다:
  #   knowledge/cmp/sic-h2o2-oxidizer-saturation-alkaline-ceria.md
  # 이 팩이 실제로 쓰는 산화제 종. 아래 형상 상수(K)가 이 종에서 적합됐음을
  # 함께 선언해, 산화제를 바꾼 자식 팩이 곡선을 조용히 상속하지 못하게 막는다
  # (sim/chemistry.py::_oxidizer_species_gate_ok).
  oxidizer:
    value: H2O2
    source: >
      Wang et al., figshare:31056549 (ACS SI Table S3) — 4H-SiC DOE 의 산화제는
      과산화수소(2/4/6 vol%).
    confidence: measured
  oxidizer_langmuir_species:
    value: H2O2
    note: >
      oxidizer_langmuir_K 가 **어느 산화제 종의 데이터로 적합됐는지**의 선언.
      판정#47(착화제 종 게이트)과 같은 장치다 — 종이 다르면 형상을 전이하지 않는다.
    source: knowledge/cmp/sic-h2o2-oxidizer-saturation-alkaline-ceria.md
    confidence: measured

  oxidizer_langmuir_K:
    value: 0.76
    unit: "1/vol%"
    note: >
      촉진-포화형 Langmuir 피복 상수. f(C)=φ+(1-φ)·θ(C)/θ(C_ref),
      θ(C)=K·C/(1+K·C), φ=0.15(기계 하한 기본값), C_ref=4 vol%.
      이 팩의 근거 DOE 에서 **H2O2 만 다르고 CeO2·pH·압력·rpm 이 모두 같은
      18쌍**의 MRR 비를 로그 공간 최소자승으로 적합해 얻었다(자유 파라미터 K 하나).
      재현: 노트 §3 의 ```python verify``` 블록이 데이터셋을 직접 읽어 K=0.7600 을
      다시 계산하고 기준 1.0 계약·방향·잔차를 assert 한다.

      정합: (2→4) 실측 중앙값 1.096 vs 예측 1.203, (4→6) 1.127 vs 1.076,
      (2→6) 1.209 vs 1.295 — 모두 12 % 이내. 로그 잔차 rms 0.2724(=31.3 %)로 크다.

      ⚠ **estimated 인 이유**: 18쌍 부트스트랩(400회) K 의 2.5/50/97.5 백분위가
      0.320 / 0.797 / 2.697 로, 한 자릿수 수준에서만 결정된다.
      ⚠ **캘리브레이션 데이터에서 나왔다**(sic2026_ceria_h2o2_ph_DOE50,
      used_for_calibration: true). 이 항으로 그 데이터셋의 개선을 주장하지 않는다.
      ⚠ **외삽 금지**: 6 vol% 초과는 Wei 2026(DOI 10.3390/cryst16030179) §3.3 의
      ·OH 소광 구간이라 실제로는 꺾이는데 이 함수형은 계속 오른다.
      ⚠ 다른 산화제 종(KMnO4 등)으로 전이 금지 — 자식 팩 sic_alumina_kmno4 는
      일부러 상속시키지 않고 경고를 남겨 두었다.
    source: knowledge/cmp/sic-h2o2-oxidizer-saturation-alkaline-ceria.md
    confidence: estimated

