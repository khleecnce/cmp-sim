# 텅스텐 플러그 CMP — 이 파일은 "설계가 진짜인가"를 증명하려고 만들었다.
#
# 2026-09-06: 파라미터 팩 도입 직후, sim/ 의 파이썬 코드를 **한 줄도 건드리지 않고**
# 이 YAML 하나만 새로 써서 W CMP 시뮬레이션이 돌아가는지 확인했다. 돌아갔다.
# 그게 "그 내용만 바꾸면 각각 다른 시뮬레이션을 할수있도록" 지시의 수용 기준이었다.
base: base
description: "W plug CMP: Fe계 산화제 산성 슬러리, 알루미나 연마입자"

params:
  film:
    value: w
    confidence: verified
  abrasive:
    value: alumina
    source: knowledge/cmp/slurry-components-overview.md
    confidence: literature

  kp_m_per_pa:
    value: 2.8e-13
    unit: m^2/N
    note: >
      ⚠ 문헌 W MRR 범위(300~600 nm/min @ 3psi)에서 역산한 대표값. 미재현.
      W는 Fe(III)/H2O2 산화 후 기계적 제거라 산화막과 메커니즘이 다르다.
    source: knowledge/cmp/surface-chemistry-cu-w-pourbaix-passivation.md
    confidence: estimated

  slurry_ph:
    value: 2.5
    unit: pH
    note: 강산성 — Pourbaix상 W 산화물 용해 억제하며 부동태막 유지
    source: knowledge/cmp/surface-chemistry-cu-w-pourbaix-passivation.md
    confidence: literature
  # ── W 산성역 pH 항 (χ PARTIAL 해소, 2026-09-15) ────────────────────────────
  # pH 는 W 를 직접 깎지 않는다 — 산화(WO3 생성) 구동력을 통해서만 MRR 에 들어온다.
  # Nernst: W + 3H2O -> WO3 + 6H+ + 6e-,  E_rev = -0.119 - 0.059*pH
  # 이 키가 있어야 sim/factors.py::_ph_w_acidic_term 이 켜진다(산화제 없는 W 계는
  # 부호가 반대라 게이트가 필요하다 — 노트 §4 참조).
  ph_ref:
    value: 2.5
    unit: pH
    note: 이 팩의 기준 pH. 기준조건에서 pH 항이 정확히 1.0 이 되도록 slurry_ph 와 같다.
    source: knowledge/cmp/w-cmp-ph-acidic-oxidizer-mediated-stojadinovic.md
    confidence: literature
  w_ph_acid_k:
    value: 0.1163
    unit: 1/pH
    note: >-
      f(pH)=exp(-k*(pH-ph_ref)). Stojadinovic 2016 Table 1 (3% 실리카 12nm, KIO3
      4수준 고정, HCl 로 pH 만 5->2) 의 산화제 존재 3조건 MRR 비 1.429/1.533/1.300 을
      로그평균해 dpH=3 으로 나눈 값. 재현오차 -0.8/-7.6/+9.0 %.
      ⚠ 대리계다 — 원문 산화제는 KIO3, 이 팩은 Fe(NO3)3 (막질·pH영역·산화경로는 동일).
      ⚠ 2점 할선이라 pH 2~5 밖은 외삽. 알칼리역은 용해 지배로 부호가 반대(미모델링).
      ⚠ 3조건 개별 k 산포 0.0875~0.1426 (+-22%) — 지수형 가정 자체는 미검증.
      ⚠ 단위 불일치(의도됨, 환산하지 않는다): 접미사 `_k` 의 기본 해석은 온도 K 이지만
      이 키는 온도가 아니라 **지수 감쇠의 pH 역수 계수**(1/pH)다. exp() 의 지수는
      무차원이어야 하므로 (pH - ph_ref) [pH] 와 곱해질 때만 소거된다 — K 로 바꿔
      환산하면 오히려 차원이 깨진다. 이 값을 읽는 곳은 sim/factors.py 의 χ pH 항
      하나뿐이고(다른 모듈은 참조하지 않음) 그 항이 같은 pH 단위로 곱한다.
    source: knowledge/cmp/w-cmp-ph-acidic-oxidizer-mediated-stojadinovic.md
    confidence: literature
  oxidizer:
    value: Fe(NO3)3
    source: knowledge/cmp/slurry-components-overview.md
    confidence: literature
  # ── H2O2 산화제 항 (χ 활성화) — US20110186542A1 15조건에서 역산 (2026-09-09) ──
  # ⚠ 이 4개는 그 특허 실시예 표에서 뽑았으므로 그 데이터셋은 used_for_calibration: true.
  #   held-out 검증은 별도 문헌(US8070843B2, 3M Mirra 3400)으로만 한다.
  oxidizer_wt_pct:
    value: 3.0
    unit: "wt%"
    note: 이번 런의 H2O2 농도. Fe(III) 활성제와 공존하는 W 슬러리의 통상 상한 구간.
    source: papers/US20110186542A1.txt
    confidence: literature
  oxidizer_ref_wt_pct:
    value: 3.0
    unit: "wt%"
    note: 기준 농도 — 화학 배수 1.0. 실시예 표의 최고 농도(3 wt%)를 기준으로 상대화했다.
    source: papers/US20110186542A1.txt
    confidence: literature
  oxidizer_peak_wt_pct:
    value: 6.0
    unit: "wt%"
    note: >
      ⚠ 실측 3점(0/1/3 wt%)이 단조 증가라 정점을 직접 못 봤다. Kaufman 단봉을 0→1→3의
      상대비(0.14/0.63/1.0)에 격자 적합해 얻은 값(n=3, log-err 0.012). 3 wt% 위는 외삽.
      (비활성 — Langmuir 경로로 대체됨, 판정#19)
    source: papers/US20110186542A1.txt
    confidence: estimated
  oxidizer_curve_n:
    value: 3.0
    unit: "-"
    note: >
      위와 같은 적합에서. 현상론 형상 파라미터. [식별성 판정 2026-09-14, EVIDENCE-RULES 판정#19]
      등급 불변(estimated 유지) — 단 이 값은 잔차 최소해가 아니며, 애초에 식별 가능한 값이 아니다.
      정점(C_peak) 아래 관측만 있으면 (n, C_peak)는 완전축퇴해 n=0.5->C_peak=22.1 / n=2->41.1 /
      n=6->83.0 wt% 가 전부 문헌 상대비(1wt% 0.63, 3wt% 1.00)를 잔차 0으로 재현한다. 현 저장값
      (n=3, C_peak=6.0)은 1wt%에서 0.6373을 줘 관측 0.63 대비 +1.16% 어긋난다(같은 n=3의 잔차 0
      해는 C_peak=52.3). 값을 바꾸지 않는 이유: 어느 쪽도 근거가 없어 바꾸면 근거 없는 변경이 되고
      기존 백테스트 기준선만 흔들기 때문이다. 축퇴를 깨려면 C_peak의 2배 이상 농도 실측 1점이 필요.
      상세: knowledge/cmp/chi-oxidizer-curve-exponent-identifiability.md
      (비활성 — Langmuir 경로로 대체됨, 판정#19)
    source: papers/US20110186542A1.txt
    confidence: estimated
  oxidizer_langmuir_K:
    value: 0.549550
    unit: "1/wt%"
    note: >
      판정#19(chi-oxidizer-curve-exponent-identifiability.md)로 (n, C_peak) 형상이
      정점 아래 관측만으로는 완전축퇴(식별 불가)임이 확인됨에 따라, 식별 가능한
      1파라미터 Langmuir 표면피복 θ(C)=K·C/(1+K·C)로 대체한다.
      폐형식 유도: f(C) = φ + (1-φ)·θ(C)/θ(C_ref), φ=oxidizer_mech_floor=0.14,
      C_ref=3.0 wt%. f(1.0)=0.63 관측을 풀면 t=(0.63-φ)/(1-φ), K=(3t-1)/(3-3t)
      → K=0.549550 /wt%. 이 K로 세 관측점(US20110186542A1 실시예 표, 0/1/3 wt%
      상대비 0.14/0.63/1.00)이 전부 잔차 0.0000%로 재현된다: f(0)=0.140000,
      f(1)=0.630000, f(3)=1.000000. 기존 (n=3,C_peak=6.0) 저장값은 1wt%에서
      +1.16% 어긋났던 것과 대비된다. 자유 파라미터가 K 하나뿐이라 3관측점(사실상
      2자유도: φ, K)으로 완전히 식별된다 — n·C_peak 2파라미터 축퇴 문제가 없다.
    source: papers/US20110186542A1.txt
    confidence: literature
  oxidizer_mech_floor:
    value: 0.14
    unit: "-"
    note: >
      H2O2 0 wt%에서 남는 순수 기계 연마 분율(3 wt% 대비). 15조건 전부에서 0.117~0.189,
      평균 0.142. Kaufman 단봉은 C=0에서 0이라 이 바닥이 없으면 산화제 0 예측이 0이 된다.
    source: papers/US20110186542A1.txt
    confidence: literature
  abrasive_size_nm:
    value: 50.0
    unit: nm
    note: >
      Bielmann et al. 1999(ECS Solid-State Lett. 2(3) 148, DOI:10.1149/1.1390765) 실측 W CMP
      폴리싱 슬러리의 γ-알루미나 1차입자경("primary size ~50 nm diam"). 원래 후보였던 OSTI
      0.7μm(질산철 문구가 구리·석영유리 캡션에만 있고 텅스텐 캡션엔 없음, E5)과 Cabot v.
      Solution Technology 판례의 60nm(그 제품 화학성분은 질산이지 질산철이 아니고, boehmite+
      질산철 조합은 구리용 — 대상계 불일치로 기각)를 원문 대조 후 모두 기각하고, 계 근접도가
      가장 높은 이 1차 문헌으로 대체했다. 산화제가 K3Fe(CN)6(Fe(NO3)3 아님)라는 차이는 남음 —
      상세 근거는 노트 참조.
    source: knowledge/cmp/w-cmp-abrasive-d50-bielmann1999-osti-cabot-conflict.md
    confidence: literature

  abrasive_ref_size_nm:
    value: 50.0
    unit: nm
    note: >
      κ 입경항 기준점 — abrasive_size_nm과 같은 값(cu_h2o2_bta의 abrasive_ref_size_nm 패턴과 동일).
    source: knowledge/cmp/w-cmp-abrasive-d50-bielmann1999-osti-cabot-conflict.md
    confidence: literature
  abrasive_size_exponent:
    value: 0.0
    unit: "-"
    note: >
      **검증된 영(null) 결과** — cu_h2o2_bta와 독립적인 두 번째 계에서 확정.
      Egan & Kim 2019(ECS JSSTechnol. 8(5) P3206, DOI:10.1149/2.0311905jss, GLOBALFOUNDRIES W
      contact CMP 실제 양산 데이터) 초록: "tungsten removal rate is not affected by abrasive size".
      본문: "rate tests were done on multiple slurry samples with varying ranges of abrasive
      size. In each case, the rate was statistically comparable." 독립 2차 확증: Bouvet et al.
      2002(JVST B 20(4) 1556, DOI:10.1116/1.1490393) — 콜로이달 실리카 12-75nm(factor 6.25)
      범위에서 W 제거율이 "quite constant"(정량 범위 확인, 단 연마입자 종류는 실리카로 다름).
      두 독립 문헌이 같은 방향(입경 무반응)으로 수렴 — EVIDENCE-RULES.md 판정#6.
      ⚠ Egan&Kim은 정량 수치가 없어(서술적 결론) cu_h2o2_bta의 null 판정(Spearman ρ 정량 재검정 +
      Chen 이론 이중 지지)보다 근거가 약하다 — 향후 정량 데이터가 나오면 재검토 대상.
    source: knowledge/cmp/w-cmp-abrasive-size-null-result-egan-kim-2019.md
    confidence: literature

  # ── κ 농도항 (2026-09-12 정확도루프 — kappa PARTIAL 채움) ──────────
  abrasive_wt_pct:
    value: 10.0
    unit: "wt%"
    note: >
      Bielmann et al. 1999(같은 논문·같은 문장, 위 abrasive_size_nm과 동일 출처) —
      "The polishing slurries contained 10 wt % γ-alumina particles". 입경과 농도를
      같은 실험·같은 문장에서 동시 확보해 내적 정합성을 유지했다(다른 논문 조합 회피).
    source: knowledge/cmp/kappa-abrasive-concentration-cu-w-cooper-bielmann.md §4
    confidence: literature
  abrasive_ref_wt_pct:
    value: 10.0
    unit: "wt%"
    note: κ 농도항 기준점 — 이 실험 조건 자체(Bielmann 1999)를 기준으로 잡아 κ=1.0 계약 유지
    source: knowledge/cmp/kappa-abrasive-concentration-cu-w-cooper-bielmann.md §4
    confidence: literature
  abrasive_conc_exponent:
    value: 0.3333
    unit: "-"
    note: >
      Wang et al. 2012(ECS Trans. 41(43) 103-111, DOI:10.1149/1.4717508, Applied Materials
      Reflexion GT 실제 W CMP 실험)이 W 계에서 **직접** "the removal rate was observed to
      scale with the cubic root of the abrasive concentration"라고 명시(E1, 동일계 실측,
      Cooper 2002를 인용하며 W 데이터로 재확인). abrasive_wt_pct(Bielmann 1999)와는 다른
      논문 출처이나 둘 다 "W+알루미나+Fe계 산화제, 저농도 선형(collision-frequency) 레짐"
      동일 화학 패밀리 — 완전 단일 출처 DOE로 교체 전까지 유효.
      ⚠ 절대 wt% 스케일(x축 그래프 눈금)은 원문 텍스트에 없어 미확보. 지수값(1/3)만 채택.
    source: knowledge/cmp/kappa-abrasive-concentration-cu-w-cooper-bielmann.md §4
    confidence: literature

  # ── Δ 손상 유발도 (스크래치 위험) — 진단 전용, MRR에 곱해지지 않음 ──
  # ⚠ Egan & Kim 2019 §3.4: 텅스텐 벌크 CMP에서 대입자는 **MRR을 올리지 않고 스크래치만**
  #   늘린다("the rate does not increase … statistically comparable"). Δ와 κ의 분리 설계가
  #   이 팩에서 특히 물리적으로 옳다.
  abrasive_d99_nm:
    value: 250.0
    unit: nm
    note: >
      abrasive_size_nm(50 nm, Bielmann 1999 실측) × D99/D50 비율 5.00 = 250 nm.
      옛 근거(Silco/Levitronix 2008 일반비, 세리아 실측으로 재현 안 됨)로
      2026-09-14 EVIDENCE-RULES 판정#16이 estimated로 강등했었다.
      [등급 판정 2026-09-14, 재승격] estimated→literature. 새 근거: US7344988B2(DuPont
      Air Products Nanomaterials LLC, "Alumina abrasive for chemical mechanical
      polishing") — 화학종(알루미나)·용도("especially preferred for … copper and/or
      tungsten") 정확히 일치하는 1차 특허. post-milled D99.9 "more preferably less
      than **5 times**" D50 명세가 이 팩의 비율(250/50=5.00)과 정확히 일치. 값은
      바꾸지 않는다(항등적으로 동일 계산) — 근거만 알루미나 전용 1차 특허 스펙으로
      교체. ⚠ D99.9→D99 상한 근사(D99≤D99.9), 단일 실측 로트가 아니라 설계 스펙
      범위(cu_h2o2_bta와 동일 논거). Showa Denko US6770218B2 상한 0.5 µm, Remsen 2006
      스크래치 임계 680 nm 대조는 그대로 유지(정합적).
      상세: knowledge/cmp/abrasive-particle-size-distribution-d99-tail.md §2, §4.1, §5.
    source: knowledge/cmp/abrasive-particle-size-distribution-d99-tail.md §2, §4.1, knowledge/cmp/delta-scratch-damage-d99-oversize-particle-model.md §4.2
    confidence: literature
  abrasive_ref_d99_nm:
    value: 250.0
    unit: nm
    note: >
      기준 조건(Δ=1.0)의 기준점 — abrasive_d99_nm과 동일값으로 이중 계상 방지.
      [2026-09-14 재승격] abrasive_d99_nm과 동일 사유로 confidence를 literature로
      맞춘다(knowledge/cmp/abrasive-particle-size-distribution-d99-tail.md §4.1).
    source: knowledge/cmp/abrasive-particle-size-distribution-d99-tail.md §4.1
    confidence: literature
  damage_exponent:
    value: 2.54
    unit: "-"
    note: >
      Egan & Kim 2019(ECS JSS 8(5) P3206) 두 관측의 기하평균 √(3.73×1.73).
      막질·공정 완전 일치(텅스텐 벌크 CMP, 300mm 양산 라인 defect inspection 실측).
      ⚠ 각 관측이 n=1 단일 대응쌍이고 저자 서술이 반올림("sixty times", "85% reduction")이라
      정밀도는 낮다 — 순위만 신뢰.
    source: knowledge/cmp/delta-scratch-damage-d99-oversize-particle-model.md §4.3
    confidence: literature

  # ── psi 표면 보호도 (억제제) — Lee & Seo 2022(DOI:10.3390/app12031227) 재현 (2026-09-10) ──
  # ⚠ 정확도 루프 UNMODELED 갭 해결: w_fe_oxidizer는 이제껏 억제제 파라미터가 없어
  #   부식억제제를 넣어도 ψ(psi)가 계산 안 됐다. sim/chemistry.py::_inhibitor_term은
  #   BTA(cu_h2o2_bta)와 동일 함수를 그대로 재사용한다(함수는 범용, 화학종만 다름).
  inhibitor:
    value: picolinic_acid
    source: knowledge/cmp/w-cmp-picolinic-acid-inhibitor-langmuir-dissolution-suppression.md
    confidence: literature
  inhibitor_mM:
    value: 121.8
    unit: mM
    note: >
      1.5 wt% 피콜린산(포화 농도, 밀도 1 g/mL 근사)에 해당하는 몰농도. 원문 Lee & Seo(2022)
      3.3절에서 정지식각 90->11 A/min(8.2배 감소), CMP 제거율 120->85 A/min(1.41배 감소)의
      실측 포인트.
      [등급 판정 2026-09-14, EVIDENCE-RULES 판정#17] estimated→literature 승격.
