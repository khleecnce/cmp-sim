      환산하면 ρ=1.000 g/mL 기준 121.84 mM — 팩 값 121.8과 −0.03% 차이로 사실상 일치.
      희박수용액 영역이라 밀도를 0.995~1.010으로 흔들어도 몰농도는 121.23~123.06 mM
      (기준 대비 −0.5%~+1.0%)로만 움직여 ψ 계산에서 무시 가능. ⚠ `inhibitor_ref_mM`과
      값이 같아 이 팩의 ψ 배수는 현재 항상 1.0이다 — 이번 환산 정확도 확인은 **다른
      농도를 시뮬레이션할 때만** 실질적 의미를 갖는다. `inhibitor_ref_mM`은 기준점
      선택 문제(환산 문제 아님)라 confidence를 건드리지 않는다.
      상세: knowledge/cmp/bta-inhibitor-langmuir-K-effective-cu-cmp-falsification.md §8
