  inhibitor_strength_k:
    value: 2.117
    unit: "-"
    note: >
      정지식각 90->11 A/min(8.2배 감소, 1.5wt% 앵커) 역산값. Cu/BTA의 k=3.0(cu_h2o2_bta.yaml)과
      다른 화학종 전용 값.
      [등급 판정 2026-09-14, EVIDENCE-RULES 판정#24] unverified 유지(승격하지 않음). 사유:
      원문 Figure 4b를 픽셀 판독해 0.5wt% 실측 정지식각(≈55.7 A/10min, None≈89.7 대비 잔여율
      0.621)을 확보했다(기존 "정량값 없음" 기록을 정정). K=1108 L/mol(Table 1)+임의의 k로는
      1.5wt% 앵커(잔여율 0.134)를 만족시키며 동시에 0.5wt% 값(0.621)을 재현할 수 없다 — K→0
      극한(이론적 하한)에서도 예측 0.512로 실측 0.621에 17.6% 못 미친다. 즉 **k를 어떤 값으로
      바꿔도(심지어 K까지 자유롭게 풀어도) 이 불일치가 해소되지 않는다** — 약한 고리가 k
      단독이 아니라 Langmuir(n=1)+exp(-kθ) 함수형 자체의 구조적 한계(고농도 앵커에 맞추면
      저농도에서 과포화). 대체 폐형식(임계피복률 문턱·Frumkin 등온식 등)은 이 코퍼스에서
      확보하지 못해 코드 변경 없이 한계로만 기록. 판정#16과 달리(그쪽은 등급만 잘못 낮았던
      순수 하이진 결함) 여기는 정량 반증이 실재해 승격 불가.
      상세: knowledge/cmp/psi-inhibitor-strength-k-grade-ruling.md §A
    source: knowledge/cmp/psi-inhibitor-strength-k-grade-ruling.md
    confidence: unverified

