        source: "미검증 — Mu 2016은 폭과 피치를 동시에 바꿔 분리 불가(GFQ로만 보고)"
      - metric: planarization
        direction: unknown
        strength: weak
        source: "미검증 — 특허 '접촉면적·강성 균형 최적 GFQ 구간'은 실시예 한정(노트 §2)"
    engine_key: groove_pitch_mm
    status: pack_only

  # ───────────────────────── 10. 그루브 패턴 ─────────────────────────
  - key: groove_pattern
    label: "Groove pattern"
    range: {options: [concentric, xy_grid, radial, spiral, concentric_plus_radial, micro_pattern], unit: "enum"}
    range_source: >
      동심(K-groove, Kenchappa 상용)·나선(Kenchappa Pad-2) — pad-3dprinted-nonporous-lowdefect-review.md §5.1;
      방사 추가 R0/R8/R32 — Kim (SKKU/삼성) 2022 Appl. Sci. 12, 4339 (DOI 10.3390/app12094339);
      이산 마이크로패턴(원/타원/사각-원, DCA 5%) — Sadri Mofakham 2024 (DOI 10.1149/2162-8777/ad8fd3),
      pad-groove-cfd-micropattern-optimal-design.md.
    typical: concentric
    typical_source: "IC1000 K-groove — pad-structure-groove-subpad.md"
    affects:
      - metric: uniformity
        direction: "+"
        strength: strong
        source: "Kim 2022 (DOI 10.3390/app12094339): 방사 그루브 수 0→8→32에 300 mm NU 4.65→2.67→1.56% — pad-groove-geometry-contact-area-flow-resistance.md §3"
      - metric: mrr
        direction: "+"
        strength: medium
        source: "Sadri Mofakham 2024: 사각-원 패턴 ~1000 Å/min vs 원 745(+34%) — DICL이 지배 변수 — pad-groove-cfd-micropattern-optimal-design.md"
      - metric: defects
        direction: unknown
        strength: weak
        source: "미검증"
    status: not_wired

  # ───────────────────────── 11. 폴리싱층 두께 ─────────────────────────
  - key: top_pad_thickness_mm
    label: "Polishing layer thickness (mm)"
    range: {min: 0.64, max: 2.29, unit: "mm"}
    range_source: >
      US8066552B2(AMAT) 폴리싱층 30~90 mil(0.76~2.29 mm), US7654885B2 저압용 ≤25 mil(0.64 mm);
      IC1000 50 mil(1.27)/IC1010 80 mil(2.03) — pad-hardness-porosity-measurement-methods.md §1;
      US20120225612A1 통상 50~80 mil — pad-thickness-groove-depth-monitoring-replacement-economics.md §3.
    typical: 1.27
    typical_source: "IC1000 50 mil"
    affects:
      - metric: uniformity
        direction: "-"
        strength: medium
        source: "Lo & Lin 2005 (DOI 10.1016/j.jmatprotec.2005.01.010) FEM: T0 0.70→2.10 mm에 엣지 응력비 R 1.794→2.076(+15.7%, 엣지 과연마↑) — pad-subpad-stiffness-edge-nonuniformity.md §3"
      - metric: life
        direction: "+"
        strength: strong
        source: "US20120225612A1·Son & Lee 2021: 수명 = (초기 그루브 깊이/컷레이트) — 두께가 그루브 깊이 여유를 정함(pad-structure-groove-subpad.md §1)"
      - metric: planarization
        direction: unknown
        strength: weak
        source: "미검증 — 두께 단독 평탄화 실측 없음"
    status: not_wired

  # ───────────────────────── 12. 서브패드 강성 ─────────────────────────
  - key: subpad_hardness_shore_a
    label: "Subpad/backing hardness (Shore A)"
    range: {min: 1, max: 61, unit: "Shore A"}
    range_source: >
      Suba IV(PU 함침 폴리에스터 펠트, 50 mil) Shore A 약 61 — US8066552B2/US7654885B2 배경기술;
      AMAT 저압용 백킹 Shore A 1~10(청구항 4), ≤20(US7654885B2 청구항 6), 압축률 1~30% @0.5 psi.
      Lo & Lin 2005 등가 패드층 E0 1.15~3.43 MPa(적층 전체 등가) — pad-subpad-stiffness-edge-nonuniformity.md §2.
      Shore D 환산(근사): A 61 ≈ D 16, A 1~10 ≈ D <5 (EPS 환산표) — 폴리싱층 슬라이더(Shore D)의 <20 구간에 해당.
    typical: 61
    typical_source: "Suba IV — US8066552B2 배경기술"
    affects:
      - metric: uniformity
        direction: "-"
        strength: strong
        source: "US8066552B2: Suba IV(61A) 적층은 ≤1 psi에서 균일도 불량, 1~10A 백킹으로 두께 비균일 흡수. Lo & Lin 2005: 등가 E0↑→R↓(엣지 피크 완화, −6.5%)는 반대 방향 — 저압/고압 영역이 다름을 노트 §4가 지적. 강한 효과이나 부호는 압력 영역 의존."
      - metric: planarization
        direction: "+"
        strength: medium
        source: "US7654885B2 배경기술: 연질 백킹이 장거리 순응을 늘려 평탄화를 해침(경질 백킹=평탄화↑). 정량 미검증."
      - metric: mrr
        direction: unknown
        strength: weak
        source: "미검증"
    status: not_wired

  # ───────────────────────── 13. 표면 조도 / asperity 높이 스케일 ─────────────────────────
  - key: surface_roughness_ra_um
    label: "Conditioned surface roughness Ra (µm)"
    range: {min: 1.34, max: 8.05, unit: "µm"}
    range_source: >
      최소 1.34: Yang 2010 (DOI 10.1016/j.ijmachtools.2010.06.007) 70 µm 다이아 컨디셔너 — pad-3dprinted… §3.2;
      Kim & Kang 2011 1.8~2.0 µm(cvd-diamond-disk-patterned-grit-array.md §2).
      최대 8.05: Kwon 2013 (Tribol. Int. 67, 272, DOI 10.1016/j.triboint.2013.08.008) 17k 디스크 Ra 8.05(본문 7.89) —
      disk-design-pad-roughness-asperity-relation.md §2.1. 엔진은 GW 높이스케일 1/β=0.3 µm(추정치)로 표현.
    typical: 4.0
    typical_source: "3M Pysher 2010 설계지도 180~250 µm semi-sharp 군집 surface finish 4.1~4.2 µm — disk-design-pad-roughness-asperity-relation.md §2.2"
    affects:
      - metric: mrr
        direction: "+"
        strength: medium
        source: "Kwon 2013: Rpk↑=절삭율↑·MRR 상관(저자 명시); CR ∝ Rpk^0.85 — disk-design-cutrate-asperity-regeneration-model.md §2. ⚠ Yang 2010 솔리드 패드는 Ra↓(2.31→1.34)에 RR +20%로 반대 — 접촉면적 배분 차이"
      - metric: defects
        direction: "+"
        strength: strong
        source: "Yang 2010: Ra 2.31→1.34 µm에 스크래치/로트 5.36→1.69(−68%); Kwon 2013 거친 디스크→디브리·스크래치↑"
      - metric: stability
        direction: "-"
        strength: medium
        source: "Jeong 2024 (DOI 10.3390/ma17081817): 글레이징 = σz 4.51→3.2 µm 감소·접촉반경 2.5~4.5배 — pad-glazing-mechanism-mrr-decay.md §2 (조도 유지가 안정성)"
    engine_key: pad_height_beta_inv_m
    status: wired

  # ───────────────────────── 14. asperity 밀도 ─────────────────────────
  - key: asperity_density_per_mm2
    label: "Contacting asperity density (#/mm²)"
    range: {min: 42, max: 237, unit: "#/mm²"}
    range_source: >
      Sun 2009 학위논문(Univ. Arizona, hdl 10150/194898) 사파이어창 공초점 실측: D100/IC1000 × 디스크 A/B에서
      η_c 42~237 #/mm²; McAllister 2018 (DOI 10.1149/2.0271805jss) EHWA CVD 6/10 lbf에서 82/143 #/mm² —
      disk-design-pad-roughness-asperity-relation.md §2.3·§2.5. 엔진 팩값 1e11 /m² (=1e5 /mm²)는 GW 명목 asperity
      (접촉 여부 무관) 기준의 추정치(confidence estimated)라 단위 정의가 다름 — 직접 비교 금지.
    typical: 100
    typical_source: "Sun 2009 IC1000 k-groove 80~88 #/mm² (접촉 정점 밀도)"
    affects:
      - metric: mrr
        direction: "-"
        strength: medium
        source: "Sun 2009 p.306–308: 공격적 디스크는 η_c·A_f를 줄이지만 접촉당 압력↑로 MRR↑ — 즉 접촉밀도↑→MRR↓(같은 하중). 엔진 κ는 반대 부호(밀도↑→접촉면적↑→MRR↑, GW)로 구현 — 모순은 sim/factors.py notes로 보고할 것"
      - metric: uniformity
        direction: "+"
        strength: medium
        source: "Kenchappa 2021: asperity 높이분포 폭 8 µm(Pad-2) vs 30(상용) vs 130(Pad-1)이 압력 균일→평탄화·균일 — pad-3dprinted… §5.2"
      - metric: defects
        direction: unknown
        strength: weak
        source: "미검증"
    engine_key: asperity_density_per_m2
    status: wired

