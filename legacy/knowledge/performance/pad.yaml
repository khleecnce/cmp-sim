      Mu 2016 GFQ=W/P 0.200/0.333/0.429에 W 300/600/900 µm → P ≈ 1.5/1.8/2.1 mm —
      pad-groove-geometry-contact-area-flow-resistance.md §2 verify; 120 mil(3.05 mm) 피치 — base.yaml groove_pitch_mm.
