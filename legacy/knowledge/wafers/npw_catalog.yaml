# NPW(블랭킷 테스트 웨이퍼) 카탈로그 — CMP 평가용
#
# 왜 이 파일이 있나 (사용자 지시 2026-09-08):
#   "웨이퍼 초기 두께, TTV, Roughness 등 초기 값을 입력할 수 있도록. 웨이퍼 종류 고르는
#    항목에서 어떤 NPW인지 고를 수 있도록 해. 그리고 이 NPW 기준으로 CMP 퍼포먼스가 산출되도록."
#   "실시간 두께 변화 시각화 (웨이퍼 옆면을 보여줘서 웨이퍼 스택별로 연마가 어떻게 되는지)"
#
# 원칙
#   - 웨이퍼 종류를 고르면 **스택**이 정해지고, 스택의 각 층이 **어느 팩(knowledge/params/*.yaml)으로
#     연마되는지**가 정해진다. 팩이 막질을 소유하므로 pack 은 실존 팩 이름이어야 한다
#     (검증기가 ls knowledge/params 와 대조한다). 팩이 없는 층은 pack: null + pack_missing_reason.
#   - 스택은 위에서 아래로(연마되는 순서). 마지막 층(기판)은 stop: true — 실무에서 기판까지 깎지 않는다.
#   - **출처 없는 숫자 금지.** 값마다 source 를 단다. 모르면 range 생략 + "미검증".
#   - 이 파일은 sim/timeline.py 의 Layer(name, thickness_nm, pack, stop) 와 1:1 대응하도록
#     설계했다(§layer_transition_design 참조). UI는 wafers[].stack 을 그대로 Layer 목록으로 넘긴다.
#
# 초기값(initial) 공통 근거 — 기판(300 mm Si) 스펙
#   ⚠ SEMI M1 원문은 downloads.semi.org Cloudflare 봉쇄로 미확보(fabsim-agent-org 스킬·wafer.yaml과 동일 상황).
#     대신 SEMI M1 준거를 명시한 **벤더 스펙 2건**을 1차 근거로 쓴다:
#     [V1] WaferPro 300 mm prime polished wafer 제품 스펙(waferpro.com/product/12-inch-300mm-polished-silicon-wafer/,
#          2026-09-08 curl 확인): 두께 775±25 µm, TTV ≤3 µm, BOW ≤30 µm, WARP ≤30 µm, 표면 Ra ≤5 Å.
#     [V2] PAM-XIAMEN(powerwaywafer.com) 300 mm test-grade 스펙(2026-09-08 curl 확인):
#          두께 775±25 µm, TTV 5 µm, WARP 60 µm.
#     → prime(TTV≤3)와 test(TTV 5)의 차이가 곧 NPW 초기 TTV 범위다. 값은 µm 단위이며 nm로 환산해 적었다.
#   ⚠ 막 증착 후 bow 는 기판 bow + 막응력 기여(Stoney)다. 막응력 기여의 정량은 팩·증착 조건에 따라 달라
#     여기서는 **기판 bow 범위만** 적고 막응력 항은 미검증으로 남긴다.
#   Roughness 는 **스캔 크기와 함께**만 의미가 있다(knowledge/cmp/wafer-surface-roughness-afm-scan-scale-dependence.md §2).
#     각 값에 scan 필드를 병기한다. Rq(RMS)와 Ra 를 섞지 않는다 — 문헌이 준 것을 그대로 적고 종류를 표시한다.
#
# 스키마
#   wafers[].id                 식별자(소문자 스네이크)
#   wafers[].label              UI 표시명
#   wafers[].diameter_mm        문헌 실험 직경(200/300). base 팩은 300 mm 기준이므로 200 mm 문헌값을 옮길 때 주의
#   wafers[].purpose            무엇을 평가하는 웨이퍼인가
#   wafers[].stack[]            위→아래. layer/material/deposition/thickness_nm/pack/stop/(pack_missing_reason)
#   wafers[].initial            ttv_nm / roughness / bow_um — 각 {typical, range, kind, scan, source, confidence}
#   wafers[].source             이 스택이 표준 테스트 웨이퍼임을 보여주는 문헌/특허
#   wafers[].status             catalog_ok | pack_missing(첫 층 팩 없음 → 시뮬 불가, UI에 dead 배지)

version: 1
owner: wafer-type
substrate_defaults:
  diameter_mm: 300
  thickness_um: {typical: 775, range: [750, 800], source: "[V1][V2] 775±25 µm (SEMI M1 준거 벤더 스펙)", confidence: literature}
  ttv_nm: {typical: 3000, range: [1000, 5000], source: "[V1] prime TTV ≤3 µm, [V2] test TTV 5 µm", confidence: literature,
           note: "하한 1 µm는 벤더 스펙에 없다 — 첨단 prime이 그 아래로 내려간다는 정성 지식뿐이라 ⚠미검증. 보수적으로 1 µm를 하한으로 둔다."}
  bow_um: {typical: 10, range: [-30, 30], source: "[V1] BOW ≤30 µm(부호 없는 스펙 → ±로 해석)", confidence: literature,
           note: "typical 10 µm는 스펙 절반 이하라는 추정이지 실측 분포가 아니다 ⚠미검증"}
  warp_um: {range: [0, 60], source: "[V1] WARP ≤30 µm(prime), [V2] 60 µm(test)", confidence: literature}
  substrate_roughness: {typical_ra_nm: 0.2, range_ra_nm: [0.1, 0.5], kind: Ra, scan: "벤더 스펙(스캔 크기 미표기)",
                        source: "[V1] Ra ≤5 Å; Si 웨이퍼 500 nm FOV AFM RMS 0.11 nm (Sci. Rep. 9, 2019, doi:10.1038/s41598-018-36991-z, 초록 확인)",
                        confidence: literature}

wafers:

  # ═══════════════════════════════ OXIDE ═══════════════════════════════
  - id: teos_1um_si
    label: "PE-TEOS 1.0 µm / Si"
    diameter_mm: 300
    purpose: "ILD oxide CMP 기본 평가 — 실리카 슬러리 Kp·WIWNU 기준선"
    status: catalog_ok
    stack:
      - layer: TEOS
        material: oxide
        deposition: teos_pecvd
        thickness_nm: 1000
        pack: oxide_silica
        stop: false
      - layer: Si
        material: si
        thickness_nm: 775000
        pack: null
        pack_missing_reason: "기판. 실무에서 산화막 CMP는 기판을 노출시키지 않는다 — 노출 시 즉시 정지"
        stop: true
    initial:
      film_thickness_nm: {typical: 1000, range: [700, 2000],
        source: "Wei 2010 (Micron, WMED, doi:10.1109/wmed.2010.5453755) Table I PECVD-TEOS 700 nm 300 mm 샘플; US7351662 PETEOS 15,000 Å 200 mm(Advantiv) — knowledge/materials/film-oxide-teos-hdp-bpsg-sod-density-hardness.md §3",
        confidence: literature}
      ttv_nm: {typical: 3000, range: [1000, 5000], source: "substrate_defaults.ttv_nm ([V1][V2])", confidence: literature}
      roughness: {typical_nm: 0.4, range_nm: [0.2, 0.5], kind: Rq, scan: "1×1 µm 및 10×10 µm AFM",
        source: "GINECHIP TEOS oxide wafer 스펙 'RMS < 0.5 nm for both PECVD and LPCVD films' (ginechip.com, 벤더 자료, 2026-09-08 검색 스니펫 확인) — ⚠ 2차/벤더, 학술 1차 미확보",
        confidence: unverified}
      bow_um: {typical: 10, range: [-30, 30], source: "substrate_defaults.bow_um — PECVD TEOS 막응력 기여는 ⚠미검증", confidence: unverified}
    source: >
      Lee & Boning/Oji thesis (MIT 1999, dspace 1721.1/80109)가 blanket LPCVD TEOS 를 균일도 실험 원형으로 사용
      (knowledge/cmp/npw-ptw-test-wafer-fundamentals.md §1, 1차). US7351662 (DuPont Air Products) 실시예:
      "PETEOS 200 mm wafers ... film thickness specification 15,000 Å" (trea.com 전문, 2026-09-08 확인).
      EP3689988B1 (Versum) 실시예: "PECVD or LECVD or HD TEOS blanket wafers ... purchased from Silicon Valley Microelectronics".

  - id: peteos_1p5um_si_200mm
    label: "PE-TEOS 1.5 µm / Si (200 mm, 특허 실시예 사양)"
    diameter_mm: 200
    purpose: "STI/ILD 슬러리 특허 실시예 재현용 — 200 mm 문헌 데이터(mariscal2020 등) 대조"
    status: catalog_ok
    stack:
      - layer: PETEOS
        material: oxide
        deposition: teos_pecvd
        thickness_nm: 1500
        pack: sti_ceria
        stop: false
      - layer: Si
        material: si
        thickness_nm: 725000
        pack: null
        pack_missing_reason: "기판"
        stop: true
    initial:
      film_thickness_nm: {typical: 1500, range: [1500, 1500], source: "US7351662: 'PETEOS film thickness specification for these wafers is 15,000 Å' (200 mm, Advantiv)", confidence: literature}
      substrate_thickness_um: {typical: 725, source: "[V1] 200 mm 725±20 µm", confidence: literature}
      ttv_nm: {typical: 3000, range: [1000, 5000], source: "substrate_defaults ([V1][V2]는 300 mm 스펙 — 200 mm는 통상 더 느슨하다는 정성 지식뿐 ⚠)", confidence: unverified}
      roughness: {typical_nm: 0.4, range_nm: [0.2, 0.5], kind: Rq, scan: "1×1 µm AFM", source: "teos_1um_si 와 동일(벤더, 2차)", confidence: unverified}
      bow_um: {range: [-30, 30], source: "substrate_defaults", confidence: unverified}
    source: >
      US7351662 실시예(위). validation/datasets/mariscal2020_peteos_ceria_pressure_velocity_3x3.yaml —
      Mariscal et al. 2020 (ECS JSS 9 044008, doi:10.1149/2162-8777/ab89bc) "PETEOS-based SiO2 blanket wafers", 200 mm.
      ⚠ Mariscal 논문의 막두께는 데이터셋 노트에 없어 US7351662 사양(15 kÅ)을 대표값으로 썼다.

  - id: hdp_oxide_700nm_si
    label: "HDP oxide 0.7 µm / Si"
    diameter_mm: 200
    purpose: "STI 매립 산화막 CMP — 세리아 슬러리 제거율·패드 경도 평가 (kenchappa2021 재현)"
    status: catalog_ok
    stack:
      - layer: HDP_SiO2
        material: oxide
        deposition: hdp_cvd
        thickness_nm: 700
        pack: sti_ceria
        stop: false
      - layer: Si
        material: si
        thickness_nm: 725000
        pack: null
        pack_missing_reason: "기판"
        stop: true
    initial:
      film_thickness_nm: {typical: 700, range: [500, 1000],
        source: "Wei 2010 Table I HDP 700 nm(300 mm); Kenchappa 2021 (ECS JSS 10 014008, doi:10.1149/2162-8777/abdc40) blanket HDP oxide 200 mm — 두께 본문 미기재라 Wei 값을 씀 ⚠",
        confidence: literature}
      ttv_nm: {typical: 3000, range: [1000, 5000], source: "substrate_defaults", confidence: literature}
      roughness: {kind: Rq, source: "HDP as-deposited 조도 1차 문헌 미확보 — ⚠미검증. TEOS와 같은 서브nm대라는 정성 지식만", confidence: unverified}
      bow_um: {range: [-30, 30], source: "substrate_defaults. HDP는 압축응력(−100~−300 MPa, ninescrolls.com 기술블로그 2차)이라 bow가 음(convex)으로 이동 — 정량 ⚠미검증", confidence: unverified}
    source: >
      Kenchappa et al. 2021 — "polishing experiments were performed with blanket High-Density Plasma deposited
      silicon dioxide [oxide] wafers" (papers/kenchappa2021-soft-pad-oxide-cmp-jss.txt, 1차 전문 확인).
      validation/datasets/kenchappa2021_softpad_hdp_oxide.yaml.

  - id: thermal_oxide_1um_si
    label: "Thermal SiO2 1.0 µm / Si"
    diameter_mm: 300
    purpose: "가장 치밀한 산화막 기준선 — 슬러리 화학(pH·Ce3+) 평가 (li2021, netzband2020 재현)"
    status: catalog_ok
    stack:
      - layer: thermal_SiO2
        material: oxide
        deposition: thermal_oxide
        thickness_nm: 1000
        pack: oxide_silica
        stop: false
      - layer: Si
        material: si
        thickness_nm: 775000
        pack: null
        pack_missing_reason: "기판"
        stop: true
    initial:
      film_thickness_nm: {typical: 1000, range: [300, 1300],
        source: "Li 2021 (ECS JSS 10 123008, doi:10.1149/2162-8777/ac3e44): 열산화 SiO2 1.3 µm, 300 mm, SKW (validation/datasets/li2021_oxide_silica_ph.yaml 주석); Netzband 2020 열산화막 쿠폰(두께 미기재)",
        confidence: literature}
      ttv_nm: {typical: 3000, range: [1000, 5000], source: "substrate_defaults", confidence: literature}
      roughness: {typical_nm: 0.15, range_nm: [0.1, 0.3], kind: Rq, scan: "500 nm FOV AFM (기판 값)",
        source: "열산화막은 기판 표면을 그대로 복제한다(정성). 기판: Sci. Rep. 2019 RMS 0.11 nm(500 nm FOV); [V1] Ra ≤5 Å. ⚠ 열산화막 자체의 as-grown Rq 1차 수치는 미확보 — 기판값 대용, 미검증",
        confidence: unverified}
      bow_um: {range: [-30, 30], source: "substrate_defaults. 열산화막은 압축응력(~−300 MPa 교과서값, 1차 미확보 ⚠)", confidence: unverified}
    source: >
      Li et al. 2021 실험 웨이퍼 사양(열산화 1.3 µm/300 mm/SKW) — papers/slurry-additives-cmp-oxide-ac3e44.pdf.
      Netzband & Dunn 2020 (ECS JSS 9 044001, doi:10.1149/2162-8777/ab8393) "wafers of thermal oxide or PECVD nitride on silicon"
      (papers/netzband2020-jss-ceria-oxidation-state-oxide-cmp.pdf 1차 전문 확인).
      ⚠ oxide_silica 팩의 Kp는 STI 문헌점에서 캘리브레이션됐고 열산화막은 TEOS보다 치밀해 느리게 깎인다
      (knowledge/materials/film-oxide-teos-hdp-bpsg-sod-density-hardness.md) — 막종류별 Kp 분리는 미구현.

  # ═══════════════════════════════ NITRIDE (정지층 평가) ═══════════════════════════════
  - id: sin_300nm_oxide_si
    label: "SiN 0.3 µm / pad-oxide / Si (STI stop 선택비 평가)"
    diameter_mm: 200
    purpose: "STI 정지층 자체의 제거율 측정 → oxide:nitride 선택비 분모. sti_ceria 팩 oxide_nitride_selectivity 검증 대상"
    status: pack_missing
    stack:
      - layer: SiN
        material: nitride
        deposition: lpcvd_or_pecvd
        thickness_nm: 300
        pack: null
        pack_missing_reason: "nitride 전용 팩 없음(film-nitride 에이전트 대기). 현재는 sti_ceria.oxide_nitride_selectivity=60 으로 oxide MRR/60 근사만 가능 — sim/timeline.py transitional_mrr() 경로"
        stop: false
      - layer: pad_oxide
        material: oxide
        deposition: thermal_oxide
        thickness_nm: 10
        pack: oxide_silica
        stop: false
      - layer: Si
        material: si
        thickness_nm: 725000
        pack: null
        pack_missing_reason: "기판"
        stop: true
    initial:
      film_thickness_nm: {typical: 300, range: [100, 300],
        source: "US7351662: 'silicon nitride film thickness specification for these wafers is 3,000 Å' (SVM, 200 mm); Ranaweera 2019 (ECS JSS 8 P3001, doi:10.1149/2.0021905jss) Si3N4 ~300 nm on 200 mm Si",
        confidence: literature}
      pad_oxide_note: "pad oxide 10 nm는 STI 통합 구조의 관행값이며 블랭킷 SiN 테스트 웨이퍼에 반드시 있는 층은 아니다 ⚠미검증(문헌 사양은 'SiN on Si'만 명시)"
      ttv_nm: {typical: 3000, range: [1000, 5000], source: "substrate_defaults", confidence: literature}
      roughness: {typical_nm: 0.4, range_nm: [0.2, 0.6], kind: Rq, scan: "5~10 µm AFM",
        source: "LPCVD Si3N4 RMS 0.39 nm (arXiv 2411.01724, 2024, 스니펫 확인); 저온 PECVD SiN 최적 RMS 0.58 nm (J. Appl. Phys. 126 115302, 2019, 초록) — 광도파로용 막이라 CMP 테스트 웨이퍼와 증착 조건 다를 수 있음 ⚠",
        confidence: unverified}
      bow_um: {range: [-30, 30], source: "substrate_defaults. LPCVD SiN은 강한 인장응력(~1 GPa 교과서값, 1차 미확보 ⚠) → 300 nm에서도 bow 수십 µm 가능", confidence: unverified}
    source: >
      Dandu Veera, Peddeti, Babu 2009 (JES 156 H936, doi:10.1149/1.3230624) "RRs of blanket silicon dioxide and silicon
      nitride films" — nitride ~80 nm/min vs oxide ~350 nm/min (validation/datasets/dandu2009_sio2_ceria_ph_sweep.yaml 주석).
      Mariscal 2020 제목 자체가 "SiO2 and Si3N4 Polishing for STI CMP on Blanket and Patterned Wafers".
      EP3689988B1 "SiN blanket wafers were polished at baseline conditions".

  # ═══════════════════════════════ POLY-Si ═══════════════════════════════
  - id: poly_2um_oxide_si
    label: "poly-Si 2.0 µm / thermal oxide / Si"
    diameter_mm: 200
    purpose: "게이트/MEMS poly CMP — poly:oxide 선택비, 정지층=oxide"
    status: pack_missing
    stack:
      - layer: poly_Si
        material: poly_si
        deposition: lpcvd
        thickness_nm: 2000
        pack: null
        pack_missing_reason: "poly-Si 팩 없음(film-poly-si 에이전트 대기). 제거율 문헌: undoped/P-doped 200/250 nm/min (Dandu & Babu, amines/amino acids 논문 초록) — 팩 작성 시 근거"
        stop: false
      - layer: thermal_SiO2
        material: oxide
        deposition: thermal_oxide
        thickness_nm: 100
        pack: oxide_silica
        stop: false
      - layer: Si
        material: si
        thickness_nm: 725000
        pack: null
        pack_missing_reason: "기판"
        stop: true
    initial:
      film_thickness_nm: {typical: 2000, range: [500, 2000],
        source: "Langmuir 2011 (doi:10.1021/la104257k) 'Blanket poly-Si wafers (2000 nm thick, LPCVD at ~610 °C) ... DK Nanotechnology'(초록 스니펫); PolyMUMPs Poly0 500 nm(MEMS 관행)",
        confidence: literature}
      oxide_under_note: "하지 열산화막 100 nm는 la104257k 스니펫 'Thermal oxide ...'가 별도 웨이퍼인지 하지층인지 불명 — ⚠미검증 관행값"
      ttv_nm: {typical: 3000, range: [1000, 5000], source: "substrate_defaults", confidence: literature}
      roughness: {typical_nm: 1.5, range_nm: [1.0, 2.5], kind: Rq, scan: "1×1 µm AFM",
        source: "MEMSnet 물성표: LPCVD n+ poly RMS 1.45 nm @1×1 µm (J. Mater. Res. 12(1) 1997 p.60), 1.07 nm @500×500 nm; JVST A 25(4) 1034 (2007) 'as-deposited LPCVD polysilicon ~2.3 nm rms'(초록). ⚠ 610 °C 완전결정화 두꺼운 막은 71 nm RMS까지 보고(Microsyst. Nanoeng. 2024) — 증착 온도 의존 큼",
        confidence: literature}
      bow_um: {range: [-30, 30], source: "substrate_defaults. LPCVD poly 내부응력 −0.18 GPa(MEMSnet, Sens. Act. 20 1989) → 2 µm에서 bow 기여 있음, 정량 ⚠미검증", confidence: unverified}
    source: >
      Langmuir 27 (2011) doi:10.1021/la104257k (Babu 그룹, PDADMAC 선택 poly-Si CMP) 실험 웨이퍼 사양(초록 스니펫, 원문 미확보).
      knowledge/cmp/npw-ptw-test-wafer-fundamentals.md §1 "MEMS 구조 CMP 특성화에 블랭킷 폴리실리콘 사용"(2차).

  # ═══════════════════════════════ METAL ═══════════════════════════════
  - id: cu_ecd_1um_tan_teos_si
