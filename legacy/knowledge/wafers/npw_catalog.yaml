# ══════════════════════════════════════════════════════════════════════════════════════
# 층 전이 설계 제안 (구현 아님 — 데이터 구조만)
# ══════════════════════════════════════════════════════════════════════════════════════
layer_transition_design:
  현재_상태: >
    sim/timeline.py 가 이미 반경별 시간 스텝 루프를 갖고 있다. 층 i 가 어떤 반경에서 소진되면 그 반경만
    층 i+1 로 넘어가고, 층 i+1 에 pack 이 없으면 transitional_mrr() 이 이전 층 팩의
    `oxide_nitride_selectivity` 하나를 고정 키로 찾아 MRR/sel 로 근사한다. 세 가지 결함이 있다:
    (a) 선택비 키가 oxide→nitride 하나로 하드코딩돼 Cu→Ta, W→TiN, poly→oxide 전이를 표현할 수 없다.
    (b) 선택비의 방향(어느 팩이 어느 막을 깎을 때의 비인지)이 데이터에 없다.
    (c) 전이가 즉시 전환이라 혼합 접촉 구간(같은 반경 격자 안에 두 층이 동시 노출)이 없다.
    (d) **실측 확인된 버그(2026-09-08, tools/check_npw_catalog.py 실행):** hdp_oxide_700nm_si 를 돌리면
        "층 'Si'에 팩이 없어 이전 층 팩의 oxide_nitride_selectivity=60로 MRR/60 근사" 노트가 뜬다.
        루프가 `transitional_mrr(li, li+1)` 을 `layers[li+1].stop` 검사보다 먼저 호출해 **기판(Si)에
        oxide:nitride 선택비를 적용**한다. stop 덕에 실제로 깎이진 않지만 노트가 거짓이고, 선택비가
        막질을 묻지 않는다는 (b)의 증거다. 제안 2의 material 키 조회로 고쳐지며, stop 층은 조회 전에 걸러야 한다.
  제안_1_팩에_선택비_테이블: >
    팩(knowledge/params/*.yaml)의 params 에 `selectivity_vs:` 맵을 둔다. 팩이 자기 주 막질(film) 대비
    **다른 막질을 얼마나 느리게 깎는지**를 소유한다 — 선택비는 슬러리의 성질이므로 팩이 소유자다.
      sti_ceria.params.selectivity_vs:
        nitride: {value: 60, source: "Hwang 2024 59~80 하단", confidence: literature}
        poly_si: {value: null, confidence: unverified}
      cu_h2o2_bta.params.selectivity_vs:
        ta:      {value: null, note: "Cu bulk 슬러리는 Ta를 거의 못 깎는다(정성) — 미검증이면 null"}
        oxide:   {value: null}
      w_fe_oxidizer.params.selectivity_vs:
        tin:     {value: null, note: "US8070843B2 'clear including Ti and TiN' — 깎이긴 하나 비율 미기재"}
    기존 `oxide_nitride_selectivity` 는 `selectivity_vs.nitride` 의 별칭으로 남겨 하위 호환한다.
  제안_2_층_MRR_해석_규칙: >
    timeline 이 층 L 의 MRR(r)을 정할 때 아래 순서로 해석하고, 어느 경로였는지 frame.notes 에 남긴다:
      1. L.pack 이 있으면 그 팩으로 simulate() — 정식 모델.
      2. 없으면, **직전 층의 팩** P 에서 selectivity_vs[L.material] 을 찾는다.
         있으면 MRR_L(r) = MRR_prev(r) / sel, status='selectivity_approx'.
      3. 그것도 없으면 그 반경은 정지(status='no_model'). 지어내지 않는다 — 현재 동작 유지.
    핵심은 "직전 층의 팩"이다: 실무에서 TEOS를 깎던 세리아 슬러리가 SiN을 만나면 슬러리는 그대로이고
    막만 바뀐다. 따라서 전이 후 MRR은 '새 층의 팩'이 아니라 '**같은 슬러리의 새 막에 대한 선택비**'다.
    2단계 CMP(Cu clear 후 배리어 슬러리 교체)는 별개 문제이며, 이는 레시피 steps 로 팩을 바꾸는 것이지
    스택 전이가 아니다 — 카탈로그의 Ta 층에 pack: null 을 둔 이유.
  제안_3_혼합_접촉_구간: >
    반경 격자 한 칸 안에서도 WIWNU·조도 때문에 두 층이 동시에 노출된다. 즉시 전환 대신 노출 분율 f_L(r)
    가중 평균을 쓴다: MRR(r) = Σ f_L(r)·MRR_L(r). f 는 층 잔량이 0에 가까워질 때 초기 TTV·조도 스케일
    (initial.ttv_nm, roughness)을 폭으로 하는 로지스틱으로 0→1 전이시키면 초기값 입력이 결과에 실제로
    반응한다(사용자 지시 "이 NPW 기준으로 CMP 퍼포먼스가 산출되도록"의 연결 통로). 폭 파라미터는
    문헌 폐형식이 없으므로 confidence: unverified 로 팩이 아니라 카탈로그 wafer.initial 에서 가져온다.
  제안_4_초기값의_엔진_연결: >
    - initial.ttv_nm → 층 두께를 반경별로 흔든다: thickness(r) = thickness_nm + ttv_profile(r), 프로파일
      형태(선형 웨지 / 중심 두꺼움)는 UI 선택. 이러면 "반경마다 전이 시점이 다르다"가 초기 TTV 에도 반응한다.
    - initial.roughness → 제안 3 의 전이 폭 하한.
    - initial.bow_um → 현재 엔진에 압력분포↔bow 연결 없음. `status: unmodeled` 로 결과 notes 에 명시하고
      값은 받아 저장만 한다(거짓 연결 금지).
  데이터_구조_요약: >
    catalog.wafers[].stack[] (layer, material, thickness_nm, pack, stop) → sim.timeline.Layer 로 1:1 매핑.
    material 필드가 새로 필요하다 — 선택비 조회 키가 layer 이름("SiN")이 아니라 막질("nitride")이어야
    팩의 selectivity_vs 와 맞물린다. Layer 데이터클래스에 material: str 추가 제안(코드 변경은 트랙 B).
  검증_계약: >
    - 팩 selectivity_vs 값에 source/confidence 필수(test_every_param_carries_a_source 확장).
    - 카탈로그 stack[].pack ∈ ls knowledge/params (이 파일 검증 스크립트).
    - selectivity_approx 경로로 깎인 층이 있으면 WaferResult/Timeline notes 에 ⚠ 반드시 실린다.
