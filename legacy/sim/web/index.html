<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FabSim</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--fg:#e6edf3;--dim:#8b949e;
      --ok:#7ee787;--src:#79c0ff;--warn:#f0883e;--bad:#f85149;--acc:#58a6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:12px}
h1{font-size:17px;margin:0}
.sub{color:var(--dim);font-size:12px}
main{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 52px)}
aside{border-right:1px solid var(--line);padding:16px;overflow-y:auto}
section{padding:18px 22px;overflow-y:auto}
label{display:block;font-size:12px;color:var(--dim);margin:12px 0 4px}
select,input{width:100%;background:var(--panel);color:var(--fg);border:1px solid var(--line);
             border-radius:6px;padding:6px 8px;font-size:13px}
input[type=range]{padding:0}
button{background:var(--acc);color:#04101f;border:0;border-radius:6px;padding:9px 14px;
       font-weight:600;cursor:pointer;width:100%;font-size:14px}
button:disabled{opacity:.5;cursor:wait}
.pipe{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:8px}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px}
.slot h3{font-size:12px;margin:0 0 2px}
.slot .own{font-size:10.5px;color:var(--dim);margin-bottom:8px}
.opt{display:flex;gap:6px;align-items:flex-start;padding:5px 0;cursor:pointer;font-size:12px}
.opt input{width:auto;margin-top:2px}
.dot{font-size:10px}
.verified{color:var(--ok)}.sourced{color:var(--src)}.warn{color:var(--warn)}.unsourced{color:var(--bad)}
.meta{font-size:10.5px;color:var(--dim);padding-left:18px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:16px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
.kpi .v{font-size:22px;font-weight:650}
.kpi .k{font-size:11px;color:var(--dim)}
.kpi .u{font-size:11px;color:var(--dim)}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.note{background:#1c1408;border:1px solid #4a3510;border-radius:8px;padding:10px 12px;
      font-size:12.5px;margin-top:6px}
.info{background:#0d1b2a;border:1px solid #1c3a5e;border-radius:8px;padding:10px 12px;
      font-size:12.5px;margin-top:12px;color:#a5c9ea}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td,th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--dim);font-weight:500}
svg{background:var(--panel);border:1px solid var(--line);border-radius:8px}
.err{color:var(--bad);padding:10px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{padding:8px 16px;cursor:pointer;border-bottom:2px solid transparent;font-size:13px;color:var(--dim)}
.tab.on{color:var(--fg);border-bottom-color:var(--acc)}
.cgroup{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.cgroup h4{margin:0 0 2px;font-size:13px}
.cgroup .why{font-size:11.5px;color:var(--dim);margin-bottom:8px}
.crow{display:grid;grid-template-columns:1fr 140px;gap:8px;align-items:center;padding:4px 0;
      border-top:1px solid #21262d}
.crow:first-of-type{border-top:0}
.crow .lab{font-size:12.5px}
.crow .st{font-size:10px;padding:1px 5px;border-radius:3px;margin-left:6px}
.st.wired{background:#132d1a;color:var(--ok)}
.st.partial{background:#2d2410;color:var(--warn)}
.st.not_wired{background:#25292f;color:var(--dim)}
.crow input,.crow select{padding:4px 6px;font-size:12px}
.badge-user{font-size:10px;background:#1d2a3d;color:var(--src);padding:1px 6px;border-radius:3px}
.badge-res{font-size:10px;background:#2a2438;color:#c9a4ff;padding:1px 6px;border-radius:3px}
.cnote{font-size:11px;color:var(--dim);padding:2px 0 4px}
</style></head>
<body>
<header><h1>FabSim</h1><span class="sub">CMP 시뮬레이터 — 물리 모델을 갈아끼운다</span>
<span class="sub" id="ver" style="margin-left:auto"></span></header>
<main>
<aside>
  <label>물성 팩</label><select id="pack"></select>
  <div class="sub" id="packdesc" style="margin-top:4px"></div>
  <label>웨이퍼</label><select id="wafer"><option>NPW</option><option>PTW</option></select>
  <label>압력 <span id="pv">3.0</span> psi</label>
  <input type="range" id="press" min="0.5" max="8" step="0.1" value="3">
  <label>웨이퍼 <span id="rwv">60</span> rpm</label>
  <input type="range" id="rw" min="10" max="150" step="5" value="60">
  <label>플래튼 <span id="rpv">55</span> rpm</label>
  <input type="range" id="rp" min="10" max="150" step="5" value="55">
  <label>시간 <span id="tv">60</span> s</label>
  <input type="range" id="time" min="5" max="300" step="5" value="60">
  <label>초기 막두께 [nm] (0=제거량 기준)</label>
  <input type="number" id="thick" value="1000" step="100" min="0">
  <div id="ptwbox" style="display:none">
    <label>패턴 밀도 ρ <span id="rhov">0.50</span></label>
    <input type="range" id="rho" min="0.05" max="1" step="0.05" value="0.5">
  </div>
  <label>패드 사용시간 [h]</label><input type="number" id="padh" value="0" step="10" min="0">
  <div style="margin-top:18px"><button id="run">▶ 실행</button></div>
</aside>
<section>
  <div class="tabs">
    <div class="tab on" data-t="pipe">파이프라인</div>
    <div class="tab" data-t="comp">구성요소</div>
  </div>
  <div id="v_pipe">
    <div id="pipe" class="pipe"></div>
    <div id="out"></div>
  </div>
  <div id="v_comp" style="display:none"></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
let CAT=null, CFG={};

const bind=(r,o)=>{$(r).oninput=()=>$(o).textContent=$(r).value};
bind('press','pv');bind('rw','rwv');bind('rp','rpv');bind('time','tv');bind('rho','rhov');
$('wafer').onchange=()=>$('ptwbox').style.display=$('wafer').value==='PTW'?'block':'none';

async function boot(){
  const h=await (await fetch('/api/health')).json();
  $('ver').textContent='v'+h.version;
  CAT=await (await fetch('/api/catalog')).json();
  CFG={...CAT.default_config};
  $('pack').innerHTML=CAT.packs.filter(p=>p.id!=='base')
    .map(p=>`<option value="${p.id}">${p.id}</option>`).join('');
  $('pack').onchange=showPack; showPack();
  drawPipe(); drawComp();
}
function showPack(){
  const p=CAT.packs.find(x=>x.id===$('pack').value);
  const c=p.confidence_counts||{};
  const est=(c.estimated||0)+(c.unverified||0);
  $('packdesc').innerHTML=(p.description||'')+
    (est?`<br><span class="warn">⚠ 미검증/추정 ${est}개 파라미터</span>`:'');
}
function drawPipe(){
  $('pipe').innerHTML=CAT.slots.map(s=>`
    <div class="slot"><h3>${s.label}</h3><div class="own">담당: ${s.owner}</div>
    ${s.impls.map(i=>`
      <label class="opt">
        <input type="radio" name="s_${s.id}" value="${i.id}" ${CFG[s.id]===i.id?'checked':''}
               onchange="CFG['${s.id}']='${i.id}'">
        <span><span class="dot ${i.status}">●</span> ${i.label}</span>
      </label>
      ${CFG[s.id]===i.id&&i.note&&i.note!=='—'?`<div class="meta">📄 ${i.note.split('/').pop()}</div>`:''}
      ${CFG[s.id]===i.id&&i.agent?`<div class="meta">👤 ${i.agent}</div>`:''}
    `).join('')}</div>`).join('');
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  $('v_pipe').style.display=t.dataset.t==='pipe'?'':'none';
  $('v_comp').style.display=t.dataset.t==='comp'?'':'none';
});
const CV={};   // 구성요소 입력값
function drawComp(){
  if(!CAT.components||!CAT.components.length){
    $('v_comp').innerHTML='<div class="info">구성요소 스키마가 아직 없습니다.</div>';return}
  const cov=CAT.coverage;
  $('v_comp').innerHTML=`
  <div class="info">실무 단위로 입력합니다. <b>연결</b>된 항목만 계산에 반영되고,
    <b>미연결</b> 항목은 입력해도 결과에 영향을 주지 않습니다 — 그 사실을 결과에 표시합니다.
    현재 ${cov.total_fields}개 필드 중 연결됨
    ${Object.values(cov.by_component).reduce((a,b)=>a+b.wired,0)}개.</div>
  ${CAT.components.map(c=>`
    <h3 style="font-size:14px;margin:16px 0 8px">${c.label} <span class="sub">담당 ${c.owner}</span></h3>
    ${c.groups.map(g=>`
      <div class="cgroup">
        <h4>${g.label} <span class="${g.origin==='user'?'badge-user':'badge-res'}">${g.origin==='user'?'사용자 지시':'조사 추가'}</span></h4>
        ${g.why?`<div class="why">${g.why.split('\n')[0]}</div>`:''}
        ${g.fields.map(f=>{
          const id='cf_'+f.path.replace(/\./g,'_');
          let ctl;
          if(f.type==='enum'&&f.options) ctl=`<select id="${id}" onchange="CV['${f.path}']=this.value||undefined">
              <option value=""></option>${f.options.map(o=>`<option>${o}</option>`).join('')}</select>`;
          else if(f.type==='number') ctl=`<input id="${id}" type="number" step="any"
              placeholder="${f.typical?f.typical[0]+'~'+f.typical[1]:''}"
              oninput="CV['${f.path}']=this.value===''?undefined:+this.value">`;
          else ctl=`<input id="${id}" type="text" oninput="CV['${f.path}']=this.value||undefined">`;
          return `<div class="crow">
            <div class="lab">${f.label}${f.unit?' <span class="sub">['+f.unit+']</span>':''}
              <span class="st ${f.status}">${f.status==='wired'?'연결':f.status==='partial'?'부분':'미연결'}</span></div>
            ${ctl}</div>
            ${f.note&&f.note.includes('⚠')?`<div class="cnote">${f.note.split('\n')[0]}</div>`:''}`;
        }).join('')}
      </div>`).join('')}`).join('')}`;
}
$('run').onclick=async()=>{
  $('run').disabled=true;$('run').textContent='계산 중…';
  const meta={};
  if($('wafer').value==='PTW') meta.pattern_density=$('rho').value;
  if(+$('padh').value>0) meta.pad_hours=$('padh').value;
  const body={pack:$('pack').value,wafer:$('wafer').value,
    pressure_psi:+$('press').value,rpm_wafer:+$('rw').value,rpm_platen:+$('rp').value,
    time_s:+$('time').value,
    initial_thickness_nm:+$('thick').value||null,meta,slots:CFG,components:CV};
  try{
    const r=await fetch('/api/simulate',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(!r.ok){$('out').innerHTML=`<div class="err">${d.detail||'오류'}</div>`;return}
    render(d);
  }finally{$('run').disabled=false;$('run').textContent='▶ 실행'}
};
function render(d){
  const m=d.metrics;
  const kpi=(k,v,u)=>`<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div><div class="u">${u}</div></div>`;
  const P=d.profile, W=680,H=240,pad=34;
  const mx=Math.max(...P.mrr_nm_min), mn=Math.min(...P.mrr_nm_min);
  const rng=(mx-mn)||1;
  const pts=P.mrr_nm_min.map((v,i)=>{
    const x=pad+(W-pad-12)*i/(P.mrr_nm_min.length-1);
    const y=H-pad-(H-pad-14)*(v-mn)/rng; return `${x.toFixed(1)},${y.toFixed(1)}`}).join(' ');
  $('out').innerHTML=`
  <div class="kpis">
    ${kpi('평균 MRR',d.mrr_mean_nm_min.toFixed(1),'nm/min')}
    ${kpi('TTV',m.ttv_nm.toFixed(2),'nm · SEMI MF1530')}
    ${kpi('radial σ',m.radial_sigma_pct.toFixed(3),'% · 문헌 default')}
    ${kpi('CV',m.cv_pct.toFixed(3),'%')}
    ${kpi('WIWNU 3σ',m.wiwnu_3sigma_pct.toFixed(3),'%')}
  </div>
  <div class="grid2">
    <div><b style="font-size:13px">반경 프로파일</b><br>
      <svg width="${W}" height="${H}">
        <polyline points="${pts}" fill="none" stroke="#58a6ff" stroke-width="2"/>
        <text x="6" y="16" fill="#8b949e" font-size="11">${mx.toFixed(1)}</text>
        <text x="6" y="${H-pad+4}" fill="#8b949e" font-size="11">${mn.toFixed(1)}</text>
        <text x="${W-70}" y="${H-10}" fill="#8b949e" font-size="11">반경 mm</text>
      </svg></div>
    <div><b style="font-size:13px">실행 경로</b>
      <table>${d.trace.map(t=>`<tr><td><span class="dot ${t.status}">●</span> ${t.label}</td></tr>`).join('')}</table>
      <div style="margin-top:10px;font-size:12px;color:var(--dim)">
        제거량 ${d.removed_mean_nm.toFixed(1)} nm
        ${d.remaining_mean_nm!==null?`· 잔막 ${d.remaining_mean_nm.toFixed(1)} nm`:''}
      </div></div>
  </div>
  <div class="info">미산출: ${d.not_computed.join(', ')} — 담당 에이전트 학습 대기 중.
    이 값들은 지어내지 않고 비워 둡니다.</div>
  ${d.notes.map(n=>`<div class="note">⚠ ${n}</div>`).join('')}`;
}
boot();
</script></body></html>
