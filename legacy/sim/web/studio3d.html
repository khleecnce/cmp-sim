<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0f14">
<link rel="manifest" href="/manifest.webmanifest">
<title>FabSim — CMP Simulator</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<style>
  :root{
    --bg:#0b0f14; --panel:#131a23; --panel2:#1a2430; --line:#243141;
    --fg:#e6edf3; --dim:#8b9cb0; --accent:#4da3ff; --warn:#ffb454;
    --bad:#ff6b6b; --good:#5ddc9a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
       overflow:hidden}
  #app{display:flex;height:100vh}
  #view{flex:1;position:relative;min-width:0}
  canvas{display:block;touch-action:none}   /* 터치 제스처를 브라우저가 스크롤로 가로채지 않게 */
  /* ── 파트 전용 시각화 (2026-09-11: 슬러리공급/패드/디스크/로딩부) ── */
  .viz{background:#0d1319;border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:10px}
  /* ⚠ 캔버스 크기는 JS(cv())가 CSS px + DPR 로 직접 잡는다. 여기서 width:100% 를 주면
     640px 논리 캔버스가 폰에서 축소돼 글자가 5px이 된다(2026-09-11 모바일 대응). */
  .viz canvas{display:block;border-radius:4px;max-width:100%}
  .viz .cap{color:var(--dim);font-size:11px;margin-top:6px;line-height:1.45}
  .viz .cap b{color:var(--fg)}
  /* P&ID 플로우 */
  .pid{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;margin:2px 0 8px}
  .pid .nd{flex:1 1 auto;min-width:62px;text-align:center;background:var(--panel2);border:1px solid var(--line);
           border-radius:6px;padding:6px 4px;font-size:10.5px;line-height:1.3}
  .pid .nd .ic{font-size:16px;display:block;margin-bottom:1px}
  .pid .nd .vl{color:var(--accent);font-weight:600;font-size:10px}
  .pid .nd.dead{border-style:dashed;color:var(--dim)}
  .pid .nd.dead .vl{color:var(--warn)}
  .pid .ar{flex:0 0 16px;display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:13px}
  /* FOUP 슬롯 격자 */
  .foup{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:8px}
  .foup .sl{position:relative;border:1px solid var(--line);border-radius:5px;background:var(--panel2);
            padding:5px 3px;text-align:center;cursor:pointer;font-size:10px;transition:.12s}
  .foup .sl:hover{border-color:var(--accent)}
  .foup .sl .n{color:var(--dim);font-size:9px}
  .foup .sl .w{font-weight:600;font-size:10px;margin-top:1px}
  .foup .sl.empty{opacity:.42}
  .foup .sl.empty .w{color:var(--dim);font-weight:400}
  .foup .sl.on{border-color:var(--accent);background:#16324d;box-shadow:0 0 0 1px var(--accent) inset}
  .foup .sl.npw .w{color:var(--good)} .foup .sl.ptw .w{color:var(--warn)}
  .foupbar{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  .foupbar button{flex:1 1 auto;background:var(--panel2);color:var(--fg);border:1px solid var(--line);
                  border-radius:6px;padding:5px 8px;font-size:11px;cursor:pointer}
  .foupbar button:hover{border-color:var(--accent)}
  /* 폰: FOUP 슬롯은 터치 표적이 최소 40px 은 돼야 누를 수 있다 */
  @media (max-width: 560px){
    .foup{grid-template-columns:repeat(4,1fr);gap:5px}
    .foup .sl{padding:8px 3px}
    .foup .sl .w{font-size:11px}
    .pid .nd{min-width:56px;font-size:10px}
    .pid .ar{flex:0 0 12px;font-size:11px}
  }
  #crumb{position:absolute;left:14px;top:12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;
         background:rgba(11,15,20,.78);padding:6px 11px;border-radius:7px;border:1px solid var(--line);z-index:3}
  #crumb .lv{color:var(--accent);cursor:pointer} #crumb .lv:hover{text-decoration:underline}
  #crumb .sep{color:var(--dim);margin:0 2px} #crumb .cur{color:var(--fg)}
  #crumb .mini{margin-left:10px;padding:2px 8px;font-size:11px;background:var(--panel2);color:var(--dim);
         border:1px solid var(--line);border-radius:5px;cursor:pointer} #crumb .mini:hover{color:var(--fg)}
  /* 빌드 시각 — 폰에서 "고친 게 반영됐나"를 확인하는 유일한 단서 */
  #buildTag{margin-left:8px;color:var(--dim);opacity:.75;font-size:11px}
  /* 슬러리 팩 카드 — 고른 슬러리가 무엇인지 한눈에 (2026-09-11) */
  .packcard{margin-top:7px;padding:8px 10px;background:#0d1319;border:1px solid var(--line);
            border-radius:7px;font-size:11px;line-height:1.5}
  .packcard .row{display:flex;gap:8px;margin-bottom:3px;align-items:baseline}
  .packcard .k{flex:0 0 84px;color:var(--dim)}
  .packcard .v{flex:1;text-align:left}   /* 값은 왼쪽 정렬 — 부모의 오른쪽 정렬을 끊는다 */
  .packcard .note{margin-top:5px;padding-top:5px;border-top:1px dashed var(--line);color:var(--warn)}
  .packcard .idline{margin-top:5px;color:var(--dim);opacity:.6;font-size:10px}
  .packcard code{background:#0a0e14;padding:1px 5px;border-radius:3px;color:var(--dim)}
  @media (max-width: 560px){ .packcard .row{display:block} .packcard .k{margin-bottom:1px} }
  #card{position:absolute;left:14px;bottom:14px;max-width:420px;font-size:12px;line-height:1.5;color:var(--dim);
        background:rgba(11,15,20,.80);padding:9px 12px;border-radius:8px;border:1px solid var(--line);display:none;pointer-events:none}
  #card b{color:var(--fg);display:block;margin-bottom:3px;font-size:12.5px}
  #card .x{margin-top:5px;color:var(--good);font-size:11px}
  #cleanBadge{position:absolute;right:14px;top:12px;font-size:11px;color:var(--warn);background:#2a1f14;border:1px solid #4a3a20;
        padding:5px 9px;border-radius:6px;display:none;pointer-events:none}
  #hint{position:absolute;left:14px;top:48px;color:var(--dim);font-size:12px;
        background:rgba(11,15,20,.72);padding:7px 11px;border-radius:7px;
        border:1px solid var(--line);pointer-events:none}
  #label{position:absolute;padding:4px 9px;background:var(--accent);color:#04121f;
         font-weight:600;font-size:12px;border-radius:5px;pointer-events:none;
         display:none;transform:translate(-50%,-140%);white-space:nowrap}
  #side{width:400px;background:var(--panel);border-left:1px solid var(--line);
        display:flex;flex-direction:column}
  #tabs{display:flex;border-bottom:1px solid var(--line);flex-shrink:0;flex-wrap:wrap}
  .tab{flex:1;padding:9px 4px;text-align:center;cursor:pointer;color:var(--dim);
       font-size:11px;border-bottom:2px solid transparent;user-select:none;min-width:60px}
  .tab:hover{color:var(--fg);background:var(--panel2)}
  .tab.on{color:var(--accent);border-bottom-color:var(--accent);background:var(--panel2)}
  #body{flex:1;overflow-y:auto;padding:14px}
  h3{margin:0 0 4px;font-size:14px}
  .sub{color:var(--dim);font-size:11px;margin-bottom:14px;line-height:1.5}
  .fld{margin-bottom:13px}
  .fld label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
  .fld .val{color:var(--accent);font-variant-numeric:tabular-nums;font-weight:600}
  input[type=range]{width:100%;accent-color:var(--accent)}
  select{width:100%;background:var(--panel2);color:var(--fg);border:1px solid var(--line);
         padding:6px;border-radius:5px;font-size:12px}
  .meta{font-size:10px;color:var(--dim);margin-top:3px;line-height:1.45}
  .dead{color:var(--warn)}
  .weak{color:#8ab4d8}
  .closed{color:#9aa0a6}
  #out{border-top:1px solid var(--line);padding:11px 14px;background:var(--panel2);
       max-height:44vh;overflow-y:auto;flex-shrink:0}
  .row{display:flex;justify-content:space-between;padding:3px 0;font-size:12px}
  .row b{font-variant-numeric:tabular-nums}
  .sec{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.09em;
       margin:11px 0 5px;padding-bottom:3px;border-bottom:1px solid var(--line)}
  .fchip{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:12px}
  .fsym{width:19px;font-weight:700;text-align:center;font-size:14px}
  .bar{flex:1;height:5px;background:#0a0f15;border-radius:3px;overflow:hidden;position:relative}
  .bar i{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:3px}
  .bar i.lo{background:var(--bad)} .bar i.hi{background:var(--good)}
  .fval{width:52px;text-align:right;font-variant-numeric:tabular-nums;font-size:11px}
  .tag{font-size:9px;padding:1px 5px;border-radius:3px;background:#2a3644;color:var(--dim)}
  .tag.unmodeled{background:#4a2f1a;color:var(--warn)}
  .tag.partial{background:#3a3a1a;color:#ffe08a}
  .tag.modeled{background:#1a3a2a;color:var(--good)}
  #notes{font-size:10.5px;color:var(--dim);line-height:1.55}
  #notes div{padding:3px 0;border-bottom:1px solid #1b2430}
  #notes div.w{color:var(--warn)}
  .btn{width:100%;padding:9px;background:var(--accent);color:#04121f;border:0;
       border-radius:6px;font-weight:700;cursor:pointer;font-size:12px;margin-top:6px}
  .banner{background:#2a1f14;border:1px solid #4a3a20;color:var(--warn);
          padding:8px 10px;border-radius:6px;font-size:11px;margin-bottom:12px;line-height:1.5}

  /* ══ 모바일 (≤820px 또는 세로 태블릿) ═════════════════════════════
     데스크톱은 좌 3D / 우 패널 2단인데, 폰에서 그대로 두면 패널 400px가
     화면의 대부분을 먹고 3D가 손톱만해진다. 세로로 쌓고 3D를 상단에 고정한다.
     터치 조작은 아래 script의 pointer/touch 핸들러가 담당한다.
     ⚠ 슬라이더·탭은 손가락 타겟이라 44px 가까이 키운다 — 데스크톱 값(9px 패딩)
     그대로 두면 실기에서 옆 탭이 눌린다. */
  /* 3D를 크게 보고 싶을 때 패널을 접는다 (모바일 전용 버튼)
     ⚠ 이 기본 규칙은 반드시 @media보다 **앞에** 와야 한다. 뒤에 두면 같은
     명시도에서 나중 규칙이 이겨 미디어쿼리의 display:flex를 덮어버린다
     (실제로 모바일 스모크에서 버튼이 안 보였다). */
  #mtoggle{display:none;position:absolute;right:14px;bottom:14px;z-index:5;
           align-items:center;gap:6px;padding:9px 13px;border-radius:20px;
           background:rgba(19,26,35,.92);border:1px solid var(--line);
           color:var(--fg);font-size:12px;font-weight:600;cursor:pointer}
  body.panel-collapsed #view{height:calc(100vh - 46px)}
  body.panel-collapsed #side{flex:0 0 46px;overflow:hidden}

  @media (max-width: 820px), (max-height: 520px) and (orientation: landscape){
    #app{flex-direction:column}
    #view{height:44vh;min-height:220px;flex:none;border-bottom:1px solid var(--line)}
    /* 폰에서는 패널을 **하나의 스크롤 기둥**으로 만든다.
       데스크톱처럼 body와 out을 각각 스크롤시키면 out이 자기 자연 높이(결과 20여 줄)를
       차지해 슬라이더가 든 body가 0px로 눌린다 — 실제로 첫 렌더에서 컨트롤이
       통째로 사라졌다. flex:none + 바깥 스크롤이 정답이다. */
    #side{width:100%;flex:1;min-height:0;border-left:0;overflow-y:auto;
          -webkit-overflow-scrolling:touch}
    #body{flex:none;overflow:visible;padding:12px 12px 4px}
    #out{flex:none;max-height:none;overflow:visible}
    #tabs{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;
          position:sticky;top:0;background:var(--panel);z-index:4}
    .tab{flex:0 0 auto;padding:12px 14px;font-size:12px;min-width:0}
    input[type=range]{height:30px}
    select,input[type=number],input[type=text]{font-size:16px;padding:9px}  /* iOS 자동 확대 방지: 16px 미만이면 확대된다 */
    .btn{padding:14px;font-size:14px}
    /* 설명 카드가 3D의 절반을 덮으면 장비가 안 보인다 — 접어두고 탭하면 편다.
       ⚠ Controls 버튼과 같은 우하단을 쓰면 겹친다 — 카드 오른쪽을 비워 둔다. */
    #card{max-width:none;right:150px;font-size:11px;max-height:2.9em;overflow:hidden;
          pointer-events:auto;cursor:pointer}
    #card.open{max-height:60%;overflow-y:auto;right:14px;bottom:56px}
    #hint{display:none}
    #label{display:none !important}   /* 호버 라벨은 터치에서 의미 없다 */
    #crumb{font-size:12px;padding:5px 9px}
    #mtoggle{display:flex}
  }
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <div id="crumb"><span class="lv" data-lv="0">Whole Tool</span><span id="crumbTail"></span>
      <button id="cutBtn" class="mini">Cutaway: off</button></div>
    <div id="hint">Drag = orbit · Wheel = zoom · <b>Click a station to enter</b> · Esc = back
      <span id="buildTag" title="서버가 넣어주는 파일 수정 시각. 고친 게 반영됐는지 여기로 확인한다."></span></div>
    <div id="card"></div>
    <div id="cleanBadge">Cleaning: visualization only — no defect/particle model wired</div>
    <div id="label"></div>
    <div id="mtoggle">▤ <span id="mtoggleTxt">Controls</span></div>
  </div>
  <div id="side">
    <div id="tabs"></div>
    <div id="body"></div>
    <div id="out"></div>
  </div>
</div>
<script>
"use strict";
const API = location.origin;

/* ══════════════════════════════════════════════════════════════
   파트 정의 — ARCHITECTURE-V2.md §1
   각 필드의 `pk`는 팩 키다. 없으면 UI에만 있고 엔진에 안 붙은 것 →
   'dead:true'로 표시해 **거짓 UI를 만들지 않는다**.
   (V1 demo_app의 film 드롭다운이 골라도 Kp가 안 변하는 거짓 UI였다.)
   ══════════════════════════════════════════════════════════════ */
const PARTS = {
  tool: { name:"① Tool", icon:"⚙",
    sub:"Operator set-points on a production polisher (AMAT Reflexion / Mirra class). 'Tool Outputs' below are derived diagnostics, not settings.",
    fields:[
      {section:"Polish Recipe"},
      {k:"pressure_psi", l:"Pressure", u:"psi", min:0.5, max:8, step:0.1, pk:"pressure_psi"},
      {k:"rotation", l:"Rotation (P/H)", special:"rotation", u:"rpm",
       min:10, max:150, step:1,
       hint:"P = platen, H = head (carrier). Shown in one cell as on a real recipe sheet."},
      {k:"sfr_ml_min", l:"Slurry Flow Rate (SFR)", u:"mL/min", min:20, max:400, step:5, pk:"sfr_ml_min"},
      {k:"time_s", l:"Polish Time", u:"s", min:10, max:300, step:5, special:"time"},
      {section:"Conditioner"},
      {k:"cond_downforce_lbf", l:"Conditioner Force", u:"lbf", min:0, max:12, step:0.5, pk:"cond_downforce_lbf"},
      {k:"cond_duty_pct", l:"Conditioning Duty", u:"%", min:0, max:100, step:5, pk:"cond_duty_pct",
       hint:"100% = continuous in-situ. At 0 the disk sweep stops in 3D."},
      {section:"Tool Constants (not recipe)"},
      {k:"center_offset_m", l:"Head Offset r_cc", u:"m", min:0.10, max:0.30, step:0.005, pk:"center_offset_m",
       hint:"Wafer-center to platen-center distance. Fixed by where the head sits on the platen — a tool constant, not a per-recipe knob. Enters MRR as relative velocity V = ω_p·r_cc. Typical 0.18 m on 300 mm tools."},
    ]},
  /* ② 슬러리 — 조성과 공급을 한 탭에 둔다.
     사용자 지시(2026-09-11): "슬러리 공급은 어차피 수정할거 없으니까 슬러리 정보랑
     공급이랑 슬러리 공급장치 클릭하면 한번에 나올수있게해".
     순서는 실제 물질 흐름대로 — 무엇을 섞는가(조성) → 어떻게 보내는가(공급).
     공급 쪽은 SFR 하나만 엔진에 붙어 있어 따로 탭을 둘 만큼 손댈 것이 없다. */
  sds:{ name:"② Slurry", icon:"💧",
    sub:"What the slurry is, and how it reaches the pad — one place. Composition is what a formulator mixes; the P&ID below is the cabinet outside the polisher (drum/IBC → blend tank → pump → filter → flow meter → arm nozzle). Of the delivery path only SFR reaches the engine; the rest is recorded for provenance.",
    fields:[
      {section:"Abrasive"},
      {k:"abrasive_type", l:"Abrasive Type", special:"select", pk:null,
       options:[["colloidal_silica","Colloidal Silica"],["fumed_silica","Fumed Silica"],["ceria","Ceria (CeO₂)"],["alumina","Alumina (Al₂O₃)"],["zirconia","Zirconia"],["mixed","Mixed / Composite"]],
       hint:"Which abrasive the pack models is fixed by the pack (silica → oxide_silica, ceria → sti_ceria). Changing this here re-selects the pack; it is not a free slider."},
      {k:"abrasive_wt_pct", l:"Abrasive Loading", u:"wt%", min:0, max:50, step:0.5, pk:"abrasive_wt_pct",
       hint:"Above ~7 wt% Luo–Dornfeld saturation: MRR stops rising in measured systems. That range is over-estimated."},
      {k:"abrasive_d10_nm", l:"Particle Size D10", u:"nm", min:5, max:300, step:5, pk:null,
       dead:"Recorded only. The engine consumes D50 (below) — no D10 term exists in the literature we hold."},
      {k:"abrasive_size_nm", l:"Particle Size D50", u:"nm", min:5, max:300, step:5, pk:"abrasive_size_nm",
       closed:"Wired, pack-dependent by evidence ruling. Oxide/ceria packs use a peak model (peak 80 nm silica / 163 nm ceria, ruling #10): 40→80 nm raises MRR 106→268 nm/min on oxide_silica, and ceria keeps rising to 163 nm. Cu and W packs are deliberately flat (exponent 0.0) — rulings #1 and #6 found the size→MRR effect null once particle-shape confounding was removed, confirmed by two independent W studies. A flat response here is a result, not a missing term."},
      {k:"abrasive_d90_nm", l:"Particle Size D90", u:"nm", min:5, max:600, step:5, pk:null,
       weak:"Recorded. Δ (Damage) will use D90/D99 for large-particle scratch risk once that axis is wired."},
      {k:"abrasive_mean_nm", l:"Particle Size Mean", u:"nm", min:5, max:300, step:5, pk:null,
       dead:"Recorded only. Not consumed by the engine."},
      {k:"abrasive_shape", l:"Particle Shape", special:"select", pk:null,
       options:[["spherical","Spherical"],["cocoon","Cocoon (peanut, silica)"],["irregular","Irregular / Faceted (ceria, fumed)"],["aggregated","Aggregated"]],
       dead:"Recorded only. Shape → contact-area term is not in the engine; literature we hold gives direction (non-spherical ↑ MRR & ↑ defects) but no calibrated exponent."},
      {section:"Additives"},
      {special:"additives"},
      {k:"slurry_ph", l:"pH", u:"", min:0, max:14, step:0.1, pk:"slurry_ph",
       hint:"Silica pack: peak at pH 11 (Li 2021). Ceria pack: electrostatic window 2.5–6.8, collapses past pH 6 (Dandu 2009). Outside measured range = extrapolation."},
      {section:"Supply Path (P&ID)"},
      {special:"sdsflow"},
      {section:"Delivery Set-points"},
      {k:"sfr_ml_min", l:"Slurry Flow Rate (SFR)", u:"mL/min", min:20, max:400, step:5, pk:"sfr_ml_min",
       hint:"The one delivery number the engine consumes: it drives Θ (thermal/flow load) as fresh-slurry supply per unit area."},
      {k:"diw_flow_ml_min", l:"DIW Dilution Flow", u:"mL/min", min:0, max:400, step:5, pk:null,

/* 챔퍼 원통 (LatheGeometry) : 모든 금속 원통은 모서리를 깎는다 */
function chamferCyl(r, h, c, seg){
  seg = seg||96; c = Math.min(c, r*0.45, h*0.45);
  const pts = [ new THREE.Vector2(0,-h/2), new THREE.Vector2(r-c,-h/2),
    new THREE.Vector2(r,-h/2+c), new THREE.Vector2(r,h/2-c),
    new THREE.Vector2(r-c,h/2), new THREE.Vector2(0,h/2) ];
  const g = new THREE.LatheGeometry(pts, seg); g.computeVertexNormals(); return g;
}
/* 챔퍼 링(관) : 리테이너 링, 트레이 등 */
function chamferRing(ri, ro, h, c, seg){
  seg = seg||96; c = Math.min(c, (ro-ri)*0.45, h*0.45);
  const pts = [ new THREE.Vector2(ri,-h/2), new THREE.Vector2(ro-c,-h/2), new THREE.Vector2(ro,-h/2+c),
    new THREE.Vector2(ro,h/2-c), new THREE.Vector2(ro-c,h/2), new THREE.Vector2(ri+c,h/2),
    new THREE.Vector2(ri,h/2-c), new THREE.Vector2(ri,-h/2) ];
  const g = new THREE.LatheGeometry(pts, seg); g.computeVertexNormals(); return g;
}
function mesh(geo, mat, x,y,z, parent, shadow){
  const m = new THREE.Mesh(geo, mat); m.position.set(x||0,y||0,z||0);
  m.castShadow = shadow!==false; m.receiveShadow = true; (parent||scene).add(m); return m;
}
/* 볼트 원(六角 헤드) */
function boltCircle(parent, R, y, n, s){
  const g = new THREE.CylinderGeometry(s, s, s*0.9, 6);
  const im = new THREE.InstancedMesh(g, M.bolt, n);
  const o = new THREE.Object3D();
  for(let i=0;i<n;i++){
    const a = i/n*Math.PI*2;
    o.position.set(Math.cos(a)*R, y, Math.sin(a)*R); o.rotation.y = a; o.updateMatrix();
    im.setMatrixAt(i, o.matrix);
  }
  im.castShadow = true; parent.add(im); return im;
}
/* 두 점 사이 파이프 */
function pipe(a, b, r, mat, parent){
  const d = new THREE.Vector3().subVectors(b,a), L = d.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r,r,L,24), mat||M.tube);
  m.position.copy(a).addScaledVector(d, .5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d.normalize());
  m.castShadow = true; (parent||scene).add(m); return m;
}

function boxT(x0,x1,y0,y1,z0,z1,mat,parent,shadow){

const tool = new THREE.Group(); scene.add(tool);
function panelMat(){ return new THREE.MeshPhysicalMaterial({color:0xf3f5f7, metalness:0.05, roughness:0.32, clearcoat:0.65, clearcoatRoughness:0.2, transparent:true, opacity:1}); }
function bandMat(){ return M.teal.clone(); }

function newBlock(id){

const T_WALL = 0.03;
/* 정면/후면 벽 (XZ 평면, 깊이 y). win = [x0,x1,z0,z1] 창, slit = [x0,x1,z0,z1] 슬릿 도어(검정) */
function wallY(b, y, x0,x1, z0,z1, win, slit){
  const t = T_WALL, ya = y-t/2, yb = y+t/2, P = b.panel, G = b.grp;
  if(!win){ boxT(x0,x1,ya,yb,z0,z1,P,G); }
  else{
    const [a,c,d,e] = win;
    boxT(x0,a,ya,yb,z0,z1,P,G); boxT(c,x1,ya,yb,z0,z1,P,G);
    boxT(a,c,ya,yb,z0,d,P,G);   boxT(a,c,ya,yb,e,z1,P,G);
    boxT(a,c,y-0.004,y+0.004,d,e,b.glass,G,false);
    const f = 0.025;
    boxT(a-f,c+f,ya-0.004,yb+0.004,d-f,d,b.trim,G); boxT(a-f,c+f,ya-0.004,yb+0.004,e,e+f,b.trim,G);
    boxT(a-f,a,ya-0.004,yb+0.004,d,e,b.trim,G);     boxT(c,c+f,ya-0.004,yb+0.004,d,e,b.trim,G);
  }
  if(slit){ const [a,c,d,e] = slit; boxT(a,c,ya-0.006,yb+0.006,d,e,b.trim,G); }
}
/* 측면 벽 (YZ 평면, 폭 x). win = [y0,y1,z0,z1] */
function wallX(b, x, y0,y1, z0,z1, win){
  const t = T_WALL, xa = x-t/2, xb = x+t/2, P = b.panel, G = b.grp;
  if(!win){ boxT(xa,xb,y0,y1,z0,z1,P,G); return; }
  const [a,c,d,e] = win;
  boxT(xa,xb,y0,a,z0,z1,P,G); boxT(xa,xb,c,y1,z0,z1,P,G);
  boxT(xa,xb,a,c,z0,d,P,G);   boxT(xa,xb,a,c,e,z1,P,G);
  boxT(x-0.004,x+0.004,a,c,d,e,b.glass,G,false);
  const f = 0.025;
  boxT(xa-0.004,xb+0.004,a-f,c+f,d-f,d,b.trim,G); boxT(xa-0.004,xb+0.004,a-f,c+f,e,e+f,b.trim,G);
  boxT(xa-0.004,xb+0.004,a-f,a,d,e,b.trim,G);     boxT(xa-0.004,xb+0.004,c,c+f,d,e,b.trim,G);
}
/* 서비스 도어 심(seam) — 측면 x 면 위 사각 홈 + 손잡이 */
function doorX(b, x, y0,y1, z0,z1){
  const s = 0.008, o = x<1.1 ? -0.006 : 0.006, xa = x+o-0.003, xb = x+o+0.003, G = b.grp, T = b.trim;
  boxT(xa,xb,y0,y1,z0,z0+s,T,G,false); boxT(xa,xb,y0,y1,z1-s,z1,T,G,false);
  boxT(xa,xb,y0,y0+s,z0,z1,T,G,false); boxT(xa,xb,y1-s,y1,z0,z1,T,G,false);
  boxT(x+o*2-0.008,x+o*2+0.008, y1-0.10,y1-0.04, (z0+z1)/2-0.01,(z0+z1)/2+0.01, M.steelD, G, false); // 손잡이
}
/* 후면(y 면) 도어 심 */
function doorY(b, y, x0,x1, z0,z1){
  const s = 0.008, ya = y+0.006-0.003, yb = y+0.006+0.003, G = b.grp, T = b.trim;
  boxT(x0,x1,ya,yb,z0,z0+s,T,G,false); boxT(x0,x1,ya,yb,z1-s,z1,T,G,false);
  boxT(x0,x0+s,ya,yb,z0,z1,T,G,false); boxT(x1-s,x1,ya,yb,z0,z1,T,G,false);
}
/* 상단 청록 밴드 (4면, 패널보다 1 cm 돌출) */
function bandRing(b, x0,x1, y0,y1, z0,z1){
  const p = 0.028, G = b.grp, B = b.band;
  boxT(x0-p,x1+p, y0-p,y0+T_WALL, z0,z1, B, G); boxT(x0-p,x1+p, y1-T_WALL,y1+p, z0,z1, B, G);
  boxT(x0-p,x0+T_WALL, y0,y1, z0,z1, B, G);     boxT(x1-T_WALL,x1+p, y0,y1, z0,z1, B, G);
}

  const mid = (Y0+Y1)/2;
  /* 툴 좌표(x=가로, y=깊이, z=높이) → 월드(x, 높이, -깊이).
     ⚠ mesh()는 (x, y=높이, z)를 받는다. W3와 같은 규약으로 변환해야 한다 —
     처음에 인자 순서를 틀려 부품이 전부 캐비닛 밖 바닥에 깔렸다(2026-09-11). */
  const put = (g,m,x,z,y,sh)=> mesh(g, m, x, z, -(y===undefined?mid:y), tool, sh);

  /* ① 드럼 / IBC — 원료 통 2개 (왼쪽 끝) */
  [[X0+0.30, mid-0.42],[X0+0.30, mid+0.42]].forEach(([dx,dy])=>{
    put(chamferCyl(0.24, 0.86, 0.03, 40), M.pp, dx, 0.16+0.43, dy, true);
    put(new THREE.CylinderGeometry(0.25,0.25,0.03,40), M.steelD, dx, 0.16+0.88, dy);  // 뚜껑 링
    put(new THREE.CylinderGeometry(0.05,0.05,0.10,20), M.tube,   dx, 0.16+0.95, dy);  // 인출 포트
  });

  /* ② 블렌드 탱크 — 투명 동체 + 액면 + 교반 모터 */
  const TX = X0+0.72;
  put(new THREE.CylinderGeometry(0.30,0.30,0.92,48), M.acrylic, TX, 0.16+0.52, mid);
  put(new THREE.CylinderGeometry(0.285,0.285,0.55,40), M.liquid, TX, 0.16+0.34, mid);   // 액면
  put(new THREE.CylinderGeometry(0.31,0.31,0.03,48), M.steelD, TX, 0.16+0.99, mid);     // 상판
  put(new THREE.BoxGeometry(0.20,0.16,0.20), M.anod,          TX, 0.16+1.10, mid);      // 교반 모터
  put(new THREE.CylinderGeometry(0.018,0.018,0.70,16), M.steel, TX, 0.16+0.62, mid);    // 교반축
  [0,1].forEach(i=> put(new THREE.BoxGeometry(0.22,0.012,0.05), M.steel, TX, 0.16+0.34+i*0.16, mid)); // 임펠러

  /* ③ 펌프 — 다이어프램 헤드 + 모터 */
  const PX = X0+1.06;
  put(new THREE.BoxGeometry(0.20,0.22,0.24), M.frame, PX, 0.16+0.30, mid, true);
  put(chamferCyl(0.09, 0.20, 0.02, 28), M.steel, PX, 0.16+0.52, mid);
  put(new THREE.CylinderGeometry(0.055,0.055,0.16,24), M.anod, PX+0.14, 0.16+0.52, mid);

  /* ④ 필터 하우징 — D99 꼬리를 자르는 자리. 2단으로 세운다 */
  [mid-0.26, mid+0.26].forEach(fy=>{
    put(chamferCyl(0.075, 0.62, 0.02, 32), M.steel, X0+1.26, 0.16+0.55, fy, true);
    put(new THREE.CylinderGeometry(0.085,0.085,0.04,32), M.steelD, X0+1.26, 0.16+0.88, fy);
    put(new THREE.CylinderGeometry(0.02,0.02,0.06,16), M.tube,   X0+1.26, 0.16+0.93, fy); // 벤트
  });

  /* ⑤ 배관 — 드럼 → 탱크 → 펌프 → 필터 → 토출. 같은 높이로 가로질러 인과를 보여준다 */
  const pipeY = 0.16+0.98, r = 0.022;
  function runX(xa, xb, yy, zz){
    const L = Math.abs(xb-xa);
    const m = mesh(new THREE.CylinderGeometry(r,r,L,16), M.tube, (xa+xb)/2, zz, -yy, tool);
    m.rotation.z = Math.PI/2; return m;
  }
  function runY(ya, yb, xx, zz){
    const L = Math.abs(yb-ya);
    const m = mesh(new THREE.CylinderGeometry(r,r,L,16), M.tube, xx, zz, -(ya+yb)/2, tool);
    m.rotation.x = Math.PI/2; return m;
  }
  runY(mid-0.42, mid+0.42, X0+0.30, pipeY);          // 드럼 2통 합류
  runX(X0+0.30, TX,       mid,      pipeY);          // → 탱크
  runX(TX,      PX,       mid,      0.16+0.52);      // 탱크 → 펌프(하단 인출)
  runX(PX+0.14, X0+1.26,  mid,      0.16+0.52);      // 펌프 → 필터
  runY(mid-0.26, mid+0.26, X0+1.26, 0.16+0.52);      // 필터 2기 합류

  /* ⑥ 유량계 — 여기까지가 SDS, 이후는 툴 배관 */
  const FX = X1-0.22;
  put(new THREE.BoxGeometry(0.12,0.20,0.14), M.anod, FX, 0.16+0.62, mid);
  put(new THREE.BoxGeometry(0.10,0.12,0.02), M.teal, FX, 0.16+0.62, mid-0.075);   // 표시창
  runX(X0+1.26, FX, mid, 0.16+0.52);
  runX(FX, X1+0.10, mid, 0.16+0.62);

  /* ⑦ 툴로 건너가는 배관 — POU 밸브박스(2.2~2.6, 4.2~4.5)까지 눈으로 잇는다.
     이게 있어야 "옆 캐비닛에서 와서 암 노즐로 나간다"가 읽힌다. */
  runY(mid, 4.35, X1+0.10, 0.16+0.62);
  runX(X1+0.10, 2.4, 4.35, 0.16+0.62);

  /* 라벨 판 */
  put(new THREE.BoxGeometry(0.42,0.14,0.02), M.teal, X0+0.55, ZT+0.09, Y1-0.04);
})();

/* ══════════════════════════════════════════════════════════════
   Level 1 — 폴리싱 스테이션 클로즈업 (기존 씬). 1 unit = 253 mm.
   `closeup` 그룹: scale 0.253, 원점 = P1 패드 상면 (1.61, 3.74, Z 1.00), yaw 135° 로 헤드 오프셋(+x)이 캐러셀 축을 향한다.
   ══════════════════════════════════════════════════════════════ */
const U = 0.253;
const closeup = new THREE.Group();
closeup.scale.setScalar(U); closeup.position.copy(W3(LAY.P1.x, LAY.P1.y, LAY.PAD_Z)); closeup.rotation.y = Math.PI*0.75;
tool.add(closeup);
const cm = (g,m,x,y,z,p,s)=>mesh(g,m,x,y,z,p||closeup,s);

/* ── 슬러리 배수 트레이/스플래시가드 (테이블 탑에 매입) ── */
const trayLathe = (function(){                                             // 트레이: 바닥+외벽(립)
  const pts = [ new THREE.Vector2(1.56,-0.40), new THREE.Vector2(1.92,-0.40), new THREE.Vector2(1.96,-0.36),

cm(trayLathe, M.steelD, 0,0,0);

/* 플래튼 허브(회전하지 않는 베어링 하우징) */
cm(chamferCyl(0.95,0.14,0.02,96), M.anod, 0,-0.35,0);

/* ══ 플래튼 + 패드 : 회전한다 ══ */
const PAD_TOP = 0.0;
const platenGrp = new THREE.Group(); closeup.add(platenGrp);
const platen = cm(chamferCyl(1.5,0.22,0.02,128), M.alu, 0,-0.17,0, platenGrp);
boltCircle(platenGrp, 1.42, -0.06, 24, 0.022);        // 플래튼 상면 볼트
cm(chamferRing(1.30,1.50,0.03,0.008,128), M.steelD, 0,-0.055,0, platenGrp); // 패드 클램프 링(외곽)
void platen;

const pad = new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.5,0.06,128), [padSideMat, padMat, padSideMat]);
pad.position.y = PAD_TOP-0.03; pad.castShadow = pad.receiveShadow = true;

/* 동심원 그루브 — 간격/깊이(/폭)가 텍스처에 실제로 반영된다 (P1·P2·P3 패드가 같은 텍스처를 공유) */
let grooveGrp = new THREE.Group(); platenGrp.add(grooveGrp);   // (호환용, 비어 있음)
function buildGrooves(pitchMM, depthMM){
  const pitch = Math.max(pitchMM, 0.6), depth = Math.max(depthMM, 0.1);
  const widthUM = (typeof num==="function") ? num("groove_width_um", 600) : 600;
  const pxPerMM = (PAD_PX/2)/PAD_R_MM;
  const g = padCanvas.getContext("2d"), b = padBump.getContext("2d");
  g.drawImage(padBase,0,0);
  b.fillStyle = "#808080"; b.fillRect(0,0,PAD_PX,PAD_PX);
  const w = Math.max(1.3, widthUM/1000*pxPerMM);
  const dark = THREE.MathUtils.clamp(0.30 + depth/1.5*0.45, 0.3, 0.8);
  g.lineWidth = w; g.strokeStyle = `rgba(28,30,18,${dark})`;
  b.lineWidth = w; b.strokeStyle = `rgb(${Math.round(128-100*THREE.MathUtils.clamp(depth/1.5,.2,1))},0,0)`;
  b.strokeStyle = b.strokeStyle.replace(/rgb\((\d+),0,0\)/, (m,v)=>`rgb(${v},${v},${v})`);
  const cx = PAD_PX/2;
  for(let r = 25*pxPerMM; r < (PAD_R_MM-6)*pxPerMM; r += pitch*pxPerMM){
    g.beginPath(); g.arc(cx,cx,r,0,Math.PI*2); g.stroke();
    b.beginPath(); b.arc(cx,cx,r,0,Math.PI*2); b.stroke();
  }
  /* 그루브 하이라이트 엣지(빛 받는 쪽) */
  g.lineWidth = Math.max(0.6, w*0.4); g.strokeStyle = "rgba(255,255,240,0.10)";
  for(let r = 25*pxPerMM + w*0.9; r < (PAD_R_MM-6)*pxPerMM; r += pitch*pxPerMM){
    g.beginPath(); g.arc(cx,cx,r,0,Math.PI*2); g.stroke();
  }
  padTex.needsUpdate = true; padBumpTex.needsUpdate = true;
}
buildGrooves(3.05, 0.76);

/* ══ 캐리어 헤드 + 리테이너 링 + 웨이퍼 : 플래튼과 **같은 방향**으로 자전 ══ */

const carrierGrp = new THREE.Group(); carrierGrp.position.set(R_CC, 0, 0); closeup.add(carrierGrp);
/* 리테이너 링 (PPS, 웨이퍼를 둘러싸고 패드를 미리 누름) — 하단 슬러리 슬롯 */

(function(){ const g = new THREE.BoxGeometry(0.08,0.02,0.006);
  const im = new THREE.InstancedMesh(g, M.rubber, 36); const o = new THREE.Object3D();
  for(let i=0;i<36;i++){ const a=i/36*Math.PI*2; o.position.set(Math.cos(a)*0.63, PAD_TOP+0.018, Math.sin(a)*0.63);
    o.rotation.y=-a; o.updateMatrix(); im.setMatrixAt(i,o.matrix); }
  carrierGrp.add(im); })();

/* 멤브레인 베이스(고무) → 하우징(스테인리스, 단차 2단) → 짐벌 캡 → 스핀들 */
cm(chamferCyl(0.64,0.05,0.006,128), M.rubber, 0,PAD_TOP+0.107,0, carrierGrp);

boltCircle(carrierGrp, 0.645, PAD_TOP+0.445, 16, 0.02);
cm(chamferCyl(0.55,0.16,0.02,96), M.steelD, 0,PAD_TOP+0.52,0, carrierGrp);       // 상부 단차
boltCircle(carrierGrp, 0.50, PAD_TOP+0.605, 12, 0.016);
cm(chamferCyl(0.30,0.12,0.03,64), M.anod, 0,PAD_TOP+0.66,0, carrierGrp);        // 짐벌 하우징

    Math.cos(a)*0.42, PAD_TOP+0.64, Math.sin(a)*0.42, carrierGrp);

       new THREE.Vector3(Math.cos(a)*0.12, PAD_TOP+1.20, Math.sin(a)*0.12), 0.012, M.hose, carrierGrp);
}

/* 헤드를 매단 구조(고정, 회전 안 함): 스핀들 모터 + 캐러셀 슬라이드까지의 드라이브 (갠트리 대신 캐러셀 암이 지지) */
const headMount = new THREE.Group(); headMount.position.set(R_CC,0,0); closeup.add(headMount);
cm(chamferCyl(0.23,0.42,0.03,64), M.steelD, 0,PAD_TOP+1.86,0, headMount);        // 스핀들 모터/드라이브
cm(chamferCyl(0.26,0.05,0.01,64), M.anod, 0,PAD_TOP+1.66,0, headMount);

cm(chamferCyl(0.12,0.70,0.01,48), M.steel, 0,PAD_TOP+2.42,0, headMount);         // 드라이브 샤프트 → 캐러셀 슬라이드 (Z 1.52→1.69)

/* ══ 컨디셔너 : 플래튼 밖 기둥에 고정된 스윙 암 → 끝에 다이아 디스크 (스윕 + 자전) ══
   피벗은 플래튼 바깥 모서리(캐러셀 축 반대쪽) — 툴 좌표 ≈ (1.89, 3.28), 플래튼 중심에서 0.53 m */
const COND_PIVOT = new THREE.Vector3(-2.05, 0, -0.50);
const COND_L = 2.0;                                   // 피벗→디스크 중심
const COND_YAW0 = Math.atan2(-(0-COND_PIVOT.z), (0-COND_PIVOT.x)); // 암이 플래튼 중심을 향하는 yaw
const condPost = new THREE.Group(); condPost.position.copy(COND_PIVOT); closeup.add(condPost);
cm(chamferCyl(0.20,1.70,0.02,64), M.frame, 0,-0.10,0, condPost);                // 스윙 기둥
cm(chamferCyl(0.30,0.05,0.01,64), M.steelD, 0,-0.40,0, condPost);
boltCircle(condPost, 0.255, -0.37, 6, 0.018);
cm(chamferCyl(0.16,0.22,0.02,64), M.anod, 0,0.86,0, condPost);                  // 스윙 모터
cm(chamferRing(0.22,0.30,0.20,0.01,64), M.pp, 0.55,-0.30,0.45, condPost);        // 디스크 세척 컵 Ø0.15
const condGrp = new THREE.Group(); condGrp.position.copy(COND_PIVOT); condGrp.rotation.y = COND_YAW0; closeup.add(condGrp);
cm(chamferCyl(0.14,0.16,0.015,48), M.steelD, 0,0.66,0, condGrp);                // 암 허브
cm(new THREE.BoxGeometry(COND_L,0.09,0.16), M.frame, COND_L/2,0.66,0, condGrp);
cm(new THREE.BoxGeometry(COND_L-0.2,0.02,0.10), M.steelD, COND_L/2-0.05,0.715,0, condGrp);
pipe(new THREE.Vector3(0.2,0.72,0.05), new THREE.Vector3(COND_L-0.2,0.72,0.05), 0.012, M.hose, condGrp); // 컨디셔너 린스 라인
/* 디스크 홀더 + 샤프트 + 디스크(자전) */
const diskGrp = new THREE.Group(); diskGrp.position.set(COND_L,0,0); condGrp.add(diskGrp);
cm(chamferCyl(0.13,0.20,0.015,48), M.steelD, 0,0.52,0, diskGrp);                // 홀더(다운포스 실린더)
cm(chamferCyl(0.045,0.30,0.005,32), M.steel, 0,0.27,0, diskGrp);                // 디스크 샤프트
const diskSpin = new THREE.Group(); diskGrp.add(diskSpin);

const disk = cm(chamferCyl(0.20,0.045,0.006,96), M.steel, 0,PAD_TOP+0.0425,0, diskSpin);
hot.disk = disk;
boltCircle(diskSpin, 0.135, PAD_TOP+0.07, 6, 0.012);
/* 다이아 그릿 — 밀도가 실제로 반영된다 (디스크 하면에 박힘) */
let gritGrp = new THREE.Group(); diskSpin.add(gritGrp);
const gritMat = new THREE.MeshStandardMaterial({color:0xffffff, metalness:0.35, roughness:0.04});
function buildGrits(density){
  gritGrp.clear();
  const n = Math.round(THREE.MathUtils.clamp(
      60*Math.log10(density/2e10+1)/Math.log10(21), 12, 260));
  const g = new THREE.OctahedronGeometry(0.011);
  const im = new THREE.InstancedMesh(g, gritMat, n);
  const o = new THREE.Object3D();
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, r = Math.sqrt(Math.random())*0.185;
    o.position.set(Math.cos(a)*r, PAD_TOP+0.018, Math.sin(a)*r);
    o.rotation.set(Math.random()*.6, Math.random()*Math.PI, Math.random()*.6); o.updateMatrix();
    im.setMatrixAt(i, o.matrix);
  }
  gritGrp.add(im);
}
buildGrits(1e11);

/* ══ 슬러리 암 : 플래튼 밖 기둥 → 튜브가 패드 중심 근처까지 뻗어 적하 ══
   포스트 툴 좌표 ≈ (2.15, 3.85) — 캐러셀 헤드 궤도(축에서 ≤1.0 m) 밖 */
const SL_POST = new THREE.Vector3(-1.20, 0, 1.80);
const SL_DROP = new THREE.Vector3(-0.15, 0, -0.32);   // 적하점(패드 중심 근처)
const armPivot = new THREE.Group(); closeup.add(armPivot);
cm(chamferCyl(0.13,1.45,0.015,48), M.frame, SL_POST.x,0.30,SL_POST.z, armPivot);
cm(chamferCyl(0.20,0.05,0.01,48), M.steelD, SL_POST.x,-0.40,SL_POST.z, armPivot);
cm(chamferCyl(0.10,0.10,0.01,48), M.anod, SL_POST.x,1.07,SL_POST.z, armPivot);
const slArmA = new THREE.Vector3(SL_POST.x, 1.02, SL_POST.z);
const slArmB = new THREE.Vector3(SL_DROP.x, 0.98, SL_DROP.z);
pipe(slArmA, slArmB, 0.035, M.tube, armPivot);
pipe(new THREE.Vector3(SL_POST.x+0.05,1.02,SL_POST.z+0.05), new THREE.Vector3(SL_DROP.x+0.05,0.98,SL_DROP.z+0.05), 0.012, M.hose, armPivot); // 슬러리 라인
pipe(new THREE.Vector3(SL_POST.x-0.05,1.02,SL_POST.z-0.05), new THREE.Vector3(SL_DROP.x-0.05,0.98,SL_DROP.z-0.05), 0.012, M.hose, armPivot); // DIW 라인

const FLOW = [ // [X, Y, Z, vertical?, dwell s]
  [1.06,0.20,1.05,0,1.2], [1.06,0.95,1.05,0,0.4], [2.05,1.40,1.20,0,0.2], [2.05,2.60,1.20,0,0.2],
  [1.85,2.80,1.10,0,0.5], [0.90,3.50,1.03,0,0.6], [0.59,3.74,1.03,0,0.8],
  [1.61,3.74,1.02,0,2.5], [1.61,4.76,1.02,0,2.5], [0.59,4.76,1.02,0,2.5], [0.59,3.74,1.03,0,0.8],
  [0.28,3.50,1.03,0,0.6], [0.30,2.80,1.10,0,0.5], [0.35,2.00,1.45,0,0.2], [0.35,2.00,1.15,1,1.2],
  [0.65,2.00,0.95,1,1.5], [0.95,2.00,0.95,1,1.5], [1.25,2.00,0.95,1,1.5], [1.55,2.00,0.95,1,1.5],
  [1.85,2.00,1.15,1,0.6], [1.85,2.00,1.45,0,0.3], [1.85,0.95,1.05,0,0.4], [1.56,0.20,1.05,0,1.2],
];
const flow = { tokens:[], seg:[], total:0 };
(function buildFlow(){
  const SPEED = 0.7; let T = 0; const pts = [];
  for(let i=0;i<FLOW.length;i++){
    const a = FLOW[i], b = FLOW[(i+1)%FLOW.length];
    const pa = W3(a[0],a[1],a[2]), pb = W3(b[0],b[1],b[2]);
    const dwell = a[4], travel = pa.distanceTo(pb)/SPEED;
    flow.seg.push({pa, pb, va:a[3], vb:b[3], t0:T, tDwell:dwell, tTravel:travel});
    T += dwell + travel; pts.push(pa);
  }
  pts.push(pts[0].clone()); flow.total = T;
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineDashedMaterial({color:0x4da3ff, dashSize:0.06, gapSize:0.04, transparent:true, opacity:0.35, depthTest:false}));
  line.computeLineDistances(); line.renderOrder = 9; tool.add(line); flow.line = line;
  const geo = new THREE.CylinderGeometry(0.11,0.11,0.005,48);
  for(let k=0;k<7;k++){ const m = new THREE.Mesh(geo, M.token); m.renderOrder = 10; tool.add(m); flow.tokens.push(m); }
})();
function flowPose(tau, m){
  let s = flow.seg[0];
  for(const sg of flow.seg){ if(tau >= sg.t0) s = sg; }
  const local = tau - s.t0;
  let u = local <= s.tDwell ? 0 : Math.min(1, (local - s.tDwell)/Math.max(s.tTravel,1e-6));
  u = u*u*(3-2*u);
  m.position.lerpVectors(s.pa, s.pb, u);
  m.rotation.z = THREE.MathUtils.lerp(s.va, s.vb, u)*Math.PI/2;
}

const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
const labelEl = document.getElementById("label");
function pickList(){
  if(level===1) return focusId==="P1" ? {list:Object.values(hot), kind:"part"} : {list:[], kind:""};
  if(level===2) return {list:clean.proxies, kind:"proxy"};
  return {list:proxies, kind:"proxy"};
}
function pickAny(e){
  const r = rend.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX-r.left)/r.width)*2-1;
  mouse.y = -((e.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(mouse, cam);
  const {list, kind} = pickList();
  if(!list.length) return null;
  const hits = ray.intersectObjects(list, false);
  if(!hits.length) return null;
  const fine = hits.find(x=>!/^(FI|CL)$/.test(x.object.userData.id||""));   // 블록 박스보다 스테이션 프록시 우선
  const o = (kind==="proxy" && fine) ? fine.object : hits[0].object;
  if(kind==="part") return {part:Object.keys(hot).find(k=>hot[k]===o)||null};
  return {proxy:o};
}
function pick(e){ const p = pickAny(e); return p && p.part ? p.part : null; }   // (호환용)
function setHover(m){
  const id = m ? m.userData.id : null;
  if(id===hoverId) return;
  for(const p of proxies.concat(clean.proxies)){ p.material.opacity = 0; p.userData.edges.visible = false; }
  hoverId = id;
  if(m){ m.material.opacity = 0.10; m.userData.edges.visible = true; }
}

   1손가락 = 궤도 회전, 2손가락 핀치 = 줌, 짧은 탭 = 선택을 따로 붙인다.
   ⚠ canvas에 touch-action:none이 걸려 있어야 브라우저가 스와이프를 페이지
   스크롤로 가로채지 않는다(CSS 참조). preventDefault만으로는 부족하다.
   ⚠ 탭 판정은 이동거리 + 시간을 함께 본다 — 거리만 보면 길게 눌러 회전을
   시도하다 손이 안 움직인 경우가 선택으로 오인된다. */
let tDrag=false, tx=0, ty=0, tStartX=0, tStartY=0, tStartT=0, pinchD=0;
function _td(e){ const a=e.touches[0], b=e.touches[1];
  return Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY); }
rend.domElement.addEventListener("touchstart",e=>{
  if(e.touches.length===1){
    tDrag=true; const t=e.touches[0];
    tx=tStartX=t.clientX; ty=tStartY=t.clientY; tStartT=performance.now();
  } else if(e.touches.length===2){
    tDrag=false; pinchD=_td(e);
  }
  lastInteract = performance.now(); flying=false;
},{passive:true});
rend.domElement.addEventListener("touchmove",e=>{
  if(e.touches.length===2 && pinchD>0){
    e.preventDefault();
    const d=_td(e), z=ZOOM[level];
    camGoal.dist = THREE.MathUtils.clamp(camGoal.dist*(pinchD/d), z[0], z[1]);
    pinchD=d; lastInteract=performance.now(); flying=false; return;
  }
  if(!tDrag || e.touches.length!==1) return;
  e.preventDefault();
  const t=e.touches[0];
  camGoal.yaw -= (t.clientX-tx)*0.007;
  camGoal.pitch = THREE.MathUtils.clamp(camGoal.pitch+(t.clientY-ty)*0.007, 0.06, 1.45);
  tx=t.clientX; ty=t.clientY; lastInteract=performance.now(); flying=false;
},{passive:false});
rend.domElement.addEventListener("touchend",e=>{
  const wasDrag=tDrag; tDrag=false; pinchD=0;
  if(!wasDrag || e.changedTouches.length!==1) return;
  const t=e.changedTouches[0];
  const moved=Math.hypot(t.clientX-tStartX, t.clientY-tStartY);
  const held=performance.now()-tStartT;
  if(moved>12 || held>600) return;                       // 회전 제스처였다
  const p = pickAny({clientX:t.clientX, clientY:t.clientY}); if(!p) return;
  if(p.part) select(p.part);
  else if(p.proxy && level===0) goFocus(p.proxy.userData.id);
  else if(p.proxy) setCard(p.proxy.userData.id);
},{passive:true});
rend.domElement.addEventListener("mousemove",e=>{
  if(drag){ labelEl.style.display="none"; return; }
  const p = pickAny(e);
  if(p && p.part){ labelEl.style.display="block"; labelEl.textContent = PARTS[p.part].icon+" "+PARTS[p.part].name;
         labelEl.style.left=e.clientX+"px"; labelEl.style.top=e.clientY+"px";
         rend.domElement.style.cursor="pointer"; setHover(null); }
  else if(p && p.proxy){ labelEl.style.display="block"; labelEl.textContent = p.proxy.userData.label;
         labelEl.style.left=e.clientX+"px"; labelEl.style.top=e.clientY+"px";
         rend.domElement.style.cursor="pointer"; setHover(p.proxy); if(level===0) setCard(p.proxy.userData.id); }
  else { labelEl.style.display="none"; rend.domElement.style.cursor="grab"; setHover(null); if(level===0) setCard(focusId||"TOOL"); }
});

/* ── 실행 결과 → 3D 반영 (render(d)가 호출). null 값은 건드리지 않는다 ── */
const PAD_COLD = new THREE.Color(0xffffff), PAD_HOT = new THREE.Color(0xff9a7a);
let tauSpread = 1.0;
function applyResult(d){
  if(!d) return;
  const eq = d.equipment_outputs||{}, fs = d.factors||{};
  const T = eq.pad_temp_c && eq.pad_temp_c.value;
  if(typeof T==="number" && isFinite(T)){                     // 22°C 기준 → 120°C 붉게
    const k = THREE.MathUtils.clamp((T-22)/(120-22), 0, 1);
    padMat.color.copy(PAD_COLD).lerp(PAD_HOT, k*0.85);
    padSideMat.color.set(0x8c8c62).lerp(PAD_HOT, k*0.6);
  }
  const mr = d.mean_mrr_nm_min;
  if(typeof mr==="number" && isFinite(mr))
    waferMat.emissiveIntensity = THREE.MathUtils.clamp(mr/260, .12, 1.1);
  const tau = fs.tau && fs.tau.value;
  if(typeof tau==="number" && isFinite(tau) && tau>0)         // τ(슬러리 전달) → 퍼짐 속도 가중
    tauSpread = THREE.MathUtils.clamp(Math.pow(tau, 0.6), 0.5, 1.8);
}
window.applyResult = applyResult;

/* ══════════════════════════════════════════════════════════════
   애니메이션 — 실제 설정값에 반응한다 (rpm/sfr/duty/pressure/downforce/center_offset)
   ══════════════════════════════════════════════════════════════ */
let t=0, condPhi=0.25, headSag=0, diskSag=0;
/* 캐러셀 인덱싱: dwell → 90° CCW 회전(3 s) → dwell … Level 1 에서는 dwell 에 고정 */
const CAR_DWELL = 7.0, CAR_ROT = 3.0;
let carAng = 0, carIdx = 0, carPhase = 0, carT = 0;
const CLEAN_CYC = 8.0;
function easeIO(u){ return u<.5 ? 2*u*u : 1-Math.pow(-2*u+2,2)/2; }
function tick(){
  requestAnimationFrame(tick);
  const dt=0.016; t+=dt;
  const rpmP = num("rpm_platen", 55), rpmW = num("rpm_wafer", 60);
  const sfr  = num("sfr_ml_min", 150), duty = num("cond_duty_pct", 100);
  const psi  = num("pressure_psi", 3), lbf = num("cond_downforce_lbf", 6);
  const rcc  = num("center_offset_m", 0.18);
  const SLOW = 0.10;                                   // 화면용 감속 배율
  const wP = rpmP/60*dt*2*Math.PI*SLOW, wW = rpmW/60*dt*2*Math.PI*SLOW;

  /* ── 카메라 이징 + Level 0 자동 오빗 ── */
  const idle = performance.now() - lastInteract;
  if(level===0 && !drag && idle > 4000 && !flying) camGoal.yaw += 0.0012;
  const k = flying ? 0.055 : 0.28;
  camCur.yaw += (camGoal.yaw-camCur.yaw)*k; camCur.pitch += (camGoal.pitch-camCur.pitch)*k;
  camCur.dist += (camGoal.dist-camCur.dist)*k; camCur.target.lerp(camGoal.target, k);
  if(flying && Math.abs(camGoal.dist-camCur.dist)<0.01 && camCur.target.distanceTo(camGoal.target)<0.01) flying = false;
  place();

  /* ── 셸 페이드 ── */
  shellGoals();
  for(const id in blocks){
    const b = blocks[id]; b.op += (b.goal-b.op)*0.10;
    b.panel.opacity = b.op; b.band.opacity = b.op; b.trim.opacity = b.op<0.6 ? 0 : b.op; b.glass.opacity = 0.22*b.op;
    b.grp.visible = b.op > 0.02;
    b.panel.depthWrite = b.op > 0.95;
  }

  /* ── 폴리싱: P1 상세 (기존) ── */
  platenGrp.rotation.y  += wP;                         // 플래튼
  carrierGrp.rotation.y += wW;                         // 헤드: 플래튼과 **같은 방향** (문헌)
  const rccU = THREE.MathUtils.clamp(rcc, 0.10, 0.30)/U;
  carrierGrp.position.x += (rccU-carrierGrp.position.x)*0.1; headMount.position.x = carrierGrp.position.x;
  /* 하중 → 눌림 변위 (보간). pressure_psi: 헤드 전체가 내려가 링이 패드에 파묻힘. cond_downforce: 디스크 눌림 */
  const sagT = THREE.MathUtils.clamp((psi-0.5)/7.5, 0, 1)*0.028;        // 0~0.028 unit (패드 압축)
  const dskT = THREE.MathUtils.clamp(lbf/12, 0, 1)*0.016;
  headSag += (sagT-headSag)*0.08; diskSag += (dskT-diskSag)*0.08;
  carrierGrp.position.y = -headSag; headMount.position.y = -headSag;
  diskSpin.position.y = -diskSag;
  film.position.y = PAD_TOP+0.004 - headSag*0.2;
  /* 컨디셔너: duty 0이면 스윕·자전 모두 멈춘다. 암은 플래튼 밖 피벗을 중심으로 중심↔가장자리 왕복 */
  if(duty>0){
    condPhi = 0.25 + 0.27*Math.sin(t*0.5);
    diskSpin.rotation.y += 95/60*dt*2*Math.PI*SLOW;
  }
  condGrp.rotation.y = COND_YAW0 + condPhi;
  /* P2/P3 간략 플래튼·컨디셔너 (같은 rpm/duty) */
  for(const id of ["P2","P3"]) pm.platens[id].spin.rotation.y += wP;
  pm.conds.forEach((c,i)=>{ c.carm.rotation.y = c.yaw0 + (duty>0 ? 0.30*Math.sin(t*0.5+i*1.3) : 0.30); if(duty>0) c.dsk.rotation.y += 95/60*dt*2*Math.PI*SLOW; });

  /* ── 캐러셀 인덱싱 (TS→P1→P2→P3, 위에서 반시계) ── */
  const hold = level===1;
  carT += dt;
  if(carPhase===0 && carT>CAR_DWELL && !hold){ carPhase = 1; carT = 0; }
  if(carPhase===1){
    const u = Math.min(carT/CAR_ROT, 1); carAng = (carIdx + easeIO(u))*Math.PI/2;
    if(u>=1){ carIdx++; carPhase = 0; carT = 0; carAng = carIdx*Math.PI/2; }
  }
  pm.car.rotation.y = carAng;
  const dwell = carPhase===0;
  const iP1 = ((1-carIdx)%4+4)%4;                      // 지금 P1 위에 있는 헤드
  pm.arms.forEach(a=>{
    const st = ((a.i+carIdx)%4+4)%4;                   // 0 TS, 1 P1, 2 P2, 3 P3
    const sweep = (dwell && (st===2||st===3)) ? 0.10*Math.sin(t*Math.PI) : 0;
    a.slide.position.x = LAY.CAR.R - THREE.MathUtils.clamp(rcc,0.10,0.30) + sweep;
    a.head.rotation.y += wW;
    a.head.visible = !(dwell && a.i===iP1);            // P1 dwell 중엔 상세 캐리어가 대신 보인다
    a.head.position.y = st===0 && dwell ? 0.02 : (dwell ? 0 : 0.006);   // TS 에서 살짝 들림, 이동 중 6 mm
  });
  carrierGrp.visible = headMount.visible = dwell;
  pm.tsArm.rotation.y = 0.6*Math.sin(t*0.4);
  pm.ts.lift.position.y = LAY.TABLE_Z + 0.05 + 0.02*(0.5+0.5*Math.sin(t*0.8));

  /* ── FI / 웻 로봇 ── */
  scaraBots.forEach((b,i)=>{ const ph = t*0.35 + i*2.1;
    b.g.position.x = (i===0 ? LAY.DR.x : LAY.WR.x) + (i===0 ? 0.5 : 0.6)*Math.sin(ph);
    b.a1.rotation.y = 0.9*Math.sin(ph*1.3); b.a2.rotation.y = -1.4*Math.sin(ph*1.3) ; b.eff.rotation.y = 0.5*Math.sin(ph*1.3); });

  /* ── 클리너 사이클 (8 s): 0–5 공정, 5–7.6 5장 동시 한 피치 인덱스, 7.6–8 복귀 ── */
  const cph = t % CLEAN_CYC;
  clean.brushes.forEach(b=>{ b.rotation.y += 300/60*dt*2*Math.PI*SLOW; });
  let len = 0.10, hx = 0, carry = false, showMod = true;
  if(cph<5){ /* 공정 */ }
  else if(cph<5.6){ len = 0.10 + 0.52*easeIO((cph-5)/0.6); }
  else if(cph<6.2){ len = 0.62 - 0.52*easeIO((cph-5.6)/0.6); carry = true; showMod = false; }
  else if(cph<7.0){ hx = 0.30*easeIO((cph-6.2)/0.8); carry = true; showMod = false; }
  else if(cph<7.6){ hx = 0.30; len = 0.10 + 0.52*easeIO((cph-7.0)/0.6); carry = true; showMod = false; }
  else { hx = 0.30*(1-easeIO((cph-7.6)/0.4)); len = 0.62 - 0.52*easeIO((cph-7.6)/0.4); }
  clean.hnd.position.x = hx;
  clean.grippers.forEach((g,k)=>{ g.bar.scale.y = len; g.bar.position.y = -len/2; g.fork.position.y = -len; clean.carried[k].visible = carry; });
  clean.modules.forEach(m=>{
    if(!m.wafer) return;
    if(m.id==="IN"||m.id==="OUT"){
      /* 힌지 플립: OUT 은 수령 직후(7.6→) 수평으로, 1.5~2.5 s 에 드라이 로봇이 가져감(숨김). IN 은 수평으로 들어와 수직으로 */
      let ang, vis = true;
      if(m.id==="OUT"){ const u = THREE.MathUtils.clamp(cph/1.5, 0, 1); ang = easeIO(u); vis = cph<2.5 || cph>=7.6; if(cph>=7.6) ang = 0; }
      else { const u = THREE.MathUtils.clamp((cph-0.3)/1.5, 0, 1); ang = 1-easeIO(u); vis = cph<5.6 || cph>=7.6; if(cph>=7.6) ang = 1; }
      m.hinge.rotation.z = m.flipDir*ang*Math.PI/2; m.wafer.visible = vis;
    } else {
      m.wafer.visible = showMod;
      m.wafer.rotation.x += 60/60*dt*2*Math.PI*SLOW*3;                 // 롤러 구동 웨이퍼 회전
      if(m.id==="DRY"){ const u = THREE.MathUtils.clamp((cph-3.2)/1.8, 0, 1); m.wafer.position.y = 0.95 + 0.40*u; } // Marangoni 수직 인양
      else m.wafer.position.y = 0.95;
    }
  });

  /* ── 웨이퍼 흐름 안내 (Level 0 만) ── */
  const showFlow = level===0;
  flow.line.visible = showFlow;
  flow.tokens.forEach((m,k)=>{ m.visible = showFlow; if(showFlow) flowPose((t*1.6 + k*flow.total/flow.tokens.length) % flow.total, m); });

  /* ── 슬러리 입자: Level 1(P1) 에서만 ── */
  const partsOn = level===1 && focusId==="P1";
  slurryPts.visible = partsOn;
  const fs = THREE.MathUtils.clamp(0.35+sfr/400*0.65, 0.3, 1.0);
  film.scale.set(fs,fs,1); filmMat.opacity = 0.10+0.16*fs;
  puddle.scale.setScalar(0.6+sfr/400*0.8);
  if(partsOn){
    const active = Math.round(THREE.MathUtils.clamp(NP*sfr/400,60,NP));
    const spd = 0.55+sfr/260;
    for(let i=0;i<NP;i++){
      if(i>=active){ spos[i*3+1] = -99; continue; }
      if(sph[i]===0){                       // 낙하
        spos[i*3+1] -= svel[i]*spd*2.6;
        if(spos[i*3+1] <= PAD_TOP+0.012){ sph[i]=1; spos[i*3+1]=PAD_TOP+0.012; }
      } else {                              // 패드 위 확산 (플래튼 회전 + 원심)
        const x=spos[i*3], z=spos[i*3+2];
        const r=Math.hypot(x,z), a=Math.atan2(z,x)+wP;
        const nr = r + svel[i]*spd*0.85*tauSpread*(0.4+r/1.5);
        spos[i*3]=Math.cos(a)*nr; spos[i*3+2]=Math.sin(a)*nr;
        if(nr>1.5) seed(i,true);
      }
    }
    sgeo.attributes.position.needsUpdate = true;
  }
  rend.render(scene,cam);
}
function resize(){
  const w=view.clientWidth,h=view.clientHeight;
  cam.aspect=w/h; cam.updateProjectionMatrix();
  rend.setSize(w,h); rend.setPixelRatio(Math.min(devicePixelRatio,2));
  /* 파트 캔버스는 컨테이너 폭에 맞춰 잡히므로 화면이 바뀌면 반드시 다시 그려야 한다
     — 안 그리면 회전 후 폭이 어긋나 잘린 그림이 남는다(2026-09-11 모바일 대응).
     drawViz 는 함수 선언이 아래에 있어 호이스팅되므로 여기서 호출해도 안전하다. */
  if(typeof drawViz === "function") drawViz();
}
addEventListener("resize",resize); resize(); goLevel(0); camCur.target.copy(camGoal.target); camCur.dist = camGoal.dist; place(); tick();

/* 빌드 시각 표시 — 서버가 data-build 에 파일 수정 시각을 넣어준다.
   폰에서 캐시된 구버전을 보고 있는지 이걸로 판별한다(2026-09-11). */

  const bt = document.getElementById("buildTag");
