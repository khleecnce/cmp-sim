/* ─────────────────────────────────────────── 패널 */
function num(key, dflt){
  if(state.overrides[key]!==undefined) return state.overrides[key];
  if(state.base[key]!==undefined) return state.base[key];
  return dflt;
}
function select(p){ current=p; drawTabs(); drawPanel(); }

function drawTabs(){
  document.getElementById("tabs").innerHTML =
    Object.entries(PARTS).map(([k,v])=>
      `<div class="tab ${k===current?'on':''}" data-k="${k}">${v.icon} ${v.name}</div>`).join("");
  document.querySelectorAll(".tab").forEach(el=>
    el.onclick=()=>select(el.dataset.k));
}

function drawPanel(){
  const P = PARTS[current];
  let h = `<h3>${P.icon} ${P.name}</h3><div class="sub">${P.sub}</div>`;
  const deadCount = P.fields.filter(f=>f.dead && !f.section).length;
  if(deadCount){
    h += `<div class="banner">⚠ ${deadCount} input(s) in this part are <b>not wired to the engine</b>.
      Changing them does not change the result — shown anyway rather than pretending. See the orange notes below.</div>`;
  }
  for(const f of P.fields){
    if(f.section){
      h += `<div class="sec" style="margin-top:14px">${f.section}</div>`;
      continue;
    }
    if(f.special==="data"){
      h += `
        <div id="drop" style="border:2px dashed var(--line);border-radius:8px;padding:22px 12px;
             text-align:center;color:var(--dim);cursor:pointer;margin-bottom:12px">
          <div style="font-size:22px">📂</div>
          <div><b>Drop a measurement file here, or click</b></div>
          <div class="meta">xlsx · csv · json — column names in Korean or English (pressure/psi/downforce, pre/initial, post/remaining…)</div>
          <input type="file" id="fileIn" accept=".xlsx,.xls,.csv,.json,.tsv,.txt" style="display:none">
        </div>
        <div class="fld"><label><span>Pack (film) for this measurement</span></label>
          <select id="imp-pack">${(state.packGroups&&state.packGroups.length
            ? state.packGroups
            : [{family:"", packs:state.packs}]).map(g=>{
              const inner = g.packs.map(p=>
                `<option value="${p.id}" ${p.id===state.pack?"selected":""}>${p.short||p.label||p.id}</option>`).join("");
              return g.family ? `<optgroup label="${g.family}">${inner}</optgroup>` : inner;
            }).join("")}</select>
          <div class="meta">Calibration is per pack — ceria measurements must not move the silica Kp.</div></div>
        <div id="impResult"></div>
        <div class="sec" style="margin-top:14px">Database</div>
        <div id="dbStats" class="meta">Loading…</div>
        <div class="sec" style="margin-top:14px">Measurement → Kp calibration (${(state.packs.find(p=>p.id===state.pack)||{}).short||state.pack})</div>
        <div id="calib" class="meta">Loading…</div>
        <div class="sec" style="margin-top:14px">Recent runs</div>
        <div id="runList" class="meta"></div>`;
      continue;
    }
    if(f.special==="rotation"){
      /* P/H 한 칸 — 실제 레시피 표기(예: 55/60)와 같은 형태 */
      const p = num("rpm_platen", 55), hh = num("rpm_wafer", 60);
      h += `<div class="fld">
        <label><span>${f.l}</span>
          <span class="val"><span id="v-rpm_platen">${p}</span> / <span id="v-rpm_wafer">${hh}</span> rpm</span></label>
        <div style="display:flex;gap:8px;align-items:center">
          <span style="width:14px;color:var(--dim);font-size:11px">P</span>
          <input type="range" id="r-rpm_platen" min="${f.min}" max="${f.max}" step="${f.step}" value="${p}" style="flex:1">
        </div>
        <div style="display:flex;gap:8px;align-items:center;margin-top:3px">
          <span style="width:14px;color:var(--dim);font-size:11px">H</span>
          <input type="range" id="r-rpm_wafer" min="${f.min}" max="${f.max}" step="${f.step}" value="${hh}" style="flex:1">
        </div>
        ${f.hint?`<div class="meta">${f.hint}</div>`:""}
      </div>`;
      continue;
    }
    if(f.special==="pack"){
      /* 슬러리 선택 — 막질군(optgroup)으로 묶고 사람이 읽는 이름을 쓴다.
         사용자 지시(2026-09-11): "sic_ceria_h2o2 이러면 보기도안좋고 너무 국부적이야".
         내부 ID는 파일명·검증데이터에 묶여 있어 그대로 두고 표시만 바꾼다. */
      const groups = state.packGroups && state.packGroups.length
        ? state.packGroups
        : [{family:"", packs:state.packs}];
      const opts = groups.map(g=>{
        const inner = g.packs.map(p=>
          `<option value="${p.id}" ${p.id===state.pack?"selected":""}>${p.label||p.id}</option>`
        ).join("");
        return g.family ? `<optgroup label="${g.family}">${inner}</optgroup>` : inner;
      }).join("");
      const cur = state.packs.find(p=>p.id===state.pack) || {};
      h += `<div class="fld"><label><span>${f.l}</span></label>
        <select id="sel-pack">${opts}</select>
        <div class="packcard" id="packCard">
          ${cur.film_label?`<div class="row"><span class="k">막질</span><span class="v">${cur.film_label}</span></div>`:""}
          ${cur.mechanism?`<div class="row"><span class="k">제거 기구</span><span class="v">${cur.mechanism}</span></div>`:""}
          ${cur.chem?`<div class="row"><span class="k">연마입자·케미컬</span><span class="v">${cur.chem}</span></div>`:""}
          ${cur.note?`<div class="note">${cur.note}</div>`:""}
          <div class="idline">pack id <code>${cur.id||state.pack}</code></div>
        </div>
        <div class="meta">Changing the film swaps <b>one parameter pack</b>. No code changes.</div></div>`;
      continue;
    }
    if(f.special==="npw"){
      h += `<div class="fld"><label><span>${f.l}</span></label>
        <div id="npwBox"><div class="meta">Loading NPW catalog…</div></div></div>`;
      continue;
    }
    if(f.special==="select"){
      state.recorded = state.recorded||{};
      const cur = state.recorded[f.k] ?? f.options[0][0];
      h += `<div class="fld"><label><span>${f.l}</span></label>
        <select id="s-${f.k}" data-k="${f.k}" class="recSel">${f.options.map(([v,l])=>
          `<option value="${v}" ${v===cur?"selected":""}>${l}</option>`).join("")}</select>
        ${f.dead?`<div class="meta dead">⚠ not wired: ${f.dead}</div>`:""}
        ${f.closed?`<div class="meta closed">⏹ closed by evidence ruling: ${f.closed}</div>`:""}
        ${f.weak?`<div class="meta weak">${f.weak}</div>`:""}
        ${f.hint?`<div class="meta">${f.hint}</div>`:""}</div>`;
      continue;
    }
    if(f.special==="perf"){
      h += `<div id="perf-${f.part}"><div class="meta">Loading…</div></div>`;
      continue;
    }
    if(f.special==="additives"){
      h += `<div id="addBox"><div class="meta">Loading additive catalog…</div></div>`;
      continue;
    }
    /* ── 파트 전용 시각화 (2026-09-11 사용자 지시) ───────────────────
       캔버스만 심고 그림은 drawViz()가 그린다. 값이 바뀌면 다시 그린다. */
    if(f.special==="sdsflow"){
      h += `<div class="viz" id="viz-sds"><div id="pidBox"></div>
        <div class="cap" id="cap-sds"></div></div>`;
      continue;
    }
    if(f.special==="padsection"){
      h += `<div class="viz"><canvas id="cv-padsec" data-h="230"></canvas>
        <div class="cap" id="cap-padsec"></div></div>`;
      continue;
    }
    if(f.special==="padasperity"){
      h += `<div class="viz"><canvas id="cv-padasp" data-h="250"></canvas>
        <div class="cap" id="cap-padasp"></div></div>`;
      continue;
    }
    if(f.special==="padlife"){
      h += `<div class="viz"><canvas id="cv-padlife" data-h="210"></canvas>
        <div class="cap" id="cap-padlife"></div></div>`;
      continue;
    }
    if(f.special==="diskgrit"){
      h += `<div class="viz"><canvas id="cv-diskgrit" data-h="300"></canvas>
        <div class="cap" id="cap-diskgrit"></div></div>`;
      continue;
    }
    if(f.special==="diskpcr"){
      h += `<div class="viz"><canvas id="cv-diskpcr" data-h="230"></canvas>
        <div class="cap" id="cap-diskpcr"></div></div>`;
      continue;
    }
    if(f.special==="foup"){
      h += `<div class="foupbar">
          <button data-fa="fill-npw">Fill all · NPW</button>
          <button data-fa="fill-ptw">Fill all · PTW</button>
          <button data-fa="clear">Clear all but slot 1</button>
        </div>
        <div class="foup" id="foupGrid"></div>
        <div class="cap" id="cap-foup" style="color:var(--dim);font-size:11px"></div>`;
      continue;
    }
    const isTime = f.special==="time", isThick = f.special==="thick";
    const recorded = f.pk===null;
    const cur = isTime ? state.time_s
              : isThick ? state.initial_thickness_nm
              : recorded ? ((state.recorded||{})[f.k] ?? f.min)
              : num(f.k, f.min);
    const fmt = f.fmt || (v=>(+v).toFixed(String(f.step).includes(".")?2:0));
    h += `<div class="fld">
      <label><span>${f.l}</span><span class="val" id="v-${f.k}">${fmt(cur)} ${f.u||""}</span></label>
      <input type="range" id="r-${f.k}" min="${f.min}" max="${f.max}" step="${f.step}" value="${cur}">
      ${f.dead?`<div class="meta dead">⚠ not wired: ${f.dead}</div>`:""}
        ${f.closed?`<div class="meta closed">⏹ closed by evidence ruling: ${f.closed}</div>`:""}
      ${f.weak?`<div class="meta weak">${f.weak}</div>`:""}
      ${f.hint?`<div class="meta">${f.hint}</div>`:""}
    </div>`;
  }
  h += `<button class="btn" id="reset">Reset to baseline</button>`;
  document.getElementById("body").innerHTML = h;

  /* P/H 회전 두 슬라이더 — 각각 팩 키로 바인딩 */
  for(const key of ["rpm_platen","rpm_wafer"]){
    const el = document.getElementById("r-"+key);
    if(!el) continue;
    el.oninput = ()=>{
      const v = parseFloat(el.value);
      document.getElementById("v-"+key).textContent = v.toFixed(0);
      state.overrides[key] = v;
      run();
    };
  }
  for(const f of P.fields){
    if(f.section || f.special==="rotation") continue;
    const el = document.getElementById("r-"+f.k);
    if(!el) continue;
    const fmt = f.fmt || (v=>(+v).toFixed(String(f.step).includes(".")?2:0));
    el.oninput = ()=>{
      const v = parseFloat(el.value);
      document.getElementById("v-"+f.k).textContent = fmt(v)+" "+(f.u||"");
      if(f.special==="time") state.time_s = v;
      else if(f.special==="thick") state.initial_thickness_nm = v;
      else if(f.pk===null){ state.recorded[f.k] = v; drawViz(); return; }   /* recorded only — never sent to engine */
      else state.overrides[f.k] = v;
      if(f.k==="groove_pitch_mm"||f.k==="groove_depth_mm")
        buildGrooves(num("groove_pitch_mm",3.05), num("groove_depth_mm",0.76));
      if(f.k==="asperity_density_per_m2") buildGrits(v);
      drawViz();      /* 값이 바뀌면 파트 그림도 따라 바뀐다 */
      run();
    };
  }
  document.querySelectorAll(".recSel").forEach(sel=>{
    sel.onchange = ()=>{
      state.recorded[sel.dataset.k] = sel.value;
      if(sel.dataset.k==="abrasive_type"){
        /* 입자 종류는 팩을 정한다 — 자유 슬라이더가 아니다 */
        const map = {ceria:"sti_ceria", colloidal_silica:"oxide_silica", fumed_silica:"oxide_silica"};
        const target = map[sel.value];
        if(target && state.packs.some(p=>p.id===target) && target!==state.pack){
          state.pack = target; state.overrides = {}; boot();
        }
      }
    };
  });
  if(document.getElementById("addBox")) drawAdditives();
  if(document.getElementById("npwBox")) drawNPW();
  for(const part of ["pad","disk"]) if(document.getElementById("perf-"+part)) drawPerf(part);
  drawViz();          /* 파트 전용 시각화 — 캔버스가 심긴 파트에서만 그린다 */
  wireFoup();         /* FOUP 슬롯 클릭·일괄버튼 */
  const sp=document.getElementById("sel-pack");
  if(sp) sp.onchange=()=>{ state.pack=sp.value; state.overrides={}; boot(); };
  const sw=document.getElementById("sel-wafer");
  if(sw) sw.onchange=()=>{ state.wafer=sw.value; run(); };
  if(document.getElementById("drop")) wireDataTab();
  document.getElementById("reset").onclick=()=>{ state.overrides={}; drawPanel(); run(); };
}

/* ══════════════════════════════════════════════════════════════════════
   파트 전용 시각화 — 2026-09-11 사용자 지시
     "슬러리 공급장치 만들어서 슬러리 정보입력 ui를 따로만들어.
      Pad/disk ui도 따로만들어, wafer는 loading unit쪽에서 입력"

   설계 원칙 (다른 UI와 같다): **엔진에 붙지 않은 것은 붙은 척하지 않는다.**
   그림도 마찬가지다 — dead 파라미터로 그린 형상은 점선/회색으로 그려서
   "보이지만 결과를 바꾸지 않는다"를 시각적으로 구분한다.
   ══════════════════════════════════════════════════════════════════════ */
const VC = {fg:"#e6edf3", dim:"#8b9cb0", line:"#243141", accent:"#4da3ff",
            warn:"#ffb454", bad:"#ff6b6b", good:"#5ddc9a", panel:"#131a23"};

/* 캔버스를 컨테이너 폭에 맞추고 DPR 로 선명하게 잡는다.
   ⚠ 왜 필요한가: width=640 고정 캔버스를 CSS width:100% 로 늘리면 폰(360px)에서
   0.56배로 축소된다 → 9px 글자가 5px이 되어 못 읽는다. 논리 좌표를 CSS px 와
   일치시켜야 글자 크기가 의도대로 유지된다(2026-09-11 모바일 대응).
   반환 W/H 는 **CSS px 기준 논리 크기**다. */
function cv(id, hCss){
  const c = document.getElementById(id);
  if(!c) return null;
  const host = c.parentElement;
  const cssW = Math.max(Math.floor((host && host.clientWidth ? host.clientWidth : 0) - 18), 280) || 620;
  const cssH = hCss || Math.round(+c.dataset.h || 230);
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  if(c.width !== Math.round(cssW*dpr) || c.height !== Math.round(cssH*dpr)){
    c.width = Math.round(cssW*dpr); c.height = Math.round(cssH*dpr);
  }
  c.style.width = cssW+"px"; c.style.height = cssH+"px";
  const g = c.getContext("2d");
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,cssW,cssH);
  return {c, g, W:cssW, H:cssH, narrow: cssW < 470};
}
function axes(g, x0, y0, x1, y1, xlab, ylab){
  g.strokeStyle = VC.line; g.lineWidth = 1;
  g.beginPath(); g.moveTo(x0,y0); g.lineTo(x0,y1); g.lineTo(x1,y1); g.stroke();
  g.fillStyle = VC.dim; g.font = "10px sans-serif";
  if(xlab){ g.textAlign="center"; g.fillText(xlab, (x0+x1)/2, y1+26); }
  if(ylab){ g.save(); g.translate(x0-30,(y0+y1)/2); g.rotate(-Math.PI/2);
            g.textAlign="center"; g.fillText(ylab,0,0); g.restore(); }
  g.textAlign="start";
}
/* 폭에 맞춰 줄바꿈해 그린다 — 폰에서 한 줄 텍스트는 그냥 잘려 나간다 */
function wrapText(g, text, x, y, maxW, lh){
  const words = String(text).split(" ");
  let line = "", yy = y;
  for(const w of words){
    const test = line ? line+" "+w : w;
    if(g.measureText(test).width > maxW && line){ g.fillText(line, x, yy); line = w; yy += lh; }
    else line = test;
  }
  if(line) g.fillText(line, x, yy);
  return yy + lh;
}

/* ── ② Slurry Delivery — P&ID 흐름도 ───────────────────────────────── */
function drawSDS(){
  const box = document.getElementById("pidBox");
  if(!box) return;
  const rec = state.recorded||{};
  const sfr  = num("sfr_ml_min", 200);
  const diw  = rec.diw_flow_ml_min ?? 0;
  const filt = rec.filter_rating_um ?? 1.0;
  const pump = rec.pump_type ?? "diaphragm";
  const d50  = num("abrasive_size_nm", 50);
  const d99  = num("abrasive_d99_nm", d50*5);
  const wt   = num("abrasive_wt_pct", 10);
  /* 희석 후 유효 농도 — dead 이지만 '만약 붙는다면' 값을 보여준다(회색) */
  const wtEff = diw>0 ? wt*sfr/(sfr+diw) : wt;
  const N = [
    {ic:"🛢", l:"Drum / IBC", v:`${wt.toFixed(1)} wt%`, dead:false},
    {ic:"🌀", l:"Blend Tank", v:`${rec.blend_tank_l??200} L`, dead:true},
    {ic:"⊚", l:"Pump", v:pump.replace(/_/g," "), dead:true},
    {ic:"▦", l:"Filter", v:`${(+filt).toFixed(1)} µm abs`, dead:true},
    {ic:"◈", l:"Flow Meter", v:`${sfr} mL/min`, dead:false},
    {ic:"💧", l:"Arm Nozzle", v:diw>0?`+${diw} DIW`:"no dilution", dead:diw>0},
  ];
  box.innerHTML = `<div class="pid">` + N.map((n,i)=>
      `${i?'<div class="ar">→</div>':''}<div class="nd ${n.dead?'dead':''}">
         <span class="ic">${n.ic}</span>${n.l}<div class="vl">${n.v}</div></div>`
    ).join("") + `</div>`;
  const cap = document.getElementById("cap-sds");
  if(cap){
    const cut = d99 > filt*1000;
    cap.innerHTML =
      `Solid boxes are wired to the engine; <b>dashed boxes are recorded only</b> — they draw here but do not move the result.
       <br>Abrasive as mixed <b>${wt.toFixed(1)} wt%</b>${diw>0?` → after ${diw} mL/min DIW the pad would see <b>${wtEff.toFixed(2)} wt%</b>, but the engine still uses ${wt.toFixed(1)} wt% (dilution not modeled)`:``}.
       <br>Filter ${(+filt).toFixed(1)} µm vs. slurry tail D99 ${d99.toFixed(0)} nm —
       ${cut?`<span style="color:var(--warn)">the tail is coarser than the filter rating, so a real POU filter would cut it. Our D99 is derived (D50 × 5.00) and filter-independent, so Δ (Damage) does not see this.</span>`
            :`<span style="color:var(--good)">tail is finer than the rating; nothing to retain.</span>`}
       <br>This is the one gap worth closing: <b>Δ consumes D99, and in a fab the filter sets D99.</b>`;
  }
}

/* ── ④ Pad ① 그루브 단면도 ────────────────────────────────────────── */
function drawPadSection(){
  const o = cv("cv-padsec", 230); if(!o) return;
  const {g,W,H,narrow} = o;
  const pitch = num("groove_pitch_mm", 3.05);      // mm
  const depth = num("groove_depth_mm", 0.76);      // mm
  const wid   = num("groove_width_um", 600)/1000;  // mm
  const por   = num("pad_porosity_pct", 30);
  const padT  = 1.27;                              // mm, IC1000 전형 두께
  const spanMM = Math.max(pitch*3.2, 8);
  /* 좁은 화면에서는 η 인셋을 오른쪽에 둘 자리가 없다 → 단면을 전폭으로 쓰고
     인셋은 아래쪽 절반에 깐다. 겹치면 둘 다 못 읽는다. */
  const INSET_W = narrow ? 0 : 200;
  const secW = W - 60 - INSET_W - (narrow?10:16);
  const sx = secW/spanMM, x0 = narrow ? 34 : 50;
  const sy = narrow ? 34 : 46;
  const yTop = narrow ? 56 : 118, yBot = yTop + padT*sy;

  /* 패드 본체 */
  g.fillStyle = "#2b3a4d"; g.fillRect(x0, yTop, secW, padT*sy);
  /* 기공 — 기공률에 비례한 개수. 문헌: 평균 직경 ~30 µm(Sikder 2001) */
  const nPore = Math.round(por*5);
  g.fillStyle = "rgba(11,15,20,.55)";
  for(let i=0;i<nPore;i++){
    const px = x0+4+Math.random()*(secW-8), py = yTop+3+Math.random()*(padT*sy-6);
    g.beginPath(); g.arc(px,py, 1.1+Math.random()*1.5, 0, 7); g.fill();
  }
  /* 그루브 — pitch 간격으로 폭 wid, 깊이 depth */
  let nG = 0, firstGx = null;
  for(let mm=pitch/2; mm<spanMM; mm+=pitch){
    const gx = x0+mm*sx, gw = Math.max(wid*sx, 1.5);
    if(gx-gw/2 < x0 || gx+gw/2 > x0+secW) continue;
    g.fillStyle = "#0b0f14"; g.fillRect(gx-gw/2, yTop, gw, depth*sy);
    g.strokeStyle = "rgba(255,180,84,.75)"; g.lineWidth = 1;
    g.strokeRect(gx-gw/2, yTop, gw, depth*sy);
    if(firstGx===null) firstGx = gx;
    nG++;
  }
  /* 치수선 — 폭은 첫 그루브를 지시선으로 정확히 가리킨다 */
  if(firstGx!==null){
    const gw = Math.max(wid*sx, 1.5);
    g.strokeStyle = VC.warn; g.lineWidth = 1;
    g.beginPath(); g.moveTo(firstGx, yTop-4); g.lineTo(firstGx, yTop-16); g.stroke();
    g.beginPath(); g.moveTo(firstGx-gw/2, yTop-4); g.lineTo(firstGx-gw/2, yTop-10);
                   g.moveTo(firstGx+gw/2, yTop-4); g.lineTo(firstGx+gw/2, yTop-10); g.stroke();
    g.fillStyle = VC.warn; g.font = "10px sans-serif"; g.textAlign="center";
    g.fillText(`width ${(wid*1000).toFixed(0)} µm`, firstGx, yTop-20);
  }
  g.strokeStyle = VC.accent; g.lineWidth = 1; g.setLineDash([3,3]);
  const a = x0+(pitch/2)*sx, b = a+pitch*sx;
  g.beginPath(); g.moveTo(a, yBot+12); g.lineTo(b, yBot+12); g.stroke();
  g.setLineDash([]);
  g.fillStyle = VC.accent; g.font = "10px sans-serif"; g.textAlign="center";
  g.fillText(`pitch ${pitch.toFixed(2)} mm`, (a+b)/2, yBot+25);
  g.textAlign="start";
  g.fillStyle = VC.dim; g.font = "10px sans-serif";
  wrapText(g, `depth ${depth.toFixed(2)} mm / pad ${padT} mm · porosity ${por.toFixed(0)}% (pores ~30 µm, Sikder 2001)`,
           x0, yBot+42, W-x0-8, 12);

  /* η(그루브 폭) 곡선 — Mu 2016 실측 3점. 넓으면 오른쪽, 좁으면 단면 아래 */
  const capLines = Math.ceil(g.measureText(`depth ${depth.toFixed(2)} mm / pad ${padT} mm · porosity ${por.toFixed(0)}% (pores ~30 µm, Sikder 2001)`).width / (W-x0-8));
  const ex0 = narrow ? x0 : W-INSET_W-10;
  const ey0 = narrow ? yBot+42+capLines*12+14 : 34;
  const ew  = narrow ? secW : INSET_W-24;
  const eh  = narrow ? Math.max(H-ey0-8, 40) : 92;
  const EW = [300,600,900], EV = [0.099,0.134,0.128];
  g.fillStyle = "#0f1620"; g.fillRect(ex0, ey0, ew, eh);
  g.strokeStyle = VC.line; g.strokeRect(ex0, ey0, ew, eh);
  g.fillStyle = VC.dim; g.font="9px sans-serif";
  g.fillText("η slurry utilisation (Mu 2016)", ex0, ey0-6);
  const px = w => ex0 + (w-200)/(1200-200)*ew;
  const py = v => ey0+eh-14 - (v-0.08)/(0.15-0.08)*(eh-24);
  g.strokeStyle = VC.accent; g.lineWidth=1.5; g.beginPath();
  EW.forEach((w,i)=> i?g.lineTo(px(w),py(EV[i])):g.moveTo(px(w),py(EV[i]))); g.stroke();
  EW.forEach((w,i)=>{ g.fillStyle=VC.accent; g.beginPath(); g.arc(px(w),py(EV[i]),2.5,0,7); g.fill();
    g.fillStyle=VC.dim; g.font="8px sans-serif"; g.textAlign="center";
    g.fillText(String(w), px(w), ey0+eh-3); });
  g.textAlign="start";
  const wUm = wid*1000, clamped = wUm<300||wUm>900;
  const cw = Math.min(Math.max(wUm,300),900);
  const cvv = cw<=600 ? EV[0]+(cw-300)/300*(EV[1]-EV[0]) : EV[1]+(cw-600)/300*(EV[2]-EV[1]);
  g.fillStyle = clamped?VC.warn:VC.good;
  g.beginPath(); g.arc(px(cw), py(cvv), 4, 0, 7); g.fill();
  g.font="8px sans-serif"; g.fillText("µm", ex0+ew-14, ey0+eh-3);

  const cap = document.getElementById("cap-padsec");
  if(cap) cap.innerHTML =
    `${nG} grooves across ${spanMM.toFixed(1)} mm of pad. <b>Width is the only groove dimension wired to τ</b> —
     depth and pitch redraw this section but do not move MRR (no literature held that quantifies them).
     <br>η marker: ${clamped?`<span style="color:var(--warn)">${wUm.toFixed(0)} µm is outside the measured 300–900 µm band, so the end value is held (no extrapolation)</span>`
                            :`<span style="color:var(--good)">η = ${(cvv*100).toFixed(1)}% at ${wUm.toFixed(0)} µm</span>`}.
     Note the curve <b>turns over at 600 µm</b> — wider grooves are not better.`;
}

/* ── ④ Pad ② asperity 통계 (GW) — η 500배 오류가 눈에 보이는 자리 ──── */
function drawPadAsperity(){
  /* 폰에서는 η 후보 3개를 바 아래 범례로 쌓으므로 그만큼 높인다 */
  const el0 = document.getElementById("cv-padasp"); if(!el0) return;
  const nw = ((el0.parentElement && el0.parentElement.clientWidth || 620) - 18) < 470;
  const o = cv("cv-padasp", nw ? 300 : 250); if(!o) return;
  const {g,W,H,narrow} = o;
  const eta = num("asperity_density_per_m2", 1e11);   // 1/m²
  const R   = num("pad_asperity_radius_m", 5e-6);     // m
  const spacing = 1/Math.sqrt(eta);                   // m — 평균 asperity 간격
  const ratio = spacing/(2*R);                        // <1 이면 반구가 겹친다
  const bad = ratio < 1;

  /* 위: 단면 프로파일 — 실제 비율로 반구를 그린다 */
  const xs = narrow ? 10 : 40, xw = W - xs*2;
  const y0 = narrow ? 104 : 96;
  const viewMM = 0.25;                                 // 250 µm 시야
  const pxPerM = xw/(viewMM/1000);
  g.strokeStyle = VC.line; g.beginPath(); g.moveTo(xs,y0); g.lineTo(xs+xw,y0); g.stroke();
  const rpx = Math.min(R*pxPerM, 60);
  const spx = Math.max(spacing*pxPerM, 0.8);
  let n=0;
  for(let x=xs; x<xs+xw && n<4000; x+=spx, n++){
    g.beginPath(); g.arc(x, y0, rpx, Math.PI, 0);
    g.fillStyle = bad ? "rgba(255,107,107,.30)" : "rgba(93,220,154,.30)";
    g.fill();
    g.strokeStyle = bad ? "rgba(255,107,107,.75)" : "rgba(93,220,154,.75)";
    g.lineWidth = 0.7; g.stroke();
  }
  g.fillStyle = VC.dim; g.font="10px sans-serif";
  let ty = 14;
  ty = wrapText(g, `cross-section over ${(viewMM*1000).toFixed(0)} µm · ${n} asperities · spacing 1/√η = ${(spacing*1e6).toFixed(2)} µm · R = ${(R*1e6).toFixed(1)} µm`,
                xs, ty, xw, 12);
  g.fillStyle = bad?VC.bad:VC.good;
  wrapText(g, bad ? `⚠ spacing / 2R = ${ratio.toFixed(3)} < 1 → hemispheres interpenetrate. Geometrically impossible.`
                  : `spacing / 2R = ${ratio.toFixed(2)} ≥ 1 → asperities fit side by side.`,
           xs, ty, xw, 12);

  /* 아래: η 후보 비교 바 */
  const by = narrow ? 160 : 150, bh = narrow ? 46 : 58;
  const CANDS = [
    {v:2.0e8,  l:"2.0e8 — 5 independent sources\n(Bozkaya&Müftü, Sorooshian, Shi&Ring, Suzuki/Ebara)", ok:true},
    {v:2.938e11, l:"2.938e11 — Ring et al.\n(self-inconsistent per our note §2.7)", ok:false},
    {v:eta,    l:"current pack value", cur:true},
  ];
  const lo = Math.log10(1e7), hi = Math.log10(1e12);
  const bx = (v)=> xs + (Math.log10(v)-lo)/(hi-lo)*xw;
  g.strokeStyle = VC.line; g.beginPath(); g.moveTo(xs,by+bh); g.lineTo(xs+xw,by+bh); g.stroke();
  for(let e=7;e<=12;e++){
    const x = xs+(e-lo)/(hi-lo)*xw;
    g.strokeStyle="rgba(36,49,65,.7)"; g.beginPath(); g.moveTo(x,by); g.lineTo(x,by+bh); g.stroke();
    g.fillStyle=VC.dim; g.font="9px sans-serif"; g.textAlign="center"; g.fillText(`1e${e}`, x, by+bh+12);
  }
  g.textAlign="start";
  /* 라벨 배치. 폰에서는 1e11과 2.9e11이 로그축에서 거의 붙어 어떤 배치로도 겹친다
     → 좁으면 x를 버리고 바 아래에 범례로 쌓는다(색으로 선과 연결). */
  const placed = [];
  const sorted = CANDS.map(c=>({...c, x:bx(c.v)})).sort((a,b)=>a.x-b.x);
  sorted.forEach((c,i)=>{
    const x = c.x;
    const col = c.cur ? VC.accent : c.ok ? VC.good : VC.bad;
    g.strokeStyle = col; g.lineWidth = c.cur?2.5:1.5;
    g.setLineDash(c.cur?[]:[4,3]);
    g.beginPath(); g.moveTo(x,by); g.lineTo(x,by+bh); g.stroke(); g.setLineDash([]);
    const txt = c.cur ? `current η = ${c.v.toExponential(1)} /m²`
                      : c.ok ? "2.0e8 — 5 independent sources agree"
                             : "2.9e11 — Ring 2007 (self-inconsistent)";
    g.font = c.cur?"bold 10px sans-serif":"10px sans-serif";
    g.fillStyle = col;
    if(narrow){
      /* 범례: 축 아래 고정 위치. 왼쪽에 색 점을 찍어 위 세로선과 연결한다 */
      const ly = by+bh+30+i*14;
      g.beginPath(); g.arc(xs+4, ly-3, 3, 0, 7); g.fill();
      g.textAlign="start"; g.fillText(txt, xs+12, ly);
    }else{
      const wTxt = g.measureText(txt).width;
      const right = x + wTxt + 8 < xs + xw;
      const lx = right ? x+5 : x-5;
      const x0t = right ? lx : lx-wTxt, x1t = right ? lx+wTxt : lx;
      let row = 0;
      while(placed.some(p => p.row===row && !(x1t < p.x0-6 || x0t > p.x1+6))) row++;
      placed.push({row, x0:x0t, x1:x1t});
      g.textAlign = right ? "start" : "end";
      g.fillText(txt, lx, by+11+row*13);
    }
  });
  g.textAlign="start";
  g.fillStyle=VC.dim; g.font="10px sans-serif";
  g.fillText("asperity density η [1/m²] — log scale", xs, by-6);

  const cap = document.getElementById("cap-padasp");
  if(cap) cap.innerHTML =
    `η, R and σ are a <b>set</b> — changing one alone breaks the geometry. That is why the 500× correction is not applied yet.
     <br>Sensitivity measured on our own GW solve: η × 500 moves real contact area A_r only <b>1.21×</b> (insensitive)
     but contact-point density <b>2.03×</b> (sensitive) — so an η error hides in A_r and surfaces in the contact statistics and Kp decomposition.
     ${bad?`<br><span style="color:var(--bad)">The current value fails the geometric check above.</span>`:""}`;
}

/* ── ④ Pad ③ 수명 / 글레이징 곡선 ─────────────────────────────────── */
function drawPadLife(){
  const o = cv("cv-padlife", 210); if(!o) return;
  const {g,W,H,narrow} = o;
  const t = state.time_s||60;
  /* Jeong 2024 Fig.9 pooled 로그감쇠 — sim/factors.py _f_stab 와 동일 계수 */
  const a=1.1478, b=-0.1109;
  const x0 = narrow?40:50, y0=24, x1=W-(narrow?12:24), y1=H-40;
  axes(g,x0,y0,x1,y1,"polish time [min]","normalised MRR");
  const TMIN=0.2, TMAX=30;
  const px = m => x0 + (Math.log10(m)-Math.log10(TMIN))/(Math.log10(TMAX)-Math.log10(TMIN))*(x1-x0);
  const py = v => y1 - (v-0.70)/(1.12-0.70)*(y1-y0);
  /* 관측 범위(1~10분) 밖은 clamp — 회색으로 칠해 외삽 금지를 보여준다 */
  g.fillStyle="rgba(139,156,176,.13)";
  g.fillRect(px(TMIN),y0, px(1)-px(TMIN), y1-y0);
  g.fillRect(px(10),y0, px(TMAX)-px(10), y1-y0);
  g.fillStyle=VC.dim; g.font="9px sans-serif"; g.textAlign="center";
  g.fillText("clamped", (px(TMIN)+px(1))/2, y0+12);
  g.fillText(narrow?"clamped":"clamped (no extrapolation)", (px(10)+px(TMAX))/2, y0+12);
  g.textAlign="start";
  /* 곡선 */
  g.strokeStyle=VC.accent; g.lineWidth=2; g.beginPath();
  for(let i=0;i<=200;i++){
    const m = TMIN*Math.pow(TMAX/TMIN, i/200);
    const mc = Math.min(Math.max(m,1),10);
    const v = (a+b*Math.log(mc))/a;
    i?g.lineTo(px(m),py(v)):g.moveTo(px(m),py(v));
  }
  g.stroke();
  [1,10].forEach(m=>{ const v=(a+b*Math.log(m))/a;
    g.fillStyle=VC.accent; g.beginPath(); g.arc(px(m),py(v),3,0,7); g.fill(); });
  /* 현재 시간 마커 */
  const tm = t/60, tc = Math.min(Math.max(tm,1),10), vc=(a+b*Math.log(tc))/a;
  g.strokeStyle=VC.good; g.lineWidth=1.5; g.setLineDash([4,3]);
  g.beginPath(); g.moveTo(px(tm),y0); g.lineTo(px(tm),y1); g.stroke(); g.setLineDash([]);
  g.fillStyle=VC.good; g.beginPath(); g.arc(px(tm),py(vc),4,0,7); g.fill();
  g.font="10px sans-serif";
  g.fillText(`${t}s → S = ${vc.toFixed(3)}`, Math.min(px(tm)+6, W-110), py(vc)-8);
  [0.8,0.9,1.0,1.1].forEach(v=>{ g.fillStyle=VC.dim; g.font="9px sans-serif";
    g.fillText(v.toFixed(1), x0-26, py(v)+3); });
  /* x축 눈금 — 로그축이라 1·2·5·10·20 을 찍는다 */
  g.fillStyle=VC.dim; g.font="9px sans-serif"; g.textAlign="center";
  [0.2,0.5,1,2,5,10,20].forEach(m=>{
    const x = px(m); if(x<x0-2||x>x1+2) return;
    g.strokeStyle="rgba(36,49,65,.8)"; g.beginPath(); g.moveTo(x,y1); g.lineTo(x,y1+4); g.stroke();
    g.fillText(String(m), x, y1+14);
  });
  g.textAlign="start";

  const cap = document.getElementById("cap-padlife");
  if(cap) cap.innerHTML =
    `S (time stability) = log decay fitted to Jeong et al. 2024 Fig.9 (IC1000 · colloidal silica · SiO₂ blanket · <b>no conditioning</b>, 1–10 min, R²=0.74).
     <br>Grey bands are outside the measured window — the model <b>holds the end value instead of extrapolating</b>.
     <br>⚠ This captures only the initial drift of a single unconditioned polish. Conditioning cycles and tens-of-hours pad life are still unmodeled — that is the pad-life gap, not a solved axis.`;
}

/* ── ⑤ Disk ① 그릿 맵 ─────────────────────────────────────────────── */
function drawDiskGrit(){
  const o = cv("cv-diskgrit", 300); if(!o) return;
  const {g,W,H,narrow} = o;
  const rec = state.recorded||{};
  const eta = num("asperity_density_per_m2", 1e11);
  const diskD = 0.10;                                  // m — Ø100 mm 디스크
  /* 좁으면 디스크를 위에 작게, 설명을 아래로. 넓으면 좌우로 나란히. */
  const rad = narrow ? 78 : 110;
  const cx  = narrow ? W/2 : 150;
  const cy  = narrow ? rad+14 : H/2;
  /* 디스크 본체 */
  g.fillStyle="#1d2735"; g.beginPath(); g.arc(cx,cy,rad,0,7); g.fill();
  g.strokeStyle=VC.line; g.lineWidth=1.5; g.stroke();
  g.fillStyle="#131a23"; g.beginPath(); g.arc(cx,cy,rad*0.22,0,7); g.fill();
  g.strokeStyle=VC.line; g.stroke();
  /* 그릿 — 밀도는 asperity 밀도에서 오지 않는다(별개 축)이라 패턴만 보여준다 */
  const pattern = rec.grit_pattern ?? "random";
  const nG = 260;
  g.fillStyle = "rgba(200,235,255,.85)";
  for(let i=0;i<nG;i++){
    let a, r;
    if(pattern==="array"){ const ring=Math.floor(i/26); r=rad*(0.30+ring*0.075); a=(i%26)/26*Math.PI*2 + ring*0.12; }
    else { a=Math.random()*Math.PI*2; r=rad*(0.24+Math.sqrt(Math.random())*0.72); }
    if(r>rad*0.96) continue;
    const x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r;
    g.beginPath();
    for(let k=0;k<3;k++){ const t=a+k*2.094; const s=1.7;
      k?g.lineTo(x+Math.cos(t)*s, y+Math.sin(t)*s):g.moveTo(x+Math.cos(t)*s, y+Math.sin(t)*s); }
    g.closePath(); g.fill();
  }
  g.fillStyle=VC.dim; g.font="10px sans-serif"; g.textAlign="center";
  g.fillText(`Ø${(diskD*1000).toFixed(0)} mm disk face · ${pattern} grit layout`, cx, cy+rad+20);
  g.textAlign="start";
  /* 설명 — 좁으면 디스크 아래, 넓으면 오른쪽 */
  const tx = narrow ? 10 : 290;
  let ty0 = narrow ? cy+rad+34 : 34;
  const tw = narrow ? W-20 : W-tx-8;
  g.fillStyle=VC.fg; g.font="bold 11px sans-serif";
  g.fillText("Two axes never mixed", tx, ty0);
  g.font="10px sans-serif";
  const rows = [
    ["Consumable (κ)", "grit size, density, layout, tip radius", VC.good],
    ["Tool set-point (Γ)", "downforce, sweep rate, duty — in ① Tool", VC.accent],
  ];
  let yy = ty0+20;
  rows.forEach(([a,b,c])=>{
    g.fillStyle=c; g.font="10px sans-serif"; g.fillText("● "+a, tx, yy);
    g.fillStyle=VC.dim; yy = wrapText(g, b, tx+10, yy+13, tw-12, 12) + 4;
  });
  g.fillStyle=VC.warn;
  yy = wrapText(g, "⚠ Grit count/size are recorded only — no literature term maps them to cut rate.",
                tx, yy+2, tw, 12);
  g.fillStyle=VC.dim;
  wrapText(g, `The engine's disk axis today is η = ${eta.toExponential(1)} /m² (the asperity field the disk leaves on the pad).`,
           tx, yy+2, tw, 12);

  const cap = document.getElementById("cap-diskgrit");
  if(cap) cap.innerHTML =
    `The disk is drawn to scale (Ø100 mm). <b>Layout is illustrative</b>: CVD-patterned arrays and randomly scattered grit
     are visually distinct and they do produce different pad-cut-rate profiles in literature, but we hold no calibrated
     grit-layout → cut-rate relation, so this picture is documentation, not a model input.`;
}

/* ── ⑤ Disk ② PCR 반경 프로파일 — 스윕이 패드를 어떻게 깎는가 ──────── */
function drawDiskPCR(){
  /* 폰에서는 축 아래에 sweep 설정 한 줄을 더 적으므로 캔버스를 그만큼 높인다 */
  const el0 = document.getElementById("cv-diskpcr"); if(!el0) return;
  const narrowFirst = ((el0.parentElement && el0.parentElement.clientWidth || 620) - 18) < 470;
  const o = cv("cv-diskpcr", narrowFirst ? 250 : 230); if(!o) return;
  const {g,W,H,narrow} = o;
  const sweep = num("cond_sweep_cpm", 10);        // cycles/min — 오늘 literature 승격
  const duty  = num("cond_duty_pct", 100);
  const force = num("cond_downforce_lbf", 6);
  const padR  = 0.3875;                            // m — Ø775 mm 패드
  const diskR = 0.05;                              // m
  const sweepIn = 0.09, sweepOut = padR-diskR;     // 스윕 반경 구간
  const x0 = narrow?42:52, y0=22, x1=W-(narrow?10:20), y1=H-42;
  axes(g,x0,y0,x1,y1,"pad radius [mm]","relative dwell / cut rate");
  const px = r => x0 + (r/padR)*(x1-x0);
  /* 스윕 체류시간 — 사인 왕복이면 양 끝(전환점)에서 체류가 길다 = 더 깎인다.
     이것이 "왜 패드가 특정 반경에서만 닳나"의 1차 답이다. */
  const prof = [];
  for(let i=0;i<=240;i++){
    const r = padR*i/240;
    let d;
    if(r<sweepIn || r>sweepOut) d = 0;
    else{
      const u = (r-sweepIn)/(sweepOut-sweepIn);       // 0..1
      d = 1/Math.sqrt(Math.max(u*(1-u),1e-3));        // 사인 왕복의 체류 밀도(양끝 발산)
    }
    prof.push([r,d]);
  }
  const mx = Math.max(...prof.map(p=>p[1]))||1;
  const py = v => y1 - (v/mx)*(y1-y0)*0.92;
  /* 스윕 구간 음영 */
  g.fillStyle="rgba(77,163,255,.09)";
  g.fillRect(px(sweepIn), y0, px(sweepOut)-px(sweepIn), y1-y0);
  /* duty 반영 곡선 */
  const k = duty/100;
  g.strokeStyle=VC.accent; g.lineWidth=2; g.beginPath();
  prof.forEach(([r,d],i)=> i?g.lineTo(px(r),py(d*k)):g.moveTo(px(r),py(d*k)));
  g.stroke();
  g.fillStyle="rgba(77,163,255,.16)";
  g.beginPath(); g.moveTo(px(0),y1);
  prof.forEach(([r,d])=>g.lineTo(px(r),py(d*k)));
  g.lineTo(px(padR),y1); g.closePath(); g.fill();
  /* 웨이퍼 트랙 — 여기가 실제로 연마가 일어나는 띠.
     웨이퍼 중심이 r_cc에 있고 반경이 wafer_radius_m 이므로 [r_cc−R, r_cc+R]. */
  const rcc = num("center_offset_m", 0.20), wr = num("wafer_radius_m", 0.15);
  const wIn = Math.max(rcc-wr, 0), wOut = Math.min(rcc+wr, padR);
  g.fillStyle="rgba(93,220,154,.13)";
  g.fillRect(px(wIn), y0, px(wOut)-px(wIn), y1-y0);
  g.strokeStyle=VC.good; g.lineWidth=1; g.setLineDash([3,3]);
  [wIn, wOut].forEach(r=>{ if(r>0&&r<padR){ g.beginPath(); g.moveTo(px(r),y0); g.lineTo(px(r),y1); g.stroke(); }});
  g.setLineDash([]);
  g.fillStyle=VC.good; g.font="10px sans-serif"; g.textAlign="center";
  g.fillText(narrow ? "wafer track" : `wafer track (r_cc ${(rcc*1000).toFixed(0)} ± ${(wr*1000).toFixed(0)} mm)`,
             (px(wIn)+px(wOut))/2, y0+13);
  g.textAlign="start";
  g.fillStyle=VC.dim; g.font="9px sans-serif";
  (narrow?[0,150,300]:[0,100,200,300,387]).forEach(mm=>{
    g.textAlign="center"; g.fillText(String(mm), px(mm/1000), y1+14); });
  g.textAlign="start";
  g.fillStyle=VC.accent; g.font="10px sans-serif";
  /* 좁은 화면에서는 축 안쪽에 두면 곡선에 묻힌다 → 축 아래 빈 줄에 적는다 */
  if(narrow) g.fillText(`sweep ${sweep} cpm · duty ${duty}%`, x0, H-4);
  else g.fillText(`sweep ${sweep} cpm · duty ${duty}% · ${force} lbf`, x0+6, y1-8);

  const cap = document.getElementById("cap-diskpcr");
  if(cap) cap.innerHTML =
    `A sinusoidal sweep <b>dwells longest at its turning points</b>, so those radii get cut more — this is the first-order answer
     to "why does the pad wear in a band". The blue band is the sweep stroke (${(sweepIn*1000).toFixed(0)}–${(sweepOut*1000).toFixed(0)} mm);
     the green band is where the wafer actually rides (r_cc ± 150 mm).
     <br><b>Where they overlap is what matters</b> — cut rate outside the wafer track conditions pad the wafer never touches.
     <br>⚠ Shape is kinematic (dwell time), not a fitted cut-rate model: no paper we hold sweeps sweep-rate as an independent variable
     and measures PCR, so the <b>vertical scale is relative</b>. Sweep rate is literature-grade (12 commercial recipes, 9–19 cpm, mode 10) but its effect on PCR is not.`;
}

/* ── ⑥ Loading Unit — FOUP 25슬롯 ─────────────────────────────────── */
function drawFoup(){
  const grid = document.getElementById("foupGrid");
  if(!grid) return;
  const F = state.foup;
  grid.innerHTML = F.slots.map((s,i)=>{
    const on = i===F.sel;
    const cls = ["sl", on?"on":"", s?(s.wafer==="NPW"?"npw":"ptw"):"empty"].filter(Boolean).join(" ");
    return `<div class="${cls}" data-slot="${i}" title="${s?`${s.wafer} · ${s.pack} · ${s.thick} nm`:"empty slot — click to load"}">
      <div class="n">${String(i+1).padStart(2,"0")}</div>
      <div class="w">${s?s.wafer:"—"}</div></div>`;
  }).join("");
  const n = F.slots.filter(Boolean).length;
  const cap = document.getElementById("cap-foup");
  if(cap) cap.innerHTML =
    `<b>${n}/25 slots loaded</b> · slot ${String(F.sel+1).padStart(2,"0")} is selected and its wafer is what the simulation runs.
     Clicking an empty slot loads a copy of the current wafer settings; clicking a loaded slot selects it.
     <br>⚠ <b>One wafer per run.</b> The batch exists as data only — sequential 25-wafer execution and wafer-to-wafer
     uniformity (WTWNU) are not implemented, so nothing here changes the result except which slot is selected.`;
}
function wireFoup(){
  const grid = document.getElementById("foupGrid");
  if(!grid) return;
  const F = state.foup;
  const cur = ()=>({wafer:state.wafer, pack:state.pack,
                    thick:state.initial_thickness_nm,
                    ttv:(state.recorded||{}).initial_ttv_nm ?? 0});
  grid.querySelectorAll(".sl").forEach(el=>{
    el.onclick = ()=>{
      const i = +el.dataset.slot;
      if(!F.slots[i]) F.slots[i] = cur();       /* 빈 슬롯 = 현재 설정 복사해 적재 */
      F.sel = i;
      const s = F.slots[i];
      state.wafer = s.wafer; state.initial_thickness_nm = s.thick;
      if(s.pack && s.pack!==state.pack){ state.pack = s.pack; state.overrides={}; boot(); return; }
      drawPanel(); run();
    };
  });
  document.querySelectorAll("[data-fa]").forEach(b=>{
    b.onclick = ()=>{
      const a = b.dataset.fa, c = cur();
      if(a==="fill-npw") F.slots = F.slots.map(()=>({...c, wafer:"NPW"}));
      else if(a==="fill-ptw") F.slots = F.slots.map(()=>({...c, wafer:"PTW"}));
      else if(a==="clear"){ F.slots = F.slots.map((s,i)=> i===F.sel?(s||c):null); }
      drawFoup();
    };
  });
}

/* 파트가 바뀌거나 값이 바뀔 때 호출 — 해당 캔버스가 없으면 조용히 통과 */

  try{

    drawDiskGrit(); drawDiskPCR(); drawFoup();

}

/* ─────────────────────────────────────────── NPW */
async function drawNPW(){
  const box = document.getElementById("npwBox");
  if(!state.npwCat){
    try{ state.npwCat = await (await fetch(API+"/api/npw")).json(); }
    catch(e){ box.innerHTML=`<div class="banner">${e.message}</div>`; return; }
  }
  const W = state.npwCat.wafers||[];
  if(!W.length){
    box.innerHTML = `<div class="meta dead">NPW catalog not built yet (knowledge/wafers/npw_catalog.yaml). Research agent is populating it. Timeline uses a single film layer from the current pack.</div>`;
    return;
  }
  const cur = state.npw || W[0].id;
  const w = W.find(x=>x.id===cur)||W[0];
  const stackRows = (w.stack||[]).map(L=>{
    const packOk = L.pack && state.packs.some(p=>p.id===L.pack);
    const tag = L.stop ? `<span class="tag" style="font-size:9px">stop</span>`
              : packOk ? `<span class="tag modeled" style="font-size:9px">${L.pack}</span>`
              : L.pack ? `<span class="tag unmodeled" style="font-size:9px" title="pack listed but not available">${L.pack}?</span>`
              : `<span class="tag unmodeled" style="font-size:9px" title="No pack — polished only via previous layer's selectivity, or stops">no model</span>`;
    return `<div style="display:flex;gap:6px;align-items:center;font-size:11px;padding:2px 0;border-bottom:1px dashed #1b2430">
      <i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${L.color||'#7fb3ff'}"></i>
      <b style="width:70px">${L.layer}</b><span style="width:70px;text-align:right">${L.thickness_nm>=100000?(L.thickness_nm/1000).toFixed(0)+" µm":L.thickness_nm+" nm"}</span>${tag}</div>`;
  }).join("");
  const init = w.initial||{};
  const initRow = (k,label,unit)=>{ const v=init[k]; if(!v) return ""; 
    return `<div class="meta">${label}: typical ${v.typical} ${unit}${v.range?` (${v.range[0]}–${v.range[1]})`:""} <span style="opacity:.6">[${(v.source||"").slice(0,50)}]</span></div>`; };
  box.innerHTML = `
    <select id="sel-npw">${W.map(x=>`<option value="${x.id}" ${x.id===w.id?"selected":""}>${x.label}</option>`).join("")}</select>
    <div class="meta" style="margin:3px 0">${w.purpose||""}</div>
    <div style="margin:4px 0">${stackRows}</div>
    ${initRow("ttv_nm","TTV","nm")}${initRow("roughness_ra_nm","Ra","nm")}${initRow("bow_um","Bow","µm")}
    <div class="meta" style="opacity:.7">[${(w.source||"").slice(0,80)}]</div>`;
  document.getElementById("sel-npw").onchange = e=>{ state.npw = e.target.value; applyNPW(); };
  if(!state.npw){ state.npw = w.id; applyNPW(false); }
}

function applyNPW(redraw=true){
  /* NPW 선택 → 스택 + 첫 층 팩 + 초기 두께. CMP 퍼포먼스는 이 스택 기준으로 산출된다. */
  const W = (state.npwCat||{}).wafers||[]; const w = W.find(x=>x.id===state.npw); if(!w) return;
  const palette = ["#7fb3ff","#c9a86a","#e0906a","#9ad0a0","#b09ae0","#3a3f48"];
  state.stack = (w.stack||[]).map((L,i)=>({name:L.layer, thickness_nm:L.thickness_nm, pack:L.pack||null, stop:!!L.stop, color:L.color||palette[i%palette.length]}));
  const top = state.stack[0];
  if(top){ state.initial_thickness_nm = top.thickness_nm; }
  const init = w.initial||{};
  if(init.ttv_nm) state.recorded.initial_ttv_nm = init.ttv_nm.typical;
  if(init.roughness_ra_nm) state.recorded.initial_roughness_ra_nm = init.roughness_ra_nm.typical;
  if(init.bow_um) state.recorded.initial_bow_um = init.bow_um.typical;
  if(top && top.pack && state.packs.some(p=>p.id===top.pack) && top.pack!==state.pack){
    state.pack = top.pack; state.overrides = {}; boot(); return;
  }
  if(redraw){ drawPanel(); run(); }
}

/* ─────────────────────────────────────────── Additives */
async function drawAdditives(){
  const box = document.getElementById("addBox");
  if(!state.additives){
    try{ state.additives = await (await fetch(API+"/api/additives")).json(); }
    catch(e){ box.innerHTML=`<div class="banner">additive catalog: ${e.message}</div>`; return; }
  }
  const cat = state.additives;
  if(!cat.chemicals || !cat.chemicals.length){
    box.innerHTML = `<div class="meta dead">Additive catalog not built yet (knowledge/additives/catalog.yaml). Research agent is populating it.</div>`;
    return;
  }
  state.formulation = state.formulation||[];   /* [{cat, chem_id, wt}] */
  const packFilm = ((state.packs.find(p=>p.id===state.pack)||{}).film||"").toLowerCase();
  const order = ["rr_booster","rr_inhibitor","oxidizer","corrosion_inhibitor","dispersant","defect_reducer","ph_adjuster","chelator","biocide"];
  let h = "";
  for(const ck of order){
    const C = cat.categories[ck]; if(!C) continue;
    const chems = cat.chemicals.filter(c=>(c.categories||[]).includes(ck));
    const rows = state.formulation.filter(f=>f.cat===ck);
    h += `<div style="border:1px solid #1b2430;border-radius:6px;padding:6px 8px;margin:5px 0">
      <div style="display:flex;align-items:center;gap:6px">
        <b style="font-size:12px">${C.label}</b>
        ${C.needs_target_film?`<span class="tag" style="font-size:9px">target film shown</span>`:""}
        <button class="btn addRow" data-cat="${ck}" style="margin-left:auto;padding:1px 7px;font-size:11px;margin-top:0">+ add</button></div>`;
    rows.forEach((row,i)=>{
      const chem = chems.find(c=>c.id===row.chem_id)||chems[0];
      const rng = chem.typical_range||{};
      const wired = chem.engine_key ? `<span class="tag modeled" title="engine key: ${chem.engine_key}">wired → ${chem.engine_key}</span>`
                                    : `<span class="tag unmodeled" title="Recorded in the formulation but no engine term consumes it. Not a bug — no literature model held.">recorded only</span>`;
      const films = (chem.target_films||[]).map(f=>{
        const hit = packFilm && f.toLowerCase().includes(packFilm.split("_")[0]);
        return `<span style="padding:0 4px;border-radius:3px;background:${hit?"#1f4a30":"#1b2430"};color:${hit?"var(--good)":"var(--dim)"}">${f}</span>`;
      }).join(" ");
      h += `<div style="margin:5px 0;padding:4px 0;border-top:1px dashed #1b2430;font-size:11px">
        <div style="display:flex;gap:6px;align-items:center">
          <select class="chemSel" data-cat="${ck}" data-i="${i}" style="flex:1">${chems.map(c=>
            `<option value="${c.id}" ${c.id===chem.id?"selected":""}>${c.name}${c.subtype?" ("+c.subtype+")":""}</option>`).join("")}</select>
          <input type="number" class="chemWt" data-cat="${ck}" data-i="${i}" value="${row.wt ?? (rng.min ?? 0)}" step="${rng.unit==="mM"?0.5:0.05}" min="0"
            style="width:64px;text-align:right;background:#0a0e14;border:1px solid #1b2430;border-radius:4px;color:var(--fg)">
          <span style="color:var(--dim);width:32px">${rng.unit||"wt%"}</span>
          <button class="btn delRow" data-cat="${ck}" data-i="${i}" style="padding:1px 6px;font-size:11px;margin-top:0">×</button></div>
        <div style="margin-top:3px;display:flex;flex-wrap:wrap;gap:4px;align-items:center">
          ${C.needs_target_film?`<span style="color:var(--dim)">for:</span> ${films||"—"}`:""}
          ${wired}
          ${rng.min!=null?`<span style="color:var(--dim)">typical ${rng.min}–${rng.max} ${rng.unit||""}</span>`:""}</div>
        <div class="meta" style="margin-top:2px">${chem.mechanism||""} <span style="opacity:.6">[${(chem.source||"").slice(0,60)}]</span></div>
      </div>`;
    });
    h += `</div>`;
  }
  box.innerHTML = h;
  box.querySelectorAll(".addRow").forEach(b=>b.onclick=()=>{
    const chems = cat.chemicals.filter(c=>(c.categories||[]).includes(b.dataset.cat));
    if(!chems.length) return;
    state.formulation.push({cat:b.dataset.cat, chem_id:chems[0].id, wt:(chems[0].typical_range||{}).min ?? 0});
    drawAdditives(); applyFormulation();
  });
  box.querySelectorAll(".delRow").forEach(b=>b.onclick=()=>{
    const rows = state.formulation.filter(f=>f.cat===b.dataset.cat);
    state.formulation.splice(state.formulation.indexOf(rows[+b.dataset.i]),1);
    drawAdditives(); applyFormulation();
  });
  box.querySelectorAll(".chemSel").forEach(s=>s.onchange=()=>{
    const rows = state.formulation.filter(f=>f.cat===s.dataset.cat);
    rows[+s.dataset.i].chem_id = s.value; drawAdditives(); applyFormulation();
  });
  box.querySelectorAll(".chemWt").forEach(w=>w.onchange=()=>{
    const rows = state.formulation.filter(f=>f.cat===w.dataset.cat);
    rows[+w.dataset.i].wt = parseFloat(w.value)||0; applyFormulation();
  });
}

function applyFormulation(){
  /* 배합표 → 엔진 override. engine_key 있는 케미컬만 값이 넘어간다.
     같은 키에 여러 케미컬이면 합산(같은 역할이므로). 나머지는 기록만. */
  const cat = state.additives; if(!cat) return;
  const keys = new Set(cat.chemicals.filter(c=>c.engine_key).map(c=>c.engine_key));
  for(const k of keys) delete state.overrides[k];
  for(const row of state.formulation){
    const chem = cat.chemicals.find(c=>c.id===row.chem_id); if(!chem||!chem.engine_key) continue;
    state.overrides[chem.engine_key] = (state.overrides[chem.engine_key]||0) + (row.wt||0);
  }
  run();
}

/* ─────────────────────────────────────────── 결과 */
function bar(v){
  if(v==null) return `<div class="bar"></div><div class="fval">—</div>`;
  const pct = THREE.MathUtils.clamp((Math.log10(v)+1)/2*100, 2, 100);
  const cls = v<0.97?"lo":(v>1.03?"hi":"");
  return `<div class="bar"><i class="${cls}" style="width:${pct}%"></i></div>
          <div class="fval">${v.toFixed(3)}</div>`;
}
function render(d){
  const m = d.metrics||{}, eq = d.equipment_outputs||{}, fs = d.factors||{};
  const cov = d.factor_coverage||{};
  const F = k => fs[k]||{};
  const sym = k => (state.symbols&&state.symbols[k]) || (F(k).symbol||"");
  const eqRow = (k,dec=2)=>{
    const o = eq[k]; if(!o) return "";
    const v = o.value==null ? `<b style="color:var(--warn)">not modeled</b>`
            : `<b>${(+o.value).toFixed(dec)} ${o.unit}</b>`;
    return `<div class="row" title="${(o.note||"").replace(/"/g,"'")}">
              <span>${EQ_LABEL[k]||o.label}</span>${v}</div>`;
  };
  const fRow = k=>{
    const f=F(k); if(!f.symbol) return "";
    return `<div class="fchip" title="${(f.notes||[]).join(' / ').replace(/"/g,"'")}">
      <span class="fsym">${sym(k)}</span>
      <span style="width:74px;font-size:11px">${FACTOR_EN[k]||f.name}</span>
      ${bar(f.value)}
      <span class="tag ${f.status}">${f.status}</span></div>`;
  };
  document.getElementById("out").innerHTML = `
    <div class="sec">Polish Result</div>
    <div class="row"><span>Mean MRR</span><b>${(d.mean_mrr_nm_min||0).toFixed(2)} nm/min</b></div>
    <div class="row"><span>TTV (81pt)</span><b>${m.ttv_nm!=null?m.ttv_nm.toFixed(2)+" nm":"—"}</b></div>
    <div class="row"><span>CV</span><b>${m.cv_pct!=null?m.cv_pct.toFixed(3)+" %":"—"}</b></div>
    <div class="row"><span>WIWNU (½range)</span><b>${m.wiwnu_halfrange_pct!=null?m.wiwnu_halfrange_pct.toFixed(3)+" %":"—"}</b></div>

    <div class="sec">In-situ — Polish Timeline
      <button class="btn" id="tlBtn" style="float:right;padding:2px 8px;font-size:11px;margin:0">▶ Run</button></div>
    <div id="tl" class="meta">Run the timeline to see thickness vs. time, wafer cross-section by stack, temperature & carrier current traces.</div>

    <div class="sec">Tool Outputs — derived, not set</div>
    ${eqRow("pad_temp_c",1)}${eqRow("pad_temp_rise_k",2)}${eqRow("cof",4)}
    ${eqRow("carrier_current_a",3)}${eqRow("platen_torque_nm",2)}${eqRow("friction_power_w",1)}

    <div class="sec">Merged Parameters — Tool axis (never mixed with consumables)</div>
    ${fRow("lambda")}${fRow("pi")}${fRow("theta")}${fRow("gamma")}
    <div class="sec">Merged Parameters — Consumable axis (Slurry · Pad · Disk)</div>
    ${fRow("kappa")}${fRow("chi")}${fRow("psi")}${fRow("tau")}${fRow("delta")}${fRow("stab")}
    <div class="row" style="margin-top:7px;color:var(--dim);font-size:11px">
      <span>Model coverage</span><b>${((cov.score||0)*100).toFixed(0)}% — ${(cov.unmodeled||[]).length} axes not wired</b></div>
    <button class="btn" id="linBtn" style="margin-top:6px">Parameter Lineage — which inputs → which parameter, rename symbols</button>
    <div id="lineage"></div>

    <div class="sec">Engine-reported limits (${(d.notes||[]).length})</div>
    <div id="notes">${(d.notes||[]).slice(0,40).map(n=>
      `<div class="${n.includes("⚠")?"w":""}">${n}</div>`).join("")}</div>`;
  document.getElementById("tlBtn").onclick = runTimeline;
  document.getElementById("linBtn").onclick = showLineage;
  if(state.lineageOpen) showLineage();
}

/* 전문용어는 영어로 — 사용자 지시 */
const EQ_LABEL = {pad_temp_c:"Pad Temperature", pad_temp_rise_k:"Pad ΔT", cof:"COF (μ)",
  carrier_current_a:"Carrier Current", platen_torque_nm:"Platen Torque", friction_power_w:"Friction Power"};
const FACTOR_EN = {lambda:"Mech. Load", pi:"Load Profile", theta:"Thermal/Flow", gamma:"Conditioning",
  kappa:"Contact", chi:"Chem. Reactivity", psi:"Passivation", tau:"Slurry Transport",
  delta:"Damage", stab:"Stability"};

/* ─────────────────────────────────────────── Polish Timeline */
function currentStack(){
  /* 웨이퍼 탭의 스택. NPW 카탈로그가 연결되기 전엔 팩 막질 1층 + 기판 */
  if(state.stack && state.stack.length) return state.stack;
  const film = (state.packs.find(p=>p.id===state.pack)||{}).film || "film";
  return [{name:film, thickness_nm:state.initial_thickness_nm||1000, pack:state.pack, color:"#7fb3ff"},
          {name:"Si substrate", thickness_nm:775000, pack:null, stop:true, color:"#3a3f48"}];
}

async function runTimeline(){
  const box = document.getElementById("tl");
  box.innerHTML = `<div class="meta">Running…</div>`;
  const body = { layers: currentStack(), total_s: state.time_s||120, dt_s: 2,
                 pack_overrides: state.overrides };
  ["pressure_psi","platen_rpm","wafer_rpm","slurry_flow_ml_min"].forEach(k=>{
    const ov = state.overrides||{};
    const map = {pressure_psi:"pressure_psi", platen_rpm:"rpm_platen", wafer_rpm:"rpm_wafer", slurry_flow_ml_min:"sfr_ml_min"};
    if(ov[map[k]]!=null) body[k]=ov[map[k]];
  });
  try{
    const r = await fetch(API+"/api/timeline",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const d = await r.json();
    if(!r.ok){ box.innerHTML=`<div class="banner">${d.detail||"timeline failed"}</div>`; return; }
    state.timeline = d; drawTimeline(d);
  }catch(e){ box.innerHTML=`<div class="banner">${e.message}</div>`; }
}

function drawTimeline(d){
  const box = document.getElementById("tl");
  const n = d.frames.length;
  box.innerHTML = `
    <div class="row" style="font-size:11px"><span>t = <b id="tlT">0</b> s</span>
      <input type="range" id="tlS" min="0" max="${n-1}" value="0" style="flex:1;margin:0 8px">
      <button class="btn" id="tlPlay" style="padding:1px 8px;font-size:11px;margin:0">▶</button></div>
    <div class="meta" style="margin:2px 0 4px">${d.endpoint_s!=null?`Endpoint (all radii clear layer 1): <b>${d.endpoint_s}s</b>, first breakthrough ${d.layer_breakthrough_s[d.layers[0].name]}s`:"No endpoint within run time"}</div>
    <canvas id="tlX" width="360" height="110" style="width:100%;display:block;border-radius:6px;background:#0a0e14"></canvas>
    <div class="meta" style="margin:2px 0">Wafer cross-section (center → edge), vertical scale = film only</div>
    <canvas id="tlG" width="360" height="120" style="width:100%;display:block;border-radius:6px;background:#0a0e14;margin-top:4px"></canvas>
    <div style="display:flex;gap:10px;font-size:10px;color:var(--dim);margin-top:2px">
      <span><i style="display:inline-block;width:10px;height:3px;background:#7fb3ff"></i> thickness (center)</span>
      <span><i style="display:inline-block;width:10px;height:3px;background:#ff8a5c"></i> pad temp</span>
      <span><i style="display:inline-block;width:10px;height:3px;background:#a0e0a0"></i> MRR</span>
      <span><i style="display:inline-block;width:10px;height:3px;background:#e0c060"></i> COF</span></div>
    <div id="tlRow" style="font-size:11px;margin-top:4px"></div>
    ${d.notes.map(x=>`<div class="meta ${x.includes("⚠")?"dead":""}">${x}</div>`).join("")}`;
  const S = document.getElementById("tlS"), T = document.getElementById("tlT");
  const draw = i=>{ T.textContent = d.frames[i].t_s; drawXsec(d,i); drawTraces(d,i); showRow(d,i); };
  S.oninput = ()=>draw(+S.value);
  let timer=null;
  document.getElementById("tlPlay").onclick = function(){
    if(timer){ clearInterval(timer); timer=null; this.textContent="▶"; return; }
    this.textContent="❚❚"; let i=+S.value;
    timer=setInterval(()=>{ i=(i+1)%n; S.value=i; draw(i); if(i===n-1){clearInterval(timer);timer=null;this.textContent="▶";} }, 80);
  };
  draw(0);
}

function drawXsec(d,i){
  const c = document.getElementById("tlX"), g = c.getContext("2d"), W=c.width, H=c.height;
  g.clearRect(0,0,W,H);
  const f = d.frames[i], nr = d.radius_mm.length;
  const filmLayers = d.layers.filter(L=>!L.stop);
  const total0 = filmLayers.reduce((s,L)=>s+L.thickness_nm,0);
  const pad=6, top=10, bot=H-8, sc=(bot-top)/total0;
  /* 기판 */
  g.fillStyle = "#2a2f38"; g.fillRect(pad,bot,W-2*pad,6);
  for(let r=0;r<nr;r++){
    const x0 = pad + (W-2*pad)*r/nr, x1 = pad + (W-2*pad)*(r+1)/nr + 0.5;
    let y = bot;
    for(let k=d.layers.length-1;k>=0;k--){
      const L=d.layers[k]; if(L.stop) continue;
      const rem = f.remaining_nm[k][r]; if(rem<=0) continue;
      const h = rem*sc; g.fillStyle=L.color; g.fillRect(x0,y-h,x1-x0,h); y-=h;
    }
  }
  /* 초기 두께 점선 */
  g.strokeStyle="rgba(255,255,255,.25)"; g.setLineDash([3,3]); g.beginPath(); g.moveTo(pad,top); g.lineTo(W-pad,top); g.stroke(); g.setLineDash([]);
  g.fillStyle="rgba(255,255,255,.55)"; g.font="9px sans-serif";
  g.fillText("center",pad+2,H-12); g.fillText("edge",W-pad-24,H-12);
  let ly=top+9; d.layers.forEach(L=>{ if(L.stop) return; g.fillStyle=L.color; g.fillRect(W-70,ly-7,8,8); g.fillStyle="#ccc"; g.fillText(`${L.name} ${L.thickness_nm}nm`,W-58,ly); ly+=11; });
}

function drawTraces(d,i){
  const c = document.getElementById("tlG"), g = c.getContext("2d"), W=c.width, H=c.height;
  g.clearRect(0,0,W,H);
  const n=d.frames.length, pad=6;
  const series = [
    {k:f=>f.remaining_nm[0][0], col:"#7fb3ff"},
    {k:f=>f.outputs.pad_temp_c, col:"#ff8a5c"},
    {k:f=>f.mean_mrr, col:"#a0e0a0"},
    {k:f=>f.outputs.cof, col:"#e0c060"},
  ];
  series.forEach(s=>{
    const vals = d.frames.map(s.k); const fin = vals.filter(v=>v!=null);
    if(!fin.length) return;
    const lo=Math.min(...fin), hi=Math.max(...fin), rng=(hi-lo)||1;
    g.strokeStyle=s.col; g.lineWidth=1.5; g.beginPath(); let started=false;
    vals.forEach((v,j)=>{ if(v==null){started=false;return;} const x=pad+(W-2*pad)*j/(n-1), y=H-pad-(H-2*pad)*(v-lo)/rng;
      if(!started){g.moveTo(x,y);started=true;} else g.lineTo(x,y); });
    g.stroke();
  });
  const x=pad+(W-2*pad)*i/(n-1); g.strokeStyle="rgba(255,255,255,.5)"; g.beginPath(); g.moveTo(x,0); g.lineTo(x,H); g.stroke();
  if(d.endpoint_s!=null){ const j=d.frames.findIndex(f=>f.t_s>=d.endpoint_s); if(j>=0){ const xe=pad+(W-2*pad)*j/(n-1); g.strokeStyle="#ff5c5c"; g.setLineDash([2,2]); g.beginPath(); g.moveTo(xe,0); g.lineTo(xe,H); g.stroke(); g.setLineDash([]); } }
}

function showRow(d,i){
  const f=d.frames[i], o=f.outputs;
  const ex = f.exposed_layer; const cnt={}; ex.forEach(k=>cnt[k]=(cnt[k]||0)+1);
  const exposed = Object.entries(cnt).map(([k,v])=>`${d.layers[k].name} ${(100*v/ex.length).toFixed(0)}%`).join(", ");
  document.getElementById("tlRow").innerHTML =
    `<div class="row"><span>Exposed</span><b>${exposed}</b></div>
     <div class="row"><span>Thickness center / edge</span><b>${f.remaining_nm[0][0].toFixed(0)} / ${f.remaining_nm[0][f.remaining_nm[0].length-1].toFixed(0)} nm</b></div>
     <div class="row"><span>MRR</span><b>${f.mean_mrr.toFixed(1)} nm/min</b></div>
     <div class="row"><span>Pad Temp</span><b>${o.pad_temp_c!=null?o.pad_temp_c.toFixed(1)+" °C":"—"}</b></div>
     <div class="row"><span>COF / Torque</span><b>${o.cof!=null?o.cof.toFixed(3):"—"} / ${o.platen_torque_nm!=null?o.platen_torque_nm.toFixed(1)+" N·m":"—"}</b></div>
     <div class="row"><span>Carrier Current</span><b>${o.carrier_current_a!=null?o.carrier_current_a.toFixed(2)+" A":'<span style="color:var(--warn)">needs motor K_t</span>'}</b></div>`;
}

/* ─────────────────────────────────────────── Parameter Lineage */
async function showLineage(){
  state.lineageOpen = true;
  const box = document.getElementById("lineage");
  box.innerHTML = `<div class="meta">Loading…</div>`;
  const d = await (await fetch(API+"/api/factors/lineage/"+state.pack)).json();
  const conf = c=>({verified:"var(--good)",literature:"#8ab4d8",estimated:"var(--warn)"}[c]||"var(--dim)");
  box.innerHTML = `<div class="meta" style="margin:6px 0">Each merged parameter, what inputs feed it, how each term contributes, and its sources. Click a symbol to rename (1–3 chars, empty = default).</div>` +
    d.factors.map(f=>`
    <div style="border:1px solid #1b2430;border-radius:6px;padding:6px 8px;margin:4px 0">
      <div style="display:flex;align-items:center;gap:8px">
        <input value="${f.symbol}" data-k="${f.key}" class="symIn" maxlength="3"
          style="width:34px;text-align:center;font-weight:700;font-size:15px;background:#0a0e14;border:1px solid #1b2430;border-radius:4px;color:var(--accent)">
        <b>${FACTOR_EN[f.key]||f.name}</b>
        <span class="tag ${f.status}">${f.status}</span>
        <span style="margin-left:auto;font-size:10px;color:${conf(f.confidence)}">${f.confidence}</span></div>
      <div style="font-size:11px;margin-top:4px">
        <div><span style="color:var(--dim)">Inputs →</span> ${Object.entries(f.drivers).map(([k,v])=>`<code>${k}</code>=${typeof v==="number"?+v.toPrecision(4):v}`).join(" · ")||'<span style="color:var(--warn)">none wired</span>'}</div>
        <div><span style="color:var(--dim)">Terms</span> ${Object.entries(f.terms).map(([k,v])=>`${k}×${(+v).toFixed(3)}`).join(" · ")||"—"}
          ${f.value!=null?`<b style="margin-left:6px">= ${f.value.toFixed(3)}</b>`:""}</div>
        <div><span style="color:var(--dim)">Affects MRR</span> ${f.mrr_coupled?"yes (multiplies)":"no (diagnostic only)"} · <span style="color:var(--dim)">Change via</span> ${f.parts.map(p=>PARTS[p]?PARTS[p].name:p).join(", ")}</div>
        ${f.sources.length?`<div style="color:var(--dim)">Sources: ${f.sources.map(s=>`<span title="${s}">${s.split("/").pop().slice(0,40)}</span>`).join("; ")}</div>`:""}
        ${f.status==="unmodeled"?`<div class="dead">${(f.notes||[]).join(" ")||"Not modeled — required parameters missing from pack."}</div>`:""}
      </div></div>`).join("");
  box.querySelectorAll(".symIn").forEach(inp=>{
    inp.onchange = async ()=>{
      const r = await fetch(API+"/api/factors/symbols",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({symbols:{[inp.dataset.k]:inp.value}})});
      const res = await r.json();
      if(!r.ok){ alert(res.detail); return; }
      state.symbols = state.symbols||{}; 
      const fresh = await (await fetch(API+"/api/factors")).json();
      state.symbols = Object.fromEntries(fresh.factors.map(f=>[f.key,f.symbol]));
      run();
    };
  });
}

async function run(){
  const body = { pack:state.pack, wafer:state.wafer, time_s:state.time_s,
                 initial_thickness_nm:state.initial_thickness_nm,
                 pack_overrides:state.overrides };
  try{
    const r = await fetch(API+"/api/simulate/v2",
      {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const d = await r.json();
    if(!r.ok){ document.getElementById("out").innerHTML =
      `<div class="banner">Engine error: ${d.detail||"unknown"}</div>`; return; }
    render(d);
    /* 실행 결과 → 3D 반영 (패드 온도 틴트·웨이퍼 발광·슬러리 퍼짐) */
    if(typeof applyResult==="function") applyResult(d);
    else { const mr = d.mean_mrr_nm_min||0;
           waferMat.emissiveIntensity = THREE.MathUtils.clamp(mr/260, .12, 1.1); }
    state.lastRunId = d.run_id||null;
  }catch(e){
    document.getElementById("out").innerHTML =
      `<div class="banner">API unreachable (${e.message}). The server was probably restarted — <a href="#" onclick="location.reload();return false" style="color:var(--accent)">reload the page</a>. If it persists, check that the address is http://localhost:8848/3d and the server is running (~/fab-sim/fabsim.command).</div>`;
  }
}

async function boot(){
  try{
    const cat = await (await fetch(API+"/api/catalog")).json();
    state.packs = (cat.packs||[]).filter(p=>!p.error);
    /* 막질군 묶음 — 서버가 준 그룹에서 에러 팩을 걸러낸다 (2026-09-11) */
    state.packGroups = (cat.pack_groups||[])
      .map(g=>({family:g.family, packs:(g.packs||[]).filter(p=>state.packs.some(q=>q.id===p.id))
        .map(p=>Object.assign({}, p, state.packs.find(q=>q.id===p.id)))}))
      .filter(g=>g.packs.length);
    try{ const fs = await (await fetch(API+"/api/factors")).json();
         state.symbols = Object.fromEntries(fs.factors.map(f=>[f.key,f.symbol])); }catch(e){}
    const pk = state.packs.find(p=>p.id===state.pack);
    state.base = {};
    if(pk) for(const p of pk.params) if(typeof p.value==="number") state.base[p.key]=p.value;
    buildGrooves(num("groove_pitch_mm",3.05), num("groove_depth_mm",0.76));
    buildGrits(num("asperity_density_per_m2",1e11));
  }catch(e){ /* 카탈로그 실패해도 시뮬은 돈다 */ }
  drawTabs(); drawPanel(); run();
}
boot();
</script>
