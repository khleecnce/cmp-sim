# Blanket SiO2 산화막 CMP — 세리아(60 nm, 0.25 wt%) 슬러리 pH 스윕 9수준
#
# 이 데이터셋의 목적은 기계층이 아니라 **화학층(pH 축)**을 때리는 것이다.
# 압력·속도는 전 조건 고정이고 변하는 것은 pH 하나뿐이다.

source: >
  P. R. Dandu Veera, S. Peddeti, S. V. Babu, "Selective Chemical Mechanical Polishing of
  Silicon Dioxide over Silicon Nitride for Shallow Trench Isolation Using Ceria Slurries",
  J. Electrochem. Soc. 156(12), H936–H943 (2009). doi:10.1149/1.3230624
  ⚠ 오픈액세스 아님(ECS 구독). PDF는 papers/에만 두고 저장소에 커밋하지 않는다.
  수치 출처: Figure 3 "RRs of blanket silicon dioxide and silicon nitride films ...
  0.25% ceria (~60 nm) with and without additives" 중 **첨가제 없는 oxide 계열**.

in_scope: true
used_for_calibration: false
pack: sti_ceria
calibration_contact:
  - param: abrasive_size_nm
    pack: sti_ceria
    what: >
      knowledge/params/sti_ceria.yaml의 abrasive_size_nm(60.0) note — "Dandu Veera,
      Peddeti, Babu 2009 ... 원문 명시 'mean diameter d_mean = 60 nm'"를 그대로
      팩 기준값으로 채택했다. 이 데이터셋(같은 논문 Figure 3)의 전 조건이 그
      60nm·0.25wt% 세리아로 고정돼 있다 — pH 축 자체는 오염되지 않았으나, 배경
      상수(입경)가 이 데이터셋의 원천 문헌에서 왔다.
    axis: abrasive_size_nm
  - param: abrasive_wt_pct
    pack: sti_ceria
    what: >
      [2026-09-16 판정#48] sti_ceria의 abrasive_wt_pct(0.25)·abrasive_ref_wt_pct(0.25)를
      이 논문 본문("carried out at 0.25% ceria particle loading")에서 채택했다.
      이 데이터셋의 전 조건도 같은 0.25 wt%로 고정돼 있다 — pH 축 자체는 오염되지
      않으나(농도가 변하지 않으므로 κ 농도항은 전 조건 동일 상수), 배경 상수가 이
      데이터셋의 원천 문헌에서 왔다.
    axis: abrasive_wt_pct
  - param: abrasive_conc_exponent
    pack: sti_ceria
    what: >
      [2026-09-16 판정#48] sti_ceria의 abrasive_conc_exponent(-0.4295)를 같은 논문의
      **다른 그림**(Figure 2a, 농도 스윕)에서 역산했다. 이 데이터셋은 Figure 3(pH 스윕)
      이고 농도가 전 조건 고정이라 이 지수는 **이 데이터셋의 순위에 전혀 영향을 주지
      않는다**(κ 농도항이 상수배로 빠짐). 그래도 같은 논문이므로 접촉을 신고한다.
    axis: abrasive_wt_pct

# ── 판독 방법과 검증 ────────────────────────────────────────────────────
# Figure 3은 PDF 벡터 산점도라 마커 중심과 축 눈금 좌표를 직접 읽어 선형사상했다.
# ⭐ 자기검증: 본문이 "RRs of oxide and nitride films were ~350 and ~80 nm/min,
#    respectively, in the pH range of 4–5.5"라고 서술했는데, 같은 구간을 이 방법으로
#    읽으니 347 / 344 / 350 nm/min이 나왔다 — 서술과 일치.
#    또 Figure 2a(입자 loading 0.25%, pH 4)를 같은 방법으로 읽으면 352 nm/min이라
#    Figure 3의 pH 4 값(347)과 1.4% 안에서 일치한다(같은 조건의 독립 재현).
#    그래도 인쇄된 표가 아니므로 read_method는 digitized로 정직하게 표기한다.
#
# 고정 조건(본문): 0.25 wt% 세리아, 평균입경 ~60 nm, 4 psi 다운포스, blanket
#   silicon dioxide 웨이퍼. pH ≥ 5.5 구간은 슬러리 안정화를 위해 0.01% PAA를 넣었다.

conditions:
  - label: "pH 2 (0.25wt% ceria 60nm, 4psi)"
    pressure_psi: 4.0
    rpm_wafer: 60
    rpm_platen: 60
    mrr_nm_per_min: 4.3
    read_method: digitized
    overrides:
      slurry_ph: 2.0
      abrasive_wt_pct: 0.25
      abrasive_size_nm: 60.0
  - label: "pH 3"
    pressure_psi: 4.0
    rpm_wafer: 60
    rpm_platen: 60
    mrr_nm_per_min: 95.3
    read_method: digitized
    overrides:
      slurry_ph: 3.0
      abrasive_wt_pct: 0.25
      abrasive_size_nm: 60.0
  - label: "pH 3.5"
    pressure_psi: 4.0
    rpm_wafer: 60
    rpm_platen: 60
    mrr_nm_per_min: 276.3
    read_method: digitized
    overrides:
      slurry_ph: 3.5
      abrasive_wt_pct: 0.25
      abrasive_size_nm: 60.0
  - label: "pH 4 (정점 구간)"
    pressure_psi: 4.0
    rpm_wafer: 60
    rpm_platen: 60
    mrr_nm_per_min: 347.4
    read_method: digitized
    overrides:
      slurry_ph: 4.0
      abrasive_wt_pct: 0.25
      abrasive_size_nm: 60.0
  - label: "pH 5 (정점 구간)"
    pressure_psi: 4.0
    rpm_wafer: 60
    rpm_platen: 60
    mrr_nm_per_min: 344.3
    read_method: digitized
    overrides:
      slurry_ph: 5.0
      abrasive_wt_pct: 0.25
      abrasive_size_nm: 60.0
  - label: "pH 5.5 (정점 구간, 0.01% PAA 추가)"
    pressure_psi: 4.0
    rpm_wafer: 60
    rpm_platen: 60
    mrr_nm_per_min: 350.4
    read_method: digitized
    overrides:
      slurry_ph: 5.5
      abrasive_wt_pct: 0.25
      abrasive_size_nm: 60.0
  - label: "pH 6 (급락)"
    pressure_psi: 4.0
    rpm_wafer: 60
    rpm_platen: 60
    mrr_nm_per_min: 99.3
    read_method: digitized
    overrides:
      slurry_ph: 6.0
      abrasive_wt_pct: 0.25
      abrasive_size_nm: 60.0
  - label: "pH 8"
    pressure_psi: 4.0
    rpm_wafer: 60
    rpm_platen: 60
    mrr_nm_per_min: 69.4
    read_method: digitized
    overrides:
      slurry_ph: 8.0
      abrasive_wt_pct: 0.25
      abrasive_size_nm: 60.0
  - label: "pH 10"
    pressure_psi: 4.0
    rpm_wafer: 60
    rpm_platen: 60
    mrr_nm_per_min: 64.3
    read_method: digitized
    overrides:
      slurry_ph: 10.0
      abrasive_wt_pct: 0.25
      abrasive_size_nm: 60.0

notes: >
  변수: pH 하나. 압력(4 psi)·입자(60 nm, 0.25 wt%)·막(blanket SiO2)은 전부 고정이다.
  DOE이지 양산 데이터가 아니다 — 조건마다 blanket 웨이퍼를 따로 연마했고 pH는
  실험자가 독립적으로 설정했다.

  ⚠ rpm은 논문에 없다. 60/60 rpm(헤드=플래튼)으로 전 조건 **동일하게** 두었다.
  pH만 변하는 DOE이므로 rpm 절대값은 순위 지표에 영향을 주지 않는다(모든 조건에
  같은 상수배로 작용). 절대값 대조에는 당연히 부적합하다.

  ⭐ 이 데이터셋이 시험하는 물리 — 그리고 우리 모델이 지금 틀릴 것으로 예상되는 지점:
  세리아/실리카 계의 MRR은 **pH 4~5.5에서 정점**이고 pH 6 이상에서 급락한다.
  논문의 설명은 정전기 인력이다 — 산성 영역에서 세리아는 양전하(IEP ~8), 산화막은
  음전하라 서로 끌어당기고, pH 6 이상에서는 세리아도 음전하가 되어 반발한다.
  반면 우리 sti_ceria 팩은 oxide_silica를 base로 상속받아 **pH가 올라갈수록 MRR이
  단조 증가**하는 실리카용 pH 항을 쓴다(pH 8 미만에서는 아예 응답이 없다).
  → 예측 순위가 실측과 반대로 나올 가능성이 높다. 그것은 데이터 결함이 아니라
    **팩의 실제 결함**이며, 이 데이터셋의 존재 이유가 바로 그 결함을 계량하는 것이다.
    Spearman이 음수로 나오면 sti_ceria에 세리아 고유의 정점형 pH 항(IEP 기반)을
    넣어야 한다는 뜻이다.

  ⛔ **실행 결과(ρ=-0.525, 쌍적중 13.3%)와 그 진짜 원인 — 확인된 사실이다.**
  예측값은 pH 2/3/3.5/4/5/5.5/6 이 **전부 4.90 nm/min으로 동일**했고,
  pH 8에서 8.04, pH 10에서 88.06으로 뛰었다. 9조건 중 7조건이 동점이다.
  즉 우리 팩은 pH 6 이하에서 pH를 **입력으로조차 받지 않는다**(oxide_silica에서
  상속한 ph_peak=11 정점형 항이 산성 영역에서 死구간). 음수 ρ는 "모델이 pH를
  거꾸로 예측했다"가 아니라 "모델에 산성 pH 항이 아예 없다"는 뜻이다.
  ⚠ backtest.py의 "전 조건 동일" 경고는 **전부** 같을 때만 뜨므로 이 7/9 동점을
  잡아내지 못했다. 이 데이터셋의 지표를 인용할 때는 반드시 이 사실을 함께 말해야 한다.

  ⚠ pH 5.5 이상 조건에는 0.01% PAA가 들어가 있고, PAA는 세리아 IEP를 8에서 4로
  낮춘다고 논문이 명시한다. 즉 pH 6~10 구간은 순수한 pH 효과가 아니라
  "PAA로 표면화학이 바뀐 상태"다. 모델에는 이 항을 전달할 통로가 없다.
