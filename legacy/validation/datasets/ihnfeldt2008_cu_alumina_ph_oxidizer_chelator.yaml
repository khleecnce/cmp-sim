notes: >
  이 데이터셋이 cu_h2o2_bta 에 대해 새로 묻는 것: **산화제 0 / 0.1 / 2.0 wt% 3 수준과
  pH 3 / 8.3 / 10 / 10.8 를 같은 장비·같은 연마입자에서 교차**한다. 특히
  조성 c(0.1 wt%) 대 d(2.0 wt%) 비교는 pH 8.3 에서 287 vs 289(무변화), pH 10.0 에서
  350 vs 166(0.474 배 감소), pH 3.0 에서 8(불확도 이하) vs 113(증가)로
  **산화제 효과의 부호가 pH 에 따라 바뀐다** — Miranda 2004(doi:10.1109/WMED.2004.1297359)
  가 pH 4/8 2×2 로 보인 반전을 pH 3/8.3/10 3 수준에서 독립 재확인한다.
  현행 `_oxidizer_term` 은 이 팩에서 억제형 단일 레짐이므로 이 데이터셋의 순위가
  안 맞으면 잡음이 아니라 pH×산화제 교호작용 부재의 신고로 읽어야 한다
  (EVIDENCE-RULES 판정#77·#88 계열).
