# 구리 CMP — H2O2 스윕 (산성 pH 3 × 옥살산 착화제 레짐)
source: >
  C. Jani, R. Venkataswamy, J. Seo, S. Krishnan,
  "Revisiting the Roles of Chelator, Inhibitor, Oxidant, and Abrasive in High-Rate Copper CMP",
  ECS Journal of Solid State Science and Technology 14(4) 044003, 2025.
  doi:10.1149/2162-8777/adc59e (CC-BY 오픈액세스, 전문 확보: papers/jani2025-revisiting-roles-cu-cmp.html)
  옮긴 곳: Table I(조성) × Table II(Cu RR), Experiments 30 / 31 / 32 —
  H2O2 만 3 → 4 → 6 wt% 로 바뀌고 나머지가 전부 같은 3조.
  고정 조성: 콜로이달 실리카 6 wt%(Z-평균 33 nm), 옥살산 0.08 M, 글리신 0 M,
  DOSS 0.001 M, pH 3.0. **BTA 없음.**
  고정 공정: CETR-CP-4 벤치탑, IK4250H 패드, 3.0 psi, platen 90 rpm,
  슬러리 150 mL/min, 2인치 Cu 디스크, 질량감량법(8.96 g/cm3, 20.27 cm2).

# ── 이 데이터셋이 존재하는 이유 ─────────────────────────────
# 판정#29(2회차)의 근거다. Cu 산화제 항의 **부호가 레짐에 따라 뒤집힌다**는 것을
# 보여주는 유일한 산성×착화제 계열이다:
#   알칼리·무착화제  : H2O2 ↑ → MRR ↓ (US20110165777A1, US9200180B2)
#   산성·착화제(여기): H2O2 ↑ → MRR ↑ (2282 → 2578 nm/min)
# 노트: knowledge/cmp/chi-cu-h2o2-regime-reversal-jani2025.md
#
# [EVIDENCE-RULES 판정#41, 2026-09-15] in_scope: false → true.
#   sim/chemistry.py::_oxidizer_term 에 산성(pH<6)×착화제(chelator_M>0) 레짐
#   게이트를 신설(oxidizer_acid_chelator_K, 촉진-포화형)해 팩을 레짐별로
#   분리했다(노트 §7 구현요청 이행) — 더 이상 구조적으로 표현 불가능하지
#   않다. 게이트가 선택한 K=0.7935는 **바로 이 데이터셋의 3점**(Expt
#   30/31/32)에 최소자승 적합됐으므로, in_scope=true 로 두되
#   **used_for_calibration: true** 로도 표시한다 — 그래야 qa_loop이 이
#   3점을 held-out ρ 계산에서 제외한다(F4 자기채점 검사와 동일 원칙).
#   즉 이 데이터셋은 "모델이 맞혔다"를 보여주는 held-out 증거가 아니라
#   "부호가 바로잡혔다(반증→정합)"를 보여주는 재현 확인용이다.
#
# ⚠ 여전히 남는 한계(값 승격은 하지 않았다): 착화제 종이 이 팩(글리신)과
#   다르다(여기는 옥살산) — §0 전수탐색 결과 글리신 존재 조건에서 H2O2만
#   바뀌는 실험쌍이 원문에 없어 확인 불가. K의 confidence는 estimated로
#   유지한다. 상세: knowledge/cmp/chi-cu-h2o2-regime-reversal-jani2025.md §9.
#
# ⚠ 절대값: 이 조건 엔진 예측 ~10284 nm/min vs 실측 2282 (4.5배 과대).
#   순위 전용이며 절대 MRR 주장에 쓰지 마라.
in_scope: true
used_for_calibration: true
pack: cu_h2o2_bta

conditions:
  - label: "H2O2 3 wt% (Expt 30)"
    pressure_psi: 3.0
    rpm_wafer: 90
    rpm_platen: 90
    mrr_nm_per_min: 2282.0
    read_method: table
    overrides: {slurry_ph: 3.0, abrasive_wt_pct: 6.0, abrasive_ref_wt_pct: 3.0, oxidizer_wt_pct: 3.0, inhibitor_mM: 0.0, sfr_ml_min: 150.0}
  - label: "H2O2 4 wt% (Expt 31)"
    pressure_psi: 3.0
    rpm_wafer: 90
    rpm_platen: 90
    mrr_nm_per_min: 2533.0
    read_method: table
    overrides: {slurry_ph: 3.0, abrasive_wt_pct: 6.0, abrasive_ref_wt_pct: 3.0, oxidizer_wt_pct: 4.0, inhibitor_mM: 0.0, sfr_ml_min: 150.0}
  - label: "H2O2 6 wt% (Expt 32)"
    pressure_psi: 3.0
    rpm_wafer: 90
    rpm_platen: 90
    mrr_nm_per_min: 2578.0
    read_method: table
    overrides: {slurry_ph: 3.0, abrasive_wt_pct: 6.0, abrasive_ref_wt_pct: 3.0, oxidizer_wt_pct: 6.0, inhibitor_mM: 0.0, sfr_ml_min: 150.0}

notes: >
  H2O2 1축만 변화(3/4/6 wt%), 나머지 조성·공정 전부 고정. n=3 이라 p 는 구조적으로
  최소 0.167 — 유의성은 나올 수 없고, 이 데이터셋의 역할은 통계가 아니라
  **부호 반증**이다. 현행 모델은 이 3점에서 순위가 완전히 뒤집힌다(ρ=-1.0 예상).
  그것이 곧 in_scope: false 의 근거다.
