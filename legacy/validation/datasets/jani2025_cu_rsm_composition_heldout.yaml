# 구리 CMP — Jani 2025 5인자 RSM 조성 DOE (held-out, 조성 3축 동시 변화)
source: >
  C. Jani, R. Venkataswamy, J. Seo, S. Krishnan,
  "Revisiting the Roles of Chelator, Inhibitor, Oxidant, and Abrasive in High-Rate Copper CMP",
  ECS J. Solid State Sci. Technol. 14(4) 044003, 2025. doi:10.1149/2162-8777/adc59e
  (CC-BY 오픈액세스, 전문 로컬 보관: papers/jani2025-revisiting-roles-cu-cmp.html)
  옮긴 곳: Table I(조성) × Table II(Cu RR). **표에 인쇄된 값만** — 그래프 판독 없음.
  고정 공정(원문 Experimental, 전 실험 동일): CETR-CP-4, IK4250H 패드, 3.0 psi,
  platen 90 rpm, 슬러리 150 mL/min, pH 3.0, 실리카 Z-평균 33 nm,
  2인치 Cu 디스크 질량감량법(8.96 g/cm3, 20.27 cm2).

# ── 선정 규칙 (자기채점 방지) ──────────────────────────────────────
#  · 캘리브레이션에 쓰인 Expt 30/31/32(oxidizer_acid_chelator_K)와
#    16/33(같은 노트 §9 한계 서술의 근거)은 **제외**.
#  · 실리카 0 wt%(무연마입자) 조건은 이 팩(연마입자 계)의 범위 밖이라 제외.
#  · 복제쌍(5/6, 7/8, 10/11, 13/14, 27/28)은 산술평균 1점으로 묶었다.
#  · **판정#72 적합에 쓴 4조건(E5/6, E7/8, E15, E27/28)도 제외** —
#    chelator_suppression_a(=1.5119)가 이 두 쌍의 비에서 역산됐으므로 남겨두면
#    자기 답안지로 채점하는 것이다(qa_loop F4 가 실제로 이걸 잡았다).
#  → 남은 13조건. 전부 held-out(used_for_calibration: false).
#
# ⚠ 미모델링 변수를 정직하게 적는다:
#   · 옥살산 농도(0.02~0.08 M)는 이 팩에 대응 파라미터가 없다. 같은 논문 회귀에서
#     [oxalic acid]=+536.63(p=1.7e-7)로 **가장 강한 인자**다 — 이 데이터셋의 잔차
#     상당 부분이 그 미모델링에서 온다. 이것이 이 데이터셋의 ρ가 낮은 주된 이유로
#     예상되며, 다음 회차 C1 갭 후보다.
#   · DOSS(계면활성제) 0.001~0.005 M 도 미연결.
#   · 절대값: 이 계열은 계통 편향이 크다 — 순위 전용.
in_scope: true
used_for_calibration: false
pack: cu_h2o2_bta

# ── 부분 접촉 선언 (qa_loop F4 → C4) ──────────────────────────────────────
# ⚠ 2026-09-19 학습총괄: qa_loop 가 이 데이터셋을 F4(자기채점, used_for_calibration
#   누락)로 플래그했다. 원인은 팩의 chelator_suppression_a(=1.5119)가 **같은 논문**
#   에서 역산됐기 때문이다. 다만 그 역산에 쓰인 4조건(E5/6, E7/8, E15, E27/28)은
#   위 선정 규칙에서 **이미 제외**돼 이 파일에 없다 — 즉 전면 오염이 아니라
#   부분 접촉이고, 남은 13조건은 계수를 보지 않은 점들이다.
#   그래서 used_for_calibration 을 뒤집지 않고 아래로 **신고**한다. 뒤집으면
#   정당하게 확보한 held-out 13점을 근거 없이 버리는 것이고, 신고하지 않으면
#   qa_loop 가 매 회차 같은 경보를 낸다(경보가 상시화되면 아무도 안 읽는다).
calibration_contact:
  - param: chelator_suppression_a
    pack: cu_h2o2_bta
    what: >
      knowledge/params/cu_h2o2_bta.yaml 의 chelator_suppression_a(1.5119 /M) 가
      이 논문(doi:10.1149/2162-8777/adc59e) Table I × Table II 의 통제쌍 2건
      (E5/6 vs E7/8, E15 vs E27/28)에 최소자승 적합해 얻은 값이다. 그 4조건은
      이 데이터셋에서 명시적으로 제외했으므로 남은 13조건은 독립이다.
      ⚠ 완전 독립은 아니다: 같은 실험 배치·같은 장비·같은 측정자의 데이터이므로
      계통 편향은 공유한다. 순위 검증에는 영향이 작지만 절대값 주장에는 쓰지 마라.
    axis: chelator_M
  - param: promoter_exponent_m
    pack: cu_h2o2_bta
    what: >
      [2026-09-19 판정#75] 카복실레이트 촉진축(promoter_*)의 계수 (phi, m)은
      **이 논문이 아니라** US6309560B1 TABLE 1 통제쌍 2건에서 적합했다 — 즉 이
      데이터셋으로 채점해도 자기채점이 아니다. 그럼에도 이 항목을 신고하는 이유는,
      `promoter_exponent_m` 의 note 가 **독립 교차확인**으로 이 논문의 회귀 계수
      ([oxalic acid]=+536.63)를 인용하고 있어 감사 휴리스틱이 DOI 문자열을 보고
      F4(자기채점)로 잡기 때문이다. 교차확인은 계수를 이 문헌에서 **가져온 것이
      아니라 가져오지 않았음을 보이려고** 대조한 것이고, 그 대조 결과는 19.2%
      불일치로 노트에 그대로 남아 있다(맞았다면 오히려 의심해야 할 방향이다).
      ⚠ 그래도 완전 독립은 아니다: 이 축의 **존재**를 지목한 것이 이 논문의 회귀
      (판정#73 §8-3)이므로 "무엇을 모델링할지"의 선택에는 이 문헌이 개입했다.
      계수 값에는 개입하지 않았다 — 그 구분을 위해 신고한다.
    axis: promoter_M

# ── 기계가 읽는 '미전달 축' 선언 (tools/label_vs_input_audit.py) ──────────
# ⚠ 2026-09-19 학습총괄: 구조 검사가 이 데이터셋을 🔴 로 잡았다 —
#   라벨 13종 vs 모델이 받는 고유 입력 12종. 충돌쌍을 실제로 뽑아 원인을 확정했다:
#     E9  (silica3 H2O2-7 oxalic **0.08** glycine0.26)
#     E23 (silica3 H2O2-7 oxalic **0.05** glycine0.26)
#   두 조건은 **옥살산 농도만** 다르고 나머지 8개 입력이 전부 같다. 즉 모델
#   입장에서 같은 점인데 실측이 다르다 — 이 쌍에 대해서는 순위·절대값 지표가
#   구조적으로 달성 불가능하다.
#
#   **이 결함을 데이터로 덮지 않는다.** 두 점을 평균내거나 한쪽을 빼면 ρ 는
#   오르지만 모델은 그대로다(빠진 항이 그대로 남는다). 위 헤더가 이미 옥살산을
#   "같은 논문 회귀에서 가장 강한 인자(+536.63, p=1.7e-7)"로 적어뒀는데도 산문이라
#   기계가 못 읽었다 — 그래서 아래 필드로 옮긴다. 🔴 은 선언으로 면제되지 않으며
#   (설계상 옳다), 해소 조건은 **옥살산 항의 신설** 하나다.
excluded_axes:
  oxalic_acid_M: >
    옥살산(0.02~0.08 M)에 대응하는 파라미터가 이 팩에 없다. 미전달이 아니라
    **미모델링**이다 — 전달할 키 자체가 존재하지 않는다. 같은 논문의 5인자 회귀에서
    [oxalic acid] 계수 +536.63 (p=1.7e-7) 로 다섯 인자 중 가장 강하므로, 이 축을
    임의의 기존 키(착화제·억제제 등)에 실어 보내면 물리적으로 틀린 항을 켜는 것이다
    (US9200180B2 벤젠술폰산 건과 같은 함정). 해소 경로: Cu×옥살산 착화 항의 신설.
    그때까지 E9/E23 쌍은 모델 입장에서 동일 입력이며, 이 데이터셋의 ρ 상한은
    그만큼 구조적으로 눌려 있다.
  doss_M: >
    DOSS(계면활성제, 0.001~0.005 M)도 대응 파라미터가 없다. 위와 같은 이유로
    기존 키에 싣지 않는다. 다만 이 축은 남은 조건들에서 다른 축과 함께 움직여
    단독 충돌쌍을 만들지는 않는다.

