# 제외 조건 — 삭제가 아니라 보류다. 원문이 산화제 농도를 적지 않아 입력을 결정할 수 없다.
# (수준 ②는 Table 2 에 "H2O2" 로만 적혀 있고 농도가 없다. 확인 못 함.)
excluded_conditions:
  - label: "No.2: 64kPa, pH7, H2O2(농도 미표기), 0.6um"
    mrr_nm_per_min: 94
    reason: "첨가제 수준②의 H2O2 농도가 원문 Table 2 에 없음 — 입력 미결정"
  - label: "No.5: 77kPa, pH4, H2O2(농도 미표기), 1.7um"
    mrr_nm_per_min: 125
    reason: "동일"
  - label: "No.12: 90kPa, pH11, H2O2(농도 미표기), 1.7um"
    mrr_nm_per_min: 144
    reason: "동일"
  - label: "No.15: 115kPa, pH9, H2O2(농도 미표기), 0.6um"
    mrr_nm_per_min: 156
    reason: "동일"

notes: >
  피연마재가 Mo(금속)라 전용 팩이 없다. 순위는 Kp 스케일에 불변이므로 oxide_silica 팩의
  기계 모델만 쓰되, 절대 MRR·MAPE 는 의미 없다(in_scope: false).
  논문 자신의 분산분석(Table 4)에서 MRR 기여도는 첨가제 57.07% > 압력 28.92% >
  입경 12.43% > pH 1.58% 순이다. 즉 **지배 인자가 화학(첨가제)** 이고, 산화막용 팩의
  화학 항은 Mo 계에 성립하지 않으므로 우리 예측의 순위 상한이 구조적으로 낮다.
  **이것이 이 데이터셋의 핵심 정보다** — Mo 팩이 없는 상태에서 예측이 얼마나 무력한지의 정량치.
  pH 기여도가 1.58% 로 사실상 null 인 것도 결론이다(이 계에서 pH 는 지배 인자가 아니다).
  양면 연마기(상/하 정반 3.3/10 rpm)를 회전형 CMP 기구학으로 근사했다 — 모든 조건에서
  동일하므로 순위에는 영향이 없다.
