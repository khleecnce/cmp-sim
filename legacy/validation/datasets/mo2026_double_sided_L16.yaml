# 몰리브덴 기판 양면 CMP — L16 직교배열 (압력 4수준 x pH 4수준 x 첨가제 4수준 x 입도 2수준)
source: >
  "Experimental Study on Double-Sided Chemical Mechanical Polishing of Molybdenum
  Substrates for LED Devices", Micromachines (2026) 17(2):150.
  doi:10.3390/mi17020150 · PMC12942839 (MDPI 오픈액세스).
  https://www.ncbi.nlm.nih.gov/pmc/articles/PMC12942839/
  Table 2(인자수준표)와 Table 3(L16 결과, MRR[nm/min])을 그대로 옮겼다.
  회전수: 본문 §2.1 "the upper plane and lower plane rotated at 3.3 rpm and 10 rpm".

# ⚠ 2026-09-15 수정 (학습총괄) — 라벨↔전달값 감사가 잡은 결함 2건:
#   slurry_ph 가 라벨에서 4/7/9/11 로 변하는데 조건에 전달되지 않았고,
#   oxidizer_wt_pct 도 마찬가지였다. 모델이 못 보는 축은 검증에 쓰일 수 없다.
#   1차 원문(Europe PMC fullTextXML)에서 Table 2 수준표를 직접 읽어 전달한다:
#     A 압력 [kPa] : 64 / 77 / 90 / 115
#     B pH        : 4 / 7 / 9 / 11
#     C 첨가제     : ① none  ② H2O2  ③ H2O2(0.5%)+Glycine(5 mg/L)  ④ H2O2(1%)+Glycine(5 mg/L)
#     D 입경 [µm]  : 0.6 / 1.7
#
# ⚠ 첨가제 수준 ②("H2O2", 농도 미표기)는 원문이 농도를 적지 않았다 — **확인 못 했다**.
#   지어내지 않는다. 그렇다고 oxidizer_wt_pct 를 빼면 팩 기본값이 조용히 상속되므로
#   (부재 서술 ↔ 기본값 상속 함정), 해당 4조건(No.2/5/12/15)은 **제외**하고 아래
#   excluded_conditions 에 근거와 함께 남긴다. 농도가 확인되면 되살려라.
#
# ⚠ 글리신 5 mg/L 은 inhibitor_mM 로 옮기지 않았다. 억제 상수는 (분자 × 기질) 쌍의
#   성질이고 (glycine × Mo) 쌍이 우리 표에 없다 — 다른 쌍의 값으로 대체 금지.
#   [[inhibitor-pairs-additional]] 규칙과 같다.

# 재료계: 몰리브덴 금속 기판. 우리 팩은 Si 산화막용이라 범위 밖.
in_scope: false
used_for_calibration: false
pack: oxide_silica

