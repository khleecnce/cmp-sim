# Cu CMP 특허 실시예 — 연마입자 크기 9종 × 다운포스 2수준의 구리 제거율(전면 Cu 웨이퍼)
source: >
  TW202115224A, "Low dishing copper chemical mechanical planarization",
  Versum Materials US LLC (慧盛材料), 2019 출원 / 2021 공개.
  실시예 1 표2(표1의 연마입자 목록과 짝지음)에서 옮김. 원 단위 Å/min → ÷10으로 nm/min 환산.
  https://patents.google.com/patent/TW202115224A/en
in_scope: true
used_for_calibration: false
pack: cu_h2o2_bta

# ── 기계가 읽는 '미전달 축' 선언 (tools/label_vs_input_audit.py) ──────────
# ⚠ 2026-09-19 학습총괄: 구조 검사가 🔴 로 잡았다 — 라벨 18종 vs 모델이 받는
#   고유 입력 12종. 충돌쌍 6개를 실제로 뽑아 원인을 확정했다. 전부 같은 형태다:
#     배합1 Nalco 15nm 구형  ↔  배합2 Fuso 15nm 구형   (2.5 psi / 1.5 psi)
#     배합3 Nalco 27nm 구형  ↔  배합4 Fuso 27nm 구형   (2.5 psi / 1.5 psi)
#     배합5 Nalco 50nm 구형  ↔  배합6 Fuso 50nm 누에고치형 (2.5 psi / 1.5 psi)
#   즉 **공칭 입경이 같은데 제조사(그리고 5번/6번은 입자 형상)가 다른** 쌍이고,
#   모델은 공칭 입경만 받으므로 두 점이 같은 입력으로 뭉친다.
#
#   이것은 데이터 전사 오류가 아니라 **모델에 그 축이 없다**는 뜻이다. 그리고
#   이 데이터셋의 calibration_contact 가 기록한 "입경은 지배인자가 아니다"(ρ≈0.03
#   ~0.15 비유의) 라는 영 판정의 **신뢰 근거가 바로 이 충돌**이다 — 같은 공칭
#   입경에서 제조사만 바꿔도 제거율이 갈린다면, 입경축 상관이 약하게 나오는 것은
#   입경이 무력해서가 아니라 **다른 축이 그 안에 섞여 있기 때문**일 수 있다.
excluded_axes:
  abrasive_vendor: >
    연마입자 제조사(Nalco / Fuso)에 대응하는 파라미터가 없다. 제조사는 그 자체로
    물리량이 아니므로 키를 만들어 직접 넣는 것은 금지다 — 그것은 데이터셋 지문이
    된다. 제조사가 대리하는 실제 물리량(표면 실란올 밀도·응집도·PSD 폭·표면전하)
    중 어느 것이 이 차이를 만드는지 분리되기 전까지 항을 만들지 않는다.
    해소 경로: 두 제조사 입자의 물성(IEP·D99/D50·비표면적)이 함께 인쇄된 표 1건.
  abrasive_shape: >
    입자 형상(구형 / 누에고치형)도 대응 파라미터가 없다. 50 nm 쌍(배합5/6)에서만
    제조사와 **동시에** 바뀌므로 이 데이터 안에서는 두 축이 분리 불가능하다
    (2×2 격자가 대각선 2칸만 찬 상태) — 분리되기 전에 항을 만들면 두 효과가 한
    계수에 뭉쳐 그 데이터셋의 지문이 된다. 15/27 nm 쌍은 둘 다 구형이므로 그
    두 쌍의 차이는 순수하게 제조사 축이다(위 항목 참조).
calibration_contact:
  - param: abrasive_size_exponent
    pack: cu_h2o2_bta
    what: >
      knowledge/params/cu_h2o2_bta.yaml의 abrasive_size_exponent(0.0) note —
      "TW202115224A 실측 n=18"에서 순수 구형 부분집합(15/27/50/160nm, n=6/압력)만
      골라 Spearman을 돌려 rho≈0.03~0.15(비유의)로 "입경이 지배인자가 아니다"는
      영(null) 판정을 내렸다. 이 데이터셋(TW202115224A 표2, n=18 전체)이 그 실측
      원천이다.
    axis: abrasive_size_nm

# 공정조건(특허 명시): Reflexion LK, VP9280 패드, 정반 93 RPM, 슬러리 300 mL/min,
