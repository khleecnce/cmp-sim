# Cu CMP 특허 실시예 — 연마입자 크기 9종 × 다운포스 2수준의 구리 제거율(전면 Cu 웨이퍼)
source: >
  TW202115224A, "Low dishing copper chemical mechanical planarization",
  Versum Materials US LLC (慧盛材料), 2019 출원 / 2021 공개.
  실시예 1 표2(표1의 연마입자 목록과 짝지음)에서 옮김. 원 단위 Å/min → ÷10으로 nm/min 환산.
  https://patents.google.com/patent/TW202115224A/en
in_scope: true
used_for_calibration: false
pack: cu_h2o2_bta
calibration_contact:
  - param: abrasive_size_exponent
    pack: cu_h2o2_bta
    what: >
      knowledge/params/cu_h2o2_bta.yaml의 abrasive_size_exponent(0.0) note —
      "TW202115224A 실측 n=18"에서 순수 구형 부분집합(15/27/50/160nm, n=6/압력)만
      골라 Spearman을 돌려 rho≈0.03~0.15(비유의)로 "입경이 지배인자가 아니다"는
      영(null) 판정을 내렸다. 이 데이터셋(TW202115224A 표2, n=18 전체)이 그 실측
      원천이다.
    axis: abrasive_size_nm

# 공정조건(특허 명시): Reflexion LK, VP9280 패드, 정반 93 RPM, 슬러리 300 mL/min,
#   1단계 2.5 psi / 2단계 1.5 psi. 전면 전해도금 Cu 웨이퍼(제거율용).
# 조성(모든 실시예 공통): 콜로이달 실리카 833 ppm(=0.0833 wt%), H2O2 1 wt%,
#   글리신 5.5 wt%, 알라닌 9.5 wt%, 1,2,4-트리아졸 416 ppm, pH 7.20~7.30.
# 변하는 것은 **연마입자 종류·평균입경(MPS)** 과 **다운포스** 둘뿐이다.
