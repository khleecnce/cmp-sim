notes: >
  변수는 두 개다: (1) 연마입자 종류/평균입경 15~160 nm, (2) 다운포스 2.5 / 1.5 psi.
  조성(실리카 833 ppm, H2O2 1 wt%, 글리신 5.5 wt%, 알라닌 9.5 wt%, 1,2,4-트리아졸 416 ppm,
  pH 7.2~7.3)과 정반 93 rpm, 유량 300 mL/min은 전 실시예 동일 — 특허 본문에 인쇄된 값이다.

  ⚠ 모델이 실제로 구분하는 것은 압력뿐이다. 팩에 abrasive_size_exponent가 없어
  κ의 입경 항이 적용되지 않으므로(sim/factors.py `_f_kappa`가 지수를 지어내지 않는다),
  같은 압력의 9개 배합은 예측값이 모두 같다. 즉 이 데이터셋은
  **"압력 순위를 맞히는가"만 검증하고, 입경 순위는 검증하지 않는다.**
  실측은 같은 압력 안에서 4414~8493 Å/min으로 2배 가까이 갈리므로,
  Spearman이 1보다 낮게 나오는 몫의 상당 부분이 미모델링된 입경/입자형상 효과다.

  ⚠ 억제제는 BTA가 아니라 1,2,4-트리아졸 416 ppm이다. 팩의 BTA 흡착상수를 그대로
  쓰면 잘못된 화학을 적용하는 것이라 inhibitor_mM은 건드리지 않았다(전 조건 동일하므로
  순위에는 영향 없음). 절대값 비교에는 부적합하다.

  ⚠ pH는 7.2~7.3이지만 cu_h2o2_bta 팩에는 pH 항이 연결돼 있지 않아 override하지 않았다.
