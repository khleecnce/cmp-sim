# Cu CMP 특허 실시예 — H2O2 농도(0~7 wt%) 대 구리 제거율. 산화제 축 단독 검증용.
source: >
  US20110165777A1, "Method and Slurry for Tuning Low-K Versus Copper Removal Rates
  During Chemical Mechanical Polishing", DuPont Air Products NanoMaterials LLC,
  2011 공개(우선일 2006). 실시예 1~14의 TABLE 1 / TABLE 2 'Cu RR 2 psi' 행에서 옮김.
  원 단위 Å/min → ÷10으로 nm/min 환산.
  https://patents.google.com/patent/US20110165777A1/en
in_scope: true
# 2026-09-14 (EVIDENCE-RULES 판정#20): false -> true.
# 이 파일의 TABLE 2 4점(H2O2 0/0.25/0.5/1.0 wt%)에 cu_h2o2_bta 팩의
# oxidizer_passivation_K(=0.8232)를 최소자승으로 적합했다. 따라서 이 데이터셋으로
# 그 팩을 채점하면 자기 채점(self-scoring)이다 — qa_loop F4가 정확히 이것을 잡아냈다.
# 근거 노트: knowledge/cmp/chi-oxidizer-cu-h2o2-reparameterization.md §5
# (교차확인에만 쓴 us9200180b2_cu_h2o2_series 는 적합에 쓰지 않았으므로 held-out 유지)
used_for_calibration: true
pack: cu_alkaline_benzenesulfonic

# 피연마재(특허 명시): 전해도금 구리 블랭킷 웨이퍼
#   (Cu 10,000 Å / Cu seed 1,000 Å / Ta 250 Å on silicon) — 실리콘 반도체 Cu 배선계.
# 공정조건(특허 명시): Mirra, Politex embossed 패드, table 123 rpm, head 112 rpm,
#   멤브레인 압력 2.0 psi, 슬러리 유량 200 mL/min.
# 조성 고정: 콜로이달 실리카 5 wt%, 벤젠술폰산 1.0 wt%, BTA 100 ppm.
# 변수: H2O2 0~7 wt%, Zonyl FSN(비이온 불소계 계면활성제) 0~2000 ppm, KOH 0.59 / 0.41 wt%.
conditions:
  # ── TABLE 1 (KOH 0.59 wt%, pH before H2O2 = 11.1) ──
  - label: "H2O2 1%, FSN 0 ppm"
    pressure_psi: 2.0
    rpm_platen: 123
    rpm_wafer: 112
    mrr_nm_per_min: 16.0
    read_method: table
    overrides: {oxidizer_wt_pct: 1.0, abrasive_wt_pct: 5.0, sfr_ml_min: 200.0, slurry_ph: 11.1, inhibitor_mM: 0.8395}
  - label: "H2O2 3%, FSN 0 ppm"
    pressure_psi: 2.0
    rpm_platen: 123
    rpm_wafer: 112
    mrr_nm_per_min: 15.8
    read_method: table
    overrides: {oxidizer_wt_pct: 3.0, abrasive_wt_pct: 5.0, sfr_ml_min: 200.0, slurry_ph: 11.1, inhibitor_mM: 0.8395}
  - label: "H2O2 5%, FSN 0 ppm"
    pressure_psi: 2.0
    rpm_platen: 123
    rpm_wafer: 112
    mrr_nm_per_min: 15.4
    read_method: table
    overrides: {oxidizer_wt_pct: 5.0, abrasive_wt_pct: 5.0, sfr_ml_min: 200.0, slurry_ph: 11.1, inhibitor_mM: 0.8395}
  - label: "H2O2 7%, FSN 0 ppm"
    pressure_psi: 2.0
    rpm_platen: 123
    rpm_wafer: 112
    mrr_nm_per_min: 15.7
    read_method: table
    overrides: {oxidizer_wt_pct: 7.0, abrasive_wt_pct: 5.0, sfr_ml_min: 200.0, slurry_ph: 11.1, inhibitor_mM: 0.8395}
notes: >
  DOE 축: H2O2 0 / 0.25 / 0.5 / 1 / 3 / 5 / 7 wt%(모델에 전달됨) + Zonyl FSN 계면활성제
  0 / 250 / 500 ppm(모델 미전달) + KOH 농도 2수준. 실리카·BTA·압력·rpm은 전 조건 고정이고
  전부 특허 본문에 인쇄돼 있다.

  ⚠ FSN 2000 ppm 조건(Ex.14, Cu RR 72 Å/min)은 제외했다. 계면활성제 과량이 지배하는
  조건이라 산화제 축 검증을 오염시킨다 — 값을 숨긴 게 아니라 축이 다르다는 뜻이다.

  ⚠⚠ 이 데이터셋의 실측 자체가 거의 평평하다. 특허 본문이 명시한다:
  "H2O2 1~7%는 구리 제거율에 거의 영향이 없다 … 146~160 Å/min 사이에 머물렀다."
  즉 **실측 분산의 상당 부분이 측정 산포**다. 반면 모델(cu_h2o2_bta)은 Kaufman 단봉
  곡선으로 0%→3%에서 0→672 nm/min의 급격한 상승을 예측한다.
  → 이 데이터셋이 드러내는 것은 "산화제 민감도가 팩 기본값(peak 3 wt%, curve_n 2.0)에서
  과대 설정돼 있다"는 것이다. 순위 점수가 낮게 나오는 것이 정상이고, 그것이 결과다.
  다만 H2O2 0% 조건이 모델에서 MRR=0으로 예측되는 것은 명백히 틀렸다(실측 187 Å/min):
  BSA/BTA 알칼리 슬러리에서는 산화제 없이도 기계적 제거가 남는데 팩이 이를 0으로 만든다.

  ⚠ 계통 편향: Politex(연질) 패드 + 배리어 스텝 조건이라 실측 Cu MRR이 12~19 nm/min으로
  매우 낮다. 팩의 Kp는 Cu 벌크 스텝(400~800 nm/min)에서 역산된 값이라 절대값은
  30배 이상 어긋난다. **절대값 비교 부적합, 순위 비교 전용.**

  ⚠ pH 11.1 / 10.3 차이는 cu_h2o2_bta 팩에 pH 항이 연결돼 있지 않아 미반영이다.
