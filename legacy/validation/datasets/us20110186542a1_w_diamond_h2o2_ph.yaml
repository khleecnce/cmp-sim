# W 플러그 CMP 특허 실시예 — 나노다이아몬드 함량 × H2O2 농도 × pH의 텅스텐 제거율
source: >
  US20110186542A1, "Slurry containing multi-oxidizer and mixed nano-abrasives for
  tungsten chemical mechanical planarization", ASPT Inc, 2011 공개.
  실시예 3의 TABLE 3.1(pH 3)과 TABLE 3.2(pH 6)에서 옮김.
  원 단위 Å/min → ÷10으로 nm/min 환산.
  https://patents.google.com/patent/US20110186542A1/en
in_scope: true
used_for_calibration: true   # 2026-09-09: w_fe_oxidizer 팩의 oxidizer_* 5개를 이 표에서 역산 — 자기 채점 금지
pack: w_fe_oxidizer

# 공정조건(특허 EXAMPLES 도입부에 인쇄된 값):
#   Westech 372M, 다운포스 3 psi, table/carrier 75/65 rpm, 슬러리 200 mL/min,
#   백프레셔 1 psi. 피연마재는 텅스텐 블랭킷 웨이퍼(실리콘 반도체 W 플러그 계).
# 고정: KPS(과황산칼륨) 2 wt%.  변수: 다이아몬드 wt%, H2O2 wt%, pH.
conditions:
  # ── TABLE 3.1 : pH 3, 2% KPS ──
  - label: "pH3 다이아몬드 0.01wt%, H2O2 0%"
    pressure_psi: 3.0
    rpm_platen: 75
    rpm_wafer: 65
    mrr_nm_per_min: 28.9
    read_method: table
    overrides: {abrasive_wt_pct: 0.01, abrasive_ref_wt_pct: 0.02, sfr_ml_min: 200.0, oxidizer_wt_pct: 0.0, slurry_ph: 3.0}
  - label: "pH3 다이아몬드 0.01wt%, H2O2 1%"
    pressure_psi: 3.0
    rpm_platen: 75
    rpm_wafer: 65
    mrr_nm_per_min: 110.0
    read_method: table
    overrides: {abrasive_wt_pct: 0.01, abrasive_ref_wt_pct: 0.02, sfr_ml_min: 200.0, oxidizer_wt_pct: 1.0, slurry_ph: 3.0}
  - label: "pH3 다이아몬드 0.01wt%, H2O2 3%"
    pressure_psi: 3.0
    rpm_platen: 75
    rpm_wafer: 65
    mrr_nm_per_min: 227.0
    read_method: table
    overrides: {abrasive_wt_pct: 0.01, abrasive_ref_wt_pct: 0.02, sfr_ml_min: 200.0, oxidizer_wt_pct: 3.0, slurry_ph: 3.0}
  - label: "pH3 다이아몬드 0.02wt%, H2O2 0%"
    pressure_psi: 3.0
    rpm_platen: 75
    rpm_wafer: 65
    mrr_nm_per_min: 36.3
    read_method: table
    overrides: {abrasive_wt_pct: 0.02, abrasive_ref_wt_pct: 0.02, sfr_ml_min: 200.0, oxidizer_wt_pct: 0.0, slurry_ph: 3.0}
  - label: "pH3 다이아몬드 0.02wt%, H2O2 1%"
    pressure_psi: 3.0
    rpm_platen: 75
    rpm_wafer: 65
    mrr_nm_per_min: 165.0
    read_method: table
    overrides: {abrasive_wt_pct: 0.02, abrasive_ref_wt_pct: 0.02, sfr_ml_min: 200.0, oxidizer_wt_pct: 1.0, slurry_ph: 3.0}
  - label: "pH3 다이아몬드 0.02wt%, H2O2 3%"
    pressure_psi: 3.0
    rpm_platen: 75
    rpm_wafer: 65
    mrr_nm_per_min: 243.0
    read_method: table
    overrides: {abrasive_wt_pct: 0.02, abrasive_ref_wt_pct: 0.02, sfr_ml_min: 200.0, oxidizer_wt_pct: 3.0, slurry_ph: 3.0}

  # ── TABLE 3.2 : pH 6, 2% KPS ──
  - label: "pH6 다이아몬드 0.01wt%, H2O2 0%"
    pressure_psi: 3.0
    rpm_platen: 75
    rpm_wafer: 65
    mrr_nm_per_min: 24.6
    read_method: table
    overrides: {abrasive_wt_pct: 0.01, abrasive_ref_wt_pct: 0.02, sfr_ml_min: 200.0, oxidizer_wt_pct: 0.0, slurry_ph: 6.0}
  - label: "pH6 다이아몬드 0.01wt%, H2O2 1%"
    pressure_psi: 3.0
    rpm_platen: 75
    rpm_wafer: 65
    mrr_nm_per_min: 132.0
    read_method: table
    overrides: {abrasive_wt_pct: 0.01, abrasive_ref_wt_pct: 0.02, sfr_ml_min: 200.0, oxidizer_wt_pct: 1.0, slurry_ph: 6.0}
  - label: "pH6 다이아몬드 0.01wt%, H2O2 3%"
    pressure_psi: 3.0
    rpm_platen: 75
    rpm_wafer: 65
    mrr_nm_per_min: 211.0
    read_method: table
    overrides: {abrasive_wt_pct: 0.01, abrasive_ref_wt_pct: 0.02, sfr_ml_min: 200.0, oxidizer_wt_pct: 3.0, slurry_ph: 6.0}
  - label: "pH6 다이아몬드 0.02wt%, H2O2 0%"
    pressure_psi: 3.0
    rpm_platen: 75
    rpm_wafer: 65
    mrr_nm_per_min: 29.8
    read_method: table
    overrides: {abrasive_wt_pct: 0.02, abrasive_ref_wt_pct: 0.02, sfr_ml_min: 200.0, oxidizer_wt_pct: 0.0, slurry_ph: 6.0}
  - label: "pH6 다이아몬드 0.02wt%, H2O2 1%"
    pressure_psi: 3.0
    rpm_platen: 75
    rpm_wafer: 65
    mrr_nm_per_min: 161.0
    read_method: table
    overrides: {abrasive_wt_pct: 0.02, abrasive_ref_wt_pct: 0.02, sfr_ml_min: 200.0, oxidizer_wt_pct: 1.0, slurry_ph: 6.0}
  - label: "pH6 다이아몬드 0.02wt%, H2O2 3%"
    pressure_psi: 3.0
    rpm_platen: 75
    rpm_wafer: 65
    mrr_nm_per_min: 236.0
    read_method: table
    overrides: {abrasive_wt_pct: 0.02, abrasive_ref_wt_pct: 0.02, sfr_ml_min: 200.0, oxidizer_wt_pct: 3.0, slurry_ph: 6.0}
  - label: "pH6 다이아몬드 0.04wt%, H2O2 0%"
    pressure_psi: 3.0
    rpm_platen: 75
    rpm_wafer: 65
    mrr_nm_per_min: 50.0
    read_method: table
    overrides: {abrasive_wt_pct: 0.04, abrasive_ref_wt_pct: 0.02, sfr_ml_min: 200.0, oxidizer_wt_pct: 0.0, slurry_ph: 6.0}
  - label: "pH6 다이아몬드 0.04wt%, H2O2 1%"
    pressure_psi: 3.0
    rpm_platen: 75
    rpm_wafer: 65
    mrr_nm_per_min: 182.0
    read_method: table
    overrides: {abrasive_wt_pct: 0.04, abrasive_ref_wt_pct: 0.02, sfr_ml_min: 200.0, oxidizer_wt_pct: 1.0, slurry_ph: 6.0}
  - label: "pH6 다이아몬드 0.04wt%, H2O2 3%"
    pressure_psi: 3.0
    rpm_platen: 75
    rpm_wafer: 65
    mrr_nm_per_min: 265.0
    read_method: table
    overrides: {abrasive_wt_pct: 0.04, abrasive_ref_wt_pct: 0.02, sfr_ml_min: 200.0, oxidizer_wt_pct: 3.0, slurry_ph: 6.0}

notes: >
  DOE 축은 세 개다: 다이아몬드 입자 0.01/0.02/0.04 wt%, H2O2 0/1/3 wt%, pH 3/6.
  KPS 2 wt% 고정. 값은 전부 실시예 표에 인쇄된 Å/min이며 ÷10 환산했다.

  ⚠⚠ **이 데이터셋에서 모델에 실제로 전달되는 조성 변수는 다이아몬드 함량 하나뿐이다.**
  w_fe_oxidizer 팩에는 oxidizer_peak_wt_pct/oxidizer_ref_wt_pct가 없어(Fe(NO3)3 산화제만
  정성 기재) H2O2 농도를 override해도 sim/chemistry.py `_oxidizer_term`이 발동하지 않고,
  ph_peak/ph_ref도 없어 pH 항이 죽어 있다. 없는 파라미터를 지어내 넣으면 그건 검증이
  아니라 자작이므로 넣지 않았다.
  실측에서 MRR을 가장 크게 움직인 것은 H2O2(0→3%에서 8~10배)인데 모델은 그걸 못 본다.
  따라서 이 데이터셋의 낮은 순위 점수는 "모델이 틀렸다"가 아니라
  **"W 팩에 산화제 축이 비어 있다"는 커버리지 결함을 정량화한 것**이다 — 다음 작업 목록이다.
  (참고: 특허 스스로 "pH는 텅스텐 제거율에 크게 영향을 주지 않는다"고 서술했고,
   표 3.1 vs 3.2 비교로도 확인된다. pH 미모델링의 실측 영향은 작다.)

  ⚠ 연마입자가 알루미나가 아니라 나노다이아몬드(UK Abrasives DP1-IA45, 12~40 nm)이고
  산화제도 Fe(III)가 아니라 KPS+H2O2다. 팩과 화학계가 달라 절대값(Kp) 비교는 부적합하며,
  순위 비교용으로만 쓸 것. abrasive_size_nm은 팩에 지수가 없어 override하지 않았다.

  ⚠ 출원인 ASPT Inc는 코퍼스 화이트리스트 밖(untrusted)이다. 다만 값은 자동추출이 아니라
  실시예 표를 사람이 직접 대조해 옮겼다.
