# W 플러그 CMP — H2O2 농도 5수준(0~6.1 wt%), Fe(III)계 금속이온 활성제 공존. 특허 실시예 인쇄표.
source: >
  US8070843B2 (3M Innovative Properties Co), "Polishing fluids and methods for CMP",
  2011. https://patents.google.com/patent/US8070843B2
  옮긴 곳: TABLE 1 "Polishing Solution Parameters and Tungsten Removal Results"
  — Examples 1~4 및 Comparative Example CE-5 행 (Removal Rate 열, Å/min).
  공정조건 출처: 명세서 "General Polishing Procedure" — Mirra 3400, MWR66 패드,
  membrane pressure 27.6 kPa (4.0 psi), platen 79 rpm, carrier 101 rpm,
  용액 유량 150 mL/min, 60 s/웨이퍼, 블랭킷 텅스텐 웨이퍼.
  (CE-1~CE-6 및 Example 1~6이 모두 이 Mirra 3400 조건으로 연마되었다고 명시)
in_scope: true
used_for_calibration: false
pack: w_fe_oxidizer
rank_only: true
rank_only_ruling: >
  [EVIDENCE-RULES 판정#58, 2026-09-18] 절대값 계통편향 obs/pred 0.089~0.320(중앙값 0.28,
  즉 예측이 실측의 ~3.6배, ρ=+1.000 p=0.008은 그대로 집계). 두 원인이 겹친다 — 둘 다 이미
  독립적으로 확인된 것이지 이 held-out 하나에 맞추려고 새로 지어낸 게 아니다(E6 아님).
  ① **팩 Kp 자체가 계통적으로 높다(2~3배)**: knowledge/cmp/w-cmp-preston-kp-oxidizer-rate-
  literature-reproduction.md §3이 이미 3개 독립 1차문헌(Stojadinović 2016, Lim 2013,
  이 데이터셋 자신의 6.1wt% 점)에서 Preston 역산 Kp*=MRR/(P·V)를 구해 median 1.07e-13 —
  팩값 2.8e-13의 1.8~3.4배(그 노트의 verify 블록 assert로 이미 고정됨) — 를 확인했다.
  이 held-out을 뺀 완전 독립 2문헌(Stojadinović+Lim)만으로도 median 7.85e-14로 팩값의
  ~3.6배 낮다 — 이 데이터셋 하나에 맞춘 순환이 아니라는 뜻이다. ② **기계 메커니즘 자체가
  팩 정의역 밖**: 이 특허(US8070843B2, 3M Mirra 3400)는 **고정연마입자(fixed-abrasive)
  패드 + 무연마입자 용액** 방식인데(명세서 "General Polishing Procedure"), 팩 w_fe_oxidizer의
  κ(기계) 항은 슬러리 내 유리(遊離) 알루미나 연마입자 함량(abrasive_wt_pct)을 전제로
  설계됐다 — 이 데이터셋은 그 오버라이드가 아예 없어 팩 기본 유리연마입자 함량이 마치
  존재하는 것처럼 계산된다. 반사실 실험(실행값, sim.engine.simulate 직접 호출): 이 held-out만
  맞추도록 Kp를 0.28배(2.8e-13→7.84e-14)로 낮추면 이 데이터셋은 median obs/pred 1.017로
  거의 완벽해지지만, 같은 팩의 캘리브레이션 문헌(US20110186542A1, n=15)은 median 0.585
  (1.7배 과대)→**2.09배 과소**로 반전한다 — 하나를 맞추면 하나가 반대로 틀어진다(E6 회피
  확인). 3문헌 median 기반 배수(0.393배, 2.8e-13→1.1e-13)를 대신 쓰면 이 held-out은 0.725,
  캘리브레이션셋은 1.49로 **둘 다 2배 이내**로 개선되지만 어느 쪽도 완전히 맞진 않는다 —
  고정연마입자 메커니즘 불일치가 Kp 재조정만으로 안 닫히는 잔차로 남는다는 뜻이다. 그러므로
  이번 판정에서는 kp_m_per_pa 값 자체를 바꾸지 않는다(그 수치 교정은 별도 판정으로 미루고,
  이 노트가 이미 confidence=estimated 유지를 권고했다) — 대신 이 데이터셋의 절대값을
  rank_only로 면제한다. 팩 파일은 도메인 한계 주석만 추가했다(값 미변경).
calibration_contact:
  - param: kp_m_per_pa
    pack: w_fe_oxidizer
    what: >
      [판정#58] 이 데이터셋 자체는 Kp 적합에 쓰이지 않았다(값 2.8e-13 은
      surface-chemistry-cu-w-pourbaix-passivation.md 의 문헌범위 역산값이고,
      used_for_calibration 는 false 그대로다). 다만 판정#58 이 팩 note 에 추가한
      "Kp 가 3문헌 median 1.07e-13 의 1.8~3.4배" 라는 교차확인 문장의 그 3문헌에
      **이 특허가 포함**되므로, note 가 이 문헌 ID 를 언급하게 됐다. 즉 값-도출
      경로의 오염이 아니라 **근거 서술의 부분 접촉**이다 — 감사기가 F4(미신고
      자기채점)로 올리는 것이 맞고, 여기 신고함으로써 C4(신고된 부분오염)로
      격하한다. 숨기지 않고 드러내는 쪽을 택했다.
conditions:
  - label: "H2O2 0 wt% (CE-5, Fe 1180 ppm)"
    pressure_psi: 4.0
    rpm_wafer: 101
    rpm_platen: 79
    mrr_nm_per_min: 9.6
    read_method: table
    overrides:
      sfr_ml_min: 150
      oxidizer_wt_pct: 0.0
  - label: "H2O2 2.03 wt% (Example 3, Fe 60 ppm)"
    pressure_psi: 4.0
    rpm_wafer: 101
    rpm_platen: 79
    mrr_nm_per_min: 150.8
    read_method: table
    overrides:
      sfr_ml_min: 150
      oxidizer_wt_pct: 2.03
  - label: "H2O2 4.06 wt% (Example 2, Fe 5 ppm)"
    pressure_psi: 4.0
    rpm_wafer: 101
    rpm_platen: 79
    mrr_nm_per_min: 239.6
    read_method: table
    overrides:
      sfr_ml_min: 150
      oxidizer_wt_pct: 4.06
  - label: "H2O2 4.07 wt% (Example 1, Fe 1180 ppm)"
    pressure_psi: 4.0
    rpm_wafer: 101
    rpm_platen: 79
    mrr_nm_per_min: 241.0
    read_method: table
    overrides:
      sfr_ml_min: 150
      oxidizer_wt_pct: 4.07
  - label: "H2O2 6.10 wt% (Example 4, Fe 60 ppm)"
    pressure_psi: 4.0
    rpm_wafer: 101
    rpm_platen: 79
    mrr_nm_per_min: 296.5
    read_method: table
    overrides:
      sfr_ml_min: 150
      oxidizer_wt_pct: 6.10
notes: >
  변수 = H2O2 농도(0 → 2.03 → 4.06 → 4.07 → 6.10 wt%). 압력·회전수·패드·시간은 전부 동일.
  단위 환산: 원문 Å/min → nm/min (÷10). 96 / 1,508 / 2,396 / 2,410 / 2,965 Å/min.
  압력 환산: 원문 27.6 kPa ÷ 6.895 = 4.0 psi (특허 본문도 4.0 psi로 병기).
  ── 산화제 정점을 지나는가: 아니다 ──
  이 5점은 **0→6.1 wt% 전 구간 단조 증가**다. Kaufman 정점은 이 구간 안에 나타나지
  않으며, 정점은 6.1 wt%보다 오른쪽이거나 이 Fe(III)-H2O2 혼합계에서는 훨씬 높은 곳에
  있다. 따라서 이 데이터셋은 정점 위치를 검증하지 못하고 **상승 가지만** 검증한다.
  ⚠ overrides의 oxidizer_peak_wt_pct = 3.0은 **원문에 없는 값**이다. w_fe_oxidizer 팩에는
  산화제 곡선 파라미터가 아예 없어(oxidizer_wt_pct / peak / ref 전부 부재) 화학층이
  비활성화되고 전 조건 예측이 동일해진다. 그래서 자매 팩 cu_h2o2_bta의 H2O2 정점값
  3.0 wt%를 그대로 빌려 넣었다. 이 가정 때문에 모델은 3 wt% 이후 감소를 예측하는데
  실측은 계속 증가한다 — 이 불일치는 **데이터에 맞춰 정점을 조정하지 않은 결과**이며,
  W 팩의 산화제 정점을 실측으로 정해야 한다는 작업 지시로 읽어야 한다.
  oxidizer_ref_wt_pct = 4.06은 이 표의 최빈 조건(기준 배합)이며 상대 배수의 기준점일 뿐
  순위에 영향이 없다.
  ── 미모델링 교란요인 ──
  금속이온(Fe) 농도가 5~1180 ppm으로 함께 변한다. 다만 H2O2 ≈ 4.06 wt% 고정에서
  Fe 5 ppm(2,396 Å/min)과 1180 ppm(2,410 Å/min)의 차이가 0.6%에 불과해, 이 범위에서
  Fe 농도는 지배 변수가 아니다. 그래도 완전한 단일변수 DOE는 아니다.
  Fe 농도·착화제(methylmalonic acid 등) 종류는 모델에 전달할 통로가 없어 생략했다.
  본 특허는 **고정 연마입자(fixed abrasive) 패드 + 무연마입자 용액** 방식이라
  팩의 알루미나 슬러리 가정과 다르다 — 절대 MRR은 신뢰하지 말고 순위만 볼 것.
  피연마재는 실리콘 웨이퍼 위 블랭킷 W 박막이므로 in_scope: true.
