# Cu 배선 CMP — H2O2 농도 3수준 (연마입자·첨가제 고정). 특허 실시예 인쇄표.
source: >
  US9200180B2 (Air Products and Chemicals / 현 Versum·Merck), "Chemical-mechanical
  planarization composition having benzenesulfonic acid and per-compound oxidizing
  agents, and associated method for use", 2015. https://patents.google.com/patent/US9200180B2
  옮긴 곳: TABLE 1-b (Examples 5, 6, 7) — "... Using Mixtures of Benzenesulfonic acid
  with Hydrogen Peroxide". Cu removal rate at 2.0 psi 행.
  공정조건 출처: 명세서 실험 절차 — Mirra 3400, Politex 패드, platen 90 rpm,
  head 84 rpm, membrane pressure 2.0 psi, slurry 200 mL/min, 60 s, ECD 구리 블랭킷 웨이퍼.
in_scope: true
used_for_calibration: false
pack: cu_h2o2_bta
conditions:
  - label: "H2O2 1wt% (Example 5)"
    pressure_psi: 2.0
    rpm_wafer: 84
    rpm_platen: 90
    mrr_nm_per_min: 11.8
    read_method: table
    overrides:
      oxidizer_wt_pct: 1.0
      abrasive_wt_pct: 3.0
      abrasive_ref_wt_pct: 3.0
  - label: "H2O2 2.5wt% (Example 6)"
    pressure_psi: 2.0
    rpm_wafer: 84
    rpm_platen: 90
    mrr_nm_per_min: 9.2
    read_method: table
    overrides:
      oxidizer_wt_pct: 2.5
      abrasive_wt_pct: 3.0
      abrasive_ref_wt_pct: 3.0
  - label: "H2O2 5wt% (Example 7)"
    pressure_psi: 2.0
    rpm_wafer: 84
    rpm_platen: 90
    mrr_nm_per_min: 7.7
    read_method: table
    overrides:
      oxidizer_wt_pct: 5.0
      abrasive_wt_pct: 3.0
      abrasive_ref_wt_pct: 3.0
notes: >
  변수 = H2O2 농도(1 → 2.5 → 5 wt%) 단 하나. 고정 = 실리카 3 wt%, 벤젠술폰산 2 wt%,
  압력 2.0 psi, platen/head 90/84 rpm.
  단위 환산: 원문 Å/min → nm/min (÷10). 118/92/77 Å/min = 11.8/9.2/7.7 nm/min.
  ── 산화제 정점 위치 (중요) ──
  이 3점은 **전 구간 단조 감소**다(1 wt%가 가장 높다). 즉 이 데이터는 Kaufman 정점을
  이미 지난 오른쪽 가지만 담고 있고, 정점 자체는 1 wt% 이하 어딘가라 이 표로는 위치를
  특정할 수 없다. 팩 기본 정점(oxidizer_peak_wt_pct = 3.0 wt%)은 이 계와 맞지 않을
  가능성이 크다 — 팩 정점을 그대로 두고 예측하면 1→3 wt% 구간에서 모델은 증가를,
  실측은 감소를 준다. 이 데이터셋은 그 불일치를 드러내라고 넣은 것이며, 정점값을
  데이터에 맞춰 조정하지 않았다(그러면 검증이 아니라 피팅이 된다).
  ── 억제제 축과 섞지 말 것 ──
  BTA 등 억제제는 전 조건 미첨가·불변이다. 여기서 보이는 MRR 감소는 산화제 과잉에
  의한 것이지 억제제 효과가 아니다.
  ── 팩과의 조성 차이(정직성) ──
  pH 8.5~9.5 알칼리 + 벤젠술폰산계로, 팩 cu_h2o2_bta의 pH 4 산성 + BTA 조성과 다르다.
  피연마재는 실리콘 웨이퍼 위 ECD Cu 박막이라 in_scope: true. 절대 MRR은 팩 기준보다
  한 자릿수 낮으므로 순위 지표만 근거로 쓸 것. 벤젠술폰산 농도는 모델 통로가 없어 생략.
  n=3으로 순위 지표의 최소 요건을 겨우 만족한다 — ρ의 통계적 신뢰구간은 넓다.
