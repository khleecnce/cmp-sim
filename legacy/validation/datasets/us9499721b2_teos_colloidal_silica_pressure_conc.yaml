notes: >
  변수 2축 = 다운포스(1.5→3→4→5 psi) × 콜로이달 실리카 농도(0.5→3.0 wt%). 총 22점.
  패드·플래튼 rpm·유량·pH·입경은 전 조건 동일. rpm_wafer(헤드)는 원문 미기재라 필드를
  빼고 팩 기본값을 쓴다 — 전 조건 공통 상수배라 순위 지표에는 영향 없음.
  단위 환산: 원문 Å/min → nm/min (÷10). 예: 18D 4 psi 3,140 Å/min → 314 nm/min.
  ── 원문 표 그대로(Å/min) ──
  18A(0.5wt%): 940 / 1400 / 1350 / —     18B(1.0): 1100 / 2070 / 2560 / 2690
  18C(1.5):    1130 / 2260 / 2940 / 3480  18D(2.0): 1170 / 2290 / 3140 / 3630
  18E(2.5):    1200 / 2430 / 3190 / 3860  18F(3.0): 1240 / 2480 / — / 4030
  (열 순서 1.5 / 3 / 4 / 5 psi)
  ── 팩과 다른 점(절대값 비교 주의) ──
  · 입자가 아미노실란 내장 **양전하(cationic)** 콜로이달 실리카, pH 4.7 산성. 팩 기본은
    음전하 실리카 pH 10.5 염기성이다. slurry_ph 4.7은 농축액 pH이며 희석 후 pH는
    원문에 없다(아세트산 완충이라 크게 안 변한다고 보지만 확인 불가).
  · 농도 0.5~3 wt%는 팩 기준(20 wt%)보다 훨씬 낮다 — 농도 외삽 구간.
  · 압력 1.5→3 psi 구간은 거의 선형(Preston), 3→5 psi는 약간 포화. 18A(0.5 wt%)는
    4 psi에서 3 psi보다 낮다(1400→1350) — 저농도에서 입자 고갈(starvation) 신호.
  절대 MRR은 신뢰하지 말고 순위(압력·농도 단조성)만 볼 것.
