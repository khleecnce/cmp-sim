# Blanket SiO2(TEOS) CMP — 콜로이달 실리카(아미노실란 내장 코어-쉘, 54 nm) 0.5~3.0 wt% × 다운포스 1.5/3/4/5 psi.
# 특허 실시예 인쇄표(Table 18). oxide_silica 팩의 압력·입자농도 2축 held-out 데이터셋.
#
# li2021(팩 캘리브레이션 출처, 20 wt% 실리카·pH 10~12.5)과 문헌·조성·pH 영역이 전부 다르다.

source: >
  US9499721B2 (Cabot Microelectronics Corp), "Colloidal silica chemical-mechanical
  polishing composition", 2016. https://patents.google.com/patent/US9499721B2
  옮긴 곳: Example 18, TABLE 18 "TEOS Polishing Rate (Å/min)" — 조성 18A~18F 행 ×
  1.5/3/4/5 psi 열 (빈 칸 2개: 18A@5psi, 18F@4psi 는 원문도 공란이라 제외).
  Semisperse SS25 Control(흄드 실리카 12.5 wt%) 행은 콜로이달 실리카가 아니라 제외.
  단위 환산: Å/min ÷ 10 = nm/min.
  조성 출처: Example 18 본문 — 15 wt% 농축액(pH 4.7, 아세트산 완충, 0.5 wt% Pluriol 300,
  아세트산 600 ppm, Kathon LX 12 ppm)을 DI수로 희석해 0.5/1.0/1.5/2.0/2.5/3.0 wt%
  고형분(18A~18F). 입자 = 아미노프로필 트리알콕시실란이 쉘에 내장된 코어-쉘 콜로이달
  실리카, 평균 입경 54 nm (Example 13 절차).
  공정조건 출처: Example 18 본문 — 200 mm TEOS 블랭킷 웨이퍼, Mirra CMP 툴, IC1010 패드,
  다운포스 1.5/3.0/4.0/5.0 psi, 플래튼 100 rpm, 슬러리 유량 150 mL/min.
  papers/US9499721B2.txt 에 Google Patents 본문 캐시 저장(urllib).

in_scope: true
used_for_calibration: false
pack: oxide_silica
calibration_contact:
  - param: abrasive_conc_exponent
    pack: oxide_silica
    what: >
      knowledge/params/oxide_silica.yaml의 abrasive_conc_exponent(0.3333) note —
      "US9499721B2 E1 직접 실측(TABLE 18, 0.5~3.0wt% 4압력)을 3psi 행에서 로그-로그
      전역회귀하면 n≈0.30" — 이 데이터셋(Example 18 TABLE 18)의 3psi 행을 그대로
      회귀해 지수를 도출했다. 나머지 축(압력)과 다른 wt% 행들은 회귀에 안 썼다.
    axis: abrasive_wt_pct

# rpm_wafer(헤드 회전수)는 원문 미기재 → 필드 생략, 팩 기본값 사용.
