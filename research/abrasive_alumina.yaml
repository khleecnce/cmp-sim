    # ---------- SiC ----------

    - film: sic
      rate_nm_per_min: 106.9
      pressure_psi: 4.0
      velocity_m_s: 1.225
      velocity_source: "derived from platen 90 rpm, R_cc=0.13 m (assumed); carrier 90 rpm"
      conc_wt_pct: 2.0
      d50_nm: 100
