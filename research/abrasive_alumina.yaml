  film_anchors:
  # -------------------------------------------------------------------

    - film: w
      rate_nm_per_min: 810.0
      uncertainty_nm_per_min: 40
      pressure_psi: 6.5
      velocity_m_s: 2.042
      velocity_source: "derived from 150 rpm, R_cc=0.13 m (assumed)"
      conc_wt_pct: 10.0
