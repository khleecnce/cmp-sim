      source: "R. Ihnfeldt, PhD dissertation, UC San Diego (2008), Table 6.2, solution c at pH 8.3; journal version R. V. Ihnfeldt & J. B. Talbot, ECS Trans. 13(4) 43-49 (2008), DOI 10.1149/1.2912977; local copy papers/ihnfeldt2008-ucsd-dissertation-cu-cmp-alumina-colloidal.pdf"
      confidence: literature
      note: "Additive: glycine 0.1 M. Primary particle 20 nm, aggregate d50 150 nm."

    - film: cu
      rate_nm_per_min: 350.0
      uncertainty_nm_per_min: 14
      pressure_psi: 1.0
      velocity_m_s: 0.408
      velocity_source: "derived from platen 30 rpm, R_cc=0.13 m (assumed)"
      conc_wt_pct: 4.0
      d50_nm: 150
      ph: 10.0
      oxidizer: "H2O2 0.1 wt%"
      pad: "IC1000"
      phase_stated: true
      source: "Ihnfeldt 2008, Table 6.2, solution c at pH 10.0"
      confidence: literature
      note: "Highest Cu rate in the whole matrix. Glycine 0.1 M."

    - film: cu
      rate_nm_per_min: 113.0
      uncertainty_nm_per_min: 14
      pressure_psi: 1.0
      velocity_m_s: 0.408
      velocity_source: "derived from platen 30 rpm, R_cc=0.13 m (assumed)"
      conc_wt_pct: 4.0
      d50_nm: 150
      ph: 3.0
      oxidizer: "H2O2 2.0 wt%"
      pad: "IC1000"
      phase_stated: true
      source: "Ihnfeldt 2008, Table 6.2, solution d at pH 3.0"
      confidence: literature
      note: "Acidic end of the H2O2 2.0 wt% series. Compare with solution c (0.1 wt% H2O2) at the same pH 3.0, which fell below the +/-14 nm/min detection limit -> at low pH the oxidiser is rate-controlling."

    - film: cu
      rate_nm_per_min: 289.0
      uncertainty_nm_per_min: 14
      pressure_psi: 1.0
      velocity_m_s: 0.408
      velocity_source: "derived from platen 30 rpm, R_cc=0.13 m (assumed)"
      conc_wt_pct: 4.0
      d50_nm: 150
      ph: 8.3
      oxidizer: "H2O2 2.0 wt%"
      pad: "IC1000"
      phase_stated: true
      source: "Ihnfeldt 2008, Table 6.2, solution d at pH 8.3"
      confidence: literature
      note: >
        Pair this with the 287 nm/min anchor (same pH 8.3, H2O2 0.1 vs 2.0 wt%):
        a 20x oxidiser change moves the rate by less than the measurement error.
        At pH 10.0 the same 20x change goes the other way (350 -> 166). The sign
