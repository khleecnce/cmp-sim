        DECADES (Bielmann 0.1-10 um; Saint-Gobain sub-micron around 120 nm;
        Egan production-range nano). A non-monotonic m(d) would satisfy all
        three, but nobody has shown that.
        Independent confirmation that d-effects can vanish: Bouvet et al.,
        J. Vac. Sci. Technol. B 20(4) 1556 (2002), DOI 10.1116/1.1490393,
        full text read (papers/bouvet2002-jvst-colloidal-silica-w-cmp-size.pdf):
