      plateau_rate_nm_per_min: [450, 490]
      conditions: "5 psi, 100 rpm table / 25 rpm carrier, Fe(NO3)3.9H2O 5 wt% fixed, Strasbaugh 6DS-SP"
      source: "US5916855 Experiment 1B"
      confidence: literature
      note: >
        Two-sided: rate is 'substantially reduced' below 2 wt% and drops again
        above 6 wt% (the patent says the high-side drop is 'not understood').
        Mechanistic reading given by the patent: in the plateau 'the tungsten
        oxide is being removed about as fast as it is being formed', i.e. the
        process is OXIDATION-limited, not abrasive-limited.

    cu_conc_plateau:
      knee_wt_pct: 2.5
      plateau_rate_nm_per_min: null
      conditions: "6.8 psi, IC-1000 perforated pad, colloidal alpha-alumina 220 nm in DI water, no chemistry"
      source: "Guo & Subramanian 2004, DOI 10.1149/1.1640632"
      confidence: literature
      note: >
        'as the abrasive concentration is increased from 2.5 to 5.0 wt %, the
        removal rate is hardly affected'. Authors' explanation: below the knee
        the rate is limited by the availability of particles on the pad asperity
        tops. On the SUBA 500 pad the same slurry shows NO knee (clean C^0.5 to
        5 wt%) -> the knee is a PAD property, not a slurry property.
        plateau_rate null: absolute values are in Figs. 3/4 only.

    cu_velocity_plateau:
      knee_velocity_m_s: 0.7
      conditions: "IC-1000 pad, 2.5 wt% alpha-alumina 220 nm, DI water, 3.6 and 6.8 psi"
      source: "Guo & Subramanian 2004: 'the removal rate essentially levels off at values of V larger than approximately 0.7 m/s'"
      confidence: literature
      note: >
        Rare published VELOCITY saturation with a number attached. Authors'
        mechanism: above 0.7 m/s there is not enough time between asperity
        passes to regrow the Cu oxide layer. Directly relevant to any Preston
        term that assumes MRR ~ V without bound.

    cu_pressure_regime_break:
      knee_pressure_psi: 6.0
      threshold_pressure_psi: [1.0, 2.0]
      exponent_above_knee: 0.165
      source: "Guo & Subramanian 2004, Fig. 2 caption: power-law exponents 0.16 +/- 0.05 (0.47 m/s) and 0.17 +/- 0.04 (0.67 m/s) for P > 6 psi; linear (Prestonian) below 6 psi; 'a small non-zero threshold pressure between 1 and 2 psi below which the removal rate is essentially zero'"
      confidence: literature
      note: >
        Three pressure regimes on IC-1000: dead below ~1-2 psi, Prestonian
        1-6 psi, then R ~ P^0.17 above 6 psi. On the SUBA 500 pad the SAME
        slurry gives R ~ P^0.5 over the ENTIRE range. Pad-dependent again.

    sapphire_ph_saturation:
      knee_ph: 12.5
      source: "KR20130060211A: 'when alumina abrasive grains are used (curve a), the polishing rate increases when the pH of the polishing slurry exceeds 10 ... and the polishing rate is saturated in the strong alkali region where the pH exceeds about 12.5'"
      confidence: literature
      note: >
        Corroborated by the patent's own examples: pH 12.55 -> 3.4 um/hr but
        pH 13.21 -> 2.8 um/hr (i.e. past saturation it actually falls back).
        The pH-vs-rate curve itself is Fig. 1, graph only.

    w_oxidizer_saturation:
      knee_wt_pct_fe_nitrate: 5.0
      source: "US5916855 Experiment 2B (see oxidizer_response)"
      confidence: literature

  # -------------------------------------------------------------------
  oxidizer_response:
  # -------------------------------------------------------------------

    w_ferric_nitrate:
      raw_pairs_wt_pct_rate: null
      normalised_pairs: "rates plotted normalised to the 5 wt% ferric nitrate value; absolute axis not given"
      range_wt_pct: [3.0, 9.0]
      knee_wt_pct: 5.0
      fixed_conditions: "alumina held at 2.8 wt%, 5 psi, 100 rpm table / 25 rpm carrier, Strasbaugh 6DS-SP, blanket W on Ti/TiN"
      source: "US5916855 Experiment 2B, body text: 'The results show a strong tungsten removal rate dependence on concentration of Fe3+ between 3 wt % and 5 wt % ferric nitrate. As Fe3+ concentration is further increased, i.e., from 5 wt % to 9 wt % ferric nitrate, the removal rate is nearly constant.'"
      confidence: literature
      note: >
        The mechanistic statement is the useful part and it is explicit:
        'below 5 wt % ferric nitrate concentration the polish rate is controlled
        by the chemical oxidation rate of the freshly exposed W surface
        undergoing continuous abrasion by Al2O3 particles. Above 5 wt % ferric
        nitrate ... surface WOx abrasion rate becomes the rate limiting
        mechanism.' -> a two-regime (chemistry-limited / mechanics-limited)
        model with the crossover at 5 wt% Fe(NO3)3 and 2.8 wt% alumina.
        raw_pairs null: FIG. 4 is normalised and was not digitised.
        TODO(owner): digitise US5916855 FIG. 4.

    w_cupric_ion_catalysis:
      pairs_wt_pct_cu2plus_rate: null
      threshold_wt_pct: 0.0003
      effect_at_0p01_wt_pct: "+60% W rate (to 9300 A/min) vs the same slurry without cupric sulfate"
      fixed_conditions: "ferric nitrate slurry, alumina 2.8 wt%, 5 psi, 100 rpm table"
      source: "US5916855 body text + FIG. 5"
      confidence: literature
      note: >
        'Experiments using slurries formulated with Cu2+ ions and no ferric
        nitrate show tungsten polish rates consistent with mechanical abrasion
        only' -> Cu2+ is a CATALYST for the Fe(III) cycle, not an oxidiser.
        Pairs are in FIG. 5 (graph) only.

    w_persulfate_costoxidant:
      pairs:
        - {fe3_wt_pct: 5.0, persulfate_wt_pct: 0.0, w_rate_nm_per_min: 81.0, ti_rate_nm_per_min: 52.0, oxide_rate_nm_per_min: 3.8, note: "slurry 7, no suspension agent"}
        - {fe3_wt_pct: 5.0, persulfate_wt_pct: 1.0, w_rate_nm_per_min: 319.3, ti_rate_nm_per_min: 45.8, oxide_rate_nm_per_min: 2.9, note: "slurry 9"}
        - {fe3_wt_pct: 5.0, persulfate_wt_pct: 0.0, w_rate_nm_per_min: 427.5, ti_rate_nm_per_min: 30.0, oxide_rate_nm_per_min: 2.1, note: "slurry 6, with suspension agent + salt"}
        - {fe3_wt_pct: 5.0, persulfate_wt_pct: 1.0, w_rate_nm_per_min: 687.2, ti_rate_nm_per_min: 100.4, oxide_rate_nm_per_min: 2.9, note: "slurry 8, with suspension agent + salt"}
      unit: "nm/min (patent A/min / 10)"
      fixed_conditions: "alumina 2.8 wt%, 5 psi, 100 rpm table / 25 rpm carrier"
      source: "US5916855, TABLE III (columns: Salt, Evrflo, Fe3+, S2O8, W rate, Ti rate, SiO2 rate, defectivity)"
      confidence: literature
      note: >
        Within each suspension-agent state, adding 1 wt% (NH4)2S2O8 raises the W
        rate (81 -> 319 without; 428 -> 687 with). Additional TABLE I pair at
        Fe(NO3)3.9H2O 3 wt% + cupric nitrate 0.036 wt%:
        with 1 wt% persulfate  -> W 630 nm/min, Ti 200 nm/min;
        without persulfate     -> W 440 nm/min, Ti 41 nm/min.
        So persulfate is primarily a Ti accelerator (5x) that also lifts W (1.4x).

    w_fluoride_suppression:
      pairs_wt_pct_h2sif6_w_rate_nm_per_min: [[0.0, 235.0], [0.1, 227.1], [0.2, 205.2], [0.3, 147.5]]
      paired_ti_rate_nm_per_min: [70.9, 94.3, 139.7, 188.0]
      fixed_conditions: "3.0 wt% fumed alumina, 5.0 wt% ferric nitrate, 5 psi, table 44 rpm, spindle 41 rpm, Suba 500/Suba IV, 100 mL/min, 60 s"
      source: "US5993686, TABLE I (control sample 1 + samples 2,3) and TABLE 3 runs 1A/1B/1C"
      confidence: literature
      note: >
        Clean 4-point additive series at fully specified P and V. Fluoride is a
        Ti accelerator and a W SUPPRESSOR: W falls 2350 -> 1475 A/min while Ti
        rises 709 -> 1880 A/min over 0 -> 0.3 wt% H2SiF6. Parallel HF series from
        the same table: HF 0/0.1/0.2 wt% -> W 2350/2355/2340, Ti 709/1120/1472
        (HF lifts Ti without touching W), and HF 0.4/0.6 -> W 1551/2825,
        Ti 2768/3800 (non-monotonic in W).

    w_h2o2_with_ph_coupling:
      pairs: "see film_anchors: US5391258 TABLE 1 (H2O2 fixed, pH varied 6.0->3.3 via phthalate): W 444/978/1164/1164 A/min, SiO2 167/137/93/76 A/min"
      fixed_conditions: "submicron alumina ~8.25 wt% (derived), 7 psi, platen 50 rpm, spindle 40 rpm, IC1000"
      source: "US5391258 TABLE 1"
      confidence: literature
      note: >
        With H2O2 as the oxidiser the dominant lever is pH, not oxidiser dose:
        a 2.7x W-rate gain comes purely from dropping pH 6.0 -> 3.5. The patent
        explicitly notes this contradicts US4956313 and US4992135, which taught
        pH > 6 for W/oxide selectivity.

    w_ferric_nitrate_cross_abrasive:
      pairs_wt_pct_rate_nm_per_min: [[0.0, 5.6], [0.01, 92.3], [0.05, 117.7]]
      plateau_above_wt_pct: 0.1
      fixed_conditions: "4 wt% colloidal SILICA (Fuso PL-7), H2O2 1.0 wt%, pH 2.3, 6 psi, carrier and table both 70 rpm, IC1000/Suba IV, poli-300"
      source: "J.-H. Lim et al., Appl. Surf. Sci. 282 (2013) 512-517, DOI 10.1016/j.apsusc.2013.06.003, section 3: 'The polishing rate without Fe(NO3)3 was only 56 A/min, and the polishing rate with increasing Fe(NO3)3 concentration rapidly increased to 923 A/min at 0.01 wt% Fe(NO3)3 and 1177 A/min at 0.05 wt% Fe(NO3)3. With further Fe(NO3)3 concentration increases up to 1.0 wt%, the polishing rate of W film increased only slightly.'; local copy papers/lim2013-apsusc-fe-nitrate-w-cmp.pdf"
      confidence: literature
      note: >
        ABRASIVE MISMATCH — this is SILICA, included only because it is the only
        Fe(NO3)3 dose-response series found with absolute rates, P and V all
        printed. Do NOT use it as an alumina oxidiser constant. It is however a
        strong qualitative confirmation of the US5916855 two-regime picture:
        the authors split their own data into 'region I, below 0.1 wt%
        Fe(NO3)3' (rate rises steeply) and region II (plateau). A log-log fit of
        the two non-zero points gives n = 0.15 (r2 = 1.0 trivially, 2 points) —
        reported only to show how flat region II is. 20x oxidiser gives 1.3x rate.

    cu_h2o2_ph_sign_inversion:
      pairs_ph_h2o2_wt_pct_rate_nm_per_min:
        - [3.0, 0.1, 8.0]
        - [3.0, 2.0, 113.0]
        - [8.3, 0.1, 287.0]
        - [8.3, 2.0, 289.0]
        - [10.0, 0.1, 350.0]
        - [10.0, 2.0, 166.0]
      fixed_conditions: "4 wt% alpha-alumina (20 nm primary / 150 nm aggregate), glycine 0.1 M, 1.0 psi, platen 30 rpm / wafer 30 rpm, IC1000, 150 mL/min, +/-14 nm/min"
      source: "Ihnfeldt 2008, Table 6.2, solutions c and d"
      confidence: literature
      note: >
        THE OXIDISER EFFECT CHANGES SIGN WITH pH, on one tool with one abrasive:
          pH 3.0  : 0.1 -> 2.0 wt% H2O2 gives 8 -> 113 nm/min (strongly UP)
          pH 8.3  : 287 -> 289 nm/min (no change, inside +/-14)
          pH 10.0 : 350 -> 166 nm/min (halved, DOWN)
        Any monotonic oxidiser term will fail at least one of these three.

    sic_kmno4:
      marginal_means_wt_pct_rate_nm_per_min: [[1, 8.8913], [2, 11.242], [3, 11.3443], [4, 11.4467], [5, 11.7533]]
      fitted_value: 0.163
      r2: 0.819
      fixed_conditions: "4H-SiC (0001) Si, alumina 500 nm, 4 psi, platen 90 rpm / head 100 rpm, Suba 800, 90 mL/min, 60 min"
      source: "Gong et al., Materials 17(3) 679 (2024), DOI 10.3390/ma17030679, Table 2 — KMnO4 factor marginal means over the L25 array; fit performed here"
      confidence: derived
      note: >
        Saturating: almost all of the gain is in the 1 -> 2 wt% step
        (8.89 -> 11.24), then flat to 5 wt%. Consistent with Langmuir-type
        oxidiser adsorption. The paper's own range analysis makes KMnO4 the
        STRONGEST of its three factors (R = 0.1717).
        WARNING: this same table was already used to back out
        `oxidizer_langmuir_K` for the sic_alumina_kmno4 pack in fab-sim
        (validation/datasets/gong2024_4hsic_alumina_kmno4_L25.yaml,
        used_for_calibration: true). Re-using it as validation would be
        self-grading.

    sic_kmno4_molar:
      value: "0.05 M KMnO4 at pH 2 with 2 wt% / 100 nm alumina -> 6412 nm/h (C face), 1554 nm/h (Si face)"
      source: "Chen et al. 2020, DOI 10.1134/S1070427220060099"
      confidence: literature
      note: "Single best-point only; the pH 2-10 sweep in that paper is figure-based and was not digitised."

# =====================================================================
gamma_alumina:                # gamma / transition (delta, theta) alumina
# =====================================================================

  properties:
    description: >
      Transition aluminas (gamma, delta, theta): defect-spinel metastable phases
      produced by dehydrating boehmite or by flame hydrolysis (fumed alumina).
      Softer and lower-density than corundum, much higher specific surface area,
      and they aggregate into chains rather than existing as discrete spheres.
      In CMP they are the classic W-plug abrasive (Cabot SEMI-SPERSE W-A355 and
      its relatives), and they are what most pre-2000 "alumina" W slurries
      actually contained.

    hardness_gpa:
      value: null
      unit: GPa
      source: null
      confidence: unverified
      note: "TODO(owner): no measured hardness for gamma/transition alumina was found. It is qualitatively softer than alpha, evidenced functionally by the removal-rate gap below, but no number is available."

    hardness_mohs:
      value: null
      unit: "Mohs"
      source: null
      confidence: unverified
      note: "TODO(owner): not sourced. Do not copy the alpha value (Mohs 9) across — the phases are functionally different (see removal_rate_vs_alpha)."

    youngs_modulus_gpa:
      value: null
      unit: GPa
      source: null
      confidence: unverified
      note: "TODO(owner): not sourced."

    density_g_cm3:
      value: null
      unit: "g/cm^3"
      source: null
      confidence: unverified
      note: "TODO(owner): not sourced from any document read in this pass."

    iep_ph:
      value: null
      unit: "pH"
      source: null
      confidence: unverified
      note: >
        TODO(owner): the IEP ~9 measured by Gopal & Talbot is for a commercial
        'alumina' CMP slurry (EKC Tech) whose phase is not stated, so it is
        recorded under `alumina`, not here. Boehmite/gamma surfaces are
        hydroxyl-terminated like alpha and would be expected nearby, but that is
        an expectation, not a measurement.

    typical_primary_size_nm:
      value: 50
      unit: nm
      source: "M. Bielmann, U. Mahajan, R. K. Singh, D. O. Shah, B. J. Palla, 'Enhanced Tungsten Chemical Mechanical Polishing Using Stable Alumina Slurries', Electrochem. Solid-State Lett. 2(3) 148-150 (1999), DOI 10.1149/1.1390765 — experimental section: 'The polishing slurries contained 10 wt % gamma-alumina particles (primary size ~50 nm diam)'"
      confidence: literature
      note: >
        PRIMARY particle size as specified by the maker, NOT a dispersed d50.
        The same paper concedes 'due to agglomeration, the effective size of
        abrasive particles may increase'. The paper separately uses 300-500 nm
        alumina for SEM adhesion imaging only — do not confuse the two numbers.
        Quoted here via fab-sim/knowledge/cmp/
        w-cmp-abrasive-d50-bielmann1999-osti-cabot-conflict.md, which records
        the verbatim excerpts; the ESL PDF itself is paywalled at IOPscience and
        the full text was NOT re-read in this pass.

    removal_rate_vs_alpha:
      value: "transition alumina polishes W at a LOW rate compared with alpha alumina and SiC, on the same tool"
      source: "J. Wang, I. K. Cherian, A. G. Haerle (Saint-Gobain), Electrochem. Solid-State Lett. 13(6) H182 (2010), DOI 10.1149/1.3358135, abstract: 'The best oxide defectivities were achieved with transition alumina and silicon carbide. However, the transition alumina polished tungsten at a low rate compared to the other abrasives tested.'"
      confidence: literature
      note: >
        THE reason this file keeps the phases separate. Read from the published
        abstract (full text paywalled); no ratio is quoted, so the magnitude of
        the gap is unknown. TODO(owner): obtain ESL 13(6) H182 full text for the
        alpha-vs-transition rate numbers.

