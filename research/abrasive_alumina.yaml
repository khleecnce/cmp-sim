  - id: films_with_zero_alumina_anchors
    what: "poly_si and snag (SnAg solder) blanket removal-rate anchors with alumina"
    status: "NOT FOUND"
    searched: >
      fab-sim/papers + INDEX.json token scan, fab-sim/knowledge (grep polysilicon,
      poly-Si, SnAg, Sn-Ag, solder CMP), fab-sim/data/corpus (sqlite + fulltext),
      and 4 web searches. US7723234B2 ('Method for selective CMP of polysilicon')
      was pulled from patentimages and its full text contains ZERO occurrences of
      'alumin' — it is a silica/ceria patent. No alumina-on-SnAg CMP source was
      located at all.
    impact: "2 of the 7 requested films have no data whatsoever, for either phase."

  - id: alpha_particle_hardness
    what: "alpha-Al2O3 abrasive particle hardness in GPa (nanoindentation)"
    status: "NOT FOUND (only Mohs 9, a qualitative scale)"
    searched: "corpus knowledge notes; web search returned only paywalled sapphire-substrate nanoindentation papers, which measure the WAFER not the particle."
    impact: "Any Hertz/plastic-indentation term that needs H_abrasive cannot be parameterised for alpha from this file."

  - id: gamma_properties_all
    what: "gamma/transition alumina hardness (GPa and Mohs), Young's modulus, density, IEP"
    status: "NOT FOUND — all four are null"
    impact: "The gamma phase has essentially no physical-property record here; only its functional signature (low W rate vs alpha, Saint-Gobain 2010) and one primary size (50 nm)."

  - id: w_size_exponent_conflict
    what: "sign of m in MRR ~ d^m for alumina on W"
    status: "CONTESTED AND UNRESOLVED"
    detail: >
      Bielmann 1999 (ESL 2(8) 401) says NEGATIVE over 0.1-10 um; Wang/Cherian/
      Haerle 2010 (ESL 13(6) H182) says POSITIVE and linear; Egan & Kim 2019
      (JSS 8 P3206, open access, full text read) says NULL. All three are
      primary W-CMP measurements. The first two are paywalled and only their
      abstracts were read, so no raw pairs exist to arbitrate.
    impact: "THIS IS THE BIGGEST REMAINING GAP. A particle-size term for W CMP cannot be signed, let alone valued, from the available evidence."
    next_step: "Obtain full text of DOI 10.1149/1.1390851 and DOI 10.1149/1.3358135 (interlibrary or ECS membership) and extract their size-vs-rate tables."

  - id: sic_conc_exponent_conflict
    what: "n in MRR ~ C^n for alumina on SiC"
    status: "CONTESTED"
    detail: >
      Entegris US20220315802A1 gives n = -0.406 (r2 0.92, 5 points, 0.1-5 wt%,
      1 psi); Gong 2024 L25 marginal means give n = +0.035 (r2 0.14, 1-5 wt%,
      4 psi, 500 nm); Su 2011 is non-monotonic with a maximum at 1.6 wt%.
      Different pressures, different sizes, one patent whose absolute rates are
      a 25-38x outlier against three independent papers.
    impact: "Sign of the SiC concentration term is not settled."

