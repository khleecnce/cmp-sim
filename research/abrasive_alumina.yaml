# =====================================================================
# abrasive_alumina.yaml — quantitative literature dataset for Al2O3 abrasive in CMP
# Scope: ALUMINA ONLY. alpha-Al2O3 (corundum) and gamma/transition alumina are
#        kept STRICTLY separate (top-level keys `alumina` and `gamma_alumina`).
#        Where a source says only "alumina"/"fumed alumina" without naming the
#        phase, the entry goes under `alumina` with phase_stated: false.
# Author: research subagent, 2026-09-24.
# Sources = local corpus (~/fab-sim/papers, ~/fab-sim/knowledge,
#           ~/fab-sim/validation/datasets, ~/fab-sim/data/corpus/fulltext)
#           + patents pulled from patentimages.storage.googleapis.com
#           + IOPscience/Springer/open-access PDFs.
#
# RULES OBEYED HERE
#  - every number carries value / unit / source / confidence
#  - confidence vocabulary: literature | vendor | derived | unverified
#  - nothing is invented. Unknown -> value: null + note: "TODO(owner): ..."
#  - a rate anchor without BOTH pressure and velocity is flagged in `note`.
#
# VELOCITY CONVENTION (read before using velocity_m_s)
#   CMP papers/patents almost never report linear relative velocity; they report
#   platen rpm. Where only rpm is known, velocity_m_s is DERIVED as
#       v = 2*pi*rpm/60 * R_cc,   R_cc = 0.13 m
#   R_cc (wafer-centre to platen-centre) is NOT reported by any of these sources.
#   0.13 m is the representative value already used across the fab-sim knowledge
#   base (knowledge/cmp/w-cmp-preston-kp-oxidizer-rate-literature-reproduction.md
#   section 3, documented there as the dominant uncertainty, band 0.09-0.17 m).
#   Such entries carry velocity_source: "derived from platen rpm, R_cc=0.13 m
#   (assumed)". Treat absolute Kp inversions from them as +/- a factor of ~2.
#   Same convention as the sibling file research/abrasive_silica.yaml.
#
# PHASE MATTERS FOR ALUMINA — the single most important finding in this file:
#   Wang, Cherian & Haerle (Saint-Gobain), ECS Solid-State Lett. 13(6) H182
#   (2010), DOI 10.1149/1.3358135, directly compared alpha alumina, TRANSITION
#   (gamma-family) alumina and SiC on the SAME W CMP tool and report that
#   "the transition alumina polished tungsten at a LOW RATE compared to the
#   other abrasives tested", while alpha alumina at 120 nm gave the best
#   rate/defectivity combination. Do NOT pool alpha and gamma rate constants.
# =====================================================================

meta:
  abrasive: Al2O3
  phases: [alpha_alumina, gamma_transition_alumina]
  rate_unit_convention: "nm/min (patent Angstrom/min divided by 10; um/h multiplied by 1000/60; nm/h divided by 60)"
  pressure_unit: psi
  created: 2026-09-24
  schema_version: 1
  primary_application:
    value: "tungsten CMP (Fe(NO3)3 / K3Fe(CN)6 / H2O2 oxidisers, acidic pH); also SiC, sapphire, Cu, hard metals"
    source: "US5916855 (Cabot, W plug slurry, fumed alumina + ferric nitrate); US5391258 (IBM, submicron alumina + H2O2); Bielmann 1999 ESL 2(3) 148"
    confidence: literature

# =====================================================================
alumina:                      # alpha-Al2O3 (corundum) and phase-unstated alumina
# =====================================================================

  properties:
    description: >
      alpha-Al2O3 (corundum): the thermodynamically stable, fully densified
      crystalline phase. Hardest of the common CMP abrasives. Used where a hard
      indenter is genuinely required (W passivation-layer abrasion, SiC,
      sapphire, hard metals). Supplied both as calcined/milled micron powder
      (white corundum, W-grades) and as sub-200 nm colloidal dispersions.

    phase_stated_caveat: >
      Many W-CMP patents say only "alumina" or "fumed alumina". Fumed alumina
      (flame hydrolysis of AlCl3, e.g. Cabot SEMI-SPERSE W-A355) is in fact
      predominantly a TRANSITION (delta/gamma) alumina, not alpha. Anchors taken
      from such sources carry phase_stated: false and must not be used to
      calibrate an alpha-specific hardness or indentation term.

    hardness_mohs:
      value: 9
      unit: "Mohs"
      source: "Gong J., Wang W., Liu W., Song Z., Materials 17(3) 679 (2024), DOI 10.3390/ma17030679 (CC-BY) — 'Al2O3 is a well-known abrasive material with high hardness (Mohs hardness 9)'"
      confidence: literature
      note: "Qualitative scale only. Also stated independently in KR20130060211A (sapphire itself = Mohs 9)."

    hardness_gpa:
      value: null
      unit: GPa
      source: null
      confidence: unverified
      note: >
        TODO(owner): no nanoindentation hardness of an actual CMP alpha-alumina
        PARTICLE was found in the corpus or in accessible open literature.
        Bulk/single-crystal sapphire nanoindentation values (c-plane, ~20-30 GPa
        range) exist in the literature but every candidate found here
        (e.g. ScienceDirect S2238785424004563, S0257897221001328) is paywalled
        and was NOT read, so no number is recorded. Do not substitute a
        handbook value without a citation.

    youngs_modulus_gpa:
      value: 500
      unit: GPa
      method: "value used for the alumina ABRASIVE in a CMP contact model"
      source: "Q. Luo, S. Ramarajan, S. V. Babu, Thin Solid Films 335, 160-167 (1998) — as cited in J. Luo, 'Material Removal Regions in CMP ... Part 1' (2002/2003), escholarship.org/uc/item/0n2575s1, section 2.2; local copy papers/luo-dornfeld-material-removal-regions-part1.pdf"
      confidence: unverified
      note: >
        SECONDARY citation: read in Luo's report, the Thin Solid Films original
        was not opened. Luo quotes it as 'around 500 GPa'. Phase not stated
        there. Adequate only for the rigid-indenter sanity check
        (E_alumina >> E_pad ~ 1 GPa, H_alumina >> H_W ~ 1 GPa).

    density_g_cm3:
      value: 3.7
      unit: "g/cm^3"
      method: "bulk density quoted by the supplier for the colloidal alpha-alumina actually used"
      source: "L. Guo & R. S. Subramanian, 'Mechanical Removal in CMP of Copper Using Alumina Abrasives', J. Electrochem. Soc. 151(2) G104-G108 (2004), DOI 10.1149/1.1640632, Experimental section — 'colloidal a-alumina particles with a bulk density of 3.7 g/cm3, supplied by Ferro Corporation'"
      confidence: vendor
      note: >
        This is the density of a specific commercial alpha-alumina dispersion,
        NOT the crystallographic density of corundum (which is higher). Use it
        as the slurry-solids density, and flag that theoretical corundum density
        is NOT sourced here. TODO(owner): source crystallographic density if the
        model needs particle-number-per-volume conversions.

    iep_ph:
      value: 9.0
      unit: "pH"
      method: "zeta potential vs pH (electrophoresis), 1 mM KNO3 supporting electrolyte, commercial EKC Tech CMP alumina slurry"
      source: "V. Gopal & J. B. Talbot, J. Electrochem. Soc. (2006/2007) 'Effects of CMP slurry chemistry on the zeta potential of alumina abrasives'; local copy papers/gopal2006-jes-cmp-slurry-chemistry-zeta-alumina.pdf — zeta goes +58 mV at pH 3.5 to -24 mV at pH 10; 'As the pH approached the IEP of ~9 the effective particle diameter increases significantly'"
      confidence: literature
      note: >
        Agglomeration signature at the IEP is severe and is itself data:
        cluster size 182-192 nm at pH < 8, rising to a MAXIMUM of 3.1 um at pH 9.
        This is why alumina slurries are run far from pH 9.

    iep_ph_with_additives:
      value:
        glycine_1e-3_to_1e-1_M: [8.9, 9.3]
        h2o2_0p1_wt_pct_plus_0p1M_glycine: 8.8
        h2o2_2_wt_pct_plus_0p1M_glycine: [8, 10]
        sds_1mM: null
      unit: "pH"
      source: "Gopal & Talbot, papers/gopal2006-jes-cmp-slurry-chemistry-zeta-alumina.pdf, Figs. 3-5"
      confidence: literature
      note: >
        With 2 wt% H2O2 the authors state the IEP 'appears to be in the range of
        pH 8 to 10; however, a more precise value could not be determined'
        (electrode gassing) — recorded as a range, not a point.
        With 1 mM SDS the zeta stays NEGATIVE (-41 to -34 mV) over pH 3.5-8, i.e.
        no IEP in the measured window -> value null, not zero.

    iep_ph_independent_check:
      value: 9.2
      uncertainty: 0.2
      unit: "pH"
      method: "streaming potential, fully hydroxylated alpha-Al2O3 surface"
      source: "G. A. Parks / R. E. Johnson-type streaming-potential study, J. Am. Ceram. Soc. (1964), DOI 10.1111/j.1151-2916.1964.tb13801.x — 'the zero point of charge (zpc) of alpha-Al2O3 having a fully hydroxylated surface was found to occur at pH 9.2 +/- 0.2'"
      confidence: unverified
      note: >
        Read from the publisher ABSTRACT only (paywalled, full text not opened).
        Included because it independently corroborates Gopal's ~9 on a
        single-crystal-clean alpha surface. Same source notes calcination above
        1000 C lowers the zpc to ~6.7 — i.e. IEP is a SURFACE-HISTORY property,
        not a phase constant.

    agglomerate_size_vs_ph:
      value:
        ph_4p5_nm: 197
        ph_8p5_nm: 2800
        ph_9_max_nm: 3100
        ph_below_8_stable_nm: [182, 192]
      unit: nm
      source: "Gopal & Talbot, papers/gopal2006-jes-cmp-slurry-chemistry-zeta-alumina.pdf, Figs. 1-2"
      confidence: literature

  # -------------------------------------------------------------------
  film_anchors:
  # -------------------------------------------------------------------

    # ---------- W (tungsten) : 8 anchors ----------

    - film: w
      rate_nm_per_min: 470.0
      rate_range_nm_per_min: [450, 490]
      pressure_psi: 5.0
      velocity_m_s: 1.361
      velocity_source: "derived from table 100 rpm, R_cc=0.13 m (assumed); carrier 25 rpm"
      conc_wt_pct: [2.0, 6.0]
      d50_nm: null
      ph: null
      oxidizer: "Fe(NO3)3.9H2O 5 wt% (fixed)"
      pad: "industry standard (unnamed); Strasbaugh 6DS-SP; slurry 150 mL/min"
      phase_stated: false
      source: "US5916855 (Avanzino et al. / Cabot-AMD, 1999), Experiment 1B, body text: 'nearly constant tungsten removal rate of 4500A/min-4900 A/min for 2-6 wt % Al2O3 abrasion particles'"
      confidence: literature
      note: >
        PLATEAU, not a point: the rate is flat over the whole 2-6 wt% window.
        Blanket W on Ti/TiN over plasma TEOS, 60 s polish, Prometrix RS-55.
        Below 2 wt% the rate is 'substantially reduced' (no number given), and
        the patent explicitly says it cannot explain a drop-off above 6 wt%.
        This is the single best alumina-concentration statement for W CMP.

    - film: w
      rate_nm_per_min: 810.0
      pressure_psi: 5.0
      velocity_m_s: 1.361
      velocity_source: "derived from table 100 rpm, R_cc=0.13 m (assumed); carrier 25 rpm"
      conc_wt_pct: 2.8
      d50_nm: null
      ph: null
      oxidizer: "Fe3+ 5 wt% (ferric nitrate), no persulfate, no EVERFLO suspension agent"
      pad: "industry standard; Strasbaugh 6DS-SP"
      phase_stated: false
      source: "US5916855, TABLE III slurry 10 (Evrflo=No, Salt=No, Fe3+=5%, S2O8=No): W rate 8100 A/min, Ti 1000 A/min, SiO2 129 A/min, defectivity >10000"
      confidence: literature
      note: "Highest bare-Fe(NO3)3 W rate in that table but also the worst defectivity (>10000) and the worst oxide selectivity."

    - film: w
      rate_nm_per_min: 687.2
      pressure_psi: 5.0
      velocity_m_s: 1.361
      velocity_source: "derived from table 100 rpm, R_cc=0.13 m (assumed)"
      conc_wt_pct: 2.8
      d50_nm: null
      ph: null
      oxidizer: "Fe3+ 5 wt% + (NH4)2S2O8 1 wt%"
      pad: "industry standard; Strasbaugh 6DS-SP"
      phase_stated: false
      source: "US5916855, TABLE III slurry 8 (Evrflo=Yes, Salt=Yes, Fe3+=5%, S2O8=1%): W 6872 A/min, Ti 1004 A/min, SiO2 29 A/min"
      confidence: literature
      note: >
        Same abrasive and pressure as the previous anchor; the only changes are
        the persulfate co-oxidiser and the suspension agent. Rate drops 810->687
        but oxide rate drops 129->29 A/min (4.4x better selectivity) and
        defectivity drops to 482. Useful oxidizer-coupling pair.

    - film: w
      rate_nm_per_min: 930.0
      pressure_psi: 5.0
      velocity_m_s: 1.361
      velocity_source: "derived from table 100 rpm, R_cc=0.13 m (assumed)"
      conc_wt_pct: 2.8
      d50_nm: null
      ph: null
      oxidizer: "ferric nitrate 5 wt% + cupric sulfate 0.01 wt% (trace Cu2+ catalyst)"
      pad: "industry standard; Strasbaugh 6DS-SP"
      phase_stated: false
      source: "US5916855, body text: 'exceptionally fast tungsten polish rate of 9300A/min, 60% faster than for the same slurry formulation without the cupric sulfate, although only a trace (0.01 wt %) of cupric sulfate was used'"
      confidence: literature
      note: >
        The 60% number implies a 5812 A/min baseline for that exact lot, which is
        NOT the 8100 of slurry 10 — patent lots differ. Trace Cu2+ down to
        0.0003 wt% already raises the rate (Fig.5, graph only, not digitised).

    - film: w
      rate_nm_per_min: 235.0
      pressure_psi: 5.0
      velocity_m_s: 0.599
      velocity_source: "derived from table 44 rpm, R_cc=0.13 m (assumed); spindle 41 rpm"
      conc_wt_pct: 3.0
      d50_nm: null
      ph: null
      oxidizer: "ferric nitrate 5.0 wt%"
      pad: "Suba 500 / Suba IV stack (Rodel)"
      phase_stated: false
      source: "US5993686 (Cabot, 1999), TABLE I control sample 1 (no fluoride additive): W 2350 A/min, Ti 709 A/min, 5 psi down force, 100 mL/min, table 44 rpm, spindle 41 rpm, 60 s"
      confidence: literature
      note: >
        Abrasive = 3.0 wt% fumed alumina, prepared from Cabot W-A355
        SEMI-SPERSE + FE-10 ferric nitrate. Same patent's TABLE 3 shows the W
        rate moving 2271/2052/1475 A/min as H2SiF6 goes 0.1/0.2/0.3 wt% — i.e.
        fluoride additives suppress W while boosting Ti. Clean 5 psi / 44 rpm
        anchor with a full recipe.

    - film: w
      rate_nm_per_min: 43.6
      pressure_psi: 7.0
      velocity_m_s: 0.681
      velocity_source: "derived from platen 50 rpm, R_cc=0.13 m (assumed); spindle 40 rpm"
      conc_wt_pct: 8.25
      d50_nm: null
      ph: 6.0
      oxidizer: "H2O2 (2000 mL of 50% H2O2 per 1000 g alumina slurry + 1000 g H2O)"
      pad: "Rodel IC1000, 38 inch; Strasbaugh 6DS; 150 mL/min; 23 C"
      phase_stated: false
      source: "US5391258 (IBM, 1995), EXAMPLE 1 Composition 1: 'Polishing rate of W metal=436 Angstroms/min', SiO2 = 140 A/min, selectivity 3.1:1"
      confidence: literature
      note: >
        conc_wt_pct DERIVED: 1000 g of a 33%-solids submicron alumina slurry in
        (1000+1000+~2000) g total ~= 8.25 wt% alumina. Assumes 50% H2O2 has
        density 1.0 g/mL — flagged as an assumption, not a measurement.
        pH 6.0 comes from the same patent's TABLE 1 test 1 (zero phthalate), the
        matching composition. LOW-pH SENSITIVITY: see the next anchor.

    - film: w
      rate_nm_per_min: 116.4
      pressure_psi: 7.0
      velocity_m_s: 0.681
      velocity_source: "derived from platen 50 rpm, R_cc=0.13 m (assumed); spindle 40 rpm"
      conc_wt_pct: 8.25
      d50_nm: null
      ph: 3.5
      oxidizer: "H2O2 as above + 0.10 mol potassium hydrogen phthalate"
      pad: "Rodel IC1000; Strasbaugh 6DS"
      phase_stated: false
      source: "US5391258, TABLE 1 test 3: W polishing rate 1164 A/min at pH 3.5; SiO2 93 A/min; selectivity 12.5"
      confidence: literature
      note: >
        Same slurry, same tool, same alumina, only the pH moved (6.0 -> 3.5):
        W rate goes 444 -> 1164 A/min, a 2.6x pH effect at constant abrasive.
        Full printed series (phthalate mol / pH / W A/min / SiO2 A/min):
        0.00/6.0/444/167, 0.05/3.6/978/137, 0.10/3.5/1164/93, 0.20/3.3/1164/76.
        This is the cleanest published alumina+W pH series with P and V stated.

    - film: w
      rate_nm_per_min: 90.0
      pressure_psi: 7.0
      velocity_m_s: 0.340
      velocity_source: "derived from platen 25 rpm, R_cc=0.13 m (assumed); carrier 25 rpm"
      conc_wt_pct: 8.25
      d50_nm: null
      ph: 2.9
      oxidizer: "H2O2 + 0.3 M potassium hydrogen phthalate"
      pad: "IC-1000; Strasbaugh 6DS; 100 mL/min"
      phase_stated: false
      source: "US5391258, EXAMPLE 4: 'Sheet tungsten wafers showed removal rates of 900 Angstroms/min, while the rate for sheet SiO2 was 70 Angstroms/min, giving a selectivity of 12.9:1'"
      confidence: literature
      note: >
        Same slurry as Example 1 Composition 2 but at HALF the platen speed
        (25 vs 50 rpm) and 2/3 the flow. Rate 1038 -> 900 A/min. Pairs with the
        previous anchor as a crude velocity check at fixed P and chemistry.

    # ---------- oxide (SiO2 counter-film measured in the same W runs) ----------

    - film: oxide
      rate_nm_per_min: 14.0
      pressure_psi: 7.0
      velocity_m_s: 0.681
      velocity_source: "derived from platen 50 rpm, R_cc=0.13 m (assumed)"
      conc_wt_pct: 8.25
      d50_nm: null
      ph: 6.0
      oxidizer: "H2O2 (50%, 2000 mL per batch)"
      pad: "Rodel IC1000; Strasbaugh 6DS"
      phase_stated: false
      source: "US5391258, EXAMPLE 1 Composition 1: 'Polishing rate of SiO2 = 140 Angstroms/min'"
      confidence: literature
      note: "Thermally grown SiO2 on Si. The alumina/oxide pair in the SAME run as the 43.6 nm/min W anchor -> a directly usable selectivity constraint (3.1:1)."

    - film: oxide
      rate_nm_per_min: 6.8
      pressure_psi: 7.0
      velocity_m_s: 0.681
      velocity_source: "derived from platen 50 rpm, R_cc=0.13 m (assumed)"
      conc_wt_pct: 8.25
      d50_nm: null
      ph: 2.9
      oxidizer: "H2O2 + 0.3 M potassium hydrogen phthalate"
      pad: "Rodel IC1000"
      phase_stated: false
      source: "US5391258, EXAMPLE 1 Composition 2: SiO2 = 68 A/min, W = 1038 A/min, selectivity 15.3:1"
      confidence: literature
      note: "Thermally grown SiO2. Same run as the W = 103.8 nm/min composition-2 result; phthalate suppresses oxide 140 -> 68 A/min while W rises 436 -> 1038 A/min."

    - film: oxide
      rate_nm_per_min: 2.9
      pressure_psi: 5.0
      velocity_m_s: 0.599
      velocity_source: "derived from table 44 rpm, R_cc=0.13 m (assumed)"
      conc_wt_pct: 3.0
      d50_nm: null
      ph: null
      oxidizer: "ferric nitrate 5 wt% + H2SiF6 0.2 wt%"
      pad: "Suba 500 / Suba IV"
      phase_stated: false
      source: "US5993686, TABLE 3 run 1-B: TEOS 29 A/min (W 2052, Ti 1397)"
      confidence: literature
      note: "TEOS, not thermal oxide. Same tool/pad as the 235 nm/min W anchor."

    # ---------- Cu (copper) ----------
    # All six Cu anchors are from ONE experiment set: Ihnfeldt 2008 (UCSD PhD),
    # Table 6.2 'Experimental MRR' column. Fixed conditions (section 4.5.2):
    # Toyoda SP46, IC1000 pad (22"), 100 mm Si wafer with 1 um sputtered Cu over
    # 300 A Ta, 1.0 psi (tool maximum), platen 30 rpm / wafer 30 rpm, 150 mL/min,
    # 2 min, mass-loss metrology (+/- 14 nm/min). Abrasive: Cabot 40 wt%
    # alpha-alumina diluted to 4 wt%, primary 20 nm, aggregate d50 150 nm.
    # ONLY conditions whose measured MRR exceeds the paper's own +/-14 nm/min
    # uncertainty are recorded here (the same selection rule as
    # fab-sim/validation/datasets/ihnfeldt2008_cu_alumina_ph_oxidizer_chelator.yaml).

    - film: cu
      rate_nm_per_min: 287.0
      uncertainty_nm_per_min: 14
      pressure_psi: 1.0
      velocity_m_s: 0.408
      velocity_source: "derived from platen 30 rpm, R_cc=0.13 m (assumed); wafer 30 rpm"
      conc_wt_pct: 4.0
      d50_nm: 150
      ph: 8.3
      oxidizer: "H2O2 0.1 wt%"
      pad: "IC1000 (Rohm & Haas), 22 inch"
