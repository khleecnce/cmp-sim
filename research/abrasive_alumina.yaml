            was found to INCREASE WITH DECREASING PARTICLE SIZE and increased
            solids loading. These results suggest that the removal rate
            mechanism is not a scratching type process, but may be related to
            the contact surface area.' -> m < 0 over 0.1-10 um.
            FULL TEXT PAYWALLED — only the abstract was read; no (d, rate) pairs.
        (2) POSITIVE. J. Wang, I. K. Cherian, A. G. Haerle (Saint-Gobain),
            'Chemical Mechanical Planarization of Tungsten with Hard Abrasives',
            Electrochem. Solid-State Lett. 13(6) H182 (2010),
            DOI 10.1149/1.3358135. Abstract read directly: 'The removal rates
            increased LINEARLY WITH PARTICLE SIZE, whereas the defectivity
            decreased as the particle size became smaller. Reducing the alpha
            alumina particle size to 120 nm showed a good combination of high
            removal rate and low oxide defectivity.' -> m ~ +1.
            FULL TEXT PAYWALLED — abstract only; no (d, rate) pairs.
        (3) NULL. B. Egan & H. J. Kim (GLOBALFOUNDRIES), ECS J. Solid State Sci.
            Technol. 8(5) P3206-P3211 (2019), DOI 10.1149/2.0311905jss, OPEN
            ACCESS, full text read (papers/lee2019-jss-abrasive-size-w-cmp.pdf):
            'While tungsten removal rate is not affected by abrasive size ...'
            and in the body: 'it is also accepted that the large abrasives are
            needed to maintain removal rate; however, in the specific case of
            tungsten bulk slurry, this is proven false ... In each case, the
            rate was statistically comparable.' -> m = 0. No numeric table is
            given (qualitative claim only, no n, no p-value).
