      source: "Bielmann, Mahajan, Singh, Shah, Palla, Electrochem. Solid-State Lett. 2(3) 148-150 (1999), DOI 10.1149/1.1390765 — surfactant-STABILISED slurry, 4 repeats"
      confidence: literature
      note: >
        Film: CVD W, 0.6 um. QUOTED VIA fab-sim/knowledge/cmp/
