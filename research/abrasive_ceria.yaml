      doped_ceria_on_cu: "US20050003744A1 — Ce-Fe 1762, Ce-Nd 1980, Ce-Cu 2021 vs pure CeO2 1004 A/min at identical Cu CMP conditions (d50 co-varies; confounded)"
      confidence: literature

