      confidence: literature
      note: >
        Pairs with the 347.4 nm/min oxide anchor at the SAME condition -> bare-ceria
        oxide:nitride selectivity ~4.3:1. High STI selectivity is an ADDITIVE effect, not an
        intrinsic ceria property: 1 wt% pyridine HCl in the same slurry drops nitride to
        <2 nm/min while oxide falls only to ~150 nm/min (printed) -> selectivity >75:1.

