      confidence: derived
      note: >
        MONOTONIC INCREASING over 5-68 nm, matching the paper's printed statement "a decrease in
        MRR with decreasing particle size as expected". A single power law is a poor description:
        the local slope falls from +0.89 (5->20 nm) to +0.24 (20->68 nm), i.e. the curve is
        already flattening by 68 nm. Use the piecewise slopes, not 0.59, if the simulator
        resolves that range. Grade is DERIVED (not literature) because the exponent is my fit of
        digitized bars, and the H2O2 level was re-optimised per particle size — a co-varying
