# abrasive_ceria.yaml — CERIA (CeO2) abrasive, quantitative CMP literature dataset
#
# Purpose: per-film removal-rate anchors, concentration/size exponents, pH response and
# physical properties for CERIA ONLY. Cross-abrasive transfer of exponents is invalid, so
# nothing in this file is inherited from silica/alumina packs.
#
# HARD RULES honoured here:
#   * every number carries value + unit + source + confidence
#   * confidence vocabulary: literature | vendor | derived | unverified
#   * unknown -> value: null + note: "TODO(owner): ..."
#   * read_method: printed  = number is printed in the paper/patent text or table
#                  digitized = number recovered from PDF *vector* coordinates (not eyeballed)
#
# UNIT NORMALISATION (important — sources mix three systems)
#   Å/min ÷ 10 = nm/min ;  nm/h ÷ 60 = nm/min
#   velocity: v[m/s] = 2*pi*r_cc*rpm/60 with r_cc = 0.180 m (CMP-Sim base.yaml center_offset_m).
#   Papers that give only rpm have velocity marked derived_from_rpm: true — it is a
#   kinematic reconstruction at the nominal wafer-centre radius, NOT a measured sliding speed.
#   1 psi = 6.89476 kPa.

ceria:

  # ==================================================================== 1. PROPERTIES
  properties:
    formula: CeO2
    crystal_structure:
      value: fluorite (cubic, Fm-3m)
      confidence: literature
      source: "Hwang et al. 2026, Polymers 18, 1899, doi:10.3390/polym18151899 (XRD, CC-BY)"

    density_kg_m3:
      value: 7220.0
      unit: kg/m^3
      confidence: literature
      source: "CRC Handbook of Chemistry and Physics, cerium(IV) oxide (7.22 g/cm^3)"
      note: "Bulk crystal density; used for wt% -> volume-fraction conversion in coverage models."

    hardness_gpa:
      value: 6.44
      uncertainty_gpa: 0.72
      unit: GPa
      method: nanoindentation, room temperature
      confidence: literature
      source: "Materials 2026, doi:10.3390/ma19102134 (PMC13208460), Table 1, RT row"
      note: >
        MEASURED ON BULK SINTERED CeO2 PELLETS made as nuclear-fuel surrogate, NOT on CMP
        slurry nanoparticles. Same crystal phase, so order-of-magnitude transfer only;
        nanoparticle surface/defect effects not included — treat as unverified for
        particle-scale Hertz contact. Context: fused silica ~7.3 GPa, alumina Mohs 9.
        Ceria is therefore a SOFT abrasive relative to alumina, consistent with its
        low-scratch reputation.

    youngs_modulus_gpa:
      value: 167.6
      uncertainty_gpa: 12.5
      unit: GPa
      method: nanoindentation, room temperature
      confidence: literature
      source: "Materials 2026, doi:10.3390/ma19102134 (PMC13208460), Table 1, RT row"
      note: "Same bulk-pellet caveat as hardness_gpa."

    mohs_hardness:
      value: null
      note: "TODO(owner): no primary source found giving a Mohs number for CeO2 (alumina Mohs 9 is sourced; ceria is commonly quoted 6 but I found no citable primary)."

    iep_ph:
      value_range: [6.7, 7.8]
      unit: pH
      confidence: literature
      source: >
        Secondary-citation range collected in fab-sim knowledge/cmp/ceria-slurry-ce-redox-selectivity.md
        §4 (electrophoresis studies of ceria CMP slurries; Cambridge JMR "Effect of pH on
        ceria-silica interactions" doi:10.1557/JMR.2005.0176 family).
      note: >
        Sample- and hydration-dependent; ~8 is the value Dandu 2009 and Netzband 2020 both
        assume. IMPORTANT operational consequence: silica IEP ~2-3, so between pH ~4 and ~6
        ceria is positive and the oxide film is negative -> electrostatic attraction. Adding
        0.01 wt% PAA SHIFTS CERIA IEP FROM ~8 DOWN TO ~4 (Dandu 2009, printed statement),
        which is why PAA-stabilised slurries lose rate above pH 5.5.
      iep_shift_with_paa:
        value: 4.0
        unit: pH
        additive: "0.01 wt% poly(acrylic acid)"
        confidence: literature
        source: "Dandu Veera, Peddeti, Babu 2009, J. Electrochem. Soc. 156(12) H936-H943, doi:10.1149/1.3230624 (printed text)"

    chemical_tooth_adsorption_energy_kj_mol:
      silicic_acid_on_111: {value: -110.96, unit: kJ/mol, confidence: literature}
      silicic_acid_on_100: {value: -257.61, unit: kJ/mol, confidence: literature}
      source: "Brugnoli et al., Langmuir 39(16), 2023, doi:10.1021/acs.langmuir.3c00304 (open access, PMC10116594); DFT -1.15 eV (111) and -2.67 eV (100)"
      confidence: literature
      note: >
        Chemisorption (physisorption is -20..-40 kJ/mol). This is the quantitative basis of
        the Cook "chemical tooth": ceria removes SiO2 by Si-O-Ce bond formation and scission,
        not purely by indentation. It is why ceria exponents differ from silica exponents and
        must never be transferred.

    ce3_fraction_surface:
      value_range: [0.177, 0.221]
      unit: "-"
      method: XPS Ce3d
      confidence: literature
      source: "Hwang et al. 2026, Polymers 18, 1899, doi:10.3390/polym18151899, Table 3 (HNU15 22.1%, HC10 17.7%)"
      note: >
        Ce3+ surface fraction is the chemical activity knob. H2O2 addition maximises it
        (Netzband & Dunn 2020). CAUTION: in the Hwang pair, Ce3+ moves TOGETHER with primary
        size (12.2 vs 14.6 nm), crystallite size (10.2 vs 8.7 nm) and BET (83.2 vs 60.2 m^2/g),
        so the 1.99x MRR ratio CANNOT be attributed to Ce3+ alone — the authors say so
        explicitly. Do not fit a Ce3+ gain from that pair.

  # ============================================================== 2. FILM RATE ANCHORS
  # Each entry is one measured blanket removal rate WITH its full process condition.
  film_anchors:

    # ---------------- oxide: thermal / TEOS / PETEOS / HDP ----------------
    - film: oxide
      film_detail: "blanket thermal SiO2 (grown ~900 C), 200 mm"
      rate_nm_per_min: 347.4
      pressure_psi: 4.0
      pressure_kpa: 27.58
      velocity_m_s: 1.414
      derived_from_rpm: true
      rpm_platen: 75
      rpm_carrier: 75
      conc_wt_pct: 0.25
      d50_nm: 60.0
      ph: 4.0
      pad: "IC1000 (Rohm & Haas), diamond-grit conditioned 1 min before each run"
      additives: "none"
      polisher: "Westech 372"
      polish_time_min: 1
      read_method: digitized
      source: "Dandu Veera, Peddeti, Babu 2009, J. Electrochem. Soc. 156(12) H936-H943, doi:10.1149/1.3230624, Figure 3 (no-additive oxide series)"
      confidence: literature
      note: >
        Self-check: paper text prints "RRs of oxide and nitride films were ~350 and ~80 nm/min
        in the pH range of 4-5.5"; the vector digitisation returns 347/344/350 — consistent.
        Also matches the independent Fig.2a reading at the same condition (352.1) within 1.4%.

    - film: oxide
      film_detail: "blanket thermal SiO2, 200 mm"
      rate_nm_per_min: 350.4
      pressure_psi: 4.0
      pressure_kpa: 27.58
      velocity_m_s: 1.414
      derived_from_rpm: true
      rpm_platen: 75
      rpm_carrier: 75
      conc_wt_pct: 0.25
      d50_nm: 60.0
      ph: 5.5
      pad: "IC1000"
      additives: "0.01 wt% PAA (added for slurry stability at pH >= 5.5)"
      read_method: digitized
      source: "Dandu 2009, doi:10.1149/1.3230624, Figure 3"
      confidence: literature

    - film: oxide
      film_detail: "PETEOS blanket, 200 mm"
      rate_nm_per_min: 252.9
      measured_rate_angstrom_per_min: 2529
      pressure_psi: 3.0
      pressure_kpa: 20.68
      velocity_m_s: 1.25
      derived_from_rpm: false
      conc_wt_pct: null
      d50_nm: null
      ph: null
      pad: "concentrically-grooved polyurethane (Araca APD-800 tribometer-equipped polisher)"
      additives: "commercial colloidal ceria STI slurry, composition undisclosed"
      polish_time_min: 1
      read_method: digitized
      source: "Mariscal et al. 2020, ECS J. Solid State Sci. Technol. 9, 044008, doi:10.1149/2162-8777/ab89bc, Figure 5"
      confidence: literature
      note: >
        BEST P-V ANCHOR IN THE FILE — full 3x3 factorial (2/3/4 psi x 0.75/1.25/1.75 m/s) with
        sliding velocity printed directly, so no rpm reconstruction needed. Digitisation
        validated against the printed sentence "A measured RR of 2,528 A/min on PETEOS-based
        SiO2 blanket wafers" -> read 2,529 (0.04% error).
        Slurry composition (wt%, d50, pH) is NOT disclosed — that is the price of this dataset.
        Authors conclude the system is NON-PRESTONIAN (Langmuir-Hinshelwood, k1/k2 = 6.3-142.2,
        RR=0 incubation near P*v ~ 2000 Pa*m/s), so a pure Preston fit will over-predict at low P*v.
      full_pv_matrix:
        # (pressure_psi, velocity_m_s, rate_nm_per_min) — all 9 conditions, same slurry/pad
        - [2.0, 0.75, 69.8]
        - [3.0, 0.75, 140.4]
        - [4.0, 0.75, 206.4]
        - [2.0, 1.25, 155.8]
        - [3.0, 1.25, 252.9]
        - [4.0, 1.25, 307.9]
        - [2.0, 1.75, 171.8]
        - [3.0, 1.75, 283.8]
        - [4.0, 1.75, 346.3]
      fitted_preston_exponents:
        pressure_exponent: 1.199
        velocity_exponent: 0.862
        prefactor: 47.57
        r2: 0.9383
        confidence: derived
        note: >
          My own log-log multiple regression on the 9 points above (MRR = k*P^a*v^b, P in psi,
          v in m/s, MRR in nm/min). Not a number printed by the authors. Both exponents differ
          from Preston's 1.0/1.0 and R2=0.94 leaves structure unexplained — consistent with the
          authors' non-Prestonian conclusion. Use for ranking, not absolute extrapolation.

    - film: oxide
      film_detail: "thermal SiO2 coupon (2.25 cm^2), benchtop polisher"
      rate_nm_per_min: 21.3
      pressure_psi: 2.9
      pressure_kpa: 20.0
      velocity_m_s: 0.754
      derived_from_rpm: true
      rpm_platen: 40
      rpm_carrier: 20
      conc_wt_pct: 1.0
      d50_nm: 68.0
      ph: 10.0
      pad: "(benchtop tool, pad type not specified in text)"
      additives: "H2O2 at the concentration giving maximum Ce3+% (pH-series slurries)"
      polish_time_min: 1
      metrology: "spectroscopic ellipsometry, J.A. Woollam RC-2"
      read_method: digitized
      source: "Netzband & Dunn 2020, ECS J. Solid State Sci. Technol. 9, 044001, doi:10.1149/2162-8777/ab8393 (CC-BY), Figure 3a"
      confidence: literature
      note: >
        ABSOLUTE RATE IS ~16x LOWER than Dandu/Mariscal because this is a BENCHTOP coupon tool,
        not a 200/300 mm polisher. Never mix this absolute level with wafer-scale anchors; use
        it only for pH/size RATIOS within this paper. Digitisation independently re-validated
        twice (axis scale 5.1353 pt per nm/min) and matches the printed "~20 nm/min" statement.

    - film: oxide
      film_detail: "TEOS blanket"
      rate_nm_per_min: 736.5
      measured_rate_angstrom_per_min: 7365
      pressure_psi: 3.0
      pressure_kpa: 20.68
      velocity_m_s: 1.885
      derived_from_rpm: true
      rpm_platen: 100
      rpm_carrier: 85
      conc_wt_pct: 0.2
      d50_nm: 73.0
