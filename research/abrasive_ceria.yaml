        PSD ~200 nm) = 4881 A/min; 1C (MPS 73 nm, PSD ~380 nm) = 7365 A/min.
        This is a particle-ENGINEERING series (PSD width + surface tridentate-OH + Raman
        defect ratio all co-vary), NOT a clean d50 sweep — see size_exponent.oxide gap note.

    - film: oxide
      film_detail: "TEOS blanket (PECVD/LECVD/HD TEOS wafers), 200 mm"
      rate_nm_per_min: 629.6
      measured_rate_angstrom_per_min: 6296
      pressure_psi: 3.0
      pressure_kpa: 20.68
      velocity_m_s: 1.640
      derived_from_rpm: true
      rpm_platen: 87
      rpm_carrier: 93
      conc_wt_pct: 1.0
