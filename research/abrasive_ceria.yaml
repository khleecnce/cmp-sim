    - film: oxide
      film_detail: "TEOS blanket, same slurry as the 3.0 psi row above"
      rate_nm_per_min: 735.9
      measured_rate_angstrom_per_min: 7359
      pressure_psi: 4.0
      pressure_kpa: 27.58
      velocity_m_s: 1.640
      derived_from_rpm: true
      rpm_platen: 87
      rpm_carrier: 93
      conc_wt_pct: 1.0
      d50_nm: 117.5
      ph: 7.0
      pad: "IC1010 (Dow)"
      additives: "biocide only (reference sample)"
      read_method: printed
      source: "US12091581B2, Example 3, Table 3 reference row"
      confidence: literature
      note: >
        Pressure pair with the previous row: 3.0 psi -> 629.6, 4.0 psi -> 735.9 nm/min at
        identical v, pad, conc, pH. Implied local pressure exponent
        ln(735.9/629.6)/ln(4/3) = +0.54 (derived, n=2) — i.e. STRONGLY SUB-PRESTONIAN on
