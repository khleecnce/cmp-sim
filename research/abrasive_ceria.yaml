  # ================================================================== 5. SATURATION
  saturation:
    oxide_calcined_180nm:
      knee_wt_pct: 0.75
      unit: wt%
      evidence: "rate rises 390.0 -> 505.0 -> 627.8 nm/min at 0.25/0.50/0.75 wt%, then FALLS to 495.0 at 1.00 wt%"
      fixed_conditions: {pressure_psi: 4.0, velocity_m_s: 1.414, d50_nm: 180.0, ph: 4.0, pad: IC1000}
      read_method: digitized
      source: "Dandu 2009, doi:10.1149/1.3230624, Figure 2b"
      confidence: literature
      note: >
        A real knee with a measured turnover, not an asymptote — the 1.0 wt% point is BELOW the
        0.75 wt% point (-21%). n=4 digitized points, so the knee position is +/- one grid step.

    oxide_colloidal_60nm:
      knee_wt_pct: null
      note: >
        NO KNEE EXISTS in this branch: the 60 nm series (Fig.2a) is monotonically DECREASING
        from the lowest concentration measured (0.25 wt%), so any saturation knee lies at or
        below 0.25 wt% and was not resolved. TODO(owner): a sub-0.25 wt% sweep would settle it.
      confidence: unverified

    sic:
      knee_wt_pct: 8.0
      unit: wt%
      confidence: unverified
      source: "Wei et al. 2026, doi:10.3390/cryst16030179 §3.2 — 4H-SiC C-face, maximum 701 nm/h at 8 wt%, decay above 8 wt% attributed to viscosity/agglomeration"
      note: >
        DIFFERENT ABRASIVE: that study uses 110 nm colloidal SILICA + H2O2 + Fe3O4, not ceria.
        Listed as a regime-level expectation only. The ceria Liang series (1/5/9 wt%) is still
        rising at 9 wt% with no knee. TODO(owner): find a ceria-on-SiC series that brackets a knee.

    generic_mechanism_note: >
      Two closed forms from the Bellahsene et al. 2025 review (doi:10.3390/nano15171366, MDPI OA,
      full text held): indentation-limited MRR ~ d^(4/3), surface-area-limited MRR ~ C0/d.
      The size peak is where they cross. For ceria the crossover is pushed to larger d because
      chemical removal scales with contact-site count rather than total surface area — a
      qualitative reading of the review plus Netzband 2020, NOT a fitted result.

  # ================================================================= 6. pH RESPONSE
  ph_response:
    oxide_series_A:
      pairs_ph_rate_nm_per_min:
        - [2.0, 4.3]
        - [3.0, 95.3]
        - [3.5, 276.3]
        - [4.0, 347.4]
        - [5.0, 344.3]
        - [5.5, 350.4]
        - [6.0, 99.3]
        - [8.0, 69.4]
      fixed_conditions:
        pressure_psi: 4.0
        velocity_m_s: 1.414
        derived_from_rpm: true
        conc_wt_pct: 0.25
        d50_nm: 60.0
        pad: IC1000
        additives: "none below pH 5.5; 0.01 wt% PAA added at pH >= 5.5 for stability"
      shape: "single broad peak, plateau pH 4-5.5, collapse above pH 6"
      read_method: digitized
      source: "Dandu 2009, doi:10.1149/1.3230624, Figure 3 (no-additive oxide series)"
      confidence: literature
      note: >
        CONFOUND: the PAA added at pH >= 5.5 shifts the ceria IEP from ~8 to ~4, so the collapse
        above pH 6 is partly an ADDITIVE effect, not pure pH. The paper says as much.

    oxide_series_B:
      pairs_ph_rate_nm_per_min:
        - [4.0, 19.8]
        - [6.0, 11.3]
        - [8.0, 20.0]
        - [10.0, 21.3]
      fixed_conditions:
        pressure_psi: 2.9
        pressure_kpa: 20.0
        velocity_m_s: 0.754
        derived_from_rpm: true
        conc_wt_pct: 1.0
        d50_nm: 68.0
        tool: "benchtop coupon polisher (NOT a 200/300 mm platform)"
      shape: "DOUBLE maximum — high at pH 4 and again at pH 8-10, valley at pH 6"
      read_method: digitized
      source: "Netzband & Dunn 2020, doi:10.1149/2162-8777/ab8393 (CC-BY), Figure 3a"
      confidence: literature
      note: >
        Authors explain the two maxima as condensation being optimal near the OXIDE IEP (2-3)
        and near the CERIA IEP (~8), with neither favoured at pH 6.

    reconciliation: >
      THE TWO SERIES DISAGREE IN SHAPE and this is the single most important pH fact in this file.
      Series A (0.25 wt%, 60 nm, +PAA above 5.5) peaks at pH 4-5.5 and collapses after.
      Series B (1.0 wt%, 68 nm, H2O2, no PAA) is high at BOTH pH 4 and pH 8-10 with a pH-6 valley.
      The ceria pH response is therefore NEITHER MONOTONIC NOR UNIMODAL, and it is
      formulation-dependent. Any single monotonic pH term will fail one of these datasets.
      Absolute levels also differ ~16x because of the tool scale — compare shapes, never levels.

    sic_direction:
      value: "MRR decreases monotonically as pH rises from 2 to 10 (ceria + 0.05 M KMnO4 on 6H-SiC)"
      quantified: false
      confidence: literature
      source: "Chen et al. 2017, RSC Adv. 7, 16938-16952, doi:10.1039/C6RA27508G (CC-BY), §3.5 / Fig. 13; and Chen et al. 2015, doi:10.1016/j.apsusc.2015.10.158 (max 1089 nm/h at pH 2)"
      note: >
        Fig. 13 of the 2017 paper is a RASTER image, not vector, so the pH 2/4/10 bar values
        could not be digitized reliably. TODO(owner): request the underlying numbers, or accept
        only the pH-2 endpoint (1089 nm/h) printed in the 2015 paper.
        OPPOSITE SIGN TO OXIDE at high pH — oxidizer potency, not electrostatics, dominates here.

    sin_ph:
      pairs_ph_rate_nm_per_min: null
      note: "TODO(owner): Dandu 2009 Figure 3 does contain a nitride pH series, but only the pH 4-5.5 plateau value (~80 nm/min) is printed; the remaining points were not digitized in this pass."
      confidence: unverified

  # ===================================================== 7. MORPHOLOGY / SYNTHESIS ROUTE
  morphology:
    calcined_vs_colloidal:
      quantified_rate_difference:
        comparison: "0.25 wt%, pH 4, 4 psi, 75/75 rpm, IC1000, blanket thermal oxide, same paper and tool"
        colloidal_60nm_nm_per_min: 352.1
        calcined_180nm_nm_per_min: 390.0
        ratio_calcined_over_colloidal: 1.11
        at_optimum_of_each:
          colloidal_60nm_best: {wt_pct: 0.25, rate_nm_per_min: 352.1}
          calcined_180nm_best: {wt_pct: 0.75, rate_nm_per_min: 627.8}
          ratio: 1.78
        read_method: digitized
        source: "Dandu 2009, doi:10.1149/1.3230624, Figures 2a and 2b"
        confidence: literature
        note: >
          CONFOUNDED BY SIZE: 60 nm colloidal vs 180 nm calcined. The difference in
          CONCENTRATION RESPONSE (n = -0.43 vs +0.43, knee at 0.75 wt%) is the more robust and
          more useful distinction than the absolute ratio.

      quantified_defect_difference:
        value: null
        note: >
          TODO(owner): no paper in the sourced set reports scratch/defect COUNTS for calcined vs
          colloidal ceria at matched removal rate. Available qualitative/partial evidence:
          (a) Oh et al. 2011 Powder Technol. doi:10.1016/j.powtec.2010.09.025 — larger abrasives
          raise rate but WORSEN surface uniformity (no counts);
          (b) Netzband & Dunn 2020 Fig. 5b — RZ and RRMS comparable across 5/20/68 nm, i.e. the
          usual size-roughness penalty was NOT observed once Ce3+% was maximised;
          (c) EP3265534B1 — wet-process (colloidal) ceria with a BROAD PSD (~380 nm) nearly
          DOUBLES TEOS rate vs narrow-PSD comparatives at identical P/v/conc/pH, attributed to
          surface tridentate-OH coverage (2.3e-5 mol/m^2) and Raman defect ratio (54.8 vs 229.3);
          (d) Praveen et al. 2014 Microelectron. Eng. 114, 98-104,
          doi:10.1016/j.mee.2013.10.004 — calcined+milled lab ceria (crystallite 12 nm,
          BET 58 m^2/g) vs commercial ceria (crystallite 29-30 nm, BET 6-9 m^2/g); the
          commercial powders carry 24-31 wt% LANTHANUM and 5 wt% Si/Al, and impurity/phase
          content (not size) tracks the high nitride rates that ruin selectivity.
        confidence: unverified

      purity_axis:
        commercial_ceria_lanthanum_wt_pct: [24, 31]
        lab_calcined_milled_lanthanum_wt_pct: 0
        detection_note: "below EDX detection limit for the lab-synthesised ceria-CM"
        bet_m2_g: {ceria_CM: 58, ceria_S: 6, ceria_SA: 9}
        crystallite_nm: {ceria_CM: 12, ceria_S: 30, ceria_SA: 29}
        source: "Praveen et al. 2014, Microelectron. Eng. 114, 98-104, doi:10.1016/j.mee.2013.10.004, Tables 2 and 3"
        confidence: literature
        note: >
          '90% pure' commercial ceria is largely TOTAL RARE EARTH OXIDE, not CeO2 — a quarter to
          a third of it is La2O3. Selectivity with L-proline was found to depend on the ceria
          SOURCE, while L-glutamic acid worked regardless. Practical warning: a vendor d50 and
          wt% do not specify a ceria abrasive; the La fraction and phase mix matter.
          Process conditions for this paper: benchtop Struers Labopol-5, SUBA IV pad, 20 N force
          (contact pressure not convertible without the coupon area — TODO(owner)),
          100 rpm table / 250 rpm carrier, pH 7, 0.25 wt% ceria, 1 min, 10 mm square coupons.

      calcination_temperature_series:
        value: null
        note: >
          TODO(owner): Praveen 2014 Fig. 1 sweeps calcination temperature 300-1000 C (crystallite
          ~5 nm at 300 C to ~30 nm at 1000 C) against oxide and nitride rates, and states a WEAK
          correlation between crystallite size and oxide rate, with rates roughly flat at/above
