          unit: "A/min per wt%"
          range_wt_pct: [0.5, 1.0]
        marginal_slope_at_3psi_above_knee:
          value: 100
          unit: "A/min per wt%"
          range_wt_pct: [2.5, 3.0]
        slope_collapse_factor: 13.4
        total_gain_1p0_to_3p0_wt_pct_at_1p5psi:
          value: 12.7
          unit: "%"
      confidence: derived
      note: >
        Knee is pressure-dependent: at 1.5 psi the curve is already flat past
        1 wt%, at 4-5 psi it is still climbing at 2.5-3 wt%. Physically the knee
        moves right with pressure (more real contact area = more sites to fill).
        A pure power law cannot reproduce this; a site-occupancy / Langmuir form
        is required.
