fumed_silica:

  properties:
    description: >
      Flame-hydrolysis (pyrogenic) silica: primary particles fuse in the flame
      into branched, non-redispersible AGGREGATES. Broad PSD with a coarse tail.
      This aggregate structure — not the primary size — sets the polishing and
      defect behaviour, which is why it must never be merged with colloidal data.
    manufacturing_route:
      value: "SiCl4 + 2 H2 + O2 -> SiO2 + 4 HCl (gas-phase flame hydrolysis)"
      source: "Kim 2018, IntechOpen review, DOI 10.5772/intechopen.75408"
      confidence: literature
      note: "review chapter (secondary source)"
    aggregate_size:
      value: ">30"
      unit: nm
      source: "Kim 2018, DOI 10.5772/intechopen.75408 ('larger than 300 Angstrom')"
      confidence: literature
    typical_slurry_d50_nm:
      value: 140
      unit: nm
      source: "Basim, Adler, Mahajan, Singh, Moudgil, J. Electrochem. Soc. 147(9) 3523-3528 (2000) — Rodel 1200 commercial fumed silica slurry, 'mean particle size of 0.14 um'"
      confidence: literature
      note: "One specific commercial product, not a general property of fumed silica."
    rate_vs_colloidal:
      value: "higher removal rate, worse scratch performance, at equal nominal loading"
      source: "Kim 2018, DOI 10.5772/intechopen.75408"
      confidence: literature
      note: >
        Qualitative only. TODO(owner): no side-by-side quantitative comparison at
        matched conditions exists in this corpus EXCEPT US9499721B2 Example 18,
        where 12.5 wt% fumed (SS25) is matched by only ~1.5 wt% colloidal — i.e.
        per unit solids the fumed slurry is roughly 8x LESS efficient, which is
        the opposite of the review's generalisation. Do not rely on Kim 2018 here.
