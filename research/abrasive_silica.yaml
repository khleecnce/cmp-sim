  size_exponent:
    # MRR ~ d^m, fitted in log-log space.
    oxide_teos:
      raw_pairs_d50_nm_rate_nm_per_min: [[40, 140.7], [100, 53.2], [120, 36.6]]
      fitted_value: -1.173
      r2: 0.986
      source: "US10676647B1 Example 5 / TABLE 5B, compositions 4H (Fuso PL-2, 40 nm), 4B (PL-5, 100 nm), 4I (PL-7, 120 nm) — identical chemistry (glycine 4200 ppm + arginine 300 ppm, pH 3.5, 3 wt% silica, 0.3 wt% H2O2) and identical polish conditions (2.5 psi, 100/101 rpm); fit performed here"
      confidence: derived
      note: >
        Strongly NEGATIVE: smaller particles polish TEOS much faster in this
        acidic W-buff chemistry (surface-area-controlled limit). This conflicts
        in sign with the 40->80 nm rising branch reported by Li 2021 for
        alkaline oxide CMP — see oxide_conflict_note.
        n=3 points, so the exponent is indicative, not precise.
    oxide_conflict_note: >
      Li et al. 2021 (DOI 10.1149/2162-8777/ac3e44) report a PEAK in oxide MRR at
      d50 ~80 nm for 20-30 wt% colloidal silica at alkaline pH, with the two
      limiting laws R ~ C^(1/3) d^(-1/3) (surface-area controlled) and
      R ~ C^(-1/3) d^(4/3) (indentation controlled); they assign 40->80 nm to the
      rising indentation branch and 80->130 nm to the falling surface-area branch.
      The US10676647B1 series (acidic, 3 wt%, 40-120 nm) is monotonically falling,
      i.e. consistent only with the surface-area branch over its whole range.
      These are different chemistries/loadings, not a contradiction to be averaged:
      a single global m for oxide is not defensible. Li 2021's own MRR vs d50
      numbers are graph-only and were NOT digitised here.
    w:
      raw_pairs_d50_nm_rate_nm_per_min: [[40, 30.2], [100, 26.9], [120, 26.5]]
      fitted_value: -0.121
      r2: 0.997
      source: "US10676647B1 TABLE 5B, compositions 4H/4B/4I; fit performed here"
      confidence: derived
      note: >
        Essentially flat (m ~ -0.12, a 14% span over a 3x size range) — W removal
        in this chemistry is chemically rate-limited, so particle size barely
        matters. Independently corroborated by Bouvet et al., JVST B 20(4) 1556
        (2002), DOI 10.1116/1.1490393, who found PVD-W removal rate independent of
        colloidal silica size (12-75 nm) and of silica content ('the limiting
        factor is chemical related'). NOTE: that Bouvet paper was NOT read in full
        here — it is cited via knowledge/cmp/w-cmp-preston-kp-oxidizer-rate-
        literature-reproduction.md.
