gaps:
  - "fumed_silica: concentration exponent n for EVERY film (no published series with printed (wt%, rate) pairs)."
  - "fumed_silica: size exponent m for EVERY film (no d50 sweep at fixed chemistry; Basim 2000 is a coarse-tail spiking study)."
