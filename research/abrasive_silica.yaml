  ph_response:
    oxide_alkaline:
      raw_pairs_ph_nm_per_min: [[10.0, 155.1], [11.0, 172.7], [12.5, 140.7]]
      shape: "peak"
      peak_ph: 11.0
      rise_pct_10_to_11: 11.3
      fall_pct_11_to_12p5: 18.5
      conditions: "20 wt% colloidal silica, d50 80 nm, K+ 0.25 mol/L, 3 psi, 108/110 rpm, IC1010, thermal SiO2"
      source: "Li et al. 2021, DOI 10.1149/2162-8777/ac3e44, Fig.1 / body text"
      confidence: literature
      mechanism: "pH 10->11: OH- hydrolysis of Si-O-Si softens the surface -> MRR up. pH 11->12.5: both abrasive and film become more negative -> electrostatic repulsion -> mechanical contact down -> MRR down."
    oxide_acidic:
      raw_pairs_ph_nm_per_min: [[2.0, 10.9], [2.5, 3.2], [3.0, 1.6], [3.5, 1.5], [4.0, 1.1], [5.0, 0.5], [6.0, 1.2]]
      shape: "steep monotonic decay from pH 2 to pH 5, slight rebound at pH 6"
      power_law_fit_ph2_to_ph5:
        form: "MRR = A * pH^B"
        A: 68.1
        B: -3.09
        log_mse: 0.306
        n_points: 5
      log_quadratic_fit_ph2_to_ph6:
        form: "ln MRR = a*pH^2 + b*pH + c"
        a: 0.336472
        b: -3.228411
        c: 7.349046
        log_mse: 0.3562
        vertex_ph: 4.80
        n_points: 7
      conditions: "1 wt% anionic colloidal silica (Fuso), 2 psi, Mirra, 175 mL/min, 8-inch TEOS blanket"
      source: "CN109609035B (Fujifilm Electronic Materials USA), Example 1 / Table 1 (printed table read from the Google Patents image); fits reproduced from knowledge/cmp/silica-cmp-ph-acidic-repulsion-choi-power-law.md"
      confidence: derived
      note: "Mechanism corroborated qualitatively by Choi, Lee, Singh 2004 (DOI 10.1149/1.1738472): rate maximum at pH ~2 near the silica IEP, falling to a minimum near pH 9 as electrostatic repulsion grows, then rising again above pH 10 as silica dissolution creates a soft gel layer. Choi reports no numeric table, so no fit is attributed to it."
    oxide_acid_vs_alkaline_single_system:
      pairs: [[2.0, 13.0], [10.0, 1.0]]
      conditions: "1 wt% colloidal silica d50 50 nm, 4 psi, 90/90 rpm, IC1000, no additive"
      source: "Penta et al. 2011, DOI 10.1021/la104257k, Tables 3 and 4"
      confidence: literature
      note: ">13x drop from pH 2 to pH 10 within ONE experimental system — the cleanest single-lab confirmation of the repulsion-dominated acidic branch."
    poly_si:
      shape: "increasing with pH over pH 2-10 (OH- attack on Si-Si bonds)"
      raw_pairs_ph_nm_per_min: null
      quantified_points: [[10.0, 230.0]]
      source: "Penta et al. 2011, DOI 10.1021/la104257k, Fig.3 + text: 'pH has a strong effect on the poly-Si RRs because of the influence of OH- ion concentration on Si-Si bond breakage'; the pH-10 value is from Table 3"
      confidence: literature
      note: >
        TODO(owner): the full poly-Si pH curve for 1% silica is in Fig.3 as a
        graph only — not digitised here, so only the direction plus the pH-10
        point are sourced. Underlying kinetics (Seidel 1990, DOI 10.1149/1.2086277):
        Si + 4 OH- -> Si(OH)4 + 4 e-, with rate proportional to [H2O]^4 [KOH]^(1/4),
        i.e. a very weak quarter-power OH- dependence that peaks and then falls when
        water is displaced (~20 wt% KOH in the literature) — so the poly-Si pH
        response is peak-shaped, not monotonic, if extended far enough.
    silica_iep_ph:
      value: "<2.0"
      source: "Choi, Lee, Singh 2004, DOI 10.1149/1.1738472, Fig.3 (zeta potential)"
      confidence: literature
    nitride_iep_ph:
      value: 5
      source: "Penta et al. 2011, DOI 10.1021/la104257k (citing its ref 13); explains the 33 -> <1 nm/min nitride collapse across pH 2 -> 6"
      confidence: literature
      note: "Film property, included because it controls the silica-nitride interaction."

