  - "fumed_silica: pH response curve — none at all."
  - "fumed_silica: hardness, Young's modulus, density, IEP — no morphology-specific primary values."
  - "fumed_silica: anchors for sin, poly_si, w, cu, si — the only fumed anchors found are on oxide."
  - "fumed_silica: d50 and pH of the SS25 control slurry in US9499721B2 (patent does not state them)."
  - "colloidal_silica: concentration exponent for poly_si, sin, si (single-loading studies only)."
  - "colloidal_silica: size exponent for cu, poly_si, sin, si."
  - "colloidal_silica: particle density (g/cm3) from a primary source."
  - "colloidal_silica: nanoparticle-specific hardness — the 7.3 GPa value is bulk fused silica from a paywalled paper read only in abstract."
  - "colloidal_silica: Young's modulus lacks a primary citation."
  - "All Cu anchors from US20080090500A1: silica d50 and morphology unstated; classification as colloidal is an assumption."
  - "W concentration exponent (cube root) comes from ECS Trans. 41(43) 103-111 whose abrasive chemistry is not stated and whose raw (wt%, rate) pairs are graph-only; r2 unknown."
  - "Li 2021 MRR-vs-d50 numbers (the 80 nm peak) are graph-only — the peak position is sourced, the rate values are not."
  - "Poly-Si full pH curve (Penta 2011 Fig.3) is graph-only; only the direction plus the pH-10 point are sourced."
  - "Relative velocity in m/s is reported by NONE of these sources. Every velocity_m_s here is derived from platen rpm with an ASSUMED R_cc = 0.13 m; for the coupon polishers (Basim's Struers Rotopol 31, PPG's Struers LabPol-VT) that assumption is probably wrong by a large factor."
  - "No silica anchor in this dataset varies velocity at fixed pressure, so the Preston velocity exponent b is untested for silica here."
  - "Pad type is missing for the US20080090500A1 wafer-level Cu anchor (Example 7)."
