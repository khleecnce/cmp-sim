# =====================================================================
# abrasive_silica.yaml — quantitative literature dataset for SiO2 abrasive in CMP
# Scope: SILICA ONLY. Colloidal and fumed are kept strictly separate.
# Author: research subagent, 2026-09-24. Sources = local corpus
#   (~/fab-sim/papers, ~/fab-sim/papers/patents, ~/fab-sim/knowledge,
#    ~/fab-sim/validation/datasets).
#
# RULES OBEYED HERE
#  - every number carries value / unit / source / confidence
#  - confidence vocabulary: literature | vendor | derived | unverified
#  - nothing is invented. Unknown -> value: null + note: "TODO(owner): ..."
#  - rate anchors without BOTH pressure and velocity are flagged in `note`.
#
# VELOCITY CONVENTION (read this before using velocity_m_s)
#   Almost no CMP paper/patent reports linear relative velocity; they report
#   platen rpm. Where only rpm is known, velocity_m_s is DERIVED as
#       v = omega_platen * R_cc,  R_cc = 0.13 m
#   R_cc (wafer-centre-to-platen-centre distance) is NOT reported by any of
#   these sources; 0.13 m is the representative value already used across the
#   fab-sim knowledge base (see knowledge/cmp/w-cmp-preston-kp-oxidizer-rate-
#   literature-reproduction.md section 3, where it is documented as the dominant
#   uncertainty, band 0.09-0.17 m). Such entries are confidence: derived and
#   carry velocity_source: "derived from platen rpm, R_cc=0.13 m (assumed)".
#   Treat absolute Kp inversions from them as +/- a factor of ~2.
# =====================================================================

meta:
  abrasive: SiO2
  morphologies: [colloidal_silica, fumed_silica]
  rate_unit_convention: "nm/min (patent Angstrom/min divided by 10)"
  pressure_unit: psi
  created: 2026-09-24
  schema_version: 1

# =====================================================================
colloidal_silica:

  properties:
    description: >
      Wet-chemistry (ion-exchange / sol-gel) silica: discrete, near-spherical,
      amorphous primary particles, narrow PSD, low aggregate content.
    manufacturing_route:
      value: "ion exchange of alkali silicate / dissolved fumed silica, then controlled nucleation-growth in the liquid phase"
      source: "US8211193B2 (Fujifilm Planar Solutions), claims + spec, via freepatentsonline.com/8211193.html"
      confidence: literature
    primary_particle_size_range_nm:
      value: [2, 100]
      unit: nm
      source: "US8211193B2"
      confidence: literature
    mean_particle_size_range_nm:
      value: [10, 200]
      unit: nm
      source: "US8211193B2"
      confidence: literature
    shape:
      value: spherical
      source: "Kim 2018, IntechOpen review chapter, DOI 10.5772/intechopen.75408, section 'Silica abrasive'"
      confidence: literature
      note: "review chapter (secondary); used for qualitative shape only"
    na_impurity_ppm:
      value: "<1"
      unit: ppm
      source: "US8211193B2"
      confidence: literature
    hardness_gpa:
      value: 7.3
      uncertainty: 0.3
      unit: GPa
      method: "Vickers, room temperature, FUSED (bulk amorphous) silica"
      source: "Michel, Serbena, Lepienski, J. Non-Cryst. Solids 352, 3550-3555 (2006), DOI 10.1016/j.jnoncrysol.2006.02.113"
      confidence: unverified
      note: >
        Abstract/secondary summary only — full text is paywalled and was NOT read;
        and the specimen is bulk fused silica, not a CMP nanoparticle. Morphology
        (colloidal vs fumed) is NOT resolved by this number.
        TODO(owner): measure or source nanoindentation hardness of actual
        colloidal silica particles if the Hertz/indentation term is to be trusted.
    youngs_modulus_gpa:
      value: 72
      unit: GPa
      source: "cross-reference standard value for fused silica cited in knowledge/cmp/abrasive-hardness-hertz-indentation-removal-volume.md; not from a primary measurement in this corpus"
      confidence: unverified
      note: "TODO(owner): replace with a primary citation (E of amorphous SiO2)."
    density_g_cm3:
      value: null
      unit: g/cm3
      source: null
      confidence: unverified
      note: "TODO(owner): no primary source for colloidal-silica particle density found in the local corpus. Bulk amorphous SiO2 ~2.2 g/cm3 is common knowledge but was not sourced here."
    iep_ph:
      value: "<2.0"
      unit: pH
      method: "zeta potential vs pH, Fig.3"
      source: "Choi, Lee, Singh, Electrochem. Solid-State Lett. 7(7) G141-G144 (2004), DOI 10.1149/1.1738472 (Levasil 50CK, D50 ~110 nm)"
      confidence: literature

