  conc_exponent:
    # MRR ~ C^n, fitted in log-log space by least squares on the raw pairs below.
    oxide_teos:
      raw_pairs_wt_pct_nm_per_min:
        at_1p5_psi: [[0.5, 94.0], [1.0, 110.0], [1.5, 113.0], [2.0, 117.0], [2.5, 120.0], [3.0, 124.0]]
        at_3p0_psi: [[0.5, 140.0], [1.0, 207.0], [1.5, 226.0], [2.0, 229.0], [2.5, 243.0], [3.0, 248.0]]
        at_4p0_psi: [[0.5, 135.0], [1.0, 256.0], [1.5, 294.0], [2.0, 314.0], [2.5, 319.0]]
        at_5p0_psi: [[1.0, 269.0], [1.5, 348.0], [2.0, 363.0], [2.5, 386.0], [3.0, 403.0]]
      fitted_value:
        at_1p5_psi: 0.145
        at_3p0_psi: 0.303
        at_4p0_psi: 0.534
        at_5p0_psi: 0.350
      r2:
        at_1p5_psi: 0.961
        at_3p0_psi: 0.894
        at_4p0_psi: 0.891
        at_5p0_psi: 0.922
      piecewise_at_3psi:
        below_knee_0p5_to_1p0_wt_pct: 0.564
        above_knee_1p5_to_3p0_wt_pct: 0.144
      source: "US9499721B2 Example 18 / TABLE 18 (54 nm aminosilane core-shell colloidal silica, pH 4.7, IC1010, 100 rpm, 150 mL/min); fit performed here (numpy polyfit on ln C vs ln MRR)"
      confidence: derived
      note: >
        A single power law does NOT describe this series: the exponent drops from
        ~0.56 below 1 wt% to ~0.14 above 1.5 wt%. The pooled per-pressure values
        (0.15-0.53) straddle the classic 1/3. Use the piecewise form, or better,
        a saturating form (see `saturation`). The 4 psi row also contains an
        inversion at 0.5 wt% (135 nm/min at 4 psi < 140 nm/min at 3 psi) =
        abrasive starvation, which no power law can express.
    cu:
      raw_pairs_wt_pct_nm_per_min:
        at_ph3: [[1.0, 43.4], [2.0, 59.7], [3.0, 70.5], [4.0, 80.1]]
        at_ph4: [[1.0, 48.8], [2.0, 53.7], [3.0, 61.7], [4.0, 64.4]]
        at_ph5: [[1.0, 41.2], [2.0, 48.3], [3.0, 52.8], [4.0, 56.5]]
        at_ph6: [[1.0, 34.2], [2.0, 39.3], [3.0, 45.1], [4.0, 52.0]]
      fitted_value:
        at_ph3: 0.441
        at_ph4: 0.208
        at_ph5: 0.227
        at_ph6: 0.293
      r2:
        at_ph3: 0.999
        at_ph4: 0.963
        at_ph5: 1.000
        at_ph6: 0.959
      source: "US20080090500A1 Example 4 / TABLE 4 (9.8 psi, 60 rpm, glycine 1 wt% + BTA 1 mM + H2O2 3 wt%); fit performed here"
      confidence: derived
      note: >
        Median n = 0.26, i.e. clearly sub-linear and near the 1/3 cube-root
        regime. The zero-abrasive row of the same table (0 wt% -> 25.9 / 10.6 /
        17.6 / 15.1 nm/min at pH 3/4/5/6) is chemical etch and was EXCLUDED from
        the fit (ln 0 undefined); a correct model needs MRR = chem + k*C^n.
    w:
      raw_pairs_wt_pct_nm_per_min: null
      fitted_value: 0.333
      r2: null
      source: "Wang, Peng, Xia, Kitajima, Tsai, 'Removal Mechanism of Tungsten CMP Process', ECS Trans. 41(43) 103-111 (2012), DOI 10.1149/1.4717508 — abstract and Analysis section: 'The removal rate was observed to scale with the cubic root of the abrasive concentration'; Fig.6(b) shows a linear fit vs C^(1/3)"
      confidence: literature
      note: >
        The exponent is stated by the authors and supported by their Fig.6(b)
        linearisation, but the underlying (wt%, rate) pairs are only in Fig.5(a) /
        6(a) as graphs — not in the text and not digitised here. r2 unknown.
        Also: the paper does not state the abrasive chemistry, so its assignment
        to colloidal silica is NOT established.
        TODO(owner): digitise ECS Trans. 41(43) Fig.6(a) or replace with a W
        concentration series whose abrasive type is explicit.
    poly_si:
      raw_pairs_wt_pct_nm_per_min: null
      fitted_value: null
      r2: null
      source: null
      confidence: unverified
