    - id: missing_comparisons
      note: >
        NOT FOUND, despite targeted searching: any study polishing blanket
        oxide, W, Cu, SiC or sapphire with zirconia AND silica AND ceria AND
        alumina at matched particle size, matched loading, same tool and same
        recipe. The US5575885 table is the closest thing that exists and its
        sizes are unmatched. Treat the absence of a size-matched cross-abrasive
