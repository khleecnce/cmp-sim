
# =====================================================================
# CMP-Sim research dossier: ZIRCONIA (ZrO2) as a CMP abrasive
# + abrasive hardness / modulus comparison table (ranking fallback basis)
# =====================================================================
# Contract for every numeric entry:
#   value / unit / source (DOI | patent no | URL) / confidence / note
#   literature  - read from a peer-reviewed / standards source actually fetched
#   vendor      - manufacturer or supplier datasheet / technical compilation
#   derived     - computed from a sourced value by an explicit stated relation
#   unverified  - NOT sourced. value is null, note starts with TODO(owner)
#
# Nothing here was interpolated or invented. Where a number was wanted but
# could not be pinned to a source that was actually opened and read, the value
# is null with a TODO(owner) note naming exactly what is missing.
# =====================================================================

meta:
  schema_version: 1
  compiled_on: "2026-09-24"
  compiled_by: "CMP-Sim literature pass (open-access + Wayback-recovered sources only)"
  scope: "zirconia abrasive dossier + cross-abrasive hardness/modulus table"
  do_not_edit_note: >
    This file is additive research input. It deliberately does NOT modify
    cmp_sim/data/params/abrasives.yaml. The zirconia block there currently has
    density/hardness/modulus = null; the values in this file are candidates for
    the owner to promote, WITH their polymorph labels intact.
  search_provenance: >
    Local corpus /Users/khleecnce/fab-sim/papers (306 files, PDF/TXT/XML/HTML
    incl. patents/) was full-text scanned with pymupdf for
    /ZrO2|zirconi|Zirconi|YSZ/. 13 files matched. Of those, only THREE carry
    zirconia-as-abrasive data: US5575885 (Cu rate table), overpolish-dishing-jss
    (= Srinivasan STI review, zirconia reverse selectivity 78), and prasad2006
    (qualitative "high nitride rates with ZrO2"). The other 10 hits are zirconia
    MILLING MEDIA, zirconia as a tribology composite, or reference lists citing
    the Hanyang ZrO2/W papers. Local /Users/khleecnce/fab-sim/knowledge mentions
    zirconia only as a slurry TYPE enum option and in the high-k note (ZrO2 as
    FILM, not abrasive). Web pass then used MDPI / IOP / Springer /
    ScienceDirect / PMC / NIST / NTRS with Wayback recovery for 403 walls.
    Conclusion: zirconia IS a minor CMP abrasive. Two groups dominate the
    primary literature (Hanyang / Park J-G on W-CMP; Clarkson / Babu on nitride
    reverse selectivity). No vendor datasheet with CMP-grade D50 and no
    published concentration or size series for ZrO2 abrasive was found.

# =====================================================================
zirconia:

  material: ZrO2
  cmp_status: >
    Minor / niche CMP abrasive. Documented production-relevant use is tungsten
    CMP (harder than colloidal silica, so it cuts the WO3 passivation layer
    faster) and nitride-selective (reverse-selectivity) dielectric slurries.
    It is NOT a mainstream oxide abrasive; ZrO2 far more often appears in the
    CMP literature as MILLING MEDIA or as the POLISHED SUBSTRATE.
  cmp_status_sources:
    - "https://doi.org/10.1149/2162-8777/ab915c"
    - "https://doi.org/10.1149/2.0071511jss"
    - "https://doi.org/10.5772/intechopen.75408"

  # -------------------------------------------------------------------
  # 1. PHYSICAL PROPERTIES, KEPT SEPARATE PER POLYMORPH
  # -------------------------------------------------------------------
  polymorph_warning:
    severity: critical
    rule: >
      Never merge monoclinic (m, baddeleyite, P2_1/c), tetragonal (t, incl.
      3Y-TZP) and cubic / high-yttria (4Y, 5Y) zirconia into one 'zirconia'
      property row. Hardness spans roughly 12-14.4 GPa and modulus roughly
      199-220 GPa across the stabilised phases, and the published CMP abrasives
      are specifically MONOCLINIC while nearly all published hardness/modulus
      data are for SINTERED TETRAGONAL (dental/structural) ceramics. Polishing
      itself drives t -> m transformation at the surface, so a measured hardness
      is a function of surface history, not of the bulk label.
    polishing_induced_transformation:
      finding: >
        All four commercial Y-TZP grades tested contained ZERO monoclinic phase
        before polishing and 5.3-10.8 vol% monoclinic after polishing, with a
        corresponding reduction in the cubic fraction. Polished surfaces of
        3Y / 4Y / 5Y grades then converged to similar Vickers hardness because
        the surface phase was predominantly monoclinic in every case.
      source: "https://pmc.ncbi.nlm.nih.gov/articles/PMC12299099/"
      confidence: literature

  polymorphs:

    monoclinic:
      aliases: [m-ZrO2, baddeleyite]
      space_group: P2_1/c
      relevance: >
        THIS is the phase used in the published ZrO2 CMP abrasives - both
        Hanyang W-CMP papers state 'monoclinic crystallized' /
        'monoclinic crystal structure'.
      relevance_sources:
        - "https://doi.org/10.1149/2162-8777/ab915c"
        - "https://pmc.ncbi.nlm.nih.gov/articles/PMC8706925/"
      properties:

        density_kg_m3:
          value: 5680
          unit: kg/m^3
          source: "https://doi.org/10.3762/bjnano.6.4"
          confidence: literature
          note: >
            5.68 g/cm3 quoted as the bulk monoclinic-phase density, used in that
            paper as the reference against which the measured nanoparticle
            densities are compared.

        density_nanoparticle_kg_m3:
          value: [5220, 5870]
          unit: kg/m^3
          source: "https://doi.org/10.3762/bjnano.6.4"
          confidence: literature
          note: >
            MEASURED, size-dependent: 5.22 +/- 0.07 g/cm3 at 11 nm crystallite
            (97 m2/g) rising to 5.87 +/- 0.02 g/cm3 at 72 nm. Cause is a
            Zr(OH)x surface layer ~0.62 nm thick (hydroxide density 3.25 g/cm3)
            which becomes a large volume fraction below ~50 nm. CRITICAL for
            CMP: a 23-40 nm CMP abrasive does NOT have bulk density. Use
            ~5.2-5.5 g/cm3 for number-density / volume-fraction conversions at
            CMP sizes, not 5.68, or particle counts will be biased high.

        hardness_gpa:
          value: null
          unit: GPa
          source: null
          confidence: unverified
          note: >
            TODO(owner): no indentation hardness for PHASE-PURE monoclinic ZrO2
            was found in an accessible source. What IS sourced and adjacent:
            (a) polished Y-TZP surfaces whose top layer is predominantly
            monoclinic give Vickers hardness in the same band as the tetragonal
            parent (https://pmc.ncbi.nlm.nih.gov/articles/PMC12299099/);
            (b) the CMP paper that uses monoclinic ZrO2 abrasive states its
            hardness only on the MOHS scale (8.0) - see mohs_hardness below.
            Measure by nanoindentation on your own abrasive lot before using a
            hardness-ratio model.

        mohs_hardness:
          value: 8.0
          unit: Mohs
          source: "https://doi.org/10.1149/2162-8777/ab915c"
          confidence: literature
          note: >
            Stated as the reason to choose ZrO2 over silica for W CMP:
            colloidal crystalline ZrO2 Mohs 8.0 vs colloidal amorphous SiO2
            Mohs 6.0-7.0, W film Mohs 7.5, WO3 layer Mohs 5.0-7.0. CAUTION: the
            published sentence writes these Mohs numbers with the unit 'GPa'
            ('Mohs hardness of 8.0 GPa'), which is a unit error in the paper -
            Mohs is dimensionless. Treat as an ORDINAL ranking
            (ZrO2 > W > SiO2 > WO3), never as a GPa value.

        youngs_modulus_gpa:
          value: 217.3
          unit: GPa
          source: "https://doi.org/10.2991/emim-17.2017.206"
          confidence: derived
          note: >
            DERIVED from the DFT-GGA polycrystalline moduli of m-ZrO2 in that
            paper (B = 177.267 GPa, G = 83.841 GPa) via the isotropic identity
            E = 9BG/(3B+G) = 217.3 GPa (implied Poisson ratio 0.296). This is a
            CALCULATED, not measured, modulus; GGA typically overestimates cell
            volume and so softens elastic constants slightly.

        bulk_modulus_gpa:
          value: 177.3
          unit: GPa
          source: "https://doi.org/10.2991/emim-17.2017.206"
          confidence: literature

        shear_modulus_gpa:
          value: 83.8
          unit: GPa
          source: "https://doi.org/10.2991/emim-17.2017.206"
          confidence: literature

        poissons_ratio:
          value: 0.296
          unit: dimensionless
          source: "https://doi.org/10.2991/emim-17.2017.206"
          confidence: derived
          note: "nu = (3B-2G)/(2(3B+G)) from the same B and G."

    tetragonal_3y_tzp:
      aliases: [t-ZrO2, 3Y-TZP, yttria-tetragonal-zirconia-polycrystal]
      stabiliser: "3 mol% Y2O3"
      relevance: >
        Best-measured zirconia mechanical properties, but this is a SINTERED
        STRUCTURAL ceramic, not a CMP abrasive particle.
      properties:

        density_kg_m3:
          value: null
          unit: kg/m^3
          source: null
          confidence: unverified
          note: >
            TODO(owner): the source reports RELATIVE density (99% of
            theoretical), not an absolute g/cm3. Theoretical t-ZrO2 density was
            not verified from a primary source in this pass.

        hardness_gpa:
          value: 14.4
          unit: GPa
          source: "https://www.mdpi.com/2571-6131/3/1/7"
          confidence: literature
          note: >
            Vickers HV = 14.4 +/- 0.3 GPa, monolithic 3Y-TZP at 99% of
            theoretical density, spark-plasma-sintered, 10 indents averaged
            (Table 1). Polished surface was 99 vol% tetragonal / 1 vol%
            monoclinic, so this is a genuinely tetragonal measurement.

        hardness_alt_gpa:
          value: 14
          unit: GPa
          source: "https://www.mdpi.com/2079-4991/10/11/2097"
          confidence: literature
          note: >
            Independent 3Y-TZP pellet: hardness ~14 GPa, elastic modulus
            ~220 GPa. Consistent with the 14.4 / 199 pair above.

        youngs_modulus_gpa:
          value: 199
          unit: GPa
          source: "https://www.mdpi.com/2571-6131/3/1/7"
          confidence: literature
          note: >
            199 +/- 4 GPa measured on the same 99%-dense monolithic 3Y-TZP. The
            same paper also quotes E_ZrO2 = 200 GPa as a literature input value,
            and an independent pellet gives ~220 GPa (10.3390/nano10112097) -
            carry 199-220 GPa as the real band.

        youngs_modulus_band_gpa:
          value: [199, 220]
          unit: GPa
          source: "https://www.mdpi.com/2079-4991/10/11/2097"
          confidence: literature

        fracture_toughness_mpa_m05:
          value: 3.8
          unit: MPa*m^0.5
          source: "https://www.mdpi.com/2571-6131/3/1/7"
          confidence: literature
          note: >
            3.8 +/- 0.1 MPa*m^0.5, SENB. Relevant to whether the abrasive
            fractures or ploughs.

        flexural_strength_mpa:
          value: 1071
          unit: MPa
          source: "https://www.mdpi.com/2571-6131/3/1/7"
          confidence: literature
          note: "1071 +/- 99 MPa biaxial."

    yttria_stabilised_high_y:
      aliases: [4Y-TZP, 5Y-TZP, YSZ, partially-cubic zirconia]
      relevance: >
        Higher-yttria grades - softer and more cubic. Included because 'YSZ' in
        a slurry spec could mean any of these.
      properties:

        hardness_gpa:
          value: [12.2, 12.9]
          unit: GPa
          source: "https://pmc.ncbi.nlm.nih.gov/articles/PMC12299099/"
          confidence: literature
          note: >
            Vickers hardness 12.2-12.9 GPa quoted for 4Y-TZP and 5Y-TZP (stated
            in that paper's introduction as a comparison against tooth enamel
            3-6 GPa, i.e. it is a SECONDARY citation inside an open-access
            paper, not that paper's own measurement). Lower than the 14.4 GPa of
            3Y-TZP - consistent with more cubic phase. Grain size AND porosity
            both increase with yttria content in the same study.

        youngs_modulus_gpa:
          value: null
          unit: GPa
          source: null
          confidence: unverified
          note: >
            TODO(owner): no modulus for 4Y/5Y specifically was verified. Do not
            copy the 3Y value - the phase fraction differs.

        density_kg_m3:
          value: null
          unit: kg/m^3
          source: null
          confidence: unverified
          note: >
            TODO(owner): not sourced. Porosity rises with yttria content in the
            cited study, so an as-sintered density would not transfer to a
            particle anyway.

  # -------------------------------------------------------------------
  # 2. SURFACE CHARGE
  # -------------------------------------------------------------------
  surface_charge:

    iep_ph_model:
      value: [10.0, 11.0]
      unit: pH
      source: "https://doi.org/10.1039/d6ra00388e"
      confidence: literature
      note: >
        Modelled / compiled point of zero charge for ZrO2 given as pH 10.0-11.0
        (dominant surface species Zr(OH)4). Doping shifts it by up to ~1 pH unit.

    iep_ph_measured_undispersed:
      value: 8.96
      unit: pH
      source: "https://doi.org/10.1186/s11671-015-1130-x"
      confidence: literature
      note: >
        MEASURED by electrokinetic sonic amplitude on a 2 vol% nano-ZrO2
        suspension with NO dispersant: pH_IEP = 8.96. Lower than the modelled
        10-11 band. Use the measured value for slurry work.

    iep_ph_with_dispersant:
      value: [3.61, 4.83]
      unit: pH
      source: "https://doi.org/10.1186/s11671-015-1130-x"
      confidence: literature
      note: >
        SAME powder, same instrument: adding an anionic polyelectrolyte
        (Dolapix CE64) moved pH_IEP from 8.96 to 4.83 (1.0 mass%) and to 3.61
        (1.4 mass%). A 5 pH-unit shift from the dispersant alone. ENGINE
        IMPLICATION: for a real dispersed ZrO2 CMP slurry the bare-oxide IEP is
        nearly meaningless - the adsorbed polycarboxylate sets the charge. Both
        published ZrO2 W-CMP slurries use exactly such a polycarboxylic-acid
        dispersant.

    zeta_potential_in_w_cmp_slurry_mv:
      value: 5.09
      unit: mV
      source: "https://doi.org/10.1149/2162-8777/ab915c"
      confidence: literature
      note: >
        +5.09 mV for the 23 nm monoclinic ZrO2 abrasive in the actual W-CMP
        slurry titrated to pH 2.3 with no catalyst. Only weakly positive despite
        being ~6 pH units below the bare-oxide IEP, because of the adsorbed
        anionic dispersant. Adding K3Fe(C2O4)3 drives it through zero to
        negative as (C2O4)2- adsorbs.

    zeta_potential_second_study_mv:
      value: [5.5, -13.5]
      unit: mV
      source: "https://pmc.ncbi.nlm.nih.gov/articles/PMC8706925/"
      confidence: literature
      note: >
        Independent confirmation on a 40 nm monoclinic ZrO2 W-CMP slurry at
        pH 2: zeta of the ZrO2 goes +5.5 -> +1.4 -> -13.5 mV as scavenger
        (etidronic acid) rises 0 -> 0.25 wt%. W-film (WO3) zeta tracks it:
        +20.3 -> +1.4 -> -10.4 mV. Removal rate follows the electrostatic force,
        not the particle count.

  # -------------------------------------------------------------------
  # 3. PARTICLE SIZE ACTUALLY USED
  # -------------------------------------------------------------------
  particle_size:

    typical_d50_nm:
      value: null
      unit: nm
      source: null
      confidence: unverified
      note: >
        TODO(owner): no vendor datasheet D50 for a CMP-grade zirconia slurry was
        obtained (Saint-Gobain's zirconia CMP particle page is behind a
        Cloudflare browser check with no Wayback copy; the SEMITECH zirconia CMP
        page likewise has no archive copy). What IS sourced are the as-used
        sizes below. Do not invent a 'typical' D50.

    primary_size_used_in_literature_nm:
      value: [23, 40]
      unit: nm
      source: "https://doi.org/10.1149/2162-8777/ab915c"
      confidence: literature
      note: >
        23 nm average PRIMARY diameter, monoclinic, rounded crystalline fringe
        (Seo 2020). The companion study used 40 nm primary
        (10.3390/nano11123296 / PMC8706925). Both are colloidal, both
        monoclinic, both W-CMP.

    secondary_agglomerate_size_nm:
      value: 114
      unit: nm
      source: "https://doi.org/10.1149/2162-8777/ab915c"
      confidence: literature
      note: >
        Secondary (agglomerate) size stayed ~114 nm independent of catalyst
        concentration, which the authors read as good dispersion stability. So
        the working ZrO2 population is a 23 nm primary inside a ~114 nm
        secondary - a ~5x ratio. Feeding 23 nm as the contact radius will
        overestimate particle count by ~2 orders of magnitude.

    coarse_abrasive_size_nm:
      value: 1100
      unit: nm
      source: "US5575885"
      confidence: literature
      note: >
        1100 nm mean grain size zirconia in the 1996 Toshiba Cu-slurry patent -
        a lapping-grade size, not a modern CMP colloid. Keep separate from the
        23-40 nm colloids.

    oxidizer_pot_life_coupling:
      finding: >
        The ZrO2 secondary size is unstable once H2O2 is mixed in: it grows
        abruptly after a characteristic 'H2O2 pot lifetime', which rose linearly
        from 47 h to 1401 h as a phosphite scavenger went 0 -> 0.25 wt%.
      source: "https://pmc.ncbi.nlm.nih.gov/articles/PMC8706925/"
      confidence: literature
      note: >
        Model implication: for ZrO2 + Fenton chemistry, D50 is time-dependent.
        A static PSD input is wrong beyond the pot lifetime.

  # -------------------------------------------------------------------
  # 4. MEASURED BLANKET REMOVAL-RATE ANCHORS
  # -------------------------------------------------------------------
  film_anchors:

    - id: seo2020_w_zro2_peak
      film: w
      abrasive: "monoclinic colloidal ZrO2"
      rate:
        value: 987
        unit: A/min
        source: "https://doi.org/10.1149/2162-8777/ab915c"
        confidence: literature
      rate_nm_per_min:
        value: 98.7
        unit: nm/min
        source: "https://doi.org/10.1149/2162-8777/ab915c"
        confidence: derived
        note: "987 A/min / 10. Peak W rate at the optimum catalyst concentration."
      conditions:
        abrasive_conc_wt_pct:
          value: 1.2
          unit: wt%
          source: "https://doi.org/10.1149/2162-8777/ab915c"
          confidence: literature
        d50_nm:
          value: 23
          unit: nm
          source: "https://doi.org/10.1149/2162-8777/ab915c"
          confidence: literature
          note: "average PRIMARY diameter; secondary ~114 nm"
        ph:
          value: 2.3
          unit: pH
          source: "https://doi.org/10.1149/2162-8777/ab915c"
          confidence: literature
          note: "titrated with HNO3"
        oxidizer:
          value: "H2O2 1.5 wt%"
          unit: wt%
          source: "https://doi.org/10.1149/2162-8777/ab915c"
          confidence: literature
        catalyst:
          value: "K3Fe(C2O4)3 0.03 wt% (potassium ferric oxalate, Fenton)"
          unit: wt%
          source: "https://doi.org/10.1149/2162-8777/ab915c"
          confidence: literature
        dispersant:
          value: "polycarboxylic-acid anionic polymer 0.2 wt%"
          unit: wt%
          source: "https://doi.org/10.1149/2162-8777/ab915c"
          confidence: literature
        pressure_psi:
          value: 6
          unit: psi
          source: "https://doi.org/10.1149/2162-8777/ab915c"
          confidence: literature
        platen_rpm:
          value: 70
          unit: rpm
          source: "https://doi.org/10.1149/2162-8777/ab915c"
          confidence: literature
        carrier_rpm:
          value: 70
          unit: rpm
          source: "https://doi.org/10.1149/2162-8777/ab915c"
          confidence: literature
        velocity_m_s:
          value: null
          unit: m/s
          source: null
          confidence: unverified
          note: >
            TODO(owner): not derivable - the samples were 6 cm x 6 cm coupons
            cut from 8-inch wafers, and no head-to-platen centre offset is
            given, so relative velocity cannot be computed from 70/70 rpm alone.
        pad:
          value: "IC1000/Suba IV (Rohm and Haas)"
          unit: null
          source: "https://doi.org/10.1149/2162-8777/ab915c"
          confidence: literature
        slurry_flow_ml_min:
          value: 100
          unit: mL/min
          source: "https://doi.org/10.1149/2162-8777/ab915c"
          confidence: literature
        polish_time_s:
          value: 60
          unit: s
          source: "https://doi.org/10.1149/2162-8777/ab915c"
          confidence: literature
        tool:
          value: "POLI-300 (G&P Technology), 6x6 cm coupons from 8-inch wafers"
          unit: null
          source: "https://doi.org/10.1149/2162-8777/ab915c"
          confidence: literature
        film_stack:
          value: "Si / SiO2 100 nm / TiN 100 nm / W 600 nm"
          unit: null
          source: "https://doi.org/10.1149/2162-8777/ab915c"
          confidence: literature
      rate_measurement_method: "sheet resistance by four-point probe (W); ellipsometry (SiO2)"
      companion_points:
        w_rate_low_catalyst_A_min:
          value: 55
          unit: A/min
          source: "https://doi.org/10.1149/2162-8777/ab915c"
          confidence: literature
          note: "at 0.001 wt% catalyst"
        w_rate_high_catalyst_A_min:
          value: 300
          unit: A/min
          source: "https://doi.org/10.1149/2162-8777/ab915c"
          confidence: literature
          note: "at 1.0 wt% catalyst - corrosion-dominant regime, rate collapses"
        sio2_rate_A_min:
          value: 448
          unit: A/min
          source: "https://doi.org/10.1149/2162-8777/ab915c"
          confidence: literature
          note: >
            SAME slurry, SAME tool, blanket 700 nm SiO2 wafer: 448 A/min
            sustained at 0.001-0.005 wt% catalyst, falling to 104 A/min at
            0.1 wt% and saturating at 91 A/min. This is a genuine ZrO2-on-oxide
            blanket anchor at pH 2.3.
        static_etch_rate_w_A_min:
          value: [212, 336]
          unit: A/min
          source: "https://doi.org/10.1149/2162-8777/ab915c"
          confidence: literature
          note: >
            W static etch rate at 70 C, 3 min, over the catalyst range - i.e. a
            large fraction of the W 'removal' is chemical, not abrasive. Do not
            attribute all 987 A/min to mechanics.
        roughness_at_peak:
          value: "Rq 2.0 nm, Rp-to-v 20.3 nm (AFM 2x2 um) at 0.03 wt%; Rq 1.5 nm at 0.05 wt%"
          unit: nm
          source: "https://doi.org/10.1149/2162-8777/ab915c"
          confidence: literature
      derived_selectivity_w_over_oxide:
        value: 2.2
        unit: dimensionless
        source: "https://doi.org/10.1149/2162-8777/ab915c"
        confidence: derived
        note: >
          987 / 448 = 2.2 at the W-rate peak. CAUTION: the two rates peak at
          DIFFERENT catalyst concentrations, so the true maximum selectivity in
          that paper is higher than this single-point ratio; the paper plots
          selectivity as its own curve.
      caveat: >
        Rate is Fenton-catalyst-limited, NOT abrasive-limited. Abrasive
        concentration was FIXED at 1.2 wt% throughout, so this paper yields no
        concentration exponent.

    - id: kim2021_w_zro2_no_scavenger
      film: w
      abrasive: "monoclinic colloidal ZrO2"
      rate:
        value: 110.1
        unit: nm/min
        source: "https://pmc.ncbi.nlm.nih.gov/articles/PMC8706925/"
        confidence: literature
        note: >
          W rate with zero scavenger; falls linearly to 17.8 nm/min at 0.25 wt%
          scavenger.
      conditions:
        abrasive_conc_wt_pct:
          value: 1.0
          unit: wt%
          source: "https://pmc.ncbi.nlm.nih.gov/articles/PMC8706925/"
          confidence: literature
          note: "then diluted 1:1 with DIW before use, so ~0.5 wt% at the pad"
        d50_nm:
          value: 40
          unit: nm
          source: "https://pmc.ncbi.nlm.nih.gov/articles/PMC8706925/"
          confidence: literature
          note: "primary abrasive size"
        ph:
          value: 2
          unit: pH
          source: "https://pmc.ncbi.nlm.nih.gov/articles/PMC8706925/"
          confidence: literature
          note: "HNO3 titrant"
        oxidizer:
          value: "H2O2 1.5 wt%"
          unit: wt%
          source: "https://pmc.ncbi.nlm.nih.gov/articles/PMC8706925/"
          confidence: literature
        catalyst:
          value: "Fe(NO3)3 0.15 wt%"
          unit: wt%
          source: "https://pmc.ncbi.nlm.nih.gov/articles/PMC8706925/"
          confidence: literature
        pressure_psi:
          value: 3
