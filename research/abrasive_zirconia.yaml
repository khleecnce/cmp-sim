  # 6. COMPARATIVE STUDIES (same tool, same recipe) -> RELATIVE RATE FACTOR
  # -------------------------------------------------------------------
  comparative_studies:

    - id: us5575885_four_abrasive_cu_comparison
      status: >
        STRONGEST comparative anchor found. Same tool, same pad, same load, same
        chemistry, four abrasives + a no-abrasive control.
      source: "US5575885"
      confidence: literature
      film: cu
      fixed_conditions: "0.1 wt% aminoacetic acid + 13 wt% H2O2; ~9 wt% abrasive; SUBA800 pad; 400 g/cm2 (5.69 psi); 100 rpm counter-rotation; 12.5 mL/min"
      rates_nm_per_min:
        alumina:
          value: 98.5
          unit: nm/min
          source: "US5575885"
          confidence: literature
          note: "740 nm mean grain size"
        colloidal_silica:
          value: 35.3
          unit: nm/min
          source: "US5575885"
          confidence: literature
          note: "30 nm mean grain size"
        ceria:
          value: 31.1
          unit: nm/min
          source: "US5575885"
          confidence: literature
          note: "1300 nm mean grain size"
        zirconia:
          value: 22.1
          unit: nm/min
          source: "US5575885"
          confidence: literature
          note: "1100 nm mean grain size"
        none:
          value: 10.0
          unit: nm/min
          source: "US5575885"
          confidence: literature
          note: >
            abrasive-free control - so ~45% of the zirconia 'rate' is pure
            chemistry.
      relative_rate_factor_vs_silica:
        alumina:
          value: 2.79
          unit: dimensionless
          source: "US5575885"
          confidence: derived
          note: "98.5/35.3"
        colloidal_silica:
          value: 1.00
          unit: dimensionless
          source: "US5575885"
          confidence: derived
          note: "reference"
        ceria:
          value: 0.88
          unit: dimensionless
          source: "US5575885"
          confidence: derived
          note: "31.1/35.3"
        zirconia:
          value: 0.63
          unit: dimensionless
          source: "US5575885"
          confidence: derived
          note: >
            22.1/35.3 - on Cu, zirconia is the SLOWEST of the four abrasives
            tested.
      abrasive_attributable_factor_vs_silica:
        method: "(rate_abrasive - rate_none) / (rate_silica - rate_none), i.e. subtract the 10.0 nm/min chemical floor first"
        alumina:
          value: 3.50
          unit: dimensionless
          source: "US5575885"
          confidence: derived
          note: "88.5/25.3"
        colloidal_silica:
          value: 1.00
          unit: dimensionless
          source: "US5575885"
          confidence: derived
        ceria:
          value: 0.83
          unit: dimensionless
          source: "US5575885"
          confidence: derived
          note: "21.1/25.3"
        zirconia:
          value: 0.48
          unit: dimensionless
          source: "US5575885"
          confidence: derived
          note: >
            12.1/25.3 - zirconia contributes less than half of silica's
            mechanical increment on Cu.
      hard_caveat: >
        THE PARTICLE SIZES ARE NOT MATCHED: silica 30 nm vs zirconia 1100 nm vs
        alumina 740 nm vs ceria 1300 nm. At equal mass loading (~9 wt%) the
        30 nm silica has a vastly larger particle NUMBER and total surface area
        than the 1100 nm zirconia. So this comparison conflates abrasive
        CHEMISTRY with abrasive SIZE and the ordering cannot be read as a pure
        hardness ranking. Note the internal evidence for that: alumina (740 nm)
        beats silica (30 nm) anyway, while ceria (1300 nm) loses to silica -
        consistent with hardness mattering on a metal and with size penalising
        the coarse powders. Use these factors as a ROUGH prior for Cu only, and
        label any simulator output that leans on them.

    - id: seo2020_zro2_vs_silica_hardness_rationale
      status: "Design-rationale comparison, not a head-to-head rate measurement."
      source: "https://doi.org/10.1149/2162-8777/ab915c"
      confidence: literature
      claim: >
        The stated reason for choosing ZrO2 over colloidal silica in W CMP is
        hardness: crystalline ZrO2 (Mohs 8.0) is harder than amorphous colloidal
        SiO2 (Mohs 6.0-7.0), while the W film is Mohs 7.5 and the WO3 layer it
        must cut is Mohs 5.0-7.0. So ZrO2 is the only one of the two that is
        reliably harder than BOTH the oxidised layer and the metal.
      what_is_missing: >
        TODO(owner): the paper does not run a silica control on the same tool,
        so no ZrO2:silica rate ratio on W can be extracted. That is the single
        most valuable missing measurement for this abrasive.

    - id: srinivasan2015_nitride_selectivity_table
      status: "Cross-abrasive comparison of REVERSE SELECTIVITY, compiled in one table by one review."
      source: "https://doi.org/10.1149/2.0071511jss"
      confidence: literature
      film_pair: "Si3N4 / SiO2"
      values:
        zirconia_no_additive:
          value: 78
          unit: dimensionless
          source: "https://doi.org/10.1149/2.0071511jss"
          confidence: literature
          note: "pH 4, NO additive"
        silica_with_arginine:
          value: 7
          unit: dimensionless
          source: "https://doi.org/10.1149/2.0071511jss"
          confidence: literature
          note: "2 wt% arginine in 10 wt% silica, pH 8"
        ceria_with_cationic_polymers:
          value: [4, 200]
          unit: dimensionless
          source: "https://doi.org/10.1149/2.0071511jss"
          confidence: literature
          note: "range across PEI, pDADMAC, PVP, PAD systems, pH 3.5-4.9"
        phosphate_functionalised_silica:
          value: [10, 30]
          unit: dimensionless
          source: "https://doi.org/10.1149/2.0071511jss"
          confidence: literature
          note: "pH 3-7, no additive"
      reading: >
        Zirconia is the best ADDITIVE-FREE reverse-selective abrasive in the
        table by a wide margin. This is the one film where zirconia has a
        genuine, documented competitive advantage over silica and ceria.
      caveat: >
        Selectivities only - the underlying absolute rates are in a non-open
        conference paper. Different tools per row; the review does not normalise.

    - id: park2008_mas_vs_dss
      status: "Within-paper comparison: diluted silica slurry with vs without added ZrO2."
      source: "https://doi.org/10.1016/j.mee.2007.12.049"
      confidence: literature
