  defect_character:
    value: null
    unit: null
    source: null
    confidence: unverified
    note: >
      TODO(owner): no scratch/defectivity study of zirconia abrasive was found.
      Sourced adjacent facts only: (a) at the W-rate optimum the ZrO2 slurry
      gave AFM Rq 2.0 nm / Rp-to-v 20.3 nm, improving to Rq 1.5 nm at slightly
      higher catalyst, i.e. it can finish well
      (https://doi.org/10.1149/2162-8777/ab915c); (b) the number of ZrO2
      abrasives remaining adsorbed on the W surface after CMP FALLS as the
      catalyst concentration rises, because the abrasive-film electrostatic
      force turns repulsive - so post-CMP particle defectivity for ZrO2 is
      chemistry-tunable (same source). Zirconia is harder than every film in the
      CMP-Sim film list except SiC and sapphire, so scratch risk should be
      assumed comparable to alumina until measured.

# =====================================================================
# SECOND DELIVERABLE: cross-abrasive hardness / modulus / density / IEP
# Underpins the hardness-ratio ranking fallback used when no rate anchor exists.
# =====================================================================
abrasive_property_table:

  usage_rule: >
    This table is for a RELATIVE ranking fallback only. A hardness ratio
    H_abrasive / H_film predicts whether indentation is even possible; it does
    NOT predict a rate, because chemical-tooth abrasives (ceria, and by
    classification zirconia) remove material faster than their hardness implies
    while inert hard abrasives (SiC, diamond) scratch rather than polish. Never
    rank ceria against silica on hardness alone - ceria is SOFTER than silica by
    Mohs yet polishes oxide ~3x faster.
  measurement_caveat: >
    Hardness values below are a MIXTURE of Vickers, Knoop and nanoindentation on
    BULK or SINTERED specimens. Nanoparticles are not bulk: hydrated surface
    layers, size effects and porosity all shift the numbers (measured directly
    for zirconia - see zirconia.polymorphs.monoclinic density entries). Treat
    every value as an upper bound on the effective particle hardness, and never
    compare a Knoop number to a Vickers number as if they were the same
    quantity.

  colloidal_silica:
    material: SiO2 (amorphous)
    hardness_gpa:
      value: 5.12
      unit: GPa
      source: "https://valleydesign.com/Datasheets/Corning-Fused-Silica-7980.pdf"
      confidence: derived
      note: >
        From Knoop 522 kg/mm^2 (100 g load) x 9.807e-3 GPa per kg/mm^2. KNOOP,
        not Vickers. Colloidal nanoparticles are more hydrated than bulk fused
        silica and are likely softer.
    youngs_modulus_gpa:
      value: 72.7
      unit: GPa
      source: "https://valleydesign.com/Datasheets/Corning-Fused-Silica-7980.pdf"
      confidence: vendor
      note: >
        Corning HPFS 7980. Cross-checked: an independent indentation paper
        tabulates SiO2 as E = 71 GPa, nu = 0.17, H = 9 GPa
        (https://doi.org/10.3390/cryst7120369) - note their 9 GPa hardness is
        higher than the Knoop-derived 5.12, a real method spread.
    density_kg_m3:
      value: 2201
      unit: kg/m^3
      source: "https://valleydesign.com/Datasheets/Corning-Fused-Silica-7980.pdf"
      confidence: vendor
    iep_ph:
      value: 1.80
      unit: pH
      source: "https://doi.org/10.1039/d6ra00388e"
      confidence: literature
      note: >
        Experimental PZC for SiO2. CMP vendor literature commonly quotes 2-3;
        carry 1.8-3 as the band.
    mohs_hardness:
      value: [6.0, 7.0]
      unit: Mohs
      source: "https://doi.org/10.1149/2162-8777/ab915c"
      confidence: literature
      note: >
        Colloidal AMORPHOUS SiO2 quoted as Mohs 6.0-7.0 in the ZrO2 W-CMP paper,
        for direct comparison with ZrO2 at 8.0.

  fumed_silica:
    material: SiO2 (pyrogenic, fused aggregates)
    hardness_gpa:
      value: 5.12
      unit: GPa
      source: "https://valleydesign.com/Datasheets/Corning-Fused-Silica-7980.pdf"
      confidence: derived
      note: >
        Same amorphous-SiO2 skeletal value (Knoop 522 kg/mm^2). Separately
        sourced: fumed AGGREGATES behave as HARDER contacts than polymer-core
        composites (https://doi.org/10.1149/1.2901864) because load concentrates
        on a few protruding primaries - effective contact stress, not material
        hardness, is what differs.
    youngs_modulus_gpa:
      value: 72.7
      unit: GPa
      source: "https://valleydesign.com/Datasheets/Corning-Fused-Silica-7980.pdf"
      confidence: vendor
    density_kg_m3:
      value: 2201
      unit: kg/m^3
      source: "https://valleydesign.com/Datasheets/Corning-Fused-Silica-7980.pdf"
      confidence: vendor
      note: >
        SKELETAL density. An aggregate's effective density is lower because of
        internal voids - do not use this for settling or for aggregate number
        density.
    iep_ph:
      value: 1.80
      unit: pH
      source: "https://doi.org/10.1039/d6ra00388e"
      confidence: literature

  ceria:
    material: CeO2
    hardness_gpa:
      value: 6.44
      unit: GPa
      source: "https://doi.org/10.3390/ma19102134"
      confidence: literature
      note: >
        Room-temperature nanoindentation, 6.44 +/- 0.72 GPa, dense sintered
        CeO2 (falls to 5.08 GPa at 400 C).
    youngs_modulus_gpa:
      value: 167.6
      unit: GPa
      source: "https://doi.org/10.3390/ma19102134"
      confidence: literature
      note: >
        167.6 +/- 12.5 GPa by nanoindentation. Independent fully-dense
        measurements give 213 +/- 6 GPa (nanoindentation) and 207 GPa (resonant
        ultrasound) - https://www.osti.gov/servlets/purl/1469554. The spread is
        porosity.
    density_kg_m3:
      value: 7215
      unit: kg/m^3
      source: "https://www.osti.gov/servlets/purl/1469554"
      confidence: literature
      note: >
        Theoretical density from the measured lattice parameter of
        stoichiometric CeO2.
    iep_ph:
      value: 8.0
      unit: pH
      source: "https://doi.org/10.5772/intechopen.75408"
      confidence: literature
      note: >
        ~pH 8 (positive below, negative above). Other compilations put it
        nearer 7.
    ranking_warning: >
      Ceria is SOFTER than alumina and comparable to silica, yet gives ~3x the
      oxide rate of silica because of the Si-O-Ce chemical tooth (~24
      abrasive-substrate collisions per SiO4 removed vs ~5e8 for silica,
      https://doi.org/10.1021/acs.langmuir.3c00304). This single row is the
      proof that a hardness-ratio ranking must be a FALLBACK, not a model.

  alpha_alumina:
    material: alpha-Al2O3 (corundum)
    hardness_gpa:
      value: 15.0
      unit: GPa
      source: "https://srdata.nist.gov/CeramicDataPortal/Pds/Scdaos"
      confidence: literature
      note: >
        NIST SRD 150, sintered alpha-Al2O3, Vickers 1 kg load, 20 C:
        15 +/- 2 GPa. Cross-check: an independent indentation study tabulates
        Al2O3 as E 400 GPa / H 22 GPa (https://doi.org/10.3390/cryst7120369) -
        single-crystal vs sintered.
    youngs_modulus_gpa:
      value: 416
      unit: GPa
      source: "https://srdata.nist.gov/CeramicDataPortal/Pds/Scdaos"
      confidence: literature
      note: >
        416 +/- 30 GPa at 20 C. Poisson 0.231, K_Ic 3.5 MPa*m^0.5 from the same
        source.
    density_kg_m3:
      value: 3984
      unit: kg/m^3
      source: "https://srdata.nist.gov/CeramicDataPortal/Pds/Scdaos"
      confidence: literature
      note: >
        3.984 +/- 0.002 g/cm3 at 20 C (Munro, J. Am. Ceram. Soc. 80:1919, 1997).
    iep_ph:
      value: 9.5
      unit: pH
      source: "https://doi.org/10.1016/j.mtcomm.2024.109962"
      confidence: literature
      note: >
        Zero zeta potential of washed alpha-Al2O3 at pH ~9.5; unwashed commonly
        8.5-9. Anionic additives shift it down.

  gamma_alumina:
    material: gamma-Al2O3 (defect-spinel transition alumina)
    hardness_gpa:
      value: 0.433
      unit: GPa
      source: "https://doi.org/10.1007/s42452-023-05388-7"
      confidence: literature
      note: >
        Nanoindentation (Berkovich, 200-400 uN) on GRANULAR gamma-alumina:
        0.433 GPa, i.e. ~35x SOFTER than alpha-Al2O3's 15 GPa. The same study
        reports a plasticity index of 0.83 (highly plastic, deforms without
        fracturing). CAVEAT: the specimen is a 1.7 mm granule built from ~17 nm
        nanoparticles, so this measures a POROUS GRANULE, not the intrinsic
        gamma-Al2O3 lattice - the true single-crystal gamma hardness is higher.
        It is nonetheless the right number for a porous transition-alumina
        agglomerate, and it confirms the qualitative rule that gamma must never
        inherit alpha's numbers.
    youngs_modulus_gpa:
      value: 12.6
      unit: GPa
      source: "https://doi.org/10.1007/s42452-023-05388-7"
      confidence: literature
      note: >
        12.6 GPa from the same nanoindentation set - ~33x lower than alpha's
        416 GPa. Same porous-granule caveat. Both H and E vary NON-monotonically
        with load over 200-400 uN.
    density_kg_m3:
      value: null
      unit: kg/m^3
      source: null
      confidence: unverified
      note: >
        TODO(owner): not verified. It is lower than alpha's 3984 kg/m^3 and, for
        a granule, lower again because of porosity. Do not reuse the alpha value.
    iep_ph:
      value: 7.5
      unit: pH
      source: "https://doi.org/10.1039/d6ra00388e"
      confidence: literature
      note: >
        PROXY: experimental PZC of gamma-AlO(OH) (boehmite, the hydrated
        gamma-route surface) is pH 7.5 (alpha-AlO(OH) is 7.7). This is the
        OXYHYDROXIDE, not anhydrous gamma-Al2O3. Flagged as a substitution, not
        a measurement of gamma-Al2O3.

  zirconia:
    material: ZrO2
    polymorph_note: >
      SEE zirconia.polymorphs above - these single cells are lossy by
      construction. The CMP abrasive is MONOCLINIC; the well-measured hardness
      is TETRAGONAL.
    hardness_gpa:
      value: 14.4
      unit: GPa
      source: "https://www.mdpi.com/2571-6131/3/1/7"
      confidence: literature
      note: >
        Vickers 14.4 +/- 0.3 GPa for monolithic TETRAGONAL 3Y-TZP at 99% of
        theoretical density. Use for ranking with an explicit label. For higher
        yttria (4Y/5Y) it is 12.2-12.9 GPa
        (https://pmc.ncbi.nlm.nih.gov/articles/PMC12299099/). The MONOCLINIC
        hardness - the phase actually used as the abrasive - is NOT sourced.
        Ordinal placement for monoclinic IS sourced: Mohs 8.0, above SiO2 (6-7)
        and W (7.5), below alpha-Al2O3.
    youngs_modulus_gpa:
      value: 199
      unit: GPa
      source: "https://www.mdpi.com/2571-6131/3/1/7"
      confidence: literature
      note: >
        199 +/- 4 GPa measured on 3Y-TZP; independent pellet ~220 GPa
        (https://www.mdpi.com/2079-4991/10/11/2097); DFT-derived monoclinic
        value 217 GPa (see zirconia.polymorphs.monoclinic). All three land in
        199-220 GPa, so the modulus is robust across polymorph even though
        hardness is not.
    density_kg_m3:
      value: 5680
      unit: kg/m^3
      source: "https://doi.org/10.3762/bjnano.6.4"
      confidence: literature
      note: >
        Bulk MONOCLINIC. For CMP-sized particles use the measured size-dependent
        values 5220-5870 kg/m^3 (11-72 nm) from the same source - at 23-40 nm
        the true density is near 5.3-5.5 g/cm3 because of the Zr(OH)x surface
        layer.
    iep_ph:
      value: 8.96
      unit: pH
      source: "https://doi.org/10.1186/s11671-015-1130-x"
      confidence: literature
      note: >
        MEASURED (electroacoustic, ESA) on dispersant-free nano-ZrO2. Modelled
        PZC is 10.0-11.0 (https://doi.org/10.1039/d6ra00388e); a polycarboxylate
        dispersant drops the measured IEP to 3.6-4.8. Carry the dispersant state
        with the number or it is meaningless.

  titania:
    material: TiO2
    polymorph_note: >
      Rutile and anatase differ substantially. Specify the polymorph or the row
      is meaningless.
    hardness_gpa:
      value: null
      unit: GPa
      source: null
      confidence: unverified
      note: >
        TODO(owner): no clean STOICHIOMETRIC rutile or anatase indentation
        hardness in GPa was obtained. What IS sourced: Vickers microhardness of
        H2-reduced single-crystal rutile (110) peaks at 1500 kg/mm^2 at 25 C for
        an O/Ti ratio of 1.85 (= 14.71 GPa by the paper's own conversion
        1 kg/mm^2 = 9.807 MPa), falling to 1100 kg/mm^2 at 500 C
        (https://ntrs.nasa.gov/api/citations/19930017015/downloads/19930017015.pdf).
        That value is for a REDUCED, sub-stoichiometric crystal - stoichiometric
        rutile is plotted lower in their Fig. 3 but no stoichiometric number is
        tabulated, only graphed. Do not promote 14.71 GPa as 'TiO2 hardness'.
    hardness_reduced_rutile_25c_gpa:
      value: 14.71
      unit: GPa
      source: "https://ntrs.nasa.gov/api/citations/19930017015/downloads/19930017015.pdf"
      confidence: derived
      note: >
        1500 kg/mm^2 x 9.807e-3 = 14.71 GPa. Vickers, (110) face, H2-reduced
        single crystal at O/Ti = 1.85, 25 C. Reported separately from
        hardness_gpa on purpose: the stoichiometry is non-standard.
    youngs_modulus_gpa:
      value: null
      unit: GPa
      source: null
      confidence: unverified
      note: >
        TODO(owner): not verified. Only BULK modulus was obtained, from DFT:
        222.5 GPa (rutile) and 198.5 GPa (anatase), via the Birch-Murnaghan
        equation of state (https://etasr.com/index.php/ETASR/article/view/8393).
        Converting B to E needs the shear modulus, which that paper does not
        report, so no Young's modulus is derivable. Do not guess.
    bulk_modulus_rutile_gpa:
      value: 222.5
      unit: GPa
      source: "https://etasr.com/index.php/ETASR/article/view/8393"
      confidence: literature
    bulk_modulus_anatase_gpa:
      value: 198.5
      unit: GPa
      source: "https://etasr.com/index.php/ETASR/article/view/8393"
      confidence: literature
    density_kg_m3:
      value: null
      unit: kg/m^3
      source: null
      confidence: unverified
      note: >
        TODO(owner): not verified from a primary source in this pass. Rutile and
        anatase differ (commonly quoted ~4.25 vs ~3.9 g/cm3) and no source that
        was actually opened stated either value, so both are left null rather
        than quoted from memory.
    iep_ph:
      value: 6.0
      unit: pH
      source: "https://doi.org/10.1039/d4en00332b"
      confidence: literature
      note: >
        TiO2 nanoparticle pH_IEP spans 5-7 depending on electrolyte and particle
        properties; pristine TiO2 aggregates fastest near pH 6.5. Carry the 5-7
        range, not the point.
    iep_ph_range:
      value: [5, 7]
      unit: pH
      source: "https://doi.org/10.1039/d4en00332b"
      confidence: literature

  silicon_carbide:
    material: SiC (as the abrasive)
    hardness_gpa:
      value: 32
      unit: GPa
      source: "https://srdata.nist.gov/CeramicDataPortal/Pds/Scdscs"
      confidence: literature
      note: >
        NIST SRD 150, sintered alpha-SiC, Vickers 1 kg load, 20 C: 32 GPa
        (+/-15%). Harder than alumina - extreme scratch risk on every film in
        the CMP-Sim list.
    youngs_modulus_gpa:
      value: 415
      unit: GPa
      source: "https://srdata.nist.gov/CeramicDataPortal/Pds/Scdscs"
      confidence: literature
      note: "Poisson 0.16, K_Ic 3.1 MPa*m^0.5 from the same source."
    density_kg_m3:
      value: 3160
      unit: kg/m^3
      source: "https://srdata.nist.gov/CeramicDataPortal/Pds/Scdscs"
      confidence: literature
      note: "3.16 g/cm3 (+/-1%), sintered alpha-SiC at 20 C."
    iep_ph:
      value: 3.8
      unit: pH
      source: "https://doi.org/10.3390/ma17010056"
      confidence: literature
      note: >
        IEP 3.8 for unmodified SiC powder. Below pH 6 the surface charge is too
        low to prevent van der Waals agglomeration.

  diamond:
    material: C (sp3)
    hardness_gpa:
      value: 79.7
      unit: GPa
      source: "https://doi.org/10.3390/cryst7120369"
      confidence: literature
      note: >
        Vickers HV = 79.7 GPa, (111) face of type-Ib synthetic single-crystal
        diamond at 4.91 N, with the indent contact area measured by AFM and
        corrected for elastic deformation of the indenter and for the concave
        indent shape. Meyer hardness HM = 81.7 GPa on the same indent. The
        authors note that earlier optical-microscopy values of 100-115 GPa for
        (001)/(111) diamond are likely too high because the concave shape was
        not accounted for; a separate critical review puts the highest Knoop
        values for type-IIa at ~130-145 GPa. So 'diamond hardness' is
        method-dependent over 80-145 GPa - use 79.7 with the method stated.
    hardness_mohs:
      value: 10
      unit: Mohs
      source: "http://www.ioffe.ru/SVA/NSM/Semicond/Diamond/mechanic.html"
      confidence: literature
    youngs_modulus_gpa:
      value: 1136
      unit: GPa
      source: "https://doi.org/10.3390/cryst7120369"
      confidence: literature
      note: >
        E = 1136 GPa with Poisson 0.07, tabulated for diamond in Table 1 of that
        paper as the input used to correct the indenter's elastic deformation.
        It is a QUOTED literature value in an open-access paper, not that
        paper's own measurement - secondary. Ioffe independently gives the BULK
        modulus as 442 GPa.
    bulk_modulus_gpa:
      value: 442
      unit: GPa
      source: "http://www.ioffe.ru/SVA/NSM/Semicond/Diamond/mechanic.html"
      confidence: derived
      note: "44.2e11 dyn/cm^2 x 0.1 Pa per dyn/cm^2."
    density_kg_m3:
      value: 3515
      unit: kg/m^3
      source: "http://www.ioffe.ru/SVA/NSM/Semicond/Diamond/mechanic.html"
      confidence: literature
    iep_ph:
      value: null
      unit: pH
      source: null
      confidence: unverified
      note: >
        TODO(owner): nanodiamond surface charge is set by surface TERMINATION
        (carboxyl vs hydrogen vs hydroxyl), not by a bulk oxide IEP, so a single
        IEP is not a property of the material. Measure per product lot.

  organic_polymer:
    material: "polystyrene (PS) / poly(methyl methacrylate) (PMMA), optionally shelled with SiO2 or CeO2"
    hardness_gpa:
      value: 0.41
      unit: GPa
      source: "https://bangslabs.com/technical-library/material-properties-of-polystyrene-and-polymethyl-methacrylate-pmma-microspheres/"
      confidence: vendor
      note: >
        0.41 GPa for PMMA, from the Bangs Laboratories microsphere property
        compilation, which attributes it to Bhushan & Burton, Nanotechnology 16
        (2005) 467-478. The same compilation lists PS hardness as 'n/a' - no PS
        hardness was found. ~12x softer than colloidal silica: this is the whole
        point of a compliant abrasive. Retrieved via Wayback snapshot 2025-11-27.
    hardness_ps_gpa:
      value: null
      unit: GPa
      source: null
      confidence: unverified
      note: >
        TODO(owner): polystyrene hardness explicitly listed as 'n/a' in the
        source compilation. Also note the core's mechanical properties are
        TUNABLE by synthesis (crosslink density), so a single value would be
        wrong anyway (https://doi.org/10.1149/1.2949085).
    youngs_modulus_gpa:
      value: 3.3
      unit: GPa
      source: "https://bangslabs.com/technical-library/material-properties-of-polystyrene-and-polymethyl-methacrylate-pmma-microspheres/"
      confidence: vendor
      note: >
        PS tensile modulus 3200-3400 MPa (unoriented) -> 3.3 GPa midpoint; the
        same table gives PS shear modulus 700-800 MPa and Poisson 0.325-0.33.
        PMMA is quoted inconsistently in the same table as 5.0 GPa (Bhushan &
        Burton) and 1800-3100 MPa (IDEMAT) - carry PMMA as a range, not a point.
        Compiled from Polymer Handbook 2nd ed. and other secondary sources, so
        vendor-compilation confidence, not primary.
    youngs_modulus_ps_range_gpa:
      value: [3.0, 3.5]
      unit: GPa
      source: "https://bangslabs.com/technical-library/material-properties-of-polystyrene-and-polymethyl-methacrylate-pmma-microspheres/"
      confidence: vendor
    youngs_modulus_pmma_range_gpa:
      value: [1.8, 5.0]
      unit: GPa
      source: "https://bangslabs.com/technical-library/material-properties-of-polystyrene-and-polymethyl-methacrylate-pmma-microspheres/"
      confidence: vendor
      note: >
        Genuine disagreement between the two cited secondary sources; do not
        average them silently.
    density_kg_m3:
      value: 1050
      unit: kg/m^3
      source: "https://bangslabs.com/technical-library/material-properties-of-polystyrene-and-polymethyl-methacrylate-pmma-microspheres/"
      confidence: vendor
      note: >
        Amorphous PS 1.04-1.065 g/cm3; PMMA 1.188 g/cm3 at 25 C (1.190 at 20 C,
        1.195 at 0 C) from the same table. ~2x lighter than silica and ~5x
        lighter than zirconia, so at equal wt% a polymer slurry has far more
        particles.
    density_pmma_kg_m3:
      value: 1188
      unit: kg/m^3
      source: "https://bangslabs.com/technical-library/material-properties-of-polystyrene-and-polymethyl-methacrylate-pmma-microspheres/"
      confidence: vendor
    iep_ph:
      value: null
      unit: pH
      source: null
      confidence: unverified
      note: >
        TODO(owner): set by the SHELL or by surface functionalisation (sulfate,
        carboxyl, amine), not by the polymer bulk. If shelled with SiO2 inherit
        silica's IEP; if shelled with CeO2 inherit ceria's. A bare-polymer IEP
        is not a meaningful CMP input.

  ranking_summary:
    hardness_order_as_sourced: >
      diamond 79.7 (Vickers, AFM-corrected) > SiC 32 > alpha-Al2O3 15 >
      TiO2 (reduced rutile) 14.7 ~ ZrO2 (3Y-TZP) 14.4 > YSZ (4Y/5Y) 12.2-12.9 >
      CeO2 6.44 > SiO2 5.12 (Knoop) > gamma-Al2O3 granule 0.433 > PMMA 0.41 ;
      PS, stoichiometric TiO2 and monoclinic ZrO2 unmeasured.
    modulus_order_as_sourced: >
      diamond ~1136 (secondary) > alpha-Al2O3 416 ~ SiC 415 > ZrO2 199-220 >
      CeO2 167.6-213 > SiO2 72.7 > gamma-Al2O3 granule 12.6 > PS ~3.3 ;
      TiO2 Young's modulus unknown (bulk modulus only).
    method_mixing_warning: >
      The hardness order above mixes Vickers (Al2O3, SiC, ZrO2, TiO2, diamond),
      Knoop (SiO2), and nanoindentation (CeO2, gamma-Al2O3). HV, HK and
      nanoindentation H are NOT interchangeable - the same silica appears as
      5.12 GPa (Knoop 522) and as 9 GPa in an indentation-mechanics table
      (https://doi.org/10.3390/cryst7120369), a factor of 1.8. Any ratio built
      across methods carries at least that much uncertainty, so use the ORDER,
      not the ratio magnitude, and never let a hardness-ratio fallback outrank a
      measured anchor.
    cell_count:
      core_fields: "hardness_gpa, youngs_modulus_gpa, density_kg_m3, iep_ph"
      abrasives: 10
      total_core_cells: 40
      sourced_cells: 34
      null_cells: 6
      null_cell_list:
        - "gamma_alumina.density_kg_m3"
        - "titania.hardness_gpa (stoichiometric; a reduced-rutile value IS sourced separately)"
        - "titania.youngs_modulus_gpa (bulk modulus only)"
        - "titania.density_kg_m3"
        - "diamond.iep_ph (not a material property - termination-dependent)"
        - "organic_polymer.iep_ph (shell-determined, not a polymer property)"
      note: >
        Of the 6 nulls, 2 (diamond IEP, polymer IEP) are nulls of PRINCIPLE -
        the quantity is not a property of the material - and 4 are genuine
        literature gaps, all of them in titania plus gamma-alumina density.

# =====================================================================
gaps:

  - id: G1
    severity: critical
    gap: "No monoclinic-ZrO2 indentation hardness in GPa."
    why_it_matters: >
      The published CMP abrasive is monoclinic; the only GPa hardness values are
      for sintered tetragonal / stabilised ceramics. Any hardness-ratio model
      for ZrO2 currently mixes phases.
    what_would_close_it: >
      Nanoindentation on a consolidated monoclinic ZrO2 compact, or on the
      abrasive powder itself; failing that, a published m-ZrO2 nanoindentation
      study.

  - id: G2
    severity: critical
    gap: >
      No size-matched head-to-head comparison of zirconia against silica /
      ceria / alumina on the same tool and recipe.
    why_it_matters: >
      This is the single measurement that would give a defensible RELATIVE rate
      factor for zirconia. The best available (US5575885, Cu) has abrasive sizes
      spanning 30-1300 nm, which confounds chemistry with size and surface area.
    what_would_close_it: >
      One in-house DOE: blanket W and blanket oxide, 4 abrasives at matched D50
      and matched wt%, one pad, one pressure, one velocity.

  - id: G3
    severity: high
    gap: >
      No concentration series and no size series for zirconia as the abrasive -
      conc_exponent and size_exponent are both null.
    why_it_matters: >
      Both published ZrO2/W papers FIX the abrasive loading and sweep the Fenton
      chemistry instead, so the simulator has no anchored concentration response
      for this abrasive. The 30 wt% saturation knee that does exist is for
      silica-on-zirconia and is forbidden to transfer.
    what_would_close_it: >
      A 4-5 point wt% sweep at fixed chemistry, plus a 3-point D50 sweep at
      fixed total surface area.

  - id: G4
    severity: high
    gap: >
      The ZrO2/W rate is chemistry-limited, so the two available W anchors
      cannot be reconciled by Preston scaling (110.1 nm/min at 3 psi / ~0.5 wt%
      vs 98.7 nm/min at 6 psi / 1.2 wt%).
    why_it_matters: >
      Fitting a pressure or concentration exponent across those two papers would
      produce a wrong sign. The Fenton catalyst, not the abrasive, is the
      rate-setting variable.
    what_would_close_it: >
      Hold the catalyst and oxidizer fixed and sweep pressure alone on one tool.

  - id: G5
    severity: medium
    gap: "No vendor datasheet D50 / PSD for a CMP-grade zirconia slurry."
    why_it_matters: >
      typical_d50_nm is null. Only two research sizes (23 and 40 nm primary,
      ~114 nm secondary) are available, both from one group.
    blocked_by: >
      Saint-Gobain's zirconia CMP particle page is behind a Cloudflare browser
      check with no Wayback copy; the SEMITECH zirconia CMP slurry page likewise
      has no archive copy. A live browser session or a direct vendor request is
      needed.

  - id: G6
    severity: medium
    gap: >
      Absolute nitride and oxide rates behind the reverse-selectivity figure of
      78 are unobtainable.
    why_it_matters: >
      Selectivity 78 at pH 4 with no additive is zirconia's strongest published
      advantage, but with no absolute rate it cannot be turned into a simulator
      anchor.
    blocked_by: >
      Natarajan, Dandu & Babu, Int. Conf. Planarization/CMP Tech. (2007) p.1 -
      conference proceedings, not open access, no archive copy.

  - id: G7
    severity: medium
    gap: >
      Zirconia IEP is reported over pH 3.6 to 11 depending on dispersant and on
      whether the surface is a powder or a polished stabilised ceramic.
    why_it_matters: >
      An electrostatics model keyed on a single ZrO2 IEP will be wrong by up to
      7 pH units. Sourced values: 10.0-11.0 modelled PZC; 8.96 measured
      dispersant-free; 4.83 and 3.61 with 1.0 and 1.4 mass% polycarboxylate;
      pH 6 inferred for the polished ceramic SURFACE. All four are cited above.
    what_would_close_it: >
      Measure zeta vs pH on YOUR dispersed slurry. Treat IEP as a formulation
      output, not a material constant.

  - id: G8
    severity: medium
    gap: >
      Titania is the weakest row in the property table: hardness
      (stoichiometric), Young's modulus and density are all null.
    why_it_matters: >
      3 of the 6 null core cells are titania. The hardness-ratio fallback cannot
      rank TiO2 at all.
    what_would_close_it: >
      A single open nanoindentation study on dense stoichiometric rutile and on
      anatase, plus an XRD-derived density for each polymorph.

  - id: G9
    severity: low
    gap: >
      gamma-Al2O3 density unknown; its hardness/modulus come from a porous
      1.7 mm granule, not the lattice.
    why_it_matters: >
      0.433 GPa / 12.6 GPa are right for a porous transition-alumina agglomerate
      but will understate a dense gamma particle.
    what_would_close_it: >
      Nanoindentation on a dense gamma-Al2O3 film, plus a measured skeletal
      density.

  - id: G10
    severity: low
    gap: "No defectivity or scratch study of zirconia abrasive on any film."
    why_it_matters: >
      ZrO2 at 14.4 GPa (tetragonal) is harder than W, WO3, Cu, SiO2 and Si3N4,
      so scratch risk should be assumed alumina-like, but that is engineering
      judgement, not data.
    what_would_close_it: >
      LPC and post-CMP defect counts on blanket W and oxide against a silica
      control.

  - id: G11
    severity: low
    gap: >
      Park 2008 ZrO2-MAS process conditions (pressure, velocity, pad, PSD) not
      obtained.
    why_it_matters: >
      The 149 -> 204 nm/min oxide gain is the only ZrO2 oxide-rate datapoint
      outside the Hanyang W papers, and it cannot be placed in the engine
      without its process point.
    blocked_by: >
      Elsevier paywall; only the abstract and section snippets were recoverable
      from a Wayback snapshot of the landing page.

