# ============================================================================
# CMP-Sim — PER-FILM QUANTITATIVE VALIDATION DATASET INDEX
# ============================================================================
# Purpose: for EACH supported film/wafer type, list published removal-rate
# datasets that are usable to validate a Preston-type model, i.e. that carry
#   removal rate + pressure + velocity (or rpm + tool) + slurry description.
# Sweeps are prioritised over single points: a sweep validates model SHAPE.
#
# HONESTY RULES APPLIED (owner's requirement):
#   * Every number below was READ IN THE SOURCE during this pass. Nothing is
#     estimated, interpolated or reconstructed.
#   * Where the source could not be opened, or where the numeric table could
#     not be extracted cleanly, the entry is marked candidate_unverified and
#     carries NO rate values.
#   * Films with no acceptable public dataset get an explicit empty
#     `datasets: []` plus the search record. An honest null beats a guess.
#
# `already_in_repo: true` means a dataset YAML for this exact source already
# exists under cmp_sim/data/validation/datasets/ (name given in `repo_file`).
#
# Existing repo inventory at the time of writing (14 files incl. _TEMPLATE):
#   oxide : bouvet2002_oxide_silica_size_sweep, son2021_oxide_ceria_size_sweep,
#           us20190127607a1_teos_ceriasilica_size_sweep,
#           us20190127607a1_hdpoxide_ceriasilica_size_sweep,
#           us6564116b2_oxide_taguchi_L25_pressure_platenspeed
#   cu    : du2004_cu_h2o2_concentration_sweep, lai2001_cu_alumina_size_sweep,
#           us6918821b2_cu_ic1000_pressure_speed_2x3
#   w     : bouvet2002_w_silica_size_sweep
#   sic   : su2011_sic_alumina_size_sweep, wei2026_sic_silica_size_sweep
#   other : bouvet2002_ti_silica_size_sweep, us8142675b2_pt_alumina_pressure_sweep
#   sti / poly_si / si / snag : NOTHING. Zero datasets. (Confirmed by listing.)
#
# generated: 2026-09-24
# corpus used: ~/fab-sim/papers (397 PDFs + ~700 patent HTML captures),
#              full-text extracted and searched; plus targeted web/Crossref
#              verification of DOIs and two original patent PDFs.
# ============================================================================

films:

  # ─────────────────────────────────────────────────────────────────────────
  oxide:
    pack: oxide_silica
    reference_abrasive: colloidal_silica
    datasets:
      - source: "US 9,422,456 B2 (Cabot Microelectronics Corp., granted 2016-08-23)"
        title: "Colloidal silica chemical-mechanical polishing composition"
        abrasive: {kind: colloidal_silica_aminosilane_core_shell, size_nm: 54, wt_pct: 3.0}
        chemistry: {ph: "2.5 -> 11.0 (11 levels)", oxidizer: none, inhibitor: none}
        pad: "IC1010"
        tool: "Applied Materials Mirra, 200 mm TEOS wafers, 100 rpm platen, 150 ml/min"
        swept_variable: pH
        sweep_range: "pH 2.5, 3.0, 3.5, 4.0, 4.6, 4.9, 5.8, 8.4, 9.0, 10.0, 11.0 — each at BOTH 2.0 and 4.0 psi"
        rate_range_A_per_min: "30 - 1720 (2 psi); 60 - 2950 (4 psi)"
        n_points: 22
        data_origin: table
        already_in_repo: false
        note: >
          ⭐ BEST NEW OXIDE DATASET. TABLE 3 of the patent prints, for each of 11 pH
          values, the TEOS rate at 2 psi AND at 4 psi with everything else fixed
          (same 54 nm abrasive, 3 wt%, same pad/tool/speed). That makes it
          simultaneously a pH sweep AND a 2-point pressure check at 11 chemistries —
          exactly what separates the chemical prefactor from the Preston P term.
          Verbatim rows (pH, 2 psi Å/min, 4 psi Å/min):
            2.5 130 130 | 3.0 240 230 | 3.5 1100 1000 | 4.0 1680 2800 |
            4.6 1660 2950 | 4.9 1720 2950 | 5.8 1670 2100 | 8.4 30 200 |
            9.0 30 60 | 10.0 30 80 | 11.0 80 160
          ⚠ Non-Prestonian at low pH: at pH 2.5 and 3.0 the rate does NOT increase
          when pressure doubles (130->130, 240->230). Above pH 3.5 it does. Keep the
          low-pH rows — they mark where P-scaling breaks, like the existing
          us6918821b2 negative control.
          Table also prints zeta potential (+36 mV at pH 3 -> -51 mV at pH 8.4) and
          conductivity per composition, so the IEP crossing is pinned.

      - source: "10.1149/2162-8777/ab89bc — Mariscal et al., ECS J. Solid State Sci. Technol. 9, 044008 (2020)"
        title: "Tribological, Thermal and Kinetic Characterization of SiO2 and Si3N4 Polishing for STI CMP on Blanket and Patterned Wafers"
        abrasive: {kind: colloidal_ceria, size_nm: null, wt_pct: "low (not printed; 'low colloidal ceria nano-particle content')"}
        chemistry: {ph: null, oxidizer: none, inhibitor: "proprietary rate inhibitor (Versum DP1062)"}
        pad: "DowDuPont IC1010, Morgan Phoenix II CVD conditioning disc, in-situ, 6 lbf"
        tool: "Araca APD-800 polisher+tribometer, 200 mm PETEOS blanket, 200 ml/min"
        swept_variable: PV
        sweep_range: "3x3 full factorial: P = 2, 3, 4 psi x sliding velocity v = 0.75, 1.25, 1.75 m/s"
        rate_range_A_per_min: "one anchor value read: 2528 Å/min on PETEOS blanket (the paper's quoted measured RR). Per-cell RR values are PLOTTED ONLY."
        n_points: 9
        data_origin: graph_digitized
        already_in_repo: false
        note: >
          ⚠ READ THIS BEFORE USING. This is the single most valuable *design* in the
          whole survey — a clean 3x3 pressure x velocity grid on ONE slurry, with COF
          and pad temperature measured simultaneously at 1 kHz, plus a fitted
          two-step Langmuir-Hinshelwood model. BUT: the per-cell removal rates are
          only in Figures 12/13; the paper prints no RR table. The ONLY rate number
          printed in the text is 2528 Å/min for PETEOS blanket. Therefore the nine
          (P,v,RR) triples must be DIGITIZED from Fig. 13 before this can become a
          dataset YAML — do not enter it as a table.
          What IS printed as a table (Table I), and is directly reusable as fitted
          physics rather than as data:
            SiO2  : Ea 1.40 eV, A 9.77e-4 mol m^-2 s^-1, beta 2.61e+3, cp 1.46e-9,
                    e 15.1, RMS 98 Å/min (4.6%)
            Si3N4 : Ea 1.47 eV, A 8.47e-6, beta 1.62, cp 3.95e-6, e 0.333,
                    RMS 4 Å/min (11.9%)
          The paper states SiO2 polishing here is MECHANICALLY limited (k1 an order
          of magnitude above k2), which is the regime the Preston harness assumes.

      - source: "10.1149/2.0081905jss (Korkmaz & Babu, cited within) — threshold-pressure claim for ceria+DADMAC oxide slurries"
        title: "Non-Prestonian silicon dioxide polish rates with ceria + DADMAC (threshold pressure ~2 psi)"
        abrasive: {kind: ceria, size_nm: null, wt_pct: null}
        chemistry: {ph: null, oxidizer: none, inhibitor: DADMAC}
        pad: null
        tool: null
        swept_variable: pressure
        sweep_range: "threshold reported at 2 psi"
        rate_range_A_per_min: null
        n_points: null
        data_origin: prose
        already_in_repo: false
        note: >
          candidate_unverified — this is a SECONDARY citation seen inside the Lagudu
          2019 paper, not read in the original. No rates recorded. Listed only so the
          owner knows a published oxide threshold-pressure (non-Prestonian) dataset
          exists and can be chased: Korkmaz & Babu, ref. 17 of 10.1149/2.0081905jss.
    gaps: >
      Oxide is the BEST-COVERED film and gets better with US9422456B2 (pH x 2-point
      pressure, printed table). Still missing: a true single-slurry VELOCITY sweep at
      fixed pressure from a printed table. us6564116b2 sweeps pressure and platen speed
      but inside an L25 array with solid content and polish time varying too, so P and V
      are not cleanly separated; Mariscal has the clean 3x3 but only as a graph. If the
      owner can run one in-house experiment for oxide, it should be:
      fixed slurry, fixed 3 psi, platen speed 30/60/90/120 rpm, printed rates — that
      single series would close the last structural hole in the oxide Preston fit.

  # ─────────────────────────────────────────────────────────────────────────
  sti:
    pack: sti_ceria
    reference_abrasive: ceria
    datasets:
      - source: "Dawkins, O., PhD thesis, University of Alberta (2019) — 'Mixed abrasive slurries of ceria and silica nanoparticles joined by electrostatic attraction for STI CMP'"
        title: "Ceria/silica mixed-abrasive-slurry (MAS) STI CMP — oxide and nitride rates vs ceria:silica weight ratio, and vs down pressure"
        abrasive: {kind: ceria_on_silica_composite, size_nm: "silica EB6040 81 nm (also EB6080 125 nm); ceria size not printed", wt_pct: "silica fixed 5 wt%, ceria varied via Ce/Si weight ratio 0.02 - 0.3"}
        chemistry: {ph: "4 ± 0.6", oxidizer: none, inhibitor: "L-proline 0 / 0.5 / 2 wt% (nitride suppressant)"}
        pad: "not named in the extracted section"
        tool: "200 mm PECVD oxide (1000 nm) and PECVD nitride (100-200 nm) wafers; 60 s polish, 4 psi down force, 60 rpm table / 60 rpm chuck, 1 psi back pressure, 200 ml/min (Table 3-1)"
        swept_variable: concentration
        sweep_range: "Ce/Si weight ratio 0.02, 0.1, 0.2, 0.3 — x three proline conditions (none / 0.5 wt% into MAS / 0.5 wt% into ceria first)"
        rate_range_A_per_min: "oxide 635 - 4016 Å/min (63.55 - 401.57 nm/min); nitride 85 - 785 Å/min (8.51 - 78.46 nm/min)"
        n_points: 24
        data_origin: table
        already_in_repo: false
        note: >
          ⭐ BEST NEW STI DATASET, and STI previously had ZERO datasets in the repo.
          Table 6-1 is a printed table (12 oxide + 12 nitride values). Verbatim, all
          nm/min, columns = (no proline | 0.5 wt% proline into MAS | 0.5 wt% proline
          into ceria first), rows = Ce/Si ratio:
            0.02 : ox 125.97 / 101.75 / 63.55   nit 23.13 / 34.84 / 26.53
            0.10 : ox 377.17 / 370.00 / 304.53  nit 78.46 / 55.68 / 69.67
            0.20 : ox 377.06 / 376.34 / 401.57  nit 31.92 / 11.50 / 47.50
            0.30 : ox 276.73 / 274.97 / 258.41  nit 17.70 /  8.51 / 14.59
          ⚠ NON-MONOTONIC in abrasive ratio: oxide rate rises to a plateau at
          ratio 0.1-0.2 then FALLS at 0.3. Same interior-maximum shape as the
          existing su2011 SiC size sweep — a single power law will not fit it.
          Also usable: nitride/oxide selectivity in the SAME runs (needed for any
          STI stop-layer model), peaking near 33x at ratio 0.2 with 0.5 wt% proline.
          ⚠ A SECOND series exists in the same thesis (Fig. 7-3): oxide and nitride
          polish rate vs down pressure at 2 / 4 / 6 psi, with the optimum slurry
          (Ce/Si 0.3, EB6040 81 nm, pH 4). Rates are PLOTTED ONLY (y-axis 0-350
          nm/min, selectivity 0-60 on the right axis) — that pressure sweep must be
          graph-digitized, so it is recorded here but NOT given numbers.
          Independently corroborating conditions: the thesis states nitride polish at
          4 and 6 psi produced loud stick-slip noise (tool shutdown at 6 psi at ~25 s)
          while 2 psi was quiet — i.e. the 6 psi point is a partial run. Treat with care.

      - source: "10.1149/2162-8777/ab89bc — Mariscal et al., ECS J. Solid State Sci. Technol. 9, 044008 (2020)"
        title: "Same paper as listed under `oxide` — Si3N4 half of the STI pair"
        abrasive: {kind: colloidal_ceria, size_nm: null, wt_pct: "low, not printed"}
        chemistry: {ph: null, oxidizer: none, inhibitor: "proprietary (Versum DP1062)"}
        pad: "DowDuPont IC1010"
        tool: "Araca APD-800, 200 mm Si3N4 blanket"
        swept_variable: PV
        sweep_range: "P = 2, 3, 4 psi x v = 0.75, 1.25, 1.75 m/s"
        rate_range_A_per_min: "not printed — RR only plotted; the paper's own RMS of 4 Å/min implies rates of order tens of Å/min"
        n_points: 9
        data_origin: graph_digitized
        already_in_repo: false
        note: >
          The Si3N4 stop-layer counterpart of the oxide entry. Needs digitizing.
          Its fitted Ea = 1.47 eV and e = 0.333 (vs 15.1 for SiO2) is the quantitative
          statement that nitride removal in this slurry is NOT mechanically dominated —
          directly relevant if the owner models selectivity rather than just rate.

      - source: "Kang, H.-G. et al., ECS (2008) — local corpus 'kang2008-ecs-organic-additive-oxide-nitride-selectivity-ceria-sti'"
        title: "Effect of organic additives on oxide/nitride selectivity in ceria STI slurries"
        abrasive: {kind: ceria, size_nm: null, wt_pct: null}
        chemistry: {ph: null, oxidizer: none, inhibitor: "organic additive (anionic polymer)"}
        pad: "IC1000/Suba IV stacked (Rohm and Haas)"
        tool: "Strasbaugh 6EC; SiO2 7000 Å / Si3N4 1500 Å films; 70 rpm head = 70 rpm table; relative velocity 0.539 m/s; 100 cm3/min; 0 psi back pressure"
        swept_variable: pressure
        sweep_range: "down force 2 - 6 psi (13.8 - 41.4 kPa)"
        rate_range_A_per_min: null
        n_points: null
        data_origin: graph_digitized
        already_in_repo: false
        note: >
          candidate_unverified FOR RATES. The experimental section is fully explicit
          and excellent (pad, tool, exact relative velocity 0.539 m/s, pressure range
          2-6 psi) but the rate-vs-pressure results in the extracted text are in
          figures, not tables, so NO rate values are recorded here. Worth digitizing:
          it is a 3-level-plus pressure sweep on a named pad at a known sliding
          velocity, which is rare. Same group/tool as the Kim 2003 and Park 2007
          entries below, so the three are mutually consistent in kinematics.

      - source: "Kim, S.-K. et al., Jpn. J. Appl. Phys. 42, 5420-5425 (2003) — local corpus 'kim2003-jjap-surfactant-oxide-nitride-selectivity-ceria'"
        title: "Surfactant effect on oxide/nitride removal selectivity with ceria slurry"
        abrasive: {kind: ceria, size_nm: null, wt_pct: null}
        chemistry: {ph: null, oxidizer: none, inhibitor: "surfactant 0 - 0.8 wt%"}
        pad: "IC1000/Suba IV stacked (Rodel)"
        tool: "Strasbaugh 6EC; PETEOS 7000 Å / LPCVD nitride 1500 Å; 100 cm3/min; 30 s; no back pressure"
        swept_variable: PV
        sweep_range: "down force 4, 5, 6 psi x table speed 50, 60, 70 rpm (head speed = table speed) — a 3x3 grid, PLUS a surfactant concentration series 0 - 0.8 wt%"
        rate_range_A_per_min: "oxide axis 0 - 6000; nitride axis 0 - 50 (axis limits read off Fig. 8; individual cell values NOT readable as text)"
        n_points: 9
        data_origin: graph_digitized
        already_in_repo: false
        note: >
          Fig. 8(a)/(b) is a genuine 3x3 pressure x table-speed surface for oxide AND
          nitride with one fixed ceria+surfactant slurry — structurally the ideal
          Preston test for STI. It is a 3-D bar/surface plot, so digitizing is harder
          and less reliable than a 2-D line plot; flagged accordingly.
          ⚠ TRANSCRIPTION TRAP IN THE SOURCE ITSELF: the paper's text states "the
          relative velocity between the pad and wafer was 76.2 m/s", which is
          physically impossible for a 70 rpm 6EC (the companion papers from the same
          tool state 0.539 m/s). Do NOT propagate 76.2 m/s. Recompute velocity from
          rpm and geometry, or use the 0.539 m/s value from the sister papers.
    gaps: >
      STI went from ZERO to two usable entries, but only ONE (Dawkins Table 6-1) is a
      printed table, and it is a CONCENTRATION sweep — not a pressure or velocity
      sweep. Every STI pressure/velocity sweep found (Dawkins Fig. 7-3, Kang 2008,
      Kim 2003 Fig. 8) is graph-only. So STI currently has NO table-quality
      Preston P*V data. What the owner would need to measure: one ceria slurry at
      fixed concentration and pH, oxide AND nitride blanket wafers, 2/3/4/5 psi x
      two platen speeds, rates reported as a table. Also missing entirely: ceria
      PARTICLE SIZE sweep on nitride (the oxide-side size dependence is covered by
      son2021 and us20190127607a1, the nitride side is not), and any STI dataset with
      pH swept while abrasive is held fixed.

  # ─────────────────────────────────────────────────────────────────────────
  cu:
    pack: cu_h2o2_bta
    reference_abrasive: alumina
    datasets:
      - source: "US 7,955,520 B2 (Cabot Microelectronics Corp.) — 'Copper-passivating CMP compositions and methods'. Family members in corpus: KR101173753B1, TWI384061B."
        title: "Copper-passivating CMP compositions — Cu removal rate at 1 psi and 3 psi for 9 formulations"
        abrasive: {kind: colloidal_silica, size_nm: 80, wt_pct: "0.1 / 0.55 / 1.0"}
        chemistry: {ph: "5, 6, 7", oxidizer: "H2O2 0.8 wt%", inhibitor: "salicylhydroxamic acid (SHA) 50 / 275 / 500 ppm + 1 wt% iminodiacetic acid"}
        pad: "D100"
        tool: "Logitech Model II CDP, 4-inch Cu blanket wafers, 85 rpm platen / 93 rpm carrier, 120 ml/min"
        swept_variable: pressure
        sweep_range: "1 psi and 3 psi, for each of 9 compositions (SHA 50-500 ppm x pH 5-7 x abrasive 0.1-1.0 wt%)"
        rate_range_A_per_min: "184 - 5273"
        n_points: 18
        data_origin: table
        already_in_repo: false
        note: >
          ⭐ STRONGEST NEW Cu DATASET. TABLE 1 verified against the ORIGINAL US patent
          PDF (patentimages .../US7955520.pdf), not just the Korean/Taiwanese family
          translations. Verbatim (Ex#, SHA ppm, pH, % abrasive, Cu RR @1 psi, @3 psi):
            1A 500 5 1.0   1082 1847
            1B 275 6 0.55  2636 4303
            1C  50 5 0.1   2832 4004
            1D  50 7 1.0   3376 5273
            1E  50 5 1.0   3074 4863
            1F 500 7 1.0    258  443
            1G 500 7 0.1    184  246
            1H  50 7 0.1   2964 4162
            1I 500 5 0.1   2825 3974
          ⚠ THE PATENT'S OWN PROSE MISQUOTES ITS OWN TABLE. The text says "1082 at
          1 psi and 1847 at 3 psi" for 1 wt% and "2825 at 1 psi and 3974 at 3 psi"
          for 0.1 wt%, but those two rows differ in SHA/pH too, so it is not a clean
          abrasive-loading comparison — read the table, not the prose.
          Why this is good for a Preston fit: pressure triples 1->3 psi at NINE
          different chemistries, so the pressure exponent can be fitted 9 times
          independently. Measured ratio RR(3psi)/RR(1psi) = 1.34 to 1.71 (mean ~1.5),
          i.e. clearly SUB-linear in P, not the 3.0x Preston demands. That is a
          quantitative, reproducible non-Prestonian signature across all 9 formulations
          and it is consistent in sign with the low-pressure behaviour already
          documented in us6918821b2. High value as a model-shape constraint.
          Also printed: static etch rate 17 Å/min with 250 ppm SHA vs 1342 Å/min
          without — pins the chemical (no-abrasive) floor for the same chemistry.

      - source: "Ihnfeldt, R., PhD dissertation, UC San Diego (2008) — Cu CMP with alumina and colloidal slurries"
        title: "Experimental Cu MRR vs pH with measured surface nanohardness and agglomerate size (Table 6.2)"
        abrasive: {kind: alumina, size_nm: "agglomerate xavg 510-800+ nm (measured, pH dependent)", wt_pct: null}
        chemistry: {ph: "~2.6 - 10.9 across six additive solutions (a-f)", oxidizer: "H2O2 0.1 wt%", inhibitor: "glycine 0.1 M, KNO3 1 mM (varies by solution)"}
        pad: null
        tool: null
        swept_variable: pH
        sweep_range: "three pH levels per additive solution, six solutions (a-f)"
        rate_range_A_per_min: null
        n_points: 18
        data_origin: table
        already_in_repo: false
        note: >
          candidate_unverified — DO NOT USE THE NUMBERS YET. Table 6.2 IS a printed
          table with 18 experimental MRR values plus Luo-Dornfeld model predictions,
          and the thesis also prints measured surface nanohardness Hw and particle
          concentration C0 per condition, which is unusually complete. BUT the PDF
          text layer for this table is CORRUPTED on extraction: cells come out as
          't2.9', 'tt4', 'ttt343**' etc., where digits have been replaced by 't'
          characters. Only a few values survive unambiguously in the surrounding
          prose: MRR < 8 nm/min for all solutions at pH < 3.1 EXCEPT solution c at
          113 nm/min (pH 3.0), and Hw = 4.6 GPa for solution a at pH 2.9.
          To use this the owner must re-extract Table 6.2 from the original page
          images (OCR or manual). Flagged, not fabricated. High potential value:
          it is one of very few Cu datasets that reports hardness and agglomerate
          size measured IN THE SAME RUNS as the rate, which is what a Luo-Dornfeld
          or contact-mechanics term needs.

      - source: "US 2008/0090500 A1 — 'Process for reducing dishing and erosion during chemical mechanical planarization'"
        title: "Two-phase Cu polish, removal rate vs phase-2 time"
        abrasive: {kind: silica, size_nm: null, wt_pct: 11}
        chemistry: {ph: 5, oxidizer: "H2O2 3-8 wt%", inhibitor: "benzotriazole 1-3 mM + glycine 1 wt%"}
        pad: "polyurethane (blanket); pucks polished on Struers LabPol-V"
        tool: "3 psi, table 70 rpm, carrier 68 rpm, 0 psig back pressure, 190 ml/min; Cu rates by Prometrix RS-35 4-pt probe, 49 points/wafer"
        swept_variable: temperature
        sweep_range: "not a P or V sweep — phase-2 DURATION series at fixed 3 psi"
        rate_range_A_per_min: null
        n_points: null
        data_origin: table
        already_in_repo: false
        note: >
          Recorded for completeness, LOW PRIORITY for Preston validation: the swept
          variable is polish time / second-step chemistry, not pressure or velocity.
          Conditions are unusually well specified (3 psi, 70/68 rpm, 190 ml/min,
          pH 5, 11 wt% silica, 1 mM BTA, 1 wt% glycine, H2O2 3-8 wt%) so it is a
          good single-point CHEMISTRY anchor for the cu_h2o2_bta pack, and its
          9.8 psi / 60 rpm Cu-puck sub-experiment gives a high-pressure comparison
          point. Rate values in Tables 5/8 were not transcribed in this pass.
    gaps: >
      Cu is now well covered for pressure (US7955520B2: 9 independent 1->3 psi pairs,
      printed) and for oxidizer concentration (du2004) and abrasive size (lai2001).
      The hole is VELOCITY: not one Cu dataset in the repo or in this survey sweeps
      platen/carrier speed at fixed pressure from a printed table — us6918821b2 does
      vary rpm but its low-pressure branch inverts and it is kept as a negative
      control. Also missing: a Cu BTA-concentration series at fixed everything else
      (the inhibitor term is currently unconstrained by data), and any Cu dataset
      above ~5 psi other than the 9.8 psi puck point.

  # ─────────────────────────────────────────────────────────────────────────
  w:
    pack: w_fe_oxidizer
    reference_abrasive: alumina
    datasets:
      - source: "EP 3,161,098 B1 (CMC Materials LLC / Cabot Microelectronics, B1 published 2022-10-26) — 'Tungsten chemical-mechanical polishing composition'"
        title: "Fe/malonic-acid tungsten slurry — W and TEOS rates at three down-forces for six formulations (Table 5B), plus a second grid in Table 6B"
        abrasive: {kind: colloidal_silica_aminosilane_core_shell, size_nm: 55, wt_pct: 2.0}
        chemistry: {ph: 4.0, oxidizer: "H2O2 2.0 wt%", inhibitor: "W etch inhibitor 37 / 50 / 63 ppm; Fe(NO3)3·9H2O 45 / 60 ppm; malonic acid:Fe molar ratio fixed 8:1"}
        pad: "IC1010"
        tool: "Applied Materials Reflexion, 300 mm wafers, platen 100 rpm, 200 ml/min"
        swept_variable: pressure
        sweep_range: "1.5, 2.0, 3.0 psi (Table 5B) for six compositions 1A-1F; and 1.0, 1.5, 2.0 psi (Table 6B) for five compositions 6A-6E"
        rate_range_A_per_min: "W 270 - 2730; TEOS 1060 - 2320 (Table 5B). Table 6B: W 690 - 2490, TEOS 1070 - 2150."
        n_points: 36
        data_origin: table
        already_in_repo: false
        note: >
          ⭐ BEST NEW W DATASET — and the only clean multi-level W pressure sweep found.
          Verified against the ORIGINAL EPO PDF (patentimages .../EP3161098B1.pdf),
          not just the Google Patents HTML. Table 5B verbatim, W rate | TEOS rate at
          1.5 / 2.0 / 3.0 psi:
            1A  380  980 2130 | 1090 1750 2090
            1B  720 1070 2010 | 1070 1710 2320
            1C 1270 1340 2610 | 1060 1710 2200
            1D  480 1140 2730 | 1080 1640 2060
            1E  270  800 1390 | 1100 1600 2070
            1F  300  850 1660 | 1100 1670 2000
          ⚠ TWO HEADER INCONSISTENCIES IN THE PATENT ITSELF, both confirmed in the PDF:
            (1) paragraph [0090] says the downforces were "1.0, 2.0, and 3.0 psi" but
                the Table 5B column headers read 1.5 / 2.0 / 3.0 psi. Trust the table
                headers (the 1.5 psi column is also what Table 5C's selectivities use).
            (2) Table 6B is printed with SIX rate columns (1.0/1.5/2.0 psi for W and
                for TEOS) but most rows contain only FOUR numbers, so the column
                assignment for 6A-6E is AMBIGUOUS. Use Table 5B; treat 6B as
                unusable until resolved against the figures.
          Why it is valuable: W rate rises steeply and SUPER-linearly with pressure
          (1A: 380 -> 980 -> 2130, i.e. 5.6x over a 2x pressure change) while the
