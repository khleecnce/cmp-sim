search_log:

  method: >
    Extracted full text from the entire local corpus (~/fab-sim/papers: 397 PDFs
    via PyMuPDF, plus ~700 Google Patents HTML captures tag-stripped), then
    regex-scored every document for co-occurrence of a removal-rate unit
    (Å/min, nm/min, nm/h, um/h) with a pressure token (psi, kPa) and a
    multi-level pressure or speed pattern. Ranked candidates were then read
    in context. DOIs were verified against the Crossref REST API (title,
    journal, volume, pages, year) rather than being copied from filenames.
    Two patents were re-verified against their ORIGINAL PDFs
    (US7955520.pdf, EP3161098B1.pdf) because the HTML captures had
    inconsistencies.

  yielded_nothing:
    - "snag / SnAg / Sn solder CMP: seven distinct web queries plus corpus regex.
       Only bump-fabrication and bonding literature. See the snag entry."
    - "Google Patents direct HTML fetch for US7955520B2: HTTP 503 bot wall.
       Worked around via patentimages PDF, which succeeded."
    - "patentimages 'pdfs/EP3161098B1.pdf' short path: HTTP 403. The hashed path
       (8a/22/2f/...) returned 200 — use hashed paths for EP documents."
    - "PMC article PMC11522676 and an RIT thesis PDF: both returned empty/403 to
       the extractor and to curl with a browser UA. Nothing recorded from them."
    - "Sorooshian 2005, Liao 2014, McAllister 2019, Wei 2010 (Arizona dissertations):
       present in the corpus and rich in tribology/COF data, but the sections read
       did not yield a printed rate-vs-pressure or rate-vs-velocity table that was
       not already better covered by Mariscal 2020 from the same group. McAllister
       2019 does contain blanket CVD-W polishing work worth a second pass."
    - "Praveen 2014 (Microelectronic Engineering, STI abrasive+additive selectivity):
       extracted text contained no psi/kPa token at all — process conditions are
       absent from the machine-readable layer. Cannot be used without the original."
    - "Hwang 2026 (Polymers, PAA-ceria STI): single condition only (4 psi,
       300/150 rpm, IC1000, 28.5 ml/min, 60 s). No sweep, so not indexed."
    - "Dandu 2009 (JES, ceria SiO2/SiN selectivity): Table hits in the text layer
       did not resolve to a rate-vs-pressure table in the sections read."
    - "US9200180B2 (benzenesulfonic acid CMP): all reported rates are at a single
       2.0 psi membrane pressure on a Mirra/Politex. Rich multi-film table
       (Cu, PETEOS, Ta, TaN, Black Diamond) but NO pressure axis, so it is a
       chemistry anchor only and was not indexed as a sweep."
    - "Lee 2019 / Egan 2019 (JSS, W abrasive size): identified as candidates for the
       w pack's size axis but not read in this pass — bouvet2002_w already covers
       size, and the pressure gap was the priority."
    - "arXiv: no CMP removal-rate datasets of the required form were pursued;
       the domain's experimental data is in ECS/Elsevier/patents, not arXiv."

