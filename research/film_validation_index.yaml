        already_in_repo: false
        note: >
          Values printed in the abstract/text: maximum MRR 1089 nm/h with 2 wt%
          colloidal ceria + 0.05 M KMnO4 at pH 2, Ra 0.11 nm. Cited within the same
          corpus (Chen 2020, RJAC): colloidal-silica base slurries gave 153 nm/h
          (Si-face) and 6 nm/h (C-face). Also cited there: mixed silica+nanodiamond
          at pH 11 gives 200-550 nm/h; silica+H2O2+piperazine on 4H-SiC gives 106 nm/h.
          Process conditions are fully printed (Table 1), so this is a solid
          single-pressure ANCHOR POINT for the ceria reference abrasive of the
          sic_ceria_h2o2 pack — which is notable because BOTH existing repo SiC files
          (su2011, wei2026) use alumina and silica, NOT ceria. This is the only
          ceria-on-SiC rate found.
          ⚠ Single pressure, so no Preston content. n_points counts the
          abrasive x pH comparison cells, not a sweep.
    gaps: >
      SiC has the most sources but they disagree badly in absolute rate (see
      `disagreements`) and NONE of them sweeps pressure with a printed table —
      Su 2012 sweeps pressure and platen speed but only in figures, Gong 2024 and
      Chen 2015 are fixed at 4 psi. So sic still has no table-grade Preston data.
      Also missing: any SiC dataset that separates Si-face from C-face in the SAME
      table with the SAME slurry over a pressure range (the 4-5x face anisotropy is
      currently unmodelled), and any ceria-on-SiC CONCENTRATION or SIZE series.
      Highest-value action: digitize Su 2012 Fig. 8 (pressure) and Fig. 7 (platen
      speed) — that single paper would give sic both missing axes.

  # ─────────────────────────────────────────────────────────────────────────
  snag:
    pack: snag_solder
    reference_abrasive: null
    datasets: []
    gaps: >
      ⛔ NO PUBLIC DATASET FOUND. This is an honest empty entry, not an oversight.
      snag is the single weakest film in the simulator: the pack has no validation
      data of any kind, and this survey could not find any.

      What was searched, and what came back:
        * Local corpus (~700 patent captures, 397 papers) grepped for
          \\bSnAg\\b, 'tin[- ]silver', 'solder bump.{0,40}polish', 'Sn CMP',
          'solder CMP'. The ONLY hits were passing mentions of SnAg as a BUMP
          MATERIAL in interconnect-structure patents (e.g. KR102101377B1, where
          'PbSn, Sn, SnAg, Cu, In, SnAgCu, SnCu, Au' appears in a list of possible
          C4 bump materials). Zero removal-rate data. Zero slurry compositions
          aimed at solder.
        * Web searches run: 'SnAg solder CMP removal rate slurry polishing
          pressure'; 'solder bump CMP chemical mechanical polishing removal rate
          Sn Ag patent'; 'CMP of SnAg micro-bump planarization removal rate slurry
          hybrid bonding'; 'planarization of electroplated solder SnAg bumps fly
          cutting vs CMP removal rate'; 'CMP slurry for tin solder Sn planarization
          removal rate nm/min oxidizer pH study'; 'patents "polishing composition"
          "solder" "Sn" "removal rate" CMP bump planarization site:patents.google.com';
          'Kim "solder CMP" OR "Sn CMP" removal rate slurry ECS Journal Solid State'.
          Results were about bump FORMATION (electroplating, multilayer plating,
          wet seed etching), bump UNDERCUT characterisation, fine-pitch BONDING,
          and Cu-Cu hybrid bonding — not solder CMP rates.
        * A PMC article and an RIT thesis surfaced as possible leads but could not
          be opened (PMC returned 403/empty to both the extractor and curl with a
          browser UA), so nothing from them is recorded.

      Why the literature is thin, and it is probably structural rather than a search
      failure: SnAg micro-bumps are normally planarized by DIAMOND FLY-CUTTING /
      surface planers (DISCO-type) rather than by CMP, because solder is soft,
      smears, and embeds abrasive. The published process literature therefore sits
      in the packaging/bonding community and reports bump height uniformity and
      coplanarity, not Å/min removal rate at a given psi.

      What the owner would need to measure — there is no shortcut here:
        1. Blanket electroplated SnAg film (not bumps) on a carrier, so thickness
           metrology is meaningful.
        2. Pressure sweep at LOW pressure (solder is soft: try 0.5 / 1 / 1.5 / 2 psi)
           at one fixed platen speed, then a speed sweep at one pressure.
        3. Report abrasive type/size/wt%, pH, oxidizer, and the static etch rate
           separately — for a soft solder the chemical (etch) component is likely to
           dominate and must be measured with abrasive absent.
        4. Expect and check for smearing/embedding: report post-CMP Ra and abrasive
           residue, not just rate.
      Until that exists, any snag_solder simulation output is UNVALIDATED and should
      be labelled as such in the tool.

