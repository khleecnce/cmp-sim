disagreements:

  sic:
    severity: ">10x — far beyond the 3x flag threshold"
    detail: >
      Published SiC removal rates span more than an order of magnitude and the
      spread is NOT explained by pressure, which is 2-4 psi in every source.
        * Su 2012 (10.1088/1674-4926/33/10/106003), alumina 1.5-3.5 um, 2 psi,
          60/65 r/min : Si-face 45 - 95 nm/HOUR, C-face 353 - 404 nm/hour.
        * Gong 2024 (10.3390/ma17030679), alumina 500 nm + KMnO4, 4 psi, 90/100 r/min
          : 460 - 828 nm/hour across the L25, 1200 nm/hour optimised.
        * Chen 2015 (10.1016/j.apsusc.2015.10.158), ceria 2 wt% + 0.05 M KMnO4, pH 2,
          4 psi, 90/90 rpm : 1089 nm/hour; silica-based comparison 153 nm/hour
          Si-face, 6 nm/hour C-face.
      Si-face-to-Si-face, Su 2012's 95 nm/h vs Gong 2024's 1200 nm/h is ~13x, and
      vs Chen 2015's 1089 nm/h is ~11x, at only a 2x pressure difference.
    likely_causes: >
      (a) OXIDIZER IDENTITY dominates. Su used H2O2; Gong and Chen used permanganate
      (KMnO4/MnO2). Chen 2015 and Chen 2020 both report permanganate at acid pH is
      far more aggressive on SiC. Gong 2024's own range analysis says oxidant content
      is the single largest factor (R = 0.1717, above pH and abrasive). A pack that
      does not distinguish H2O2 from permanganate cannot span these sources.
      (b) CRYSTAL FACE. C-face polishes 4-5x faster than Si-face in Su 2012 and
      ~25x faster in the silica case cited by Chen 2020. Sources that do not state
      the face are not comparable.
      (c) POLYTYPE (6H vs 4H) and abrasive size (500 nm vs 1.5-3.5 um) differ too.
    action_for_owner: >
      Do NOT pool SiC sources into one Kp. Split sic at minimum by oxidizer class
      (peroxide vs permanganate) and preferably by crystal face. The existing repo
      files su2011 (alumina) and wei2026 (silica + Fenton H2O2/Fe3O4) are already in
      two different chemical regimes; adding Gong 2024 (permanganate) makes three.
      Treat the 3x+ spread as a pack-partitioning signal, not as measurement noise.

  si:
    severity: ">3x, and possibly much more — but the comparison is tool-limited"
    detail: >
      Bae 2022 (10.3390/nano12213893) reports 139.5 nm/min for 1 wt% colloidal
      silica with NO alkaline accelerator, rising to 552-872 nm/min with amine
      accelerators, on a POLI-300 with a SUBA 600 pad at 5.7 psi. The same paper
      states commercial Si CMP slurries measured on the same rig give
      316.7 - 372.3 nm/min.
      Wang/Zhang/Biddut 2011 (10.1016/j.wear.2010.11.006) cites ~30 nm/min for
      Al2O3 + DI water on a SUBA IV pad, and its own measurements are on a Logitech
      PM5 lapping rig at 20 kPa (2.9 psi) with 20x15 mm coupons.
      139.5 vs ~30 nm/min is ~4.6x at roughly a 2x pressure difference.
    likely_causes: >
      Different machine class (300 mm-capable polisher vs bench lapping rig),
      different metrology (film thickness vs coupon mass loss), different chemistry
      (alkaline silica vs alumina in DI water), and a 2x pressure difference. The
      ~30 nm/min figure is additionally a SECONDARY citation inside Wang 2011, not
      that paper's own measurement.
    action_for_owner: >
      Do not treat this as a contradiction to be reconciled by tuning. It is a
      reminder that bulk-Si rates are meaningless without the chemistry and the
      rig. Because si has NO pressure sweep at all, the pack's Kp is currently
      unconstrained and any absolute si prediction carries an unknown scale factor.
      Calibrate si only against a single self-consistent source, and prefer Bae 2022
      (real polisher, explicit conditions, 12 printed values).

  oxide_low_pH_pressure_response:
    severity: "not a magnitude disagreement — a SHAPE contradiction with Preston"
    detail: >
      In US9422456B2 Table 3 the TEOS rate is INSENSITIVE to a doubling of pressure
      at low pH (pH 2.5: 130 -> 130 Å/min; pH 3.0: 240 -> 230 Å/min from 2 to 4 psi)
      while at pH 4.0-4.9 the same doubling gives a 1.7-1.8x rise
      (1680 -> 2800, 1660 -> 2950, 1720 -> 2950). At pH 8.4 it rises 6.7x
      (30 -> 200).
      Independently, in US7955520B2 Table 1 the Cu rate ratio RR(3 psi)/RR(1 psi)
      is 1.34-1.71 across all nine formulations where Preston demands 3.0.
    likely_causes: >
      The pressure exponent is chemistry-dependent, not a universal 1.0. Where the
      surface reaction is rate-limiting (low pH for silica-on-oxide, strong
      passivation for SHA-on-Cu) additional mechanical drive buys little; where
      mechanical removal limits, the response approaches or exceeds linear.
    action_for_owner: >
      This is the most actionable model finding in the survey. Two independent
      printed patent tables, two different films, both show sub-Prestonian pressure
      response at the passivated/chemically-limited end and near-linear response in
      the mechanically-limited regime — and Mariscal 2020's fitted parameters say the
      same thing in Langmuir-Hinshelwood language (SiO2 mechanically limited,
      k1 >> k2; Si3N4 not). A single global pressure exponent will be wrong for at
      least one end of every film's chemistry range.

