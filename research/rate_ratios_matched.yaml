  structural_conclusion: >
    The reason this table is almost entirely null is not insufficient searching -
    it is that the experiment barely exists in the published record. Abrasive
    chemistry is the one variable a slurry supplier does not vary: it is the
    product identity, the cost driver and the IP. Academic groups do compare
    abrasives, but they legitimately optimise each abrasive's own size, loading
    and pH before comparing (Chen 2015 is the textbook case: 6 wt% silica at pH 6
    against 2 wt% ceria at pH 2), which produces a best-vs-best comparison that is
    useful to a process engineer and useless as a chemistry-only factor.
    PRACTICAL RECOMMENDATION: treat 'ranking_only' as the correct long-term state
    for most cells and keep warning the user, rather than filling cells with
    size-confounded ratios. The two cheapest routes to real numbers are
    (1) digitise Chen 2017 RSC Adv. figure for SiC silica:ceria at matched pH, and
    (2) run the swap in-house at matched d50 - two wafers per pair.
